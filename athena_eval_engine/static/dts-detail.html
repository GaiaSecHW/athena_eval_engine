<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>问题单详情</title>
<script>
(function(){
  var _p=location.pathname;
  var _ing=(_p==='/eval'||_p.indexOf('/eval/')===0)?'/eval':'';
  var _lib=_ing+'/static/lib/';
  document.write('<link rel="stylesheet" href="'+_lib+'app.css">');
  document.write('<script src="'+_lib+'config.js"><\/script>');
  document.write('<script src="'+_lib+'app.js"><\/script>');

<style>
.confirm-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.2px;transition:all .18s cubic-bezier(.4,0,.2,1);position:relative;user-select:none}
.confirm-btn:active{transform:translateY(1px)}
.confirm-btn-yes{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 3px 10px rgba(22,163,74,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.confirm-btn-yes:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,163,74,.45),inset 0 1px 0 rgba(255,255,255,.25);filter:brightness(1.05)}
.confirm-btn-no{background:linear-gradient(135deg,#fff,#f8fafc);color:#dc2626;border:2px solid #dc2626;box-shadow:0 3px 10px rgba(220,38,38,.15)}
.confirm-btn-no:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(220,38,38,.25);background:linear-gradient(135deg,#fef2f2,#fff)}
.confirm-btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.knd{font-size:14px;padding:2px 7px;border-radius:8px;background:var(--p2);color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title" onclick="go('/')">奇美拉测评平台</div>
    <nav>
      <button class="ghost nav-item" data-route="home" onclick="go('/')">首页</button>
      <button class="ghost nav-item" data-route="evals" onclick="go('/evals')">评测</button>
      <button class="ghost nav-item" data-route="dts" onclick="go('/dts')">问题单</button>
      <button class="ghost nav-item" data-route="report" onclick="go('/report')">平台任务详情</button>
    </nav>
    <div class="sp"></div>
    <button class="ghost" onclick="go('/create')">+ 新建评测</button>
    <button class="ghost nav-item" id="sys-btn" onclick="go('/system')" style="display:none">系统</button>
    <button class="ghost" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </header>
  <main><div id="view"></div></main>
</div>
<script>
const DTS_ID=decodeURIComponent(location.pathname.split('/').pop()||'');
renderNav('/dts/'+DTS_ID);

// ── 长文本展示：列表只显示截断摘要，点击弹窗看全文 ──
var _dtsTextStore=[];
function dtsTextRef(text,label){
  var i=_dtsTextStore.length;
  _dtsTextStore.push({t:String(text||''),l:String(label||'详情')});
  return i;
}
function dtsTrunc(s,n){
  s=String(s||'');
  n=n||60;
  return s.length>n?s.slice(0,n)+'…':s;
}
function dtsTextView(text,label,n){
  if(!text){return '<span style="color:var(--amber)">未提供</span>';}
  var i=dtsTextRef(text,label);
  return esc(dtsTrunc(text,n))
    +' <a href="javascript:void(0)" onclick="showDtsText('+i+')" style="color:var(--acc);white-space:nowrap">查看全文</a>';
}
function showDtsText(i){
  var it=_dtsTextStore[i];
  if(!it){return;}
  var old=document.getElementById('dts-text-modal');
  if(old){old.remove();}
  var m=document.createElement('div');
  m.id='dts-text-modal';
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px';
  m.onclick=function(e){if(e.target===m){m.remove();}};
  m.innerHTML='<div style="background:var(--panel);color:var(--txt);max-width:900px;width:100%;max-height:80vh;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)">'
    +'<div style="padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:12px">'
    +'<b style="font-size:15px">'+esc(it.l)+'</b>'
    +'<button class="btn" style="padding:4px 12px;white-space:nowrap" onclick="document.getElementById(\'dts-text-modal\').remove()">关闭</button></div>'
    +'<div style="padding:16px;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.6">'+esc(it.t)+'</div>'
    +'</div>';
  document.body.appendChild(m);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    var m=document.getElementById('dts-text-modal');
    if(m){m.remove();}
  }
});

// 知识/记忆使用情况卡片渲染
function renderKMSummary(km,title){
  if(!km||typeof km!=='object'){return '';}
  var accessCount=km.access_count||0;
  var overall=km.overall_effect||'none';
  var impact=km.impact_on_conclusion||'';
  var accesses=km.accesses||[];
  if(accessCount===0&&overall==='none'&&!impact){return '';}
  var overallLabels={
    positive:{t:'正向（知识正确推动结论）',c:'var(--green)',bg:'rgba(34,197,94,.12)'},
    negative:{t:'负向（知识误导结论）',c:'var(--red)',bg:'rgba(220,38,38,.12)'},
    neutral:{t:'中性（访问但未影响结论）',c:'var(--amber)',bg:'rgba(251,191,36,.12)'},
    none:{t:'无知识/记忆访问',c:'var(--gray)',bg:'rgba(107,114,128,.12)'}
  };
  var ov=overallLabels[overall]||overallLabels.none;
  var sourceLabels={knowledge_base:'知识库',memory:'记忆',unknown:'未知'};
  var effectLabels={positive:'正向',negative:'负向',neutral:'中性',none:'无'};
  var html='<div style="margin-top:8px;border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
    +'<div style="padding:8px 12px;background:'+ov.bg+';border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
    +'<span style="font-size:13px;font-weight:600;color:'+ov.c+'">'+(title||'知识/记忆使用情况')+'</span>'
    +'<span class="knd" style="background:'+ov.bg+';color:'+ov.c+'">访问 '+accessCount+' 次</span>'
    +'<span class="knd" style="background:'+ov.bg+';color:'+ov.c+'">'+ov.t+'</span>'
    +'</div>';
  if(accesses&&accesses.length){
    html+='<div style="padding:8px 12px">';
    accesses.forEach(function(a,idx){
      var src=sourceLabels[a.source]||a.source||'-';
      var eff=a.effect||'none';
      var effInfo=overallLabels[eff]||overallLabels.none;
      var used=a.used_in_reasoning;
      var usedLabel=used===true?'推理引用':used===false?'推理未引用':'-';
      var usedColor=used===true?'var(--green)':used===false?'var(--red)':'var(--gray)';
      html+='<div style="margin-bottom:8px;padding:8px 10px;background:var(--p2);border-radius:8px;font-size:13px">'
        +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">'
        +'<span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+src+'</span>'
        +'<span class="knd" style="background:'+effInfo.bg+';color:'+effInfo.c+'">'+effInfo.t+'</span>'
        +'<span class="knd" style="background:'+ov.bg+';color:'+usedColor+'">'+usedLabel+'</span>';
      html+='</div>';
      if(a.query){html+='<div style="margin-bottom:4px"><b style="color:var(--sub)">查询：</b>'+esc(a.query)+'</div>';}
      if(a.returned){html+='<div style="margin-bottom:4px"><b style="color:var(--sub)">返回：</b>'+esc(a.returned)+'</div>';}
      html+='</div>';
    });
    html+='</div>';
  }
  if(impact){
    html+='<div style="padding:8px 12px;border-top:1px solid var(--bd);font-size:13px">'
      +'<div style="color:var(--sub);margin-bottom:4px">对结论的影响</div>'
      +'<div style="white-space:pre-wrap">'+esc(impact)+'</div>'
      +'</div>';
  }
  html+='</div>';
  return html;
}

async function renderDtsDetailPage(dtsId){
  document.title="问题单详情 — "+dtsId;
  var view=$("view");if(!view)return;
  var _back=dtsBackInfo();
  view.innerHTML='<div style="padding:20px;height:100%;overflow-y:auto"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap"><button class="btn" style="font-size:14px;padding:6px 16px;white-space:nowrap" onclick="location.href=\''+_back.url+'\'">← 返回'+esc(_back.label)+'</button><h2 style="font-size:20px">问题单详情</h2></div><div id="dts-detail-body" style="color:var(--sub)">加载中…</div></div>';
  try{
    var d=await jget(`/api/v2/dts/${dtsId}`);
    var caseData=d.analysis_data||null;
    var causeLabel=DTS_CAUSE_LABELS[d.cause_code]||d.cause_code||'-';
    var respLabel=dtsRespLabel(d.responsibility);
    var caseTypeLabel=DTS_CASE_TYPE_LABELS[d.case_type]||d.case_type||'-';
    var statusLabel=DTS_STATUS_LABELS[d.status]||d.status||'-';
    var statusColor=DTS_STATUS_COLORS[d.status]||'var(--gray)';
    var agentLabel=dtsAgentLabel(d.agent_type);

    var html='';
    html+='<div class="card" style="margin-bottom:16px">'
      +'<h3>基本信息</h3>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:14px;margin-bottom:12px">'
      +'<div><span style="color:var(--gray)">问题单 ID：</span><b style="font-family:monospace;font-size:13px">'+esc(d.dts_id)+'</b></div>'
      +'<div><span style="color:var(--gray)">状态：</span><span class="bdg" style="background:rgba(107,114,128,.15);color:'+statusColor+'">'+esc(statusLabel)+'</span></div>'
      +'<div><span style="color:var(--gray)">任务 ID：</span><b style="font-family:monospace;font-size:12px">'+esc(d.task_id||'-')+'</b></div>'
      +'<div><span style="color:var(--gray)">类型：</span><b>'+esc(caseTypeLabel)+'</b></div>'
      +'<div><span style="color:var(--gray)">Agent：</span><b>'+esc(agentLabel)+'</b></div>'
      +'<div><span style="color:var(--gray)">责任方：</span><b>'+esc(respLabel)+'</b></div>'
      +'<div><span style="color:var(--gray)">成因：</span><b>'+esc(causeLabel)+'</b></div>'
      +'<div><span style="color:var(--gray)">断点级别：</span><b>'+esc(d.breakpoint_level||'-')+'</b></div>'
      +'<div><span style="color:var(--gray)">Case ID：</span><b style="font-family:monospace;font-size:12px">'+esc(d.case_id||'-')+'</b></div>'
      +'<div><span style="color:var(--gray)">评测 ID：</span><b style="font-family:monospace;font-size:12px">'+esc(d.evaluation_id||'-')+'</b></div>'
      +'</div>';
    if(caseData){
      html+='<div style="margin-top:8px;padding:8px 0;border-top:1px solid var(--bd)">'
        +'<div style="font-size:14px;color:var(--sub);margin-bottom:4px">漏洞标题</div>'
        +'<div style="font-size:15px;font-weight:600">'+esc(caseData.vuln_title||'-')+'</div>';
      if(caseData.summary){
        html+='<div style="margin-top:8px;font-size:14px;color:var(--sub);margin-bottom:4px">漏洞摘要</div>'
          +'<div style="font-size:14px;padding:10px 12px;background:var(--p2);border-radius:8px;white-space:pre-wrap">'+esc(caseData.summary)+'</div>';
      }
      if(caseData.human_confirmation_summary){
        html+='<div style="margin-top:8px;font-size:14px;color:var(--sub);margin-bottom:4px">人工确认信息</div>'
          +'<div style="font-size:14px;padding:8px 10px;background:rgba(220,38,38,.08);border-radius:6px;white-space:pre-wrap">'+esc(caseData.human_confirmation_summary)+'</div>';
      }
      html+='</div>';
    }
    html+='</div>';

    // 分析数据文件缺失时（/app/reports 为容器本地目录，pod 重建会清空），
    // 用问题单记录里的 hypotheses 兜底展示，避免页面只剩基本信息。
    if(!caseData){
      var dbHyps=[];
      try{
        dbHyps=typeof d.hypotheses==='string'?JSON.parse(d.hypotheses||'[]'):(d.hypotheses||[]);
      }catch(e){dbHyps=[];}
      if(!Array.isArray(dbHyps))dbHyps=[];
      dbHyps.sort(function(a,b){
        var ca=Number(a.confidence||0), cb=Number(b.confidence||0);
        if(ca!==cb) return cb-ca;
        var la=DTS_LEVEL_RANK[a.cause_code]||99, lb=DTS_LEVEL_RANK[b.cause_code]||99;
        if(la!==lb) return la-lb;
        var ra=(a.evidence_refs||[]).length, rb=(b.evidence_refs||[]).length;
        if(ra!==rb) return rb-ra;
        var c1=String(a.cause_code||'Z'), c2=String(b.cause_code||'Z');
        return c1<c2?-1:(c1>c2?1:0);
      });
      // 展示门槛与正常路径一致：>=0.6；全部低于 0.6 时只展示最高的一条。
      var dbVisible=dbHyps.filter(function(h){return Number(h.confidence||0)>=0.6;});
      if(!dbVisible.length&&dbHyps.length){dbVisible=[dbHyps[0]];}
      html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--amber)">'
        +'<h3>假定线索（'+dbVisible.length+' 条）</h3>'
        +'<div style="font-size:13px;color:var(--sub);margin-bottom:12px;padding:6px 10px;background:var(--p2);border-radius:6px">'
        +'完整分析数据文件缺失，以下内容从问题单记录恢复；会话明细与证据原文暂不可用。'
        +'</div>';
      if(!dbVisible.length){
        html+='<div style="font-size:14px;color:var(--sub)">问题单记录中也没有线索数据。</div>';
      }
      dbVisible.forEach(function(h,idx){
        var conf=Number(h.confidence||0);
        var confColor=conf>=0.85?'var(--green)':conf>=0.7?'var(--amber)':'var(--gray)';
        var fs=h.fix_suggestion||{};
        html+='<div style="margin-bottom:14px;border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
          +'<div style="padding:10px 12px;background:var(--p2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
          +'<span style="font-weight:600;font-size:14px">线索 '+(idx+1)+'</span>'
          +'<span class="knd" style="background:rgba(220,38,38,.12);color:'+confColor+'">置信度 '+conf.toFixed(2)+'</span>'
          +'<span class="knd">'+esc(DTS_CAUSE_LABELS[h.cause_code]||h.cause_code||'-')+'</span>'
          +'<span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+esc(DTS_RESP_LABELS[h.responsibility]||h.responsibility||'-')+'</span>'
          +'</div>';
        if(h.hypothesis){
          html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">线索：</b>'+esc(h.hypothesis)+'</div>';
        }
        if(h.evidence){
          html+='<div style="padding:10px 12px;font-size:13px;border-bottom:1px solid var(--bd);white-space:pre-wrap"><b style="color:var(--sub)">依据：</b>'+esc(h.evidence)+'</div>';
        }
        var fixText=[fs.location,fs.action,fs.expected_effect].filter(Boolean).join(' | ');
        if(fixText){
          html+='<div style="padding:10px 12px;font-size:13px;color:var(--sub);white-space:pre-wrap"><b>修复建议：</b>'+esc(fixText)+'</div>';
        }
        html+='</div>';
      });
      html+='</div>';
    }

    if(caseData){
      var insufficientChains=[];
      [['挖掘',caseData.mining||{}],['验证',caseData.verification||{}]].forEach(function(x){
        if(x[1].insufficient_evidence){
          insufficientChains.push({label:x[0],reason:(x[1].root_cause||{}).description||''});
        }
      });
      if(insufficientChains.length){
        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--amber)"><h3>证据不足，未生成假定线索</h3>';
        insufficientChains.forEach(function(x){
          html+='<div style="font-size:14px;margin-bottom:8px"><b>'+esc(x.label)+'链：</b>'+esc(x.reason||'证据不足，无法判定根因')+'</div>';
        });
        html+='<div style="font-size:13px;color:var(--sub)">该 case 不会自动生成问题单。</div></div>';
      }
    }

    if(caseData){
      var chainsForRC=[
        {label:'挖掘',data:caseData.mining||{}},
        {label:'验证',data:caseData.verification||{}}
      ];
      var TARGET_LABELS={agent_prompt:'Agent提示词',agent_code:'Agent代码',knowledge:'知识/记忆',knowledge_base:'知识库',memory:'记忆模块',external_data_source:'外部数据源',eval_process:'评测流程'};
      var allHypotheses=[];
      var allLabelQuality=[];
      var legacyRootCauses=[];
      var legacyFixSuggestions=[];
      var projectId=(d.project_id||d.task_id||'').split(':')[0];
      var projectName=d.evaluation_name||'';
      var evidenceMap={};
      chainsForRC.forEach(function(ch){
        (ch.data.compressed_summaries||[]).forEach(function(s){
          (s.evidence_cards||[]).forEach(function(c){
            if(c&&c.evidence_id){
              evidenceMap[c.evidence_id]={session_id:s.session_id,source:c.source,event_idx:c.event_idx,quote:c.quote,fact_type:c.fact_type};
            }
          });
        });
      });
      chainsForRC.forEach(function(ch){
        var hypList=ch.data.hypotheses||[];
        var primaryCause=ch.data.primary_cause||'';
        var primaryHyp=ch.data.primary_hypothesis||'';
        var primaryMarked=false;
        if(Array.isArray(hypList)&&hypList.length){
          hypList.forEach(function(h){
            if(h&&typeof h==='object'){
              var isPrimary=!primaryMarked && (
                (primaryHyp && h.hypothesis===primaryHyp) ||
                (!primaryHyp && primaryCause && h.cause_code===primaryCause)
              );
              if(isPrimary){primaryMarked=true;}
              allHypotheses.push({label:ch.label,chainType:ch.label,agentType:ch.data.agent_type||'',isPrimary:!!isPrimary,data:h});
            }
          });
        }else{
          var rc=ch.data.root_cause||{};
          if(rc&&Object.keys(rc).length){
            legacyRootCauses.push({label:ch.label,category:rc.category||'',description:rc.description||''});
          }
          var fsList=ch.data.fix_suggestion||[];
          if(typeof fsList==='string'){fsList=[{action:fsList}];}
          if(Array.isArray(fsList)){
            fsList.forEach(function(fs){
              if(fs&&typeof fs==='object'){legacyFixSuggestions.push({label:ch.label,items:fs});}
            });
          }
        }
        var lq=ch.data.label_quality||{};
        if(lq&&Object.keys(lq).length){allLabelQuality.push({label:ch.label,data:lq});}
      });

      var impreciseItems=allLabelQuality.filter(function(lq){return lq.data.precision==='imprecise';});
      if(impreciseItems.length){
        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--amber)">'
          +'<h3>人工标注质量评估</h3>';
        impreciseItems.forEach(function(lq){
          var d=lq.data||{};
          html+='<div style="margin-bottom:12px;padding:10px 12px;background:rgba(251,191,36,.08);border-radius:8px">'
            +'<div style="font-size:14px;color:var(--sub);margin-bottom:4px">标注不精确';
          if(lq.label){html+=' <span class="knd">'+lq.label+'</span>';}
          html+='</div>';
          if(d.reason){html+='<div style="font-size:14px;margin-bottom:6px"><b style="color:var(--sub)">理由：</b>'+esc(d.reason)+'</div>';}
          if(d.follow_up_questions&&d.follow_up_questions.length){
            html+='<div style="font-size:14px"><b style="color:var(--sub)">需追问：</b><ul style="margin:4px 0 0 18px">';
            d.follow_up_questions.forEach(function(q){html+='<li>'+esc(q)+'</li>';});
            html+='</ul></div>';
          }
          html+='</div>';
        });
        html+='</div>';
      }

      if(allHypotheses.length){
        // 断点证据：supports_hypotheses 为 1-based 线索序号
        var allBreakpoints=chainsForRC.reduce(function(acc,ch){
          var bps=(ch.data.l0_l7_breakpoints||[]);
          bps.forEach(function(bp){
            if(bp&&typeof bp==='object'){
              acc.push({label:ch.label,data:bp});
            }
          });
          return acc;
        },[]);

        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--red)">'
          +'<h3>假定线索（'+allHypotheses.length+' 条）</h3>'
          +'<div style="font-size:12px;color:var(--sub);margin-bottom:12px;padding:6px 10px;background:var(--p2);border-radius:6px">'
          +'每条线索是一个独立的根因猜测，各自带置信度，按置信度降序排列；同置信度时按最早断裂 L、证据数、cause_code 排序。'
          +'仅展示置信度 ≥ 0.6 的线索；若没有一条达到 0.6，只展示置信度最高的那条。'
          +'线索之间互不否定，请结合证据逐条判断。'
          +'</div>';
        // 与后端一致：置信度降序 → 最早 L → 证据数 → cause_code
        // DTS_LEVEL_RANK 已在 config.js 中定义为全局常量，与后端 core/causal_levels.py 一致
        allHypotheses.sort(function(a,b){
          var cfa=Number(a.data.confidence||0), cfb=Number(b.data.confidence||0);
          if(cfa!==cfb) return cfb-cfa;
          var la=DTS_LEVEL_RANK[a.data.cause_code]||99, lb=DTS_LEVEL_RANK[b.data.cause_code]||99;
          if(la!==lb) return la-lb;
          var ra=(a.data.evidence_refs||[]).length, rb=(b.data.evidence_refs||[]).length;
          if(ra!==rb) return rb-ra;
          var ca=String(a.data.cause_code||'Z'), cb=String(b.data.cause_code||'Z');
          if(ca!==cb) return ca<cb?-1:1;
          return (b.data.confidence||0)-(a.data.confidence||0);
        });
        // 展示门槛：>=0.6；全部低于 0.6 时只展示置信度最高的一条。
        // visible 只影响渲染；supports_hypotheses 的编号仍用 allHypotheses 的下标，
        // 否则隐藏某条线索后断点与线索的对应关系会错位。
        var visibleHyps=allHypotheses.filter(function(h){
          return Number((h.data||{}).confidence||0)>=0.6;
        });
        if(!visibleHyps.length&&allHypotheses.length){visibleHyps=[allHypotheses[0]];}
        visibleHyps.forEach(function(h,vidx){
          var idx=allHypotheses.indexOf(h);
          var hdata=h.data||{};
          var conf=Number(hdata.confidence||0);
          var resp=hdata.responsibility||'';
          var causeCode=hdata.cause_code||'';
          var chainType=h.chainType||h.label||'chain';
          var agentType=h.agentType||'';
          var hypDesc=hdata.hypothesis||'';
          var evidence=hdata.evidence||'';
          var canResolve=hdata.agent_can_resolve;
          var blockedBy=hdata.blocked_by||'';
          var neededData=hdata.needed_external_data||[];
          var fs=hdata.fix_suggestion||{};
          var target=TARGET_LABELS[fs.target]||fs.target||'';
          var location=fs.location||'';
          var action=fs.action||'';
          var expected=fs.expected_effect||'';
          var causeLabel=DTS_CAUSE_LABELS[causeCode]||causeCode||'-';
          var respLabel=DTS_RESP_LABELS[resp]||resp||'-';
          var probColor=conf>=0.85?'var(--green)':conf>=0.7?'var(--amber)':'var(--gray)';
          var hypSid=hdata.session_id||'';
          html+='<div style="margin-bottom:14px;border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
            +'<div style="padding:10px 12px;background:var(--p2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
            +'<span style="font-weight:600;font-size:14px">线索 '+(vidx+1)+'</span>';
          if(h.label){html+=' <span class="knd">'+h.label+'</span>';}
          if(h.isPrimary){html+=' <span class="knd" style="background:rgba(220,38,38,.18);color:var(--red);font-weight:600">置信度最高</span>';}
          html+=' <span class="knd" style="background:rgba(220,38,38,.12);color:'+probColor+'">置信度 '+conf.toFixed(2)+'</span>'
            +' <span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+respLabel+'</span>'
            +' <span class="knd">'+causeLabel+'</span>';
          if(hypSid){
            html+=' <span class="knd" style="background:rgba(16,185,129,.12);color:var(--green);font-family:monospace;font-size:12px">基于 '+esc(hypSid)+'</span>';
          }
          if(canResolve===false){
            html+=' <span class="knd" style="background:rgba(251,191,36,.18);color:var(--amber)">Agent无法自行解决</span>';
          }else if(canResolve===true){
            html+=' <span class="knd" style="background:rgba(34,197,94,.15);color:var(--green)">Agent可解决</span>';
          }
          html+='</div>';
          if(hypDesc){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">线索：</b>'+esc(hypDesc)+'</div>';
          }
          if(evidence){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">证据：</b>'+esc(evidence)+'</div>';
          }
          var evRefs=hdata.evidence_refs||[];
          if(evRefs.length){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">证据卡（'+evRefs.length+' 张）：</b>';
            evRefs.forEach(function(rid){
              var c=evidenceMap[rid];
              if(!c){
                html+='<div style="margin-top:6px;padding:8px 10px;background:var(--p2);border-radius:8px;color:var(--amber)">'+esc(rid)+'（未找到对应证据卡）</div>';
                return;
              }
              html+='<div style="margin-top:6px;padding:8px 10px;background:var(--p2);border-radius:8px">'
                +'<div style="font-size:12px;color:var(--sub);font-family:monospace">'+esc(c.fact_type||'')+' · '+esc(c.source||'')+' · '+esc(c.session_id||'')+' · event '+esc(String(c.event_idx==null?'-':c.event_idx))+'</div>'
                +'<div style="font-size:13px;margin-top:4px;white-space:pre-wrap">'+esc(c.quote||'')+'</div>'
                +'</div>';
            });
            html+='</div>';
          }
          var counterEv=hdata.counter_evidence||'';
          if(counterEv){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">反证：</b>'+esc(counterEv)+'</div>';
          }
          // 支撑断点：该线索引用的断点
          var myBps=allBreakpoints.filter(function(b){
            var sup=b.data.supports_hypotheses||[];
            return sup.indexOf(idx+1)>=0;
          });
          if(myBps.length){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">支撑断点（'+myBps.length+' 条）：</b>';
            myBps.forEach(function(b){
              var bd=b.data;
              var bCause=DTS_CAUSE_LABELS[bd.cause_code]||bd.cause_code||'-';
              html+='<div style="margin-top:6px;padding:8px 10px;background:var(--p2);border-radius:8px">'
                +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
                +'<span class="knd">'+esc(b.label)+'</span>'
                +'<span class="knd">'+(bd.break_level||'-')+'</span>'
                +'<span class="knd">'+esc(bCause)+'</span>'
                +'<span class="knd" style="font-family:monospace;font-size:12px">'+esc(bd.session_id||'-')+'</span>'
                +'</div>';
              if(bd.evidence){html+='<div style="margin-top:4px;font-size:13px;color:var(--sub);white-space:pre-wrap">'+esc(bd.evidence)+'</div>';}
              html+='</div>';
            });
            html+='</div>';
          }else if(hdata.supporting_breakpoints&&hdata.supporting_breakpoints.length===0){
            html+='<div style="padding:10px 12px;font-size:14px;color:var(--sub);border-bottom:1px solid var(--bd)">该线索不基于知识访问断点（流程/推理类问题）</div>';
          }
          if(canResolve===false){
            if(blockedBy){html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">阻塞：</b>'+esc(blockedBy)+'</div>';}
            if(neededData&&neededData.length){
              html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">需外部数据：</b>'+neededData.map(function(x){return esc(x);}).join('、')+'</div>';
            }
          }
          if(target||location||action||expected){
            html+='<div style="padding:10px 12px;background:rgba(37,99,235,.04);border-top:1px solid var(--bd)"><div style="font-size:14px;color:var(--sub);margin-bottom:6px">修复建议';
            if(target){html+=' <span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+target+'</span>';}
            html+='</div>';
            if(location){html+='<div style="font-size:14px;margin-bottom:4px"><b style="color:var(--sub)">修改位置：</b>'+esc(location)+'</div>';}
            if(action){html+='<div style="font-size:14px;margin-bottom:4px"><b style="color:var(--sub)">修改内容：</b>'+esc(action)+'</div>';}
            if(expected){html+='<div style="font-size:14px"><b style="color:var(--sub)">预期效果：</b>'+esc(expected)+'</div>';}
            var hk=(chainType||'chain')+':hyp'+(idx+1);
            var hcInfo=(d.hypothesis_confirmations||{})[hk]||{};
            html+='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
            html+='<span style="font-size:13px;color:var(--sub);font-weight:500">根因确认：</span>';
            if(hcInfo.is_root===true){
              html+='<span class="knd" style="background:rgba(34,197,94,.15);color:var(--green);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(34,197,94,.2)">✓ 确认为根因</span>';
            }else if(hcInfo.is_root===false){
              html+='<span class="knd" style="background:rgba(220,38,38,.12);color:var(--red);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(220,38,38,.2)">✗ 确认为非根因</span>';
            }else{
              html+='<button class="confirm-btn confirm-btn-yes" onclick="confirmHypothesis(\''+esc(d.dts_id)+'\',\''+esc(hk)+'\',true,\''+esc(causeCode||'')+'\',\''+esc(agentType||'')+'\',\''+esc(projectId||'')+'\',\''+esc(projectName||'')+'\',this)">✓ 是此根因</button>'
                +'<button class="confirm-btn confirm-btn-no" onclick="confirmHypothesis(\''+esc(d.dts_id)+'\',\''+esc(hk)+'\',false,\''+esc(causeCode||'')+'\',\''+esc(agentType||'')+'\',\''+esc(projectId||'')+'\',\''+esc(projectName||'')+'\',this)">✗ 非此根因</button>';
            }
            html+='</div>';
            html+='</div>';
          }else{
            var hk2=(chainType||'chain')+':hyp'+(idx+1);
            var hcInfo2=(d.hypothesis_confirmations||{})[hk2]||{};
            html+='<div style="padding:10px 12px;border-top:1px solid var(--bd)"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
            html+='<span style="font-size:13px;color:var(--sub);font-weight:500">根因确认：</span>';
            if(hcInfo2.is_root===true){
              html+='<span class="knd" style="background:rgba(34,197,94,.15);color:var(--green);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(34,197,94,.2)">✓ 确认为根因</span>';
            }else if(hcInfo2.is_root===false){
              html+='<span class="knd" style="background:rgba(220,38,38,.12);color:var(--red);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(220,38,38,.2)">✗ 确认为非根因</span>';
            }else{
              html+='<button class="confirm-btn confirm-btn-yes" onclick="confirmHypothesis(\''+esc(d.dts_id)+'\',\''+esc(hk2)+'\',true,\''+esc(causeCode||'')+'\',\''+esc(agentType||'')+'\',\''+esc(projectId||'')+'\',\''+esc(projectName||'')+'\',this)">✓ 是此根因</button>'
                +'<button class="confirm-btn confirm-btn-no" onclick="confirmHypothesis(\''+esc(d.dts_id)+'\',\''+esc(hk2)+'\',false,\''+esc(causeCode||'')+'\',\''+esc(agentType||'')+'\',\''+esc(projectId||'')+'\',\''+esc(projectName||'')+'\',this)">✗ 非此根因</button>';
            }
            html+='</div></div>';
          }
          html+='</div>';
        });
        html+='</div>';
      }else if(legacyRootCauses.length||legacyFixSuggestions.length){
        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--red)">'
          +'<h3>根因分析与修复建议</h3>';
        legacyRootCauses.forEach(function(rc){
          html+='<div style="margin-bottom:12px"><div style="font-size:14px;color:var(--sub);margin-bottom:4px">根因';
          if(rc.label){html+=' <span class="knd">'+rc.label+'</span>';}
          if(rc.category){html+=' <span class="knd">'+rc.category+'</span>';}
          html+='</div><div style="font-size:14px;padding:10px 12px;background:var(--p2);border-radius:8px;white-space:pre-wrap">'+esc(rc.description||'(无)')+'</div></div>';
        });
        legacyFixSuggestions.forEach(function(fs){
          var fi=fs.items||{};
          var target=TARGET_LABELS[fi.target]||fi.target||'';
          var location=fi.location||'';
          var action=fi.action||'';
          var expected=fi.expected_effect||'';
          html+='<div style="margin-bottom:12px;border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
            +'<div style="font-size:14px;color:var(--sub);padding:8px 12px;background:var(--p2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
            +'修复建议';
          if(fs.label){html+=' <span class="knd">'+fs.label+'</span>';}
          if(target){html+=' <span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+target+'</span>';}
          html+='</div>';
          if(location){html+='<div style="padding:8px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">修改位置：</b>'+esc(location)+'</div>';}
          if(action){html+='<div style="padding:8px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">修改内容：</b>'+esc(action)+'</div>';}
          if(expected){html+='<div style="padding:8px 12px;font-size:14px"><b style="color:var(--sub)">预期效果：</b>'+esc(expected)+'</div>';}
          html+='</div>';
        });
        html+='</div>';
      }
    }

    var _hasHypotheses=typeof allHypotheses!=='undefined'&&allHypotheses&&allHypotheses.length>0;
    // 断点证据：该线索引用的断点
    if(d.breakpoint_desc){
      var bpTitle=_hasHypotheses?'支撑断点证据':(d.case_type==='FN'?'漏报原因分析':'误报原因分析');
      html+='<div class="card" style="margin-bottom:16px">'
        +'<details><summary style="font-size:15px;color:var(--sub);cursor:pointer;font-weight:600">'+bpTitle+'</summary>'
        +'<div style="margin-top:8px;font-size:14px;padding:10px 12px;background:var(--p2);border-radius:8px;white-space:pre-wrap">'+esc(d.breakpoint_desc)+'</div>'
        +'</details>';
      if(d.evidence_uri){
        html+='<div style="margin-top:12px"><div style="font-size:14px;color:var(--sub);margin-bottom:4px">证据</div><div style="font-size:13px;font-family:monospace;padding:10px 12px;background:var(--p2);border-radius:8px;word-break:break-all">'+esc(d.evidence_uri)+'</div></div>';
      }
      html+='</div>';
    }

    var sessionChains=d.session_chains||{mining:[],verification:[],parent_map:{}};
    if(caseData){
      var chains=[
        {type:'mining',label:'挖掘链',data:caseData.mining||{},sessions:sessionChains.mining||[]},
        {type:'verification',label:'验证链',data:caseData.verification||{},sessions:sessionChains.verification||[]}
      ];
      chains.forEach(function(ch){
        if(!ch.data||!Object.keys(ch.data).length){return;}
        var sessionChain=ch.data.session_chain||[];
        var agentType=ch.data.agent_type||'';
        var agentLbl=AGENT_LABELS[agentType]||agentType||'-';
        var summaries=ch.data.compressed_summaries||[];
        var chainSessions=ch.sessions||[];
        var parentMap=sessionChains.parent_map||{};

        html+='<div class="card" style="margin-bottom:16px">'
          +'<h3>'+ch.label+' ('+agentLbl+')</h3>';

        if(chainSessions.length){
          html+='<div style="margin-bottom:12px"><div style="font-size:14px;color:var(--sub);margin-bottom:6px">Session 调用链 ('+chainSessions.length+' 个)</div>';
          html+='<div style="font-family:monospace;font-size:13px;line-height:1.8;white-space:pre-wrap;padding:10px 12px;background:var(--p2);border-radius:8px">';
          var smap={};
          chainSessions.forEach(function(s){smap[s.session_id]=s;});
          var chainSet={};
          chainSessions.forEach(function(s){chainSet[s.session_id]=true;});
          var roots=chainSessions.filter(function(s){
            var pid=s.parent_id||'';
            return !pid||!chainSet[pid];
          });
          var visited={};
          function renderNode(sid,depth){
            if(visited[sid]){return'';}
            visited[sid]=true;
            var s=smap[sid]||{};
            var agent=s.agent||s.session_type||'?';
            var taskType=s.task_type?' ['+s.task_type+']':'';
            var status=s.status?' ('+s.status+')':'';
            var indent='  '.repeat(depth);
            var arrow=depth>0?'└─ ':'';
            var line=indent+arrow+'<span style="color:var(--acc)">'+agent+'</span>'+taskType+status+' <span style="color:var(--gray);font-size:11px">'+sid+'</span>\n';
            var kids=chainSessions.filter(function(cs){return cs.parent_id===sid;});
            kids.forEach(function(kid){line+=renderNode(kid.session_id,depth+1);});
            return line;
          }
          if(roots.length){
            roots.forEach(function(s){html+=renderNode(s.session_id,0);});
          }else{
            chainSessions.forEach(function(s,idx){
              var agent=s.agent||s.session_type||'?';
              html+=(idx>0?'→ ':'')+agent+' <span style="color:var(--gray);font-size:11px">'+s.session_id+'</span>\n';
            });
          }
          html+='</div></div>';
        }

        if(summaries.length){
          html+='<details style="margin-bottom:12px"><summary style="font-size:14px;color:var(--sub);cursor:pointer">压缩摘要 ('+summaries.length+' 个)</summary>';
          summaries.forEach(function(s,idx){
            var sumText=s.summary||s.compressed_summary||'';
            if(sumText){
              html+='<div style="margin-top:8px;padding:10px 12px;background:var(--p2);border-radius:8px;font-size:13px;white-space:pre-wrap">'+esc(sumText)+'</div>';
            }
          });
          html+='</details>';
        }

        var mergeKM=ch.data.knowledge_memory_summary;
        if(mergeKM&&(mergeKM.access_count>0||mergeKM.overall_effect||mergeKM.impact_on_conclusion)){
          html+=renderKMSummary(mergeKM,ch.label+' 综合');
        }

        // L4 独立验证（由测评系统代为发起知识库查询）
        var l4=ch.data.l4_independent_verification;
        if(l4&&l4.query_log){
          var l4Exists=l4.l4_knowledge_exists;
          var l4Color=l4Exists===false?'var(--red)':l4Exists===true?'var(--green)':'var(--gray)';
          var l4Label=l4Exists===false?'知识库中未找到相关知识':l4Exists===true?'知识库中存在相关知识':'验证未完成';
          html+='<details style="margin-bottom:12px"><summary style="font-size:14px;color:var(--sub);cursor:pointer">L4 独立验证（由测评系统代为发起知识库查询）</summary>';
          html+='<div style="margin-top:8px;padding:10px 12px;background:var(--p2);border-radius:8px;font-size:13px">';
          html+='<div style="margin-bottom:8px"><span style="color:var(--gray)">验证结果：</span><b style="color:'+l4Color+'">'+l4Label+'</b>';
          if(l4.summary){html+='<span style="color:var(--gray);margin-left:8px">('+esc(l4.summary)+')</span>';}
          html+='</div>';
          // 从 query_log 中提取项目 ID
          var l4ProjectId='';
          for(var qi=0;qi<l4.query_log.length;qi++){
            var act=l4.query_log[qi].action||'';
            var m=act.match(/projects\/([a-f0-9]+)/);
            if(m){l4ProjectId=m[1];break;}
          }
          if(l4ProjectId){
            html+='<div style="margin-bottom:8px"><span style="color:var(--gray)">项目 ID：</span><b style="font-family:monospace;font-size:12px">'+l4ProjectId+'</b></div>';
          }
          if(l4.kb_searched){
            var sources=[];
            if(l4.kb_searched.athena_api)sources.push('Athena 知识库 API');
            if(l4.kb_searched.wiki_nfs)sources.push('记忆/Wiki NFS');
            if(sources.length)html+='<div style="margin-bottom:8px"><span style="color:var(--gray)">查询来源：</span>'+sources.join(' + ')+'</div>';
          }
          var ql=l4.query_log||[];
          if(ql.length){
            html+='<div style="color:var(--gray);margin-bottom:4px">查询过程（问题完整 / 回复汇总）：</div>';
            ql.forEach(function(q){
              html+='<div style="margin-bottom:8px;padding:8px 10px;background:var(--p1);border-radius:6px">';
              if(q.step){html+='<div style="font-weight:600;font-size:12px;color:var(--acc)">'+esc(q.step)+'</div>';}
              // 问题：detail（含漏洞标题/误报原因/关键词）+ action（含完整 URL）
              if(q.detail){html+='<div style="margin-top:4px;font-size:12px"><b style="color:var(--sub)">问题：</b><div style="margin-top:2px;white-space:pre-wrap">'+esc(q.detail)+'</div></div>';}
              if(q.action){html+='<div style="margin-top:2px;font-size:12px;color:var(--gray);word-break:break-all">'+esc(q.action)+'</div>';}
              // 回复：result + count 汇总
              if(q.result||q.count!==undefined){
                html+='<div style="margin-top:4px;font-size:12px"><b style="color:var(--sub)">回复：</b>';
                if(q.result){html+='<span style="color:var(--gray)">'+esc(q.result)+'</span>';}
                if(q.count!==undefined&&q.count!==null){html+=' <span class="knd">命中 '+q.count+'</span>';}
                html+='</div>';
              }
              html+='</div>';
            });
          }
          html+='</div></details>';
        }

        html+='</div>';
      });
    }

    if(d.replay_result){
      var replayColor=d.replay_result==='false_positive_resolved'?'var(--green)':d.replay_result==='still_vulnerable'?'var(--red)':'var(--gray)';
      var replayLabel=d.replay_result==='false_positive_resolved'?'误报已消除':d.replay_result==='still_vulnerable'?'漏洞仍存在':'-';
      html+='<div class="card" style="margin-bottom:16px"><h3>回归验证</h3>'
        +'<div style="font-size:14px"><span style="color:var(--gray)">回归结果：</span><span class="bdg" style="background:rgba(107,114,128,.15);color:'+replayColor+'">'+replayLabel+'</span></div>';
      if(d.replay_eval_id){
        html+='<div style="margin-top:8px;font-size:14px"><span style="color:var(--gray)">回归任务 ID：</span><b style="font-family:monospace;font-size:12px">'+d.replay_eval_id+'</b></div>';
      }
      if(d.replay_data){
        try{
          var rd=JSON.parse(d.replay_data);
          html+='<div style="margin-top:12px;font-size:14px">';
          html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">回归漏洞标题：</span>'+dtsTextView(rd.vuln_title,'回归漏洞标题',80)+'</div>';
          html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">回归漏洞描述：</span>'+dtsTextView(rd.vuln_description,'回归漏洞描述',120)+'</div>';
          if(rd.is_vulnerable!==undefined){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">是否仍有漏洞：</span><b>'+(rd.is_vulnerable?'是':'否')+'</b></div>';}
          if(rd.caller_service){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">回归方：</span><b style="font-family:monospace;font-size:12px">'+esc(rd.caller_service)+'</b></div>';}
          if(rd.message){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">结论：</span>'+esc(rd.message)+'</div>';}
          html+='</div>';
        }catch(e){}
      }
      html+='</div>';
    }

    // ── 回归历史（每次提交都保留，含提交时间）──
    if(d.regression_history&&d.regression_history.length){
      html+='<div class="card" style="margin-bottom:16px"><h3>回归历史（共 '+d.regression_history.length+' 次）</h3>'
        +'<table style="width:100%;border-collapse:collapse;font-size:13px">'
        +'<thead><tr style="text-align:left;color:var(--gray)">'
        +'<th style="padding:6px 8px">时间</th>'
        +'<th style="padding:6px 8px">回归漏洞标题</th>'
        +'<th style="padding:6px 8px">回归漏洞描述</th>'
        +'<th style="padding:6px 8px">回归方</th>'
        +'<th style="padding:6px 8px">匹配方式</th>'
        +'<th style="padding:6px 8px">结果</th>'
        +'<th style="padding:6px 8px">问题单状态</th>'
        +'<th style="padding:6px 8px">任务 ID</th>'
        +'<th style="padding:6px 8px">说明</th></tr></thead><tbody>';
      d.regression_history.forEach(function(h){
        var ok=h.replay_result==='false_positive_resolved';
        var pend=h.status==='evaluating';
        var err=h.status==='error';
        var color=ok?'var(--green)':(h.replay_result==='still_vulnerable'?'var(--red)':(err?'var(--red)':'var(--gray)'));
        var label=ok?'误报已消除':(h.replay_result==='still_vulnerable'?'漏洞仍存在':(pend?'判定中':(err?'判定失败':'-')));
        var mm=h.match_method==='llm'?'LLM 匹配':(h.match_method||'-');
        var ts=String(h.submitted_at||'').replace('T',' ').slice(0,19);
        var rd={};
        try{ rd=h.replay_data?JSON.parse(h.replay_data):{}; }catch(e){}
        var hTitle=rd.vuln_title||h.vuln_title||'';
        var hDesc=rd.vuln_description||'';
        html+='<tr style="border-top:1px solid var(--p2)">'
          +'<td style="padding:6px 8px;white-space:nowrap">'+ts+'</td>'
          +'<td style="padding:6px 8px;max-width:260px">'+dtsTextView(hTitle,'回归漏洞标题',50)+'</td>'
          +'<td style="padding:6px 8px;max-width:260px">'+dtsTextView(hDesc,'回归漏洞描述',60)+'</td>'
          +'<td style="padding:6px 8px;font-family:monospace;font-size:12px">'+esc(rd.caller_service||h.caller_service||'unknown')+'</td>'
          +'<td style="padding:6px 8px">'+mm+'</td>'
          +'<td style="padding:6px 8px"><span style="color:'+color+';font-weight:600">'+label+'</span></td>'
          +'<td style="padding:6px 8px">'+String(h.status||'')+'</td>'
          +'<td style="padding:6px 8px;font-family:monospace;font-size:12px">'+String(h.task_id||'')+'</td>'
          +'<td style="padding:6px 8px">'+esc(h.message||'')+'</td>'
          +'</tr>';
      });
      html+='</tbody></table></div>';
    }

    $("dts-detail-body").innerHTML=html;
  }catch(e){
    $("dts-detail-body").innerHTML='<div style="color:var(--red)">加载失败: '+e+'</div>';
  }
}

// 假定线索根因确认
async function confirmHypothesis(dtsId,hypKey,isRoot,causeCode,agentType,projectId,projectName,btn){
  if(!dtsId||!hypKey)return;
  var body={hypothesis_key:hypKey,is_root:isRoot,cause_code:causeCode||'',agent_type:agentType||'',project_id:projectId||'',project_name:projectName||''};
  btn.disabled=true;
  try{
    var res=await jpost('/api/v2/dts/'+encodeURIComponent(dtsId)+'/confirm-hypothesis',body);
    if(res&&res.error){showConfirm({icon:'❌',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',title:'确认失败',desc:String(res.error||''),confirmText:'知道了',confirmColor:'var(--red)',onConfirm:function(){btn.disabled=false;}});return;}
    renderDtsDetailPage(dtsId);
  }catch(e){
    showConfirm({icon:'❌',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',title:'确认失败',desc:String(e),confirmText:'知道了',confirmColor:'var(--red)',onConfirm:function(){btn.disabled=false;}});
  }
}

renderDtsDetailPage(DTS_ID);
</script>
