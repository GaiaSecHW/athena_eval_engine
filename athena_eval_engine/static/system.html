async function renderSystem(){
  var c=null;
  try{c=await jget("/api/v1/system/config");}catch(e){$("view").innerHTML='<div class="page-body"><div class="card">加载失败</div></div>';return;}
  var llmActive=c.llm_active||0,llmMax=c.llm_max_concurrency||50,rt=c.running_tasks||0;
  var evalMax=c.max_concurrent_evals||3,queued=c.queued_tasks||0,paused=c.paused_tasks||0;
  var threadCount=c.thread_count||0;
  var llmPct=Math.round(llmActive/llmMax*100);
  var llmColor=llmPct>80?'var(--red)':llmPct>50?'var(--amber)':'var(--green)';
  var h=`<div class="page-body">
    <div class="card"><h3>系统参数设置</h3>
    <div style="font-size:13px;color:var(--sub);margin-bottom:16px">修改后立即生效并持久化到数据库，Pod 重启后保留配置。</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:14px;border:1px solid var(--bd);border-radius:8px;background:var(--p2)">
      <div style="text-align:center;min-width:100px"><div style="font-size:28px;font-weight:700;color:var(--acc)">${rt}<span style="font-size:16px;color:var(--sub)">/${evalMax}</span></div><div style="font-size:12px;color:var(--sub);margin-top:2px">运行中任务${queued?`（${queued} 排队${paused?`，${paused} 暂停`:''}）`:(paused?`（${paused} 暂停）`:'')}</div></div>
      <div style="text-align:center;min-width:100px"><div style="font-size:28px;font-weight:700;color:${llmColor}">${llmActive}<span style="font-size:16px;color:var(--sub)">/${llmMax}</span></div><div style="font-size:12px;color:var(--sub);margin-top:2px">LLM 并发</div></div>
      <div style="text-align:center;min-width:100px"><div style="font-size:28px;font-weight:700;color:var(--acc)">${threadCount}</div><div style="font-size:12px;color:var(--sub);margin-top:2px">总线程数</div></div>
      <div style="flex:1;min-width:120px;display:flex;align-items:center"><div style="width:100%;height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden"><div style="width:${llmPct}%;height:100%;background:${llmColor};transition:width .3s"></div></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div><label style="font-weight:600;font-size:14px">LLM 最大并发量</label><div style="font-size:12px;color:var(--sub);margin:4px 0">LLM 请求的全局信号量上限（1-1000）</div><input id="cfg_llm_conc" type="number" min="1" max="1000" value="${c.llm_max_concurrency}" style="width:120px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">同时启动任务数</label><div style="font-size:12px;color:var(--sub);margin:4px 0">评测后台线程池大小（1-10）</div><input id="cfg_max_evals" type="number" min="1" max="10" value="${c.max_concurrent_evals}" style="width:120px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">评测线程池上界</label><div style="font-size:12px;color:var(--sub);margin:4px 0">评测线程池固定大小上界（1-50），需 ≥ 同时启动任务数</div><input id="cfg_eval_pool_max" type="number" min="1" max="50" value="${c.eval_pool_max}" style="width:120px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">Trace 解析并发数</label><div style="font-size:12px;color:var(--sub);margin:4px 0">每个评测的 trace 解析线程池大小（1-50）</div><input id="cfg_parse_workers" type="number" min="1" max="50" value="${c.parse_workers}" style="width:120px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">回归验证并发数</label><div style="font-size:12px;color:var(--sub);margin:4px 0">DTS 回归验证异步线程池大小（1-64），影响并发回归时是否排队超时</div><input id="cfg_regression_workers" type="number" min="1" max="64" value="${c.regression_workers??8}" style="width:120px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">LLM 思考模式</label><div style="font-size:12px;color:var(--sub);margin:4px 0">控制 LLM 推理深度。关闭=不思考，开启后可选 low/high/max</div><div style="display:flex;align-items:center;gap:12px"><label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin:0;cursor:pointer"><input id="cfg_reasoning_enabled" type="checkbox" ${c.reasoning_effort&&c.reasoning_effort!=='none'?'checked':''} onchange="toggleReasoning(this)" style="width:auto"> 是否开启思考</label><select id="cfg_reasoning_effort" style="width:100px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt);${c.reasoning_effort&&c.reasoning_effort!=='none'?'':'display:none'}"><option value="low" ${c.reasoning_effort==='low'?'selected':''}>low</option><option value="high" ${c.reasoning_effort==='high'?'selected':''}>high</option><option value="max" ${c.reasoning_effort==='max'?'selected':''}>max</option></select></div></div>
      <div><label style="font-weight:600;font-size:14px">LLM temperature</label><div style="font-size:12px;color:var(--sub);margin:4px 0">采样温度（0-2）。0 最稳定但非完全确定：网关可能路由到不同后端模型，输出仍有差异</div><input id="cfg_llm_temperature" type="number" min="0" max="2" step="0.1" value="${c.llm_temperature??0}" style="width:120px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">LLM seed</label><div style="font-size:12px;color:var(--sub);margin:4px 0">固定随机种子；-1 表示不发送。注意：网关随机路由不同后端，seed 不互通，无法保证结果完全一致</div><input id="cfg_llm_seed" type="number" min="-1" max="2147483647" step="1" value="${c.llm_seed??-1}" style="width:160px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>
      <div><label style="font-weight:600;font-size:14px">Trace 快照</label><div style="font-size:12px;color:var(--sub);margin:4px 0">把实际喂给模型的 session 原文写入 {eid}_trace_*.json，用于两次评测对比输入是否一致。输入/提示词指纹始终记录，关闭只停写全文</div><label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin:0;cursor:pointer"><input id="cfg_trace_snapshot" type="checkbox" ${c.trace_snapshot?'checked':''} style="width:auto"> 是否落盘</label></div>
    </div>
    <div style="margin-top:20px;display:flex;gap:12px"><button id="cfg_save_btn" onclick="saveSystemConfig()" style="padding:8px 24px;border:none;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;font-size:14px">保存</button><button onclick="renderSystem()" style="padding:8px 24px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt);cursor:pointer;font-size:14px">刷新</button></div>
    <div id="cfg_msg" style="margin-top:12px;font-size:13px"></div>
    </div>
    <div class="card" style="margin-top:20px"><h3>LLM 网关配置</h3><div style="font-size:13px;color:var(--sub);margin-bottom:16px">LLM 网关地址、模型配置与连通性测试。模型修改后立即生效，Pod 重启后保留。</div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div><label style="font-weight:600;font-size:14px">网关地址</label><div style="font-size:12px;color:var(--sub);margin:4px 0">LLM 网关 Base URL（只读，通过环境变量 EVAL_LLM_BASE_URL 配置）</div><input id="cfg_llm_base_url" value="加载中..." readonly style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--sub);font-family:monospace;font-size:13px"></div>
      <div><label style="font-weight:600;font-size:14px">模型</label><div style="font-size:12px;color:var(--sub);margin:4px 0">LLM 模型名（如 pro、glm-5.2 等，修改后立即生效）</div><div style="display:flex;gap:8px;align-items:center"><input id="cfg_llm_model" value="${c.llm_model||''}" placeholder="如 pro" style="flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"><button class="btn" style="font-size:13px;padding:6px 16px;white-space:nowrap" onclick="saveLlmModel()">切换模型</button></div></div>
      <div style="border-top:1px solid var(--bd);padding-top:16px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button class="btn g" style="font-size:13px;padding:8px 20px" onclick="testLlmConnection()">测试连通性</button><span id="llm_test_status" style="font-size:13px;color:var(--sub)"></span></div><div id="llm_test_result" style="font-size:13px"></div></div>
    </div>
    </div>
    <div class="card" style="margin-top:20px"><h3>Agent 数据源配置</h3><div style="font-size:13px;color:var(--sub);margin-bottom:16px">各 Agent 的数据库连接配置。密码脱敏显示，修改时留空或 *** 表示不更新。</div><div id="ds-container"><div style="color:var(--sub)">加载中...</div></div></div>
    <div class="card" style="margin-top:20px"><h3>日报通知配置</h3><div style="font-size:13px;color:var(--sub);margin-bottom:16px">配置每个 agent / 责任方的 WeLink 负责人。未配置或未启用的 owner 不会发送日报。工号格式：拼音首字母+工号（如 w0012345）。</div>
    <div style="margin-bottom:18px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--p2)">
      <label style="font-weight:600;font-size:14px">小鲁班 Token</label>
      <div style="font-size:12px;color:var(--sub);margin:4px 0">在 WeLink 里找「小鲁班」，发送“获取发送token”，把返回的 token 粘贴到这里。token 过期时重新获取并更新。保存后只显示前 3 位和后 3 位。</div>
      <div id="notify_xiaoluban_current" style="font-size:13px;color:var(--sub);margin:4px 0;font-family:monospace">当前：未配置</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="notify_xiaoluban" placeholder="输入新 token（留空表示不修改）" style="flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--txt);font-family:monospace">
        <button class="btn" style="font-size:13px;padding:6px 14px;white-space:nowrap" onclick="saveXiaolubanToken()">保存</button>
      </div>
      <div id="notify_xiaoluban_msg" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div style="margin-bottom:18px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--p2)">
      <label style="font-weight:600;font-size:14px">环境标识</label>
      <div style="font-size:12px;color:var(--sub);margin:4px 0">日报标题前缀，例如 green / yellow。两套 eval 环境各配各的，收到消息时可直接区分。</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="notify_env" placeholder="green / yellow" style="flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--txt);font-family:monospace">
        <button class="btn" style="font-size:13px;padding:6px 14px;white-space:nowrap" onclick="saveNotifyEnv()">保存</button>
      </div>
      <div id="notify_env_msg" style="margin-top:8px;font-size:13px"></div>
      <label style="font-weight:600;font-size:14px;display:block;margin-top:14px">对外访问地址</label>
      <div style="font-size:12px;color:var(--sub);margin:4px 0">日报消息里的链接前缀，例如 green: http://chimera-g.icsl.huawei.com/eval，yellow: http://chimera-y.icsl.huawei.com/eval。</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="notify_public_url" placeholder="http://chimera-y.icsl.huawei.com/eval" style="flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--txt);font-family:monospace">
        <button class="btn" style="font-size:13px;padding:6px 14px;white-space:nowrap" onclick="saveNotifyPublicUrl()">保存</button>
      </div>
      <div id="notify_public_url_msg" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div style="margin-bottom:18px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--p2)">
      <label style="font-weight:600;font-size:14px">发送时间</label>
      <div style="font-size:12px;color:var(--sub);margin:4px 0">每天几点发送（Asia/Shanghai），修改后 60 秒内生效。</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="notify_daily_time" type="time" style="padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--txt);font-family:monospace">
        <button class="btn" style="font-size:13px;padding:6px 14px;white-space:nowrap" onclick="saveNotifyTime()">保存</button>
      </div>
      <div id="notify_time_msg" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div style="margin-bottom:18px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--p2)">
      <label style="font-weight:600;font-size:14px">工作日日历</label>
      <div style="font-size:12px;color:var(--sub);margin:4px 0">默认周一到周五发送，周末不发。节假日填“不发送日期”，调休上班的周末填“上班日期”。每行一个 YYYY-MM-DD。</div>
      <div id="notify_workdays_range" style="font-size:12px;color:var(--sub);margin:4px 0">已导入范围：-</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label style="font-size:12px;color:var(--sub)">不发送日期（节假日）</label><textarea id="notify_holidays" rows="4" placeholder="2026-10-01&#10;2026-10-02" style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--txt);font-family:monospace;resize:vertical"></textarea></div>
        <div><label style="font-size:12px;color:var(--sub)">上班日期（调休）</label><textarea id="notify_workdays" rows="4" placeholder="2026-10-11" style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--panel);color:var(--txt);font-family:monospace;resize:vertical"></textarea></div>
      </div>
      <div style="margin-top:8px"><button class="btn" style="font-size:13px;padding:6px 14px" onclick="saveNotifyWorkdays()">保存</button></div>
      <div id="notify_workdays_msg" style="margin-top:8px;font-size:13px"></div>
    </div>
    <div id="notify-container"><div style="color:var(--sub)">加载中...</div></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <label style="font-weight:600;font-size:14px">发送状态</label>

          <button class="btn g" style="font-size:13px;padding:6px 14px" onclick="runNotifyNow('')">立即发送全部</button>
          <button class="btn" style="font-size:13px;padding:6px 14px" onclick="loadNotifyStatus()">刷新状态</button>

function toggleReasoning(cb){var sel=$("cfg_reasoning_effort");if(sel){sel.style.display=cb.checked?'':'none';}}
async function saveSystemConfig(){
  var body={llm_max_concurrency:parseInt($("cfg_llm_conc").value)||50,max_concurrent_evals:parseInt($("cfg_max_evals").value)||3,eval_pool_max:parseInt($("cfg_eval_pool_max").value)||5,parse_workers:parseInt($("cfg_parse_workers").value)||4,regression_workers:parseInt($("cfg_regression_workers").value)||8};
  var rcb=$("cfg_reasoning_enabled");
  if(rcb){body.reasoning_effort=rcb.checked?($("cfg_reasoning_effort").value||'low'):'none';}
  var tempEl=$("cfg_llm_temperature"), seedEl=$("cfg_llm_seed");
  if(tempEl&&tempEl.value!==''){var t=parseFloat(tempEl.value);if(!isNaN(t))body.llm_temperature=t;}
  if(seedEl&&seedEl.value!==''){var sd=parseInt(seedEl.value);if(!isNaN(sd))body.llm_seed=sd;}
  var trEl=$("cfg_trace_snapshot");
  if(trEl){body.trace_snapshot=!!trEl.checked;}
  $("cfg_msg").innerHTML='⏳ 保存中…';
  try{await jput("/api/v1/system/config",body);$("cfg_msg").innerHTML='<span style="color:var(--green)">✓ 已保存并生效</span>';}
  catch(e){$("cfg_msg").innerHTML='<span style="color:var(--red)">✗ '+e+'</span>';}
}
async function loadLlmStatus(){
  try{
    var s=await jget("/api/v1/system/llm/status");
    if($("cfg_llm_base_url"))$("cfg_llm_base_url").value=s.base_url||'-';
    if($("cfg_llm_model"))$("cfg_llm_model").value=s.model||'';
  }catch(e){}
}
async function testLlmConnection(){
  var st=$("llm_test_status"),rs=$("llm_test_result");
  if(st)st.innerHTML='⏳ 测试中…';
  if(rs)rs.innerHTML='';
  var model='';
  var mEl=$("cfg_llm_model");
  if(mEl)model=mEl.value.trim();
  try{
    var body={};
    if(model)body.model=model;
    var r=await jpost("/api/v1/system/llm/test",body);
    if(st)st.innerHTML='';
    if(r.success){
      if(rs)rs.innerHTML='<div style="padding:10px 14px;border-radius:6px;background:rgba(22,163,74,.1);color:var(--green)">✓ 连通正常 — 模型: '+r.model+'，延迟: '+r.latency_ms+'ms，响应: '+(r.response||'').substring(0,50)+'</div>';
    }else{
      if(rs)rs.innerHTML='<div style="padding:10px 14px;border-radius:6px;background:rgba(220,38,38,.1);color:var(--red)">✗ 连接失败 — '+r.error+'</div>';
    }
  }catch(e){
    if(st)st.innerHTML='';
    if(rs)rs.innerHTML='<div style="color:var(--red)">✗ '+e+'</div>';
  }
}
async function saveLlmModel(){
  var mEl=$("cfg_llm_model");
  if(!mEl)return;
  var model=mEl.value.trim();
  if(!model){showConfirm({icon:'⚠️',iconBg:'rgba(251,191,36,.12)',iconColor:'var(--amber)',title:'提示',desc:'请输入模型名',confirmText:'知道了',confirmColor:'var(--amber)'});return;}
  try{
    await jput("/api/v1/system/llm/model",{model:model});
    if($("llm_test_result"))$("llm_test_result").innerHTML='<div style="padding:8px 14px;border-radius:6px;background:rgba(22,163,74,.1);color:var(--green);font-size:13px">✓ 模型已切换为 '+model+'</div>';
  }catch(e){
    if($("llm_test_result"))$("llm_test_result").innerHTML='<div style="color:var(--red)">✗ '+e+'</div>';
  }
}

let _dsData=null;
let _dsTestResult={};  // agent_type → {ok, txt}，重渲染后回填测试结果
async function loadDatasources(){
  try{const d=await jget("/api/v2/datasources");_dsData=d.datasources||d||[];renderDsContainer();}
  catch(e){$("ds-container").innerHTML='<div style="color:var(--red)">加载失败: '+e+'</div>';}
}
function renderDsContainer(){
  if(!_dsData||!_dsData.length){$("ds-container").innerHTML='<div style="color:var(--sub)">无配置</div>';return;}
  $("ds-container").innerHTML=_dsData.map(function(ds,i){
    var dbType=ds.db_type||'none';
    var typeBadge=dbType==='mysql'?'<span class="bdg b-COMPLETED">MySQL</span>':dbType==='postgresql'?'<span class="bdg b-RUNNING">PostgreSQL</span>':'<span class="bdg b-CREATED">无独立DB</span>';
    var statusBadge=ds.last_error?'<span class="bdg b-FAILED">连接异常</span>':ds.last_connected_at?'<span class="bdg b-COMPLETED">已连接</span>':'<span class="bdg b-CREATED">未测试</span>';
    var enabledBadge=ds.enabled?'<span class="bdg b-COMPLETED">启用</span>':'<span class="bdg b-CREATED">禁用</span>';
    var connInfo=ds.host?(ds.host+':'+(ds.port||'')):'-';
    var dbName=ds.database_name||'-';
    var pidInput=(ds.database_name||'').indexOf('{project_id}')>=0?'<div style="margin-top:10px"><label style="font-size:12px;color:var(--sub);margin:0">测试用 Project ID（数据库名含 {project_id} 占位符）</label><input id="ds_'+i+'_pid" placeholder="如 1ebaa4b2dc204454" style="width:100%;padding:6px 10px;font-size:14px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>':'';
    return '<div style="border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:16px">'+ds.display_name+'</b>'+typeBadge+enabledBadge+statusBadge+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;color:var(--sub);margin-bottom:10px">'+
      '<div>主机: <span style="font-family:monospace;color:var(--txt)">'+connInfo+'</span></div>'+
      '<div>数据库: <span style="font-family:monospace;color:var(--txt)">'+dbName+'</span></div>'+
      '<div>用户: <span style="font-family:monospace;color:var(--txt)">'+(ds.username||'-')+'</span></div>'+
      '<div>版本: <span style="font-family:monospace;color:var(--txt)">v'+(ds._version||1)+'</span></div>'+
      '</div>'+
      (ds.last_error?'<div style="font-size:13px;color:var(--red);margin-bottom:8px;padding:6px 10px;background:rgba(248,113,113,.08);border-radius:6px">'+ds.last_error+'</div>':'')+
      pidInput+
      '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn g" style="font-size:13px;padding:6px 14px" onclick="testDatasource('+i+')">测试连接</button>'+
      '<button class="btn g" style="font-size:13px;padding:6px 14px" onclick="toggleDsEnabled('+i+')">'+(ds.enabled?'禁用':'启用')+'</button>'+
      '</div><div id="ds_'+i+'_msg" style="margin-top:8px;font-size:13px">'+
      (_dsTestResult[ds.agent_type]?'<span style="color:'+(_dsTestResult[ds.agent_type].ok?'var(--green)':'var(--red)')+'">'+_dsTestResult[ds.agent_type].txt+'</span>':'')+
      '</div></div>';
  }).join('');
}
async function testDatasource(i){
  var ds=_dsData[i];if(!ds)return;
  var msg=$("ds_"+i+"_msg");if(msg)msg.innerHTML='<span style="color:var(--sub)">测试中...</span>';
  var pidEl=$("ds_"+i+"_pid");
  var pid=pidEl?pidEl.value.trim():'';
  var url="/api/v2/datasources/"+ds.agent_type+"/test";
  if(pid)url+="?project_id="+encodeURIComponent(pid);
  try{
    var r=await jpost(url,{});
    var txt=r.success?(r.error?('✓ '+r.error):'✓ 连接成功'):('✗ '+(r.error||'连接失败'));
    _dsTestResult[ds.agent_type]={ok:r.success,txt:txt};
    if(msg)msg.innerHTML='<span style="color:'+(r.success?'var(--green)':'var(--red)')+'">'+txt+'</span>';
    // 刷新状态徽章（last_error/last_connected_at 由后端更新），
    // 结果已存入 _dsTestResult，重渲染后回填仍可见
    loadDatasources();
  }catch(e){_dsTestResult[ds.agent_type]={ok:false,txt:'✗ '+e};if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+e+'</span>';}
}
async function toggleDsEnabled(i){
  var ds=_dsData[i];if(!ds)return;
  try{await jput("/api/v2/datasources/"+ds.agent_type,{enabled:!ds.enabled});loadDatasources();}
  catch(e){showConfirm({icon:'❌',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',title:'切换失败',desc:String(e),confirmText:'知道了',confirmColor:'var(--red)'});}
}

function _setXiaolubanCurrent(d){
  var cur=$("notify_xiaoluban_current");if(!cur)return;
  cur.textContent='当前：'+((d&&d.configured)?(d.token||'****'):'未配置');
}
async function loadXiaolubanToken(){
  try{
    const d=await jget("/api/v2/notify/xiaoluban-token");
    _setXiaolubanCurrent(d);
    var el=$("notify_xiaoluban");if(el)el.value='';
  }catch(e){var m=$("notify_xiaoluban_msg");if(m)m.innerHTML='<span style="color:var(--red)">加载失败: '+esc(String(e))+'</span>';}
}
async function saveXiaolubanToken(){
  var el=$("notify_xiaoluban");if(!el)return;
  var value=el.value.trim();
  var msg=$("notify_xiaoluban_msg");
  if(!value){if(msg)msg.innerHTML='<span style="color:var(--sub)">未修改</span>';return;}
  if(msg)msg.innerHTML='<span style="color:var(--sub)">保存中…</span>';
  try{
    const d=await jput("/api/v2/notify/xiaoluban-token",{token:value});
    el.value='';
    _setXiaolubanCurrent(d);
    if(msg)msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';
  }catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+esc(String(e))+'</span>';}
}

async function loadNotifyEnv(){

    const d=await jget("/api/v2/notify/env");
    var el=$("notify_env");if(el)el.value=d.env_name||'';

}

  var el=$("notify_env");if(!el)return;

  try{await jput("/api/v2/notify/env",{env_name:el.value.trim()});if(msg)msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';}
  catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+esc(String(e))+'</span>';}
}
async function saveNotifyPublicUrl(){
  var el=$("notify_public_url");if(!el)return;

    const d=await jput("/api/v2/notify/public-url",{public_url:el.value.trim()});

    if(msg)msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';
  }catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+esc(String(e))+'</span>';}
}

async function loadNotifyTime(){
  try{const d=await jget("/api/v2/notify/daily-time");var el=$("notify_daily_time");if(el)el.value=d.daily_time||'09:00';}
  catch(e){var m=$("notify_time_msg");if(m)m.innerHTML='<span style="color:var(--red)">加载失败: '+esc(String(e))+'</span>';}
}
async function saveNotifyTime(){
  var el=$("notify_daily_time");if(!el)return;
  var msg=$("notify_time_msg");if(msg)msg.innerHTML='<span style="color:var(--sub)">保存中…</span>';
  try{await jput("/api/v2/notify/daily-time",{daily_time:el.value});if(msg)msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';}
  catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+esc(String(e))+'</span>';}
}
function _setWorkdaysRange(d){
  var el=$("notify_workdays_range");if(!el)return;
  if(d&&d.min_date&&d.max_date){
    el.textContent='已导入范围：'+d.min_date+' ~ '+d.max_date+'；范围外按周一至周五发送、周末不发送';
  }else{
    el.textContent='尚未导入公司日历；当前按周一至周五发送、周末不发送';
  }
}
async function loadNotifyWorkdays(){
  try{
    const d=await jget("/api/v2/notify/workdays");
    var h=$("notify_holidays");if(h)h.value=(d.holidays||[]).join("\n");
    var w=$("notify_workdays");if(w)w.value=(d.workdays||[]).join("\n");
    _setWorkdaysRange(d);
  }catch(e){var m=$("notify_workdays_msg");if(m)m.innerHTML='<span style="color:var(--red)">加载失败: '+esc(String(e))+'</span>';}
}
function _parseDates(v){return (v||'').split(/[\s,，;；]+/).map(function(x){return x.trim();}).filter(Boolean);}
async function saveNotifyWorkdays(){
  var h=$("notify_holidays"), w=$("notify_workdays");
  var msg=$("notify_workdays_msg");if(msg)msg.innerHTML='<span style="color:var(--sub)">保存中…</span>';
  try{
    const d=await jput("/api/v2/notify/workdays",{holidays:_parseDates(h?h.value:''),workdays:_parseDates(w?w.value:'')});
    if(h)h.value=(d.holidays||[]).join("\n");
    if(w)w.value=(d.workdays||[]).join("\n");
    _setWorkdaysRange(d);
    if(msg)msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';
  }catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+esc(String(e))+'</span>';}
}
async function loadNotifyStatus(){
  var c=$("notify_status");if(!c)return;
  try{const d=await jget("/api/v2/notify/status");renderNotifyStatus(d);}
  catch(e){c.innerHTML='<span style="color:var(--red)">加载失败: '+esc(String(e))+'</span>';}
}
function renderNotifyStatus(d){
  var c=$("notify_status");if(!c)return;
  var owners=d.owners||[];
  var html='<div style="font-size:13px;color:var(--sub);margin-bottom:8px">每天 '+esc(d.daily_time||'09:00')+' 发送'+(d.workday_today===false?' · <span style="color:var(--amber)">今天非工作日，不自动发送</span>':'')+(d.running?' · <span style="color:var(--amber)">发送中…</span>':'')+'</div>';
  if(!owners.length){c.innerHTML=html+'<div style="color:var(--sub)">无 owner 配置</div>';return;}
  html+='<div style="overflow-x:auto"><table><thead><tr><th>Owner</th><th>负责人</th><th>最近发送</th><th>状态</th><th>统计窗口</th><th>错误</th><th></th></tr></thead><tbody>';
  owners.forEach(function(o){
    var last=o.last||{};
    var st=last.status||'-';
    var stColor=st==='sent'?'var(--green)':(st==='failed'?'var(--red)':'var(--gray)');
    var win=last.window_start?(fmtDate(last.window_start)+' ~ '+fmtDate(last.window_end)):'-';
    html+='<tr>'+
      '<td>'+esc(o.display_name||o.owner_key)+'</td>'+
      '<td>'+esc(o.owner_name||'-')+'</td>'+
      '<td>'+esc(last.sent_at?fmtDate(last.sent_at):'-')+'</td>'+
      '<td style="color:'+stColor+'">'+esc(st)+'</td>'+
      '<td style="font-size:12px;color:var(--sub)">'+esc(win)+'</td>'+
      '<td style="font-size:12px;color:var(--red);max-width:220px;word-break:break-all">'+esc(last.error||'')+'</td>'+
      '<td><button class="btn g" style="font-size:12px;padding:4px 10px;white-space:nowrap" onclick="runNotifyNow(\''+esc(o.owner_key)+'\')">发送</button></td>'+
      '</tr>';
  });
  html+='</tbody></table></div>';
  c.innerHTML=html;
}
async function runNotifyNow(ownerKey){
  var c=$("notify_status");if(c)c.innerHTML='<span style="color:var(--sub)">发送中…</span>';
  try{
    var url="/api/v2/notify/run";
    if(ownerKey)url+="?owner_key="+encodeURIComponent(ownerKey);
    await jpost(url,{});
    var tries=0;
    var timer=setInterval(async function(){
      tries++;
      try{
        const d=await jget("/api/v2/notify/status");
        renderNotifyStatus(d);
        if(!d.running){clearInterval(timer);}
      }catch(e){}
      if(tries>40)clearInterval(timer);
    },3000);
  }catch(e){if(c)c.innerHTML='<span style="color:var(--red)">'+esc(String(e))+'</span>';}
}

let _notifyData=null;
async function loadNotifyOwners(){
  try{const d=await jget("/api/v2/notify/owners");_notifyData=d.owners||[];renderNotifyOwners();}
  catch(e){var c=$("notify-container");if(c)c.innerHTML='<div style="color:var(--red)">加载失败: '+esc(String(e))+'</div>';}
}
function renderNotifyOwners(){
  var c=$("notify-container");if(!c)return;
  if(!_notifyData||!_notifyData.length){c.innerHTML='<div style="color:var(--sub)">无配置</div>';return;}
  c.innerHTML=_notifyData.map(function(o,i){
    var kindLabel=o.owner_kind==='agent'?'Agent':'责任方';
    var targetType=o.target_type||'user';
    return '<div style="border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b style="font-size:15px">'+esc(o.display_name||o.owner_key)+'</b><span class="knd">'+kindLabel+'</span><span style="font-size:12px;color:var(--gray);font-family:monospace">'+esc(o.owner_key)+'</span></div>'+
      '<div style="display:grid;grid-template-columns:1.2fr .8fr 1.5fr auto;gap:10px;align-items:end">'+
      '<div><label style="font-size:12px;color:var(--sub)">负责人</label><input id="nt_'+i+'_name" value="'+esc(o.owner_name||'')+'" placeholder="如 张三" style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>'+
      '<div><label style="font-size:12px;color:var(--sub)">类型</label><select id="nt_'+i+'_type" style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"><option value="user"'+(targetType==='user'?' selected':'')+'>个人</option><option value="group"'+(targetType==='group'?' selected':'')+'>群</option></select></div>'+
      '<div><label style="font-size:12px;color:var(--sub)">工号 / 群号</label><input id="nt_'+i+'_id" value="'+esc(o.target_id||'')+'" placeholder="w0012345 或 1234567891011" style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt);font-family:monospace"></div>'+
      '<div style="display:flex;gap:10px;align-items:center"><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:0;cursor:pointer;white-space:nowrap"><input id="nt_'+i+'_enabled" type="checkbox"'+(o.enabled?' checked':'')+' style="width:auto"> 启用</label><button class="btn g" style="font-size:13px;padding:6px 14px;white-space:nowrap" onclick="saveNotifyOwner('+i+')">保存</button></div>'+
      '</div><div id="nt_'+i+'_msg" style="margin-top:8px;font-size:13px"></div></div>';
  }).join('');
}
async function saveNotifyOwner(i){
  var o=_notifyData&&_notifyData[i];if(!o)return;
  var body={owner_key:o.owner_key,owner_name:$("nt_"+i+"_name").value.trim(),target_type:$("nt_"+i+"_type").value,target_id:$("nt_"+i+"_id").value.trim(),enabled:$("nt_"+i+"_enabled").checked};
  var msg=$("nt_"+i+"_msg");if(msg)msg.innerHTML='<span style="color:var(--sub)">保存中…</span>';
  try{await jput("/api/v2/notify/owners",body);if(msg)msg.innerHTML='<span style="color:var(--green)">✓ 已保存</span>';}
  catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+esc(String(e))+'</span>';}
}
