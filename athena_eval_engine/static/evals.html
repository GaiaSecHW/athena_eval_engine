<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评测列表</title>
<script>
(function(){
  var _p=location.pathname;
  var _ing=(_p==='/eval'||_p.indexOf('/eval/')===0)?'/eval':'';
  var _lib=_ing+'/static/lib/';
  document.write('<link rel="stylesheet" href="'+_lib+'app.css">');
  document.write('<script src="'+_lib+'config.js"><\/script>');
  document.write('<script src="'+_lib+'app.js"><\/script>');
})();
</script>
<style>
.ef-btn{padding:6px 12px;font-size:13px;border:1px solid var(--bd);background:var(--p2);color:var(--txt);border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s}
.ef-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ev-actions{display:inline-flex;gap:4px;margin-left:6px}
.ev-card.deleted{opacity:.55;filter:grayscale(1)}
.ev-card.deleted:hover{transform:none;box-shadow:none;border-color:var(--bd)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title" onclick="go('/')">奇美拉测评平台</div>
    <nav>
      <button class="ghost nav-item" data-route="home" onclick="go('/')">首页</button>
      <button class="ghost nav-item" data-route="evals" onclick="go('/evals')">评测</button>
      <button class="ghost nav-item" data-route="dts" onclick="go('/dts')">问题单</button>
      <button class="ghost nav-item" data-route="report" onclick="go('/report')">平台任务详情</button>
    </nav>
    <div class="sp"></div>
    <button class="ghost" onclick="go('/create')">+ 新建评测</button>
    <button class="ghost nav-item" id="sys-btn" onclick="go('/system')" style="display:none">系统</button>
    <button class="ghost" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </header>
  <main><div id="view"></div></main>
</div>
<script>
renderNav('/evals');

let _evData=[];let _evPage=1;let _evFilter="all";let _evQ="";
// 已查询过存活状态的评测 ID，避免重复请求
let _evAliveChecked={};

// 列表秒回后，按当前可见页异步补全「平台任务已删除」置灰状态
async function loadAliveFor(pageItems){
  var need=pageItems.map(function(e){return e.evaluation_id;})
    .filter(function(id){return id&&!_evAliveChecked[id];});
  if(!need.length)return;
  need.forEach(function(id){_evAliveChecked[id]=true;});
  try{
    var d=await jget("/api/v1/eval-alive-status?eids="+encodeURIComponent(need.join(",")));
    var del=d.deleted||{};
    var changed=false;
    _evData.forEach(function(e){
      if(e.evaluation_id in del && !!e.task_deleted!==!!del[e.evaluation_id]){
        e.task_deleted=!!del[e.evaluation_id];changed=true;
      }
    });
    if(changed)renderEvList();
  }catch(e){}
}

async function renderEvals(){
  _evAliveChecked={};
  _evData=await jgetAllEvaluations();_evPage=1;
  $("view").innerHTML=`<div class="page-body">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <input id="ev-search" placeholder="搜索 ID / 名称…" oninput="filterEvals()" style="max-width:280px" value="${_evQ}">
      <button class="ef-btn${_evFilter==='all'?' active':''}" onclick="setEvFilter('all',this)">全部</button>
      <button class="ef-btn${_evFilter==='dev'?' active':''}" onclick="setEvFilter('dev',this)">开发态</button>
      <button class="ef-btn${_evFilter==='runtime'?' active':''}" onclick="setEvFilter('runtime',this)">运行态</button>
      <button class="ef-btn${_evFilter==='COMPLETED'?' active':''}" onclick="setEvFilter('COMPLETED',this)">完成</button>
      <button class="ef-btn${_evFilter==='COMPLETED_WITH_WARNINGS'?' active':''}" onclick="setEvFilter('COMPLETED_WITH_WARNINGS',this)">警告</button>
      <button class="ef-btn${_evFilter==='FAILED'?' active':''}" onclick="setEvFilter('FAILED',this)">失败</button>
      <span id="ev-total-count" style="margin-left:auto;font-size:13px;color:var(--sub)">共 ${_evData.length} 条</span>
      <button class="btn g" style="font-size:13px;padding:6px 12px" onclick="refreshEvalsData()">🔄 刷新</button>
    </div>
    <div style="flex:1;overflow-y:auto"><div class="ev-grid" id="ev-list-body"></div></div>
  </div>`;
  renderEvList();
}
function setEvFilter(f,btn){_evFilter=f;_evPage=1;document.querySelectorAll(".ef-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderEvList();}
function filterEvals(){_evQ=$("ev-search").value.toLowerCase();_evPage=1;renderEvList();}
function evPage(p){_evPage=p;renderEvList();}
// 只刷新数据，不重建页面、不重置页码/筛选/搜索（重跑、取消、删除后使用）
async function refreshEvalsData(){
  try{
    _evAliveChecked={};
    _evData=await jgetAllEvaluations();
    const cnt=$("ev-total-count");
    if(cnt)cnt.textContent="共 "+_evData.length+" 条";
    renderEvList();
  }catch(e){
    showAlert({title:'刷新失败',desc:(e&&e.message)?e.message:String(e)});
  }
}
const EV_PAGE_SIZE=16;

function renderEvList(){
  let filtered=_evData;
  if(_evFilter==='dev'||_evFilter==='runtime')filtered=filtered.filter(e=>(e.eval_mode||'dev')===_evFilter);
  else if(_evFilter!=="all")filtered=filtered.filter(e=>(e.status||"").startsWith(_evFilter));
  if(_evQ)filtered=filtered.filter(e=>(e.evaluation_id+e.name).toLowerCase().includes(_evQ));
  const total=filtered.length;
  const pages=Math.ceil(total/EV_PAGE_SIZE)||1;
  const page=Math.min(_evPage,pages);
  _evPage=page;  // 数据变少时把页码收敛到有效范围，避免停留在空页
  const start=(page-1)*EV_PAGE_SIZE;
  const pageItems=filtered.slice(start,start+EV_PAGE_SIZE);
  const el=$("ev-list-body");
  if(!el)return;
  let html=pageItems.length?pageItems.map(function(e){
    var badge=(e.status||'').replace('_WITH_WARNINGS','').replace('CANCEL_REQUESTED','FAILED').replace('CANCELLING','FAILED').replace('CANCELLED','FAILED');
    var isTerminal=e.status==='COMPLETED'||e.status==='COMPLETED_WITH_WARNINGS'||e.status==='FAILED'||e.status==='CANCELLED';
    var phaseLabel=_phaseLabel(e.status);
    if(e.status==='REPORTING'&&e.progress&&e.progress.indexOf('生成报告')<0){phaseLabel='知识与记忆分析';}
    var safeName=(e.name||e.evaluation_id).replace(/'/g,'');
    var deleted=!!e.task_deleted;
    var statusHtml=deleted?'<span class="bdg" style="background:rgba(120,120,120,.18);color:var(--gray)">任务在平台已删除</span>':_statusBadge(e.status);
    var btns=DEBUG?'<span class="ev-actions" onclick="event.stopPropagation()">'+
      (deleted?'':'<button class="btn g" style="font-size:12px;padding:2px 8px" onclick="retryEval(\''+e.evaluation_id+'\')">重跑</button>')+
      '<button class="btn" style="font-size:12px;padding:2px 8px;background:var(--acc)" onclick="window.open(U(\'/api/v2/evaluations/'+e.evaluation_id+'/debug\'))">调试</button>'+
      (!isTerminal?'<button class="btn" style="font-size:12px;padding:2px 8px;background:var(--amber)" onclick="cancelEval(\''+e.evaluation_id+'\')">取消</button>':'')+
      (isTerminal?'<button class="btn" style="font-size:12px;padding:2px 8px;background:var(--red)" onclick="deleteEval(\''+e.evaluation_id+'\',\''+safeName+'\')">删除</button>':'')+
      '</span>':'';
    return '<div class="ev-card'+(deleted?' deleted':'')+'" onclick="go(\'/evals/'+e.evaluation_id+'\')">'+
      '<div class="ev-name" title="'+(e.name||e.evaluation_id).replace(/"/g,'&quot;')+'">'+(e.name||e.evaluation_id)+'</div>'+
      '<div class="ev-meta">'+statusHtml+'<span style="font-size:11px;padding:1px 6px;border-radius:4px;background:'+(e.eval_mode==='runtime'?'rgba(245,158,11,.15)':'rgba(91,156,246,.15)')+';color:'+(e.eval_mode==='runtime'?'var(--amber)':'var(--acc)')+'">'+(e.eval_mode==='runtime'?'运行态':'开发态')+'</span><span>'+fmtDate(e.created_at)+'</span>'+btns+'</div>'+
      '<div style="font-size:12px;color:var(--gray);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e.evaluation_id+'</div>'+
      '<div style="font-size:13px;line-height:1.5;margin-top:4px">'+
        '<div><span style="color:var(--gray)">项目：</span><b>'+(e.kg_project||'-')+'</b> / '+(e.kg_task||'-')+'</div>'+
        (e.eval_mode==='runtime'?'':'<div><span style="color:var(--gray)">基线：</span><b>'+(e.benchmark_source==='vuln_center'?('漏洞中心 · '+(e.vc_source_project_name||'-')+' / '+(e.vc_source_task_name||'-')):(e.vbench_project_name||'无 GT'))+'</b></div>')+
      '</div>'+
      '</div>';
  }).join(""):'<div style="padding:48px;text-align:center;color:var(--sub);font-size:16px;grid-column:1/-1">无匹配评测</div>';
  if(pages>1){
    let pgHtml='<div style="display:flex;justify-content:center;align-items:center;gap:6px;padding:16px 0 0;grid-column:1/-1">';
    pgHtml+=`<button class="ef-btn" ${page<=1?'disabled':''} onclick="evPage(${page-1})" style="padding:6px 12px">‹ 上一页</button>`;
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||(i>=page-1&&i<=page+1))pgHtml+=`<button class="ef-btn ${i===page?'active':''}" onclick="evPage(${i})" style="padding:6px 10px;min-width:32px">${i}</button>`;
      else if(i===page-2||i===page+2)pgHtml+='<span style="color:var(--sub)">…</span>';
    }
    pgHtml+=`<button class="ef-btn" ${page>=pages?'disabled':''} onclick="evPage(${page+1})" style="padding:6px 12px">下一页 ›</button>`;
    pgHtml+=`<span style="font-size:13px;color:var(--sub);margin-left:8px">${start+1}-${Math.min(start+EV_PAGE_SIZE,total)}/${total}</span></div>`;
    html+=pgHtml;
  }
  el.innerHTML=html;
  // 可见页的置灰状态异步补全（不阻塞列表渲染）
  loadAliveFor(pageItems);
}

// 评测操作
async function retryEval(eid){
  showConfirm({
    icon:'🔄',iconBg:'rgba(37,99,235,.12)',iconColor:'var(--acc)',
    title:'重跑评测',desc:`确认重跑评测 ${eid}？`,
    risks:['重跑会重新执行全部阶段（解析→匹配→根因分析→报告）','已生成的报告将被覆盖'],
    confirmText:'重跑',confirmColor:'var(--acc)',
    onConfirm:function(){
      F('/api/v1/evaluations/'+eid+'/retry?force=true',{method:'POST'}).then(function(r){return r.json().then(function(d){if(!r.ok)throw (d&&d.detail)||('HTTP '+r.status);return d;});}).then(function(){
        refreshEvalsData();
      }).catch(function(e){
        showConfirm({icon:'❌',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',title:'重跑失败',desc:String(e),confirmText:'知道了',confirmColor:'var(--red)'});
      });
    }
  });
}
async function cancelEval(eid){
  showConfirm({
    icon:'⏹️',iconBg:'rgba(251,191,36,.12)',iconColor:'var(--amber)',
    title:'取消评测',desc:`确认取消评测 ${eid}？`,
    risks:['取消后正在运行的阶段会停止','已完成的阶段数据保留'],
    confirmText:'取消评测',confirmColor:'var(--amber)',
    onConfirm:function(){
      jpost('/api/v1/evaluations/'+eid+'/cancel',{}).then(function(){
        refreshEvalsData();
      }).catch(function(e){
        showConfirm({icon:'❌',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',title:'取消失败',desc:String(e),confirmText:'知道了',confirmColor:'var(--red)'});
      });
    }
  });
}
async function deleteEval(eid,name){
  showConfirm({
    icon:'🗑️',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',
    title:'删除评测',desc:`确认删除评测「${name||eid}」？`,
    risks:['此操作不可恢复','所有评测数据、报告、问题单将永久删除'],
    confirmText:'永久删除',confirmColor:'var(--red)',
    onConfirm:function(){
      jdel('/api/v1/evaluations/'+eid).then(function(){
        refreshEvalsData();
      }).catch(function(e){
        showConfirm({icon:'❌',iconBg:'rgba(220,38,38,.12)',iconColor:'var(--red)',title:'删除失败',desc:String(e),confirmText:'知道了',confirmColor:'var(--red)'});
      });
    }
  });
}

renderEvals();
</script>
</body>
</html>
