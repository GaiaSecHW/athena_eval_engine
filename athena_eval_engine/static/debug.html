<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>调试 — 评测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { font-size: 18px; margin-bottom: 16px; color: #8be9fd; word-break: break-all; }
.step-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.step-btn { padding: 6px 14px; border: 1px solid #444; background: #2a2a4e; color: #aaa;
  border-radius: 4px; cursor: pointer; font-size: 13px; }
.step-btn:hover { background: #3a3a5e; color: #fff; }
.step-btn.active { background: #6c5ce7; color: #fff; border-color: #6c5ce7; }
.content { background: #16213e; border: 1px solid #333; border-radius: 6px; padding: 16px;
  max-height: 75vh; overflow: auto; }
.content pre { font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
.empty { color: #666; padding: 40px; text-align: center; }
.stats { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.stat { background: #2a2a4e; padding: 8px 14px; border-radius: 4px; font-size: 13px; }
.stat .num { font-size: 20px; font-weight: bold; color: #8be9fd; }
.stat .label { color: #888; font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; color: #888; position: sticky; top: 0; background: #16213e; }
td { padding: 4px 8px; border-bottom: 1px solid #222; vertical-align: top; }
tr:hover { background: #1a1a3e; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
.badge-vulnerable, .badge-VULNERABLE { background: #e74c3c; color: #fff; }
.badge-not_vulnerable, .badge-NON_VULNERABLE { background: #27ae60; color: #fff; }
.badge-pending { background: #f39c12; color: #fff; }
.badge-inconclusive { background: #95a5a6; color: #fff; }
</style>
</head>
<body>
<h1 id="title">调试</h1>
<div class="step-bar" id="stepBar"></div>
<div class="content" id="content"></div>
<script>
const STEPS = ["ingesting", "parsing", "case_matching", "root_cause", "resolving", "lifecycle", "causal_chain", "reporting"];

function getEid() {
  const m = location.pathname.match(/\/evaluations\/([^/]+)\/debug/);
  return m ? m[1] : "";
}

// 用相对路径，兼容 /eval/ 前缀
function apiBase(step) {
  return `./debug/${step}`;
}

const eid = getEid();
document.getElementById("title").textContent = "调试 — " + eid;

let available = [];

async function checkSteps() {
  // 逐个检查哪些步骤有数据
  const results = await Promise.all(STEPS.map(async (step) => {
    try {
      const resp = await fetch(apiBase(step));
      return resp.ok ? step : null;
    } catch { return null; }
  }));
  available = results.filter(Boolean);
  renderStepBar();
  if (available.length) loadStep(available[0]);
  else document.getElementById("content").innerHTML = '<div class="empty">暂无调试数据。评测运行后此处显示各步骤中间数据。</div>';
}

function renderStepBar() {
  const bar = document.getElementById("stepBar");
  bar.innerHTML = available.map((step, i) =>
    `<button class="step-btn${i === 0 ? " active" : ""}" data-step="${step}">${step}</button>`
  ).join("");
  bar.querySelectorAll(".step-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      bar.querySelectorAll(".step-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadStep(btn.dataset.step);
    });
  });
}

async function loadStep(step) {
  const resp = await fetch(apiBase(step));
  if (!resp.ok) {
    document.getElementById("content").innerHTML = "<p>加载失败</p>";
    return;
  }
  const data = await resp.json();
  render(step, data);
}

function render(step, data) {
  const el = document.getElementById("content");
  const renderer = RENDERERS[step];
  if (renderer) renderer(el, data);
  else el.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
}

// ── 步骤渲染器 ──
const RENDERERS = {};

RENDERERS.ingesting = function(el, data) {
  let html = "";

  // 配置信息
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${data.benchmark_source || "-"}</div><div class="label">benchmark_source</div></div>`;
  html += `<div class="stat"><div class="num">${data.eval_mode || "-"}</div><div class="label">eval_mode</div></div>`;
  html += `<div class="stat"><div class="num">${data.raw_data?.total ?? 0}</div><div class="label">原始数据</div></div>`;
  html += `<div class="stat"><div class="num">${data.baseline?.total ?? 0}</div><div class="label">基线数据</div></div>`;
  html += `</div>`;

  // 原始数据明细
  const raw = data.raw_data || {};
  html += `<h3 style="margin:16px 0 8px;color:#8be9fd;">原始数据（告警中心） — ${raw.total ?? 0} 条</h3>`;
  if (raw.cases?.length) {
    html += `<table><thead><tr><th>case_id</th><th>title</th><th>validation_result</th><th>stage</th><th>false_positive_reason</th><th>project_id</th></tr></thead><tbody>`;
    for (const c of raw.cases) {
      const vr = c.validation_result || "pending";
      html += `<tr><td>${c.case_id ?? ""}</td><td>${c.title ?? ""}</td>`
        + `<td><span class="badge badge-${vr}">${vr}</span></td>`
        + `<td>${c.current_stage ?? ""}</td>`
        + `<td>${c.false_positive_reason ?? ""}</td>`
        + `<td>${c.project_id ?? ""}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  // 基线数据明细
  const bl = data.baseline || {};
  html += `<h3 style="margin:16px 0 8px;color:#8be9fd;">基线数据 — ${bl.total ?? 0} 条</h3>`;
  if (bl.cases?.length) {
    html += `<table><thead><tr><th>case_id</th><th>vulnerability_type</th><th>expected_label</th><th>source_file</th><th>false_positive_reason</th><th>false_positive_group</th></tr></thead><tbody>`;
    for (const c of bl.cases) {
      const lbl = c.expected_label || "";
      html += `<tr><td>${c.case_id ?? ""}</td><td>${c.vulnerability_type ?? ""}</td>`
        + `<td><span class="badge badge-${lbl}">${lbl}</span></td>`
        + `<td>${c.source_file ?? ""}</td>`
        + `<td>${c.false_positive_reason ?? ""}</td>`
        + `<td>${c.false_positive_group ?? ""}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  // LLM 匹配结果（开发态：原始数据 ↔ 基线）
  const matches = data.case_matches;
  if (matches && matches.length) {
    const matched = matches.filter(m => m.matched_baseline_case_id).length;
    html += `<h3 style="margin:16px 0 8px;color:#8be9fd;">LLM 匹配结果 — ${matched}/${matches.length} 条匹配成功</h3>`;
    html += `<table><thead><tr><th>原始 case_id</th><th>原始 title</th><th>匹配基线 case_id</th><th>匹配基线 title</th><th>置信度</th><th>原因</th></tr></thead><tbody>`;
    for (const m of matches) {
      const conf = m.confidence ?? 0;
      const confColor = conf >= 0.7 ? "#27ae60" : conf >= 0.4 ? "#f39c12" : "#e74c3c";
      const matchedId = m.matched_baseline_case_id;
      html += `<tr>`
        + `<td>${m.raw_case_id ?? ""}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.raw_title ?? ""}</td>`
        + `<td>${matchedId ? matchedId : '<span style="color:#666">无匹配</span>'}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.matched_baseline_title ?? ""}</td>`
        + `<td style="color:${confColor};font-weight:bold">${(conf * 100).toFixed(0)}%</td>`
        + `<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.reason ?? ""}</td>`
        + `</tr>`;
    }
    html += `</tbody></table>`;
  }

  el.innerHTML = html;
};
// RENDERERS.parsing = function(el, data) { ... };
// RENDERERS.resolving = function(el, data) { ... };
// ...

RENDERERS.parsing = function(el, data) {
  let html = "";

  const packs = data.data_packs || [];
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${packs.length}</div><div class="label">data_packs</div></div>`;
  let totalSessions = 0, totalEdges = 0, totalEvents = 0;
  for (const p of packs) {
    totalSessions += p.session_count || 0;
    totalEdges += p.edge_count || 0;
    totalEvents += p.event_count || 0;
  }
  html += `<div class="stat"><div class="num">${totalSessions}</div><div class="label">sessions</div></div>`;
  html += `<div class="stat"><div class="num">${totalEdges}</div><div class="label">edges</div></div>`;
  html += `<div class="stat"><div class="num">${totalEvents}</div><div class="label">events</div></div>`;
  html += `</div>`;

  for (const p of packs) {
    const agentLabel = p.agent_type || "";
    const condLabel = p.condition || "";
    const sc = p.session_count || 0;
    const ec = p.edge_count || 0;
    html += `<details style="margin:16px 0 8px;" open>`
      + `<summary style="cursor:pointer;color:#8be9fd;font-size:15px;font-weight:600;">${p.task_run_id} — ${agentLabel} (${condLabel}) — ${sc} sessions, ${ec} edges</summary>`;

    const sessions = p.sessions || [];
    if (sessions.length > 0) {
      // session 调用树（文本缩进格式）
      html += renderSessionTree(sessions);
    }
    html += `</details>`;
  }

  if (!packs.length) {
    html += '<div class="empty">无解析数据</div>';
  }
  el.innerHTML = html;
};

// ── session 调用树（文本缩进格式）──
function renderSessionTree(sessions) {
  // 构建 sid -> session map 和 parent -> children map
  const smap = {};
  const childrenMap = {};
  for (const s of sessions) {
    smap[s.session_id] = s;
    const pid = s.parent_id || "";
    if (pid) {
      if (!childrenMap[pid]) childrenMap[pid] = [];
      childrenMap[pid].push(s);
    }
  }

  // 根节点：无 parent 的 session
  const roots = sessions.filter(s => !s.parent_id);

  // 统计
  const treeRoots = roots.filter(r => r.session_id in childrenMap);
  const isolated = roots.filter(r => !(r.session_id in childrenMap));

  let html = `<div style="margin-bottom:8px;color:#888;font-size:13px;">`
    + `调用树: ${treeRoots.length} 棵, 孤立节点: ${isolated.length}`
    + `</div>`;

  // 渲染有子节点的树（可收起）
  if (treeRoots.length > 0) {
    html += `<details style="margin-bottom:12px" open>`;
    html += `<summary style="cursor:pointer;color:#8be9fd;font-size:13px;">调用树（${treeRoots.length} 棵）</summary>`;
    html += `<div style="font-family:monospace;font-size:13px;line-height:1.8;white-space:pre-wrap;margin-top:8px;">`;
    for (const r of treeRoots) {
      html += renderTreeNode(r.session_id, smap, childrenMap, 0, new Set());
    }
    html += `</div>`;
    html += `</details>`;
  }

  // 孤立节点按 agent 分组（可收起）
  if (isolated.length > 0) {
    const byAgent = {};
    for (const s of isolated) {
      const a = s.agent || "(none)";
      if (!byAgent[a]) byAgent[a] = [];
      byAgent[a].push(s);
    }
    html += `<details style="margin-bottom:12px">`;
    html += `<summary style="cursor:pointer;color:#888;font-size:13px;">孤立节点（${isolated.length}）— 按 agent 分组</summary>`;
    for (const [agent, sess] of Object.entries(byAgent).sort((a,b) => b[1].length - a[1].length)) {
      html += `<div style="margin:8px 0 4px;color:#8be9fd;font-size:13px;">${agent} (${sess.length})</div>`;
      html += `<div style="font-family:monospace;font-size:12px;line-height:1.6;color:#aaa;white-space:pre-wrap;">`;
      for (const s of sess) {
        const phase = s.phase ? ` <span style="color:#6c5ce7">[${s.phase}]</span>` : "";
        html += `${s.session_id}${phase}\n`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  return html;
}

function renderTreeNode(sid, smap, childrenMap, depth, visited) {
  if (visited.has(sid)) return "";
  visited.add(sid);
  const s = smap[sid];
  if (!s) return "";

  const agent = s.agent || s.session_type || "?";
  const phase = s.phase ? ` <span style="color:#6c5ce7">[${s.phase}]</span>` : "";
  const indent = "  ".repeat(depth);
  const arrow = depth > 0 ? "└─ " : "";

  let html = `${indent}${arrow}<span style="color:#8be9fd">${agent}</span>${phase} <span style="color:#666;font-size:11px">${sid}</span>\n`;

  const kids = childrenMap[sid] || [];
  for (const k of kids) {
    html += renderTreeNode(k.session_id, smap, childrenMap, depth + 1, visited);
  }
  return html;
}

// ── case_matching 渲染器 ──
RENDERERS.case_matching = function(el, data) {
  let html = "";

  // 统计
  const total = data.total_cases || 0;
  const matched = data.matched || 0;
  const unmatched = data.unmatched || 0;
  const outcomes = data.outcomes || {};
  const tp = outcomes.TP || 0;
  const fp = outcomes.FP || 0;
  const fn = outcomes.FN || 0;
  const tn = outcomes.TN || 0;

  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${total}</div><div class="label">case 总数 (${data.eval_mode || ""})</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${matched}</div><div class="label">已匹配</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${unmatched}</div><div class="label">未匹配</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${tp}</div><div class="label">TP</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${fp}</div><div class="label">FP</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#f39c12">${fn}</div><div class="label">FN</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#95a5a6">${tn}</div><div class="label">TN</div></div>`;
  html += `</div>`;

  const matches = data.matches || [];
  if (!matches.length) {
    html += '<div class="empty">无匹配数据</div>';
    el.innerHTML = html;
    return;
  }

  html += `<table><thead><tr>`;
  html += `<th>case_id</th><th>ac_case_id</th><th>漏洞类型</th><th>描述</th>`;
  html += `<th>判定</th><th>匹配方式</th><th>验证 session</th><th>匹配细节</th>`;
  html += `</tr></thead><tbody>`;

  for (const m of matches) {
    const outcome = m.outcome || "?";
    const outcomeColor = {
      "TP": "#27ae60", "FP": "#e74c3c",
      "FN": "#f39c12", "TN": "#95a5a6",
    }[outcome] || "#888";

    const method = m.match_method || "unmatched";
    const methodColor = method === "unmatched" ? "#e74c3c" : "#27ae60";
    const methodLabel = {
      "case_id": "case_id 精确",
      "unmatched": "未匹配",
    }[method] || method;

    const verifySids = (m.verify_sessions || []).join(", ") || '<span style="color:#666">—</span>';
    const detail = m.match_detail || '<span style="color:#666">—</span>';

    html += `<tr>`;
    html += `<td style="font-family:monospace;font-size:11px">${m.case_id || ""}</td>`;
    html += `<td style="font-family:monospace;font-size:11px">${m.ac_case_id || '<span style="color:#666">—</span>'}</td>`;
    html += `<td>${m.vulnerability_type || ""}</td>`;
    html += `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.description || ""}</td>`;
    html += `<td><span class="badge" style="background:${outcomeColor};color:#fff">${outcome}</span></td>`;
    html += `<td><span class="badge" style="background:${methodColor};color:#fff">${methodLabel}</span></td>`;
    html += `<td style="font-family:monospace;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${verifySids}">${verifySids}</td>`;
    html += `<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${detail}">${detail}</td>`;
    html += `</tr>`;
  }
  html += `</tbody></table>`;

  el.innerHTML = html;
};

// ── root_cause 渲染器 ──
RENDERERS.root_cause = function(el, data) {
  let html = "";

  const total = data.total_fp || 0;
  const analyzed = data.analyzed || 0;
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${total}</div><div class="label">FP case 数</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${analyzed}</div><div class="label">已分析</div></div>`;
  html += `</div>`;

  const results = data.results || [];
  if (!results.length) {
    html += '<div class="empty">无根因分析数据</div>';
    el.innerHTML = html;
    return;
  }

  // L0-L7 断点统计
  const bpCounts = {};
  const causeCounts = {};
  for (const r of results) {
    for (const chainType of ["mining", "verification"]) {
      const bps = (r[chainType] || {}).l0_l7_breakpoints || [];
      for (const bp of bps) {
        const lvl = bp.breakpoint || "null";
        const code = bp.cause_code || "null";
        if (lvl !== "null") bpCounts[lvl] = (bpCounts[lvl] || 0) + 1;
        if (code !== "null") causeCounts[code] = (causeCounts[code] || 0) + 1;
      }
    }
  }
  if (Object.keys(bpCounts).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:13px;">L0-L7 断点分布：</div>`;
    html += `<div class="stats">`;
    const bpLabels = {
      "L2": "L2 发起访问", "L3": "L3 查询准确", "L4": "L4 知识存在",
      "L5": "L5 成功取回", "L6": "L6 被使用", "L7": "L7 影响结论",
    };
    for (const [lvl, cnt] of Object.entries(bpCounts).sort()) {
      html += `<div class="stat"><div class="num" style="color:#e74c3c">${cnt}</div><div class="label">${bpLabels[lvl] || lvl}</div></div>`;
    }
    html += `</div>`;
  }
  if (Object.keys(causeCounts).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:13px;">成因分布：</div>`;
    html += `<div class="stats">`;
    const causeLabels = {
      "A": "A 该查没查", "B": "B 查询太泛", "C": "C 查了没得",
      "D": "D 链路问题", "E": "E 查到没用", "F": "F 用了没推动", "G": "G 导致误判",
    };
    for (const [code, cnt] of Object.entries(causeCounts).sort()) {
      html += `<div class="stat"><div class="num" style="color:#f39c12">${cnt}</div><div class="label">${causeLabels[code] || code}</div></div>`;
    }
    html += `</div>`;
  }

  const catLabels = {
    "knowledge_gap": "该查没查",
    "query_inaccurate": "查询不准",
    "knowledge_error": "知识错误",
    "reasoning_flaw": "推理缺陷",
    "verification_insufficient": "验证不足",
    "no_session": "无 session",
    "llm_error": "LLM 错误",
    "unknown": "未知",
  };
  const catColor = {
    "knowledge_gap": "#f39c12",
    "query_inaccurate": "#f39c12",
    "knowledge_error": "#e74c3c",
    "reasoning_flaw": "#e74c3c",
    "verification_insufficient": "#9b59b6",
    "no_session": "#666",
    "llm_error": "#666",
    "unknown": "#666",
  };

  // 逐 case 展示
  for (const r of results) {
    const mining = r.mining || {};
    const verification = r.verification || {};

    html += `<details style="margin:16px 0 8px;" open>`;
    html += `<summary style="cursor:pointer;color:#8be9fd;font-size:15px;font-weight:600;">`
      + `${r.case_id} — ${r.vulnerability_type}`
      + `</summary>`;

    // 挖掘链
    html += _renderChain(mining, "挖掘", "#8be9fd", catLabels, catColor);

    // 验证链
    html += _renderChain(verification, "验证", "#9b59b6", catLabels, catColor);

    html += `</details>`;
  }

  el.innerHTML = html;
};

function _renderChain(chainData, label, color, catLabels, catColor) {
  let html = "";
  const chain = chainData.session_chain || [];
  const cat = chainData.root_cause?.category || "unknown";
  const cc = catColor[cat] || "#888";

  html += `<div style="margin:12px 0;padding:12px;background:#1a1a2e;border-radius:6px;border-left:3px solid ${color}">`;
  html += `<div style="color:${color};font-weight:600;font-size:14px;margin-bottom:8px;">`
    + `${label}链 (${chain.length} sessions) `
    + `<span class="badge" style="background:${cc};color:#fff">${catLabels[cat] || cat}</span>`
    + `</div>`;

  // session 链
  if (chain.length > 0) {
    html += `<div style="margin:4px 0;color:#888;font-size:12px;font-family:monospace;">`
      + chain.join(" → ")
      + `</div>`;
  }

  // 根因
  html += `<div style="margin:8px 0;padding:8px;background:#1a1a3e;border-radius:4px;">`;
  html += `<div style="color:#e74c3c;font-weight:600;margin-bottom:4px;font-size:13px;">根因</div>`;
  html += `<div style="color:#ddd;font-size:12px;line-height:1.6;">${chainData.root_cause?.description || "—"}</div>`;
  html += `</div>`;

  // 修复建议
  if (chainData.fix_suggestion) {
    html += `<div style="margin:8px 0;padding:8px;background:#1a2a1e;border-radius:4px;">`;
    html += `<div style="color:#27ae60;font-weight:600;margin-bottom:4px;font-size:13px;">修复建议</div>`;
    html += `<div style="color:#ddd;font-size:12px;line-height:1.6;">${chainData.fix_suggestion}</div>`;
    html += `</div>`;
  }

  // L0-L7 断点
  const bps = chainData.l0_l7_breakpoints || [];
  if (bps.length > 0) {
    html += `<div style="margin:8px 0;">`;
    html += `<div style="color:#f39c12;font-weight:600;margin-bottom:4px;font-size:13px;">L0-L7 断点 (${bps.length})</div>`;
    html += `<table><thead><tr><th>session</th><th>断点</th><th>成因</th><th>L1</th><th>L2</th><th>L3</th><th>L4</th><th>L5</th><th>L6</th><th>L7</th><th>查询内容</th></tr></thead><tbody>`;
    for (const bp of bps) {
      const lvl = bp.breakpoint || "—";
      const code = bp.cause_code || "—";
      const bpColor = code !== "—" ? "#e74c3c" : "#888";
      html += `<tr>`;
      html += `<td style="font-family:monospace;font-size:11px">${bp.session_id || ""}</td>`;
      html += `<td style="color:${bpColor};font-weight:bold">${lvl}</td>`;
      html += `<td style="color:${bpColor};font-weight:bold">${code}</td>`;
      html += `<td>${bp.l1_need === true ? "✓" : bp.l1_need === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l2_initiated === true ? "✓" : bp.l2_initiated === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l3_accurate === true ? "✓" : bp.l3_accurate === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l4_exists === true ? "✓" : bp.l4_exists === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l5_retrieved === true ? "✓" : bp.l5_retrieved === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l6_used === true ? "✓" : bp.l6_used === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l7_influenced === "positive" ? "正向" : bp.l7_influenced === "negative" ? "负向" : "—"}</td>`;
      html += `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${bp.query_content || ""}">${bp.query_content || "—"}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table>`;
    html += `</div>`;
  }

  // 压缩摘要（可收起）
  const summaries = chainData.compressed_summaries || [];
  if (summaries.length > 0) {
    html += `<details style="margin:8px 0;">`;
    html += `<summary style="cursor:pointer;color:#888;font-size:12px;">压缩过程 (${summaries.length} 步)</summary>`;
    for (const s of summaries) {
      const stepLabel = s.is_last ? "最终" : `步骤 ${s.step}`;
      html += `<div style="margin:6px 0;padding:8px;background:#16213e;border-radius:4px;">`;
      html += `<div style="color:${color};font-size:11px;margin-bottom:4px;">${stepLabel} — session ${s.session_id}</div>`;
      html += `<pre style="font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#aaa;">${s.summary || ""}</pre>`;
      if (s.key_findings && s.key_findings.length > 0) {
        html += `<div style="color:#6c5ce7;font-size:11px;margin-top:4px;">关键发现: ${s.key_findings.join(" | ")}</div>`;
      }
      // session 级 L0-L7
      const l0l7 = s.l0_l7 || [];
      if (l0l7.length > 0) {
        html += `<div style="margin-top:4px;color:#888;font-size:11px;">`;
        for (const kp of l0l7) {
          const bp = kp.breakpoint || "—";
          const code = kp.cause_code || "—";
          html += `<span style="margin-right:8px;">${bp}/${code}</span>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  html += `</div>`;
  return html;
}

checkSteps();
</script>
</body>
</html>
