<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>调试 — 评测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; color: #333; padding: 20px; font-size: 15px; }
h1 { font-size: 20px; margin-bottom: 16px; color: #6c5ce7; word-break: break-all; }
.step-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.step-btn { padding: 6px 14px; border: 1px solid #ccc; background: #fff; color: #666;
  border-radius: 4px; cursor: pointer; font-size: 14px; }
.step-btn:hover { background: #ececff; color: #333; }
.step-btn.active { background: #6c5ce7; color: #fff; border-color: #6c5ce7; }
.content { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 16px;
  max-height: 75vh; overflow: auto; }
.content pre { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.empty { color: #999; padding: 40px; text-align: center; }
.stats { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.stat { background: #f0f0f5; padding: 8px 14px; border-radius: 4px; font-size: 14px; }
.stat .num { font-size: 22px; font-weight: bold; color: #6c5ce7; }
.stat .label { color: #888; font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 6px 8px; border-bottom: 2px solid #e0e0e0; color: #666; position: sticky; top: 0; background: #f8f8fa; }
td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
tr:hover { background: #f5f5ff; }
.badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 12px; }
.badge-vulnerable, .badge-VULNERABLE { background: #e74c3c; color: #fff; }
.badge-not_vulnerable, .badge-NON_VULNERABLE { background: #27ae60; color: #fff; }
.badge-pending { background: #f39c12; color: #fff; }
.badge-inconclusive { background: #95a5a6; color: #fff; }
</style>
</head>
<body>
<h1 id="title">调试</h1>
<div class="step-bar" id="stepBar"></div>
<div class="content" id="content"></div>
<script>
// 检测 /eval/ 前缀，构建静态资源基础路径
const _P = location.pathname;
const _INGRESS = (_P.indexOf('/eval/') === 0) ? '/eval' : '';
const _LIB_BASE = _INGRESS + '/static/lib/';

// 动态加载本地 JS/CSS（兼容 /eval/ 前缀）
(function loadLibs() {
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = _LIB_BASE + 'style.min.css';
  document.head.appendChild(css);

  const jq = document.createElement('script');
  jq.src = _LIB_BASE + 'jquery.min.js';
  jq.onload = function() {
    const js = document.createElement('script');
    js.src = _LIB_BASE + 'jstree.min.js';
    document.head.appendChild(js);
  };
  document.head.appendChild(jq);
})();

const STEPS = ["ingesting", "parsing", "case_matching", "root_cause", "reporting"];
const STEP_LABELS = {
  "ingesting": "数据采集",
  "parsing": "解析 Trace",
  "case_matching": "Case 匹配",
  "root_cause": "根因分析",
  "reporting": "生成报告",
};

function getEid() {
  const m = location.pathname.match(/\/evaluations\/([^/]+)\/debug/);
  return m ? m[1] : "";
}

// 用相对路径，兼容 /eval/ 前缀
function apiBase(step) {
  return `./debug/${step}`;
}

const eid = getEid();
document.getElementById("title").textContent = "调试 — " + eid;

let available = [];

async function checkSteps() {
  // 逐个检查哪些步骤有数据
  const results = await Promise.all(STEPS.map(async (step) => {
    try {
      const resp = await fetch(apiBase(step));
      return resp.ok ? step : null;
    } catch { return null; }
  }));
  available = results.filter(Boolean);
  renderStepBar();
  if (available.length) loadStep(available[0]);
  else document.getElementById("content").innerHTML = '<div class="empty">暂无调试数据。评测运行后此处显示各步骤中间数据。</div>';

}

function renderStepBar() {
  const bar = document.getElementById("stepBar");
  bar.innerHTML = available.map((step, i) =>
    `<button class="step-btn${i === 0 ? " active" : ""}" data-step="${step}">${STEP_LABELS[step] || step}</button>`
  ).join("");
  bar.querySelectorAll(".step-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      bar.querySelectorAll(".step-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadStep(btn.dataset.step);
    });
  });
}

async function loadStep(step) {
  const resp = await fetch(apiBase(step));
  if (!resp.ok) {
    document.getElementById("content").innerHTML = "<p>加载失败</p>";
    return;
  }
  const data = await resp.json();
  render(step, data);
}

function render(step, data) {
  const el = document.getElementById("content");
  const renderer = RENDERERS[step];
  if (renderer) renderer(el, data);
  else el.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
  // innerHTML 设置后初始化 jstree 容器
  flushJstreeInits();
}

// ── 步骤渲染器 ──
const RENDERERS = {};

RENDERERS.ingesting = function(el, data) {
  let html = "";

  // 配置信息
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${data.benchmark_source || "-"}</div><div class="label">基线来源</div></div>`;
  html += `<div class="stat"><div class="num">${data.eval_mode || "-"}</div><div class="label">评测模式</div></div>`;
  html += `<div class="stat"><div class="num">${data.raw_data?.total ?? 0}</div><div class="label">原始数据</div></div>`;
  html += `<div class="stat"><div class="num">${data.baseline?.total ?? 0}</div><div class="label">基线数据</div></div>`;
  html += `</div>`;

  // 原始数据明细
  const raw = data.raw_data || {};
  html += `<details style="margin:16px 0 8px;">`
    + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">原始数据（告警中心） — ${raw.total ?? 0} 条</summary>`;
  if (raw.cases?.length) {
    html += `<table><thead><tr><th>告警中心编号</th><th>标题</th><th>摘要</th><th>验证结果</th><th>阶段</th><th>误报分组</th><th>人工确认原因</th><th>源文件</th><th>项目编号</th></tr></thead><tbody>`;
    for (const c of raw.cases) {
      const vr = c.validation_result || "pending";
      const summary = c.summary ?? "";
      const summaryShort = summary.length > 80 ? summary.substring(0, 80) + "..." : summary;
      const title = c.title ?? "";
      const titleShort = title.length > 60 ? title.substring(0, 60) + "..." : title;
      const sf = c.source_file ?? "";
      const sfShort = sf.length > 60 ? sf.substring(0, 60) + "..." : sf;
      const hc = c.human_confirmation_summary ?? "";
      const hcShort = hc.length > 60 ? hc.substring(0, 60) + "..." : hc;
      html += `<tr><td title="${c.case_id ?? ""}">${c.case_id ?? ""}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${title.replace(/"/g, '&quot;')}">${titleShort}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${summary.replace(/"/g, '&quot;')}">${summaryShort}</td>`
        + `<td><span class="badge badge-${vr}">${vr}</span></td>`
        + `<td>${c.current_stage ?? ""}</td>`
        + `<td>${c.false_positive_group ?? ""}</td>`
        + `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${hc.replace(/"/g, '&quot;')}">${hcShort}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sf.replace(/"/g, '&quot;')}">${sfShort}</td>`
        + `<td>${c.project_id ?? ""}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</details>`;

  // 基线数据明细
  const bl = data.baseline || {};
  html += `<details style="margin:16px 0 8px;">`
    + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">基线数据 — ${bl.total ?? 0} 条</summary>`;
  if (bl.cases?.length) {
    html += `<table><thead><tr><th>基线编号</th><th>漏洞标题</th><th>预期标签</th><th>源文件</th><th>误报分组</th><th>人工确认原因</th></tr></thead><tbody>`;
    for (const c of bl.cases) {
      const lbl = c.expected_label || "";
      const vt = c.vuln_title ?? "";
      const vtShort = vt.length > 60 ? vt.substring(0, 60) + "..." : vt;
      const sf = c.source_file ?? "";
      const sfShort = sf.length > 60 ? sf.substring(0, 60) + "..." : sf;
      const hc = c.human_confirmation_summary ?? "";
      const hcShort = hc.length > 60 ? hc.substring(0, 60) + "..." : hc;
      html += `<tr><td title="${c.case_id ?? ""}">${c.case_id ?? ""}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${vt.replace(/"/g, '&quot;')}">${vtShort}</td>`
        + `<td><span class="badge badge-${lbl}">${lbl}</span></td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sf.replace(/"/g, '&quot;')}">${sfShort}</td>`
        + `<td>${c.false_positive_group ?? ""}</td>`
        + `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${hc.replace(/"/g, '&quot;')}">${hcShort}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</details>`;

  // LLM 匹配结果（开发态：原始数据 ↔ 基线）
  const matches = data.case_matches;
  if (matches && matches.length) {
    const matched = matches.filter(m => m.matched_baseline_case_id).length;
    html += `<details style="margin:16px 0 8px;">`
      + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">LLM 匹配结果 — ${matched}/${matches.length} 条匹配成功</summary>`;
    html += `<table><thead><tr><th>告警中心编号</th><th>告警中心标题</th><th>匹配基线编号</th><th>匹配基线标题</th><th>置信度</th><th>原因</th></tr></thead><tbody>`;
    for (const m of matches) {
      const conf = m.confidence ?? 0;
      const confColor = conf >= 0.7 ? "#27ae60" : conf >= 0.4 ? "#f39c12" : "#e74c3c";
      const matchedId = m.matched_baseline_case_id;
      const rt = m.raw_title ?? "";
      const rtShort = rt.length > 60 ? rt.substring(0, 60) + "..." : rt;
      const mbt = m.matched_baseline_title ?? "";
      const mbtShort = mbt.length > 60 ? mbt.substring(0, 60) + "..." : mbt;
      const reason = m.reason ?? "";
      const reasonShort = reason.length > 80 ? reason.substring(0, 80) + "..." : reason;
      html += `<tr>`
        + `<td title="${m.raw_case_id ?? ""}">${m.raw_case_id ?? ""}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${rt.replace(/"/g, '&quot;')}">${rtShort}</td>`
        + `<td title="${matchedId ?? ""}">${matchedId ? matchedId : '<span style="color:#666">无匹配</span>'}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${mbt.replace(/"/g, '&quot;')}">${mbtShort}</td>`
        + `<td style="color:${confColor};font-weight:bold">${(conf * 100).toFixed(0)}%</td>`
        + `<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${reason.replace(/"/g, '&quot;')}">${reasonShort}</td>`
        + `</tr>`;
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  el.innerHTML = html;
};
// RENDERERS.parsing = function(el, data) { ... };
// RENDERERS.resolving = function(el, data) { ... };
// ...

RENDERERS.parsing = function(el, data) {
  let html = "";

  const packs = data.data_packs || [];
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${packs.length}</div><div class="label">数据包</div></div>`;
  let totalSessions = 0, totalEdges = 0, totalEvents = 0;
  for (const p of packs) {
    totalSessions += p.session_count || 0;
    totalEdges += p.edge_count || 0;
    totalEvents += p.event_count || 0;
  }
  html += `<div class="stat"><div class="num">${totalSessions}</div><div class="label">会话数</div></div>`;
  html += `<div class="stat"><div class="num">${totalEdges}</div><div class="label">边数</div></div>`;
  html += `<div class="stat"><div class="num">${totalEvents}</div><div class="label">事件数</div></div>`;
  html += `</div>`;

  for (const p of packs) {
    const agentLabel = p.agent_type || "";
    const condLabel = p.condition || "";
    const sc = p.session_count || 0;
    const ec = p.edge_count || 0;
    html += `<details style="margin:16px 0 8px;">`
      + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">${p.task_run_id} — ${agentLabel} (${condLabel}) — ${sc} 会话, ${ec} 边</summary>`;

    const sessions = p.sessions || [];
    if (sessions.length > 0) {
      // session 调用树（文本缩进格式）
      html += renderSessionTree(sessions);
    }
    html += `</details>`;
  }

  if (!packs.length) {
    html += '<div class="empty">无解析数据</div>';
  }
  el.innerHTML = html;
};

// ── session 调用树（jstree 渲染）──
let _jstreeSeq = 0;
const _pendingJstreeInits = [];

function renderSessionTree(sessions) {
  // 构建 sid -> session map 和 parent -> children map
  const smap = {};
  const childrenMap = {};
  for (const s of sessions) {
    smap[s.session_id] = s;
    const pid = s.parent_id || "";
    if (pid) {
      if (!childrenMap[pid]) childrenMap[pid] = [];
      childrenMap[pid].push(s);
    }
  }

  // 根节点：无 parent 的 session
  const roots = sessions.filter(s => !s.parent_id);
  const treeRoots = roots.filter(r => r.session_id in childrenMap);
  const isolated = roots.filter(r => !(r.session_id in childrenMap));

  let html = `<div style="margin-bottom:8px;color:#888;font-size:14px;">`
    + `调用树: ${treeRoots.length} 棵, 孤立节点: ${isolated.length}`
    + `</div>`;

  // 用 jstree 渲染有子节点的树
  if (treeRoots.length > 0) {
    _jstreeSeq++;
    const containerId = `jstree-${_jstreeSeq}`;
    html += `<details style="margin-bottom:12px" open>`;
    html += `<summary style="cursor:pointer;color:#6c5ce7;font-size:14px;">调用树（${treeRoots.length} 棵）</summary>`;

    // 构建 jstree 节点数据（多棵树各自 parent: "#"）
    const treeNodes = [];

    // 遍历所有 session 构建 jstree 节点
    const visited = new Set();
    function buildNode(sid, parentId) {
      if (visited.has(sid)) return;
      visited.add(sid);
      const s = smap[sid];
      if (!s) return;

      const agent = s.agent || s.session_type || "?";
      const phase = s.phase ? ` [${s.phase}]` : "";
      const status = s.status ? ` <span style="color:#aaa;font-size:12px">(${s.status})</span>` : "";
      const text = `<span style="color:#6c5ce7;font-weight:600">${agent}</span>`
        + `<span style="color:#6c5ce7">${phase}</span>`
        + `${status} `
        + `<span style="color:#999;font-size:12px">${sid}</span>`;

      const hasKids = (childrenMap[sid] || []).length > 0;
      treeNodes.push({
        id: sid,
        parent: parentId,
        text: text,
        state: { opened: true },
        icon: hasKids ? "jstree-folder" : "jstree-file",
      });

      const kids = childrenMap[sid] || [];
      for (const kid of kids) {
        buildNode(kid.session_id, sid);
      }
    }

    for (const root of treeRoots) {
      buildNode(root.session_id, "#");
    }

    html += `<div id="${containerId}" style="margin-top:8px;"></div>`;
    html += `</details>`;

    // 注册 jstree 初始化（在 innerHTML 设置后执行）
    _pendingJstreeInits.push(function() {
      const $c = $("#" + containerId);
      if ($c.length && typeof $.fn.jstree === "function") {
        $c.jstree({
          core: { data: treeNodes, themes: { name: "default", dots: true, icons: true } },
          plugins: ["themes"],
        });
      }
    });
  }

  // 孤立节点按 agent 分组（可收起）
  if (isolated.length > 0) {
    const byAgent = {};
    for (const s of isolated) {
      const a = s.agent || "(none)";
      if (!byAgent[a]) byAgent[a] = [];
      byAgent[a].push(s);
    }
    html += `<details style="margin-bottom:12px">`;
    html += `<summary style="cursor:pointer;color:#888;font-size:14px;">孤立节点（${isolated.length}）— 按 agent 分组</summary>`;
    for (const [agent, sess] of Object.entries(byAgent).sort((a,b) => b[1].length - a[1].length)) {
      html += `<div style="margin:8px 0 4px;color:#6c5ce7;font-size:14px;">${agent} (${sess.length})</div>`;
      html += `<div style="font-family:monospace;font-size:13px;line-height:1.6;color:#888;white-space:pre-wrap;">`;
      for (const s of sess) {
        const phase = s.phase ? ` <span style="color:#6c5ce7">[${s.phase}]</span>` : "";
        html += `${s.session_id}${phase}\n`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  return html;
}

// 在 innerHTML 设置后调用，初始化所有待渲染的 jstree 容器
function flushJstreeInits() {
  while (_pendingJstreeInits.length) {
    const fn = _pendingJstreeInits.shift();
    try { fn(); } catch(e) { console.error("jstree init error:", e); }
  }
}

// ── case_matching 渲染器（仅误报 FP + 漏报 FN case）──
RENDERERS.case_matching = function(el, data) {
  let html = "";

  // 统计：FP（误报）+ FN（漏报）
  // TP（真阳性）和 TN（真阴性）不需要根因分析/问题单，不在 case_matching 中展示
  const total = data.total_cases || 0;
  const matched = data.matched || 0;
  const unmatched = data.unmatched || 0;
  const outcomes = data.outcomes || {};
  const fp = outcomes.FP || 0;
  const fn = outcomes.FN || 0;

  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${total}</div><div class="label">case 总数 (${data.eval_mode || ""})</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${matched}</div><div class="label">已匹配</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${unmatched}</div><div class="label">未匹配</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${fp}</div><div class="label">误报 (FP)</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e67e22">${fn}</div><div class="label">漏报 (FN)</div></div>`;
  html += `</div>`;

  const matches = data.matches || [];
  if (!matches.length) {
    html += '<div class="empty">无匹配数据</div>';
    el.innerHTML = html;
    return;
  }

  html += `<table><thead><tr>`;
  html += `<th>基线编号</th><th>告警中心编号</th><th>漏洞标题</th>`;
  html += `<th>判定</th><th>匹配方式</th><th>挖掘 agent session</th><th>验证 agent session</th><th>匹配细节</th>`;
  html += `</tr></thead><tbody>`;

  for (const m of matches) {
    const outcome = m.outcome || "?";
    const outcomeColor = {
      "FP": "#e74c3c", "FN": "#e67e22",
    }[outcome] || "#888";
    const outcomeLabel = {
      "FP": "误报", "FN": "漏报",
    }[outcome] || outcome;

    const method = m.match_method || "unmatched";
    const methodColor = method === "unmatched" ? "#e74c3c" : "#27ae60";
    const methodLabel = {
      "matched": "已匹配",
      "unmatched": "未匹配",
    }[method] || method;

    const miningSids = (m.mining_sessions || []).join(", ") || '<span style="color:#999">—</span>';
    const verifySids = (m.verify_sessions || []).join(", ") || '<span style="color:#999">—</span>';
    const detail = m.match_detail || '<span style="color:#999">—</span>';

    html += `<tr>`;
    html += `<td style="font-family:monospace;font-size:12px">${m.case_id || ""}</td>`;
    html += `<td style="font-family:monospace;font-size:12px">${m.ac_case_id || '<span style="color:#999">—</span>'}</td>`;
    html += `<td>${m.vuln_title || ""}</td>`;
    html += `<td><span class="badge" style="background:${outcomeColor};color:#fff">${outcomeLabel}</span></td>`;
    html += `<td><span class="badge" style="background:${methodColor};color:#fff">${methodLabel}</span></td>`;
    html += `<td style="font-family:monospace;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${miningSids}">${miningSids}</td>`;
    html += `<td style="font-family:monospace;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${verifySids}">${verifySids}</td>`;
    html += `<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${detail}">${detail}</td>`;
    html += `</tr>`;
  }
  html += `</tbody></table>`;

  el.innerHTML = html;
};

// ── root_cause 渲染器 ──
RENDERERS.root_cause = function(el, data) {
  let html = "";

  const total = data.total_fp || 0;
  const analyzed = data.analyzed || 0;
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${total}</div><div class="label">误报 case 数</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${analyzed}</div><div class="label">已分析</div></div>`;
  html += `</div>`;

  // ── FN 漏报原因分析子段（开发态：LLM 未匹配的 VULNERABLE 基线）──
  const fnMiss = data.fn_miss_analysis;
  if (fnMiss && fnMiss.total > 0) {
    const sinkFoundCount = (fnMiss.results || []).filter(r => r.sink_found).length;
    const preciseCount = (fnMiss.results || []).filter(r => r.sink_found_precise).length;
    html += `<details style="margin:16px 0 8px;">`
      + `<summary style="cursor:pointer;color:#e67e22;font-size:16px;font-weight:600;">FN 漏报原因分析 — ${fnMiss.total} 个 VULNERABLE 基线 LLM 未匹配上原始数据</summary>`;

    // 统计
    html += `<div class="stats" style="margin:8px 0;">`;
    html += `<div class="stat"><div class="num" style="color:#e67e22">${fnMiss.total}</div><div class="label">未匹配 VULNERABLE 基线</div></div>`;
    html += `<div class="stat"><div class="num" style="color:#27ae60">${sinkFoundCount}</div><div class="label">sink 找到（识别能力）</div></div>`;
    html += `<div class="stat"><div class="num" style="color:#f39c12">${preciseCount}</div><div class="label">精确命中（函数/行号）</div></div>`;
    html += `<div class="stat"><div class="num" style="color:#e74c3c">${fnMiss.sink_not_found || 0}</div><div class="label">sink 没找到（挖掘方向）</div></div>`;
    html += `</div>`;

    html += `<table><thead><tr>`;
    html += `<th>基线编号</th><th>漏洞标题</th><th>LLM 提取 sink</th><th>漏报类型</th><th>细分成因</th>`;
    html += `<th>命中 session</th><th>漏报原因</th>`;
    html += `</tr></thead><tbody>`;

    for (const r of (fnMiss.results || [])) {
      const category = r.miss_category || "";
      const catLabel = {
        "sink_not_found": "挖掘方向问题",
        "sink_found_no_report": "识别能力问题",
      }[category] || category;
      const catColor = category === "sink_not_found" ? "#e74c3c" : "#f39c12";

      // 细分漏报成因（sink_found_no_report 由 LLM 判定，sink_not_found 直接结论）
      const md = r.miss_detail || {};
      const subLabel = md.miss_sub_category_label || "";
      const subColor = {
        "chain_break": "#6c5ce7",
        "knowledge_mislead": "#e74c3c",
        "hallucination": "#e74c3c",
      }[md.miss_sub_category] || "#f39c12";

      // LLM 提取的 sink 信息摘要
      const si = r.sink_info || {};
      const sinkFiles = (si.sink_files || []).filter(Boolean);
      const sinkFuncs = (si.sink_functions || []).filter(Boolean);
      const sinkLines = (si.sink_lines || []).filter(Boolean);
      const sinkConf = (si.confidence ?? 0) * 100;
      let sinkSummary = "";
      if (sinkFiles.length || sinkFuncs.length || sinkLines.length) {
        const parts = [];
        if (sinkFiles.length) parts.push(`文件: ${sinkFiles.map(f => f.length > 40 ? f.substring(f.lastIndexOf('/')+1) : f).join(", ")}`);
        if (sinkFuncs.length) parts.push(`函数: ${sinkFuncs.join(", ")}`);
        if (sinkLines.length) parts.push(`行号: ${sinkLines.join(", ")}`);
        sinkSummary = parts.join(" | ") + ` (${sinkConf.toFixed(0)}%)`;
      }
      const sinkShort = sinkSummary.length > 100 ? sinkSummary.substring(0, 100) + "..." : sinkSummary;

      // 命中 session 摘要（精确命中）
      const preciseSessions = r.precise_sessions || {};
      let sessionSummary = "";
      if (Object.keys(preciseSessions).length) {
        sessionSummary = Object.entries(preciseSessions)
          .map(([at, sids]) => `${at}: ${sids.length}`)
          .join(", ");
      } else {
        sessionSummary = '<span style="color:#999">—</span>';
      }

      const vt = r.vuln_title || "";
      const vtShort = vt.length > 60 ? vt.substring(0, 60) + "..." : vt;
      const reason = r.miss_reason || "";
      const reasonShort = reason.length > 80 ? reason.substring(0, 80) + "..." : reason;
      const subReason = md.reason || "";
      const subReasonShort = subReason.length > 60 ? subReason.substring(0, 60) + "..." : subReason;

      html += `<tr>`;
      html += `<td style="font-family:monospace;font-size:12px">${r.case_id || ""}</td>`;
      html += `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${vt.replace(/"/g, '&quot;')}">${vtShort}</td>`;
      html += `<td style="font-size:12px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sinkSummary.replace(/"/g, '&quot;')}">${sinkShort || '<span style="color:#999">—</span>'}</td>`;
      html += `<td><span class="badge" style="background:${catColor};color:#fff">${catLabel}</span></td>`;
      html += `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${subReason.replace(/"/g, '&quot;')}">${subLabel ? '<span class="badge" style="background:' + subColor + ';color:#fff">' + subLabel + '</span>' : '<span style="color:#999">—</span>'}</td>`;
      html += `<td style="font-family:monospace;font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sessionSummary}">${sessionSummary}</td>`;
      html += `<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${reason.replace(/"/g, '&quot;')}">${reasonShort}</td>`;
      html += `</tr>`;

      // 有精确命中 event 时，展示上下文（可展开）
      if (r.hit_events && r.hit_events.length > 0) {
        html += `<tr><td colspan="7" style="padding:0;">`;
        html += `<details style="margin:4px 0 8px 20px;">`;
        html += `<summary style="cursor:pointer;color:#888;font-size:13px;">命中 event 上下文（${r.hit_events.length} 条）</summary>`;
        html += `<table style="margin:4px 0;"><thead><tr><th>agent</th><th>session</th><th>event_type</th><th>tool</th><th>命中字段</th><th>匹配精度</th><th>命中函数</th><th>命中行号</th><th>input 预览</th><th>output 预览</th></tr></thead><tbody>`;
        for (const ev of r.hit_events) {
          const inputPreview = (ev.input_preview || "").replace(/</g, '&lt;').substring(0, 100);
          const outputPreview = (ev.output_preview || "").replace(/</g, '&lt;').substring(0, 100);
          const precision = ev.match_precision || "";
          const precisionColor = precision === "precise" ? "#27ae60" : "#f39c12";
          const matchedFuncs = (ev.matched_functions || []).join(", ");
          const matchedLines = (ev.matched_lines || []).join(", ");
          html += `<tr>`;
          html += `<td style="font-family:monospace;font-size:12px">${ev.agent_type || ""}</td>`;
          html += `<td style="font-family:monospace;font-size:12px">${ev.session_id || ""}</td>`;
          html += `<td style="font-size:12px">${ev.event_type || ""}</td>`;
          html += `<td style="font-family:monospace;font-size:12px">${ev.tool_name || ""}</td>`;
          html += `<td style="font-size:12px">${ev.matched_field || ""}</td>`;
          html += `<td><span class="badge" style="background:${precisionColor};color:#fff">${precision === "precise" ? "精确" : "文件级"}</span></td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${matchedFuncs}">${matchedFuncs || '—'}</td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${matchedLines}">${matchedLines || '—'}</td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(ev.input_preview || '').replace(/"/g, '&quot;')}">${inputPreview}</td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(ev.output_preview || '').replace(/"/g, '&quot;')}">${outputPreview}</td>`;
          html += `</tr>`;
        }
        html += `</tbody></table>`;
        html += `</details>`;
        html += `</td></tr>`;
      }
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  const results = data.results || [];
  if (!results.length) {
    html += '<div class="empty">无根因分析数据</div>';
    el.innerHTML = html;
    return;
  }

  // L0-L7 断点统计
  const bpCounts = {};
  const causeCounts = {};
  for (const r of results) {
    for (const chainType of ["mining", "verification"]) {
      const bps = (r[chainType] || {}).l0_l7_breakpoints || [];
      for (const bp of bps) {
        const lvl = bp.breakpoint || "null";
        const code = bp.cause_code || "null";
        if (lvl !== "null") bpCounts[lvl] = (bpCounts[lvl] || 0) + 1;
        if (code !== "null") causeCounts[code] = (causeCounts[code] || 0) + 1;
      }
    }
  }
  if (Object.keys(bpCounts).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">L0-L7 断点分布：</div>`;
    html += `<div class="stats">`;
    const bpLabels = {
      "L2": "L2 发起访问", "L3": "L3 查询准确", "L4": "L4 知识存在",
      "L5": "L5 成功取回", "L6": "L6 被使用", "L7": "L7 影响结论",
    };
    for (const [lvl, cnt] of Object.entries(bpCounts).sort()) {
      html += `<div class="stat"><div class="num" style="color:#e74c3c">${cnt}</div><div class="label">${bpLabels[lvl] || lvl}</div></div>`;
    }
    html += `</div>`;
  }
  if (Object.keys(causeCounts).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">成因分布：</div>`;
    html += `<div class="stats">`;
    const causeLabels = {
      "A": "A 该查没查", "B": "B 查询太泛", "C": "C 查了没得",
      "D": "D 链路问题", "E": "E 查到没用", "F": "F 用了没推动", "G": "G 导致误判",
    };
    for (const [code, cnt] of Object.entries(causeCounts).sort()) {
      html += `<div class="stat"><div class="num" style="color:#f39c12">${cnt}</div><div class="label">${causeLabels[code] || code}</div></div>`;
    }
    html += `</div>`;
  }

  const catLabels = {
    "knowledge_gap": "该查没查",
    "query_inaccurate": "查询不准",
    "knowledge_error": "知识错误",
    "reasoning_flaw": "推理缺陷",
    "verification_dimension_missing": "验证维度遗漏",
    "verification_insufficient": "验证不足",
    "no_session": "无 session",
    "llm_error": "LLM 错误",
    "unknown": "未知",
  };
  const catColor = {
    "knowledge_gap": "#f39c12",
    "query_inaccurate": "#f39c12",
    "knowledge_error": "#e74c3c",
    "reasoning_flaw": "#e74c3c",
    "verification_dimension_missing": "#e67e22",
    "verification_insufficient": "#9b59b6",
    "no_session": "#999",
    "llm_error": "#999",
    "unknown": "#999",
  };

  // 逐 case 展示
  for (const r of results) {
    const mining = r.mining || {};
    const verification = r.verification || {};

    const fpReason = r.human_confirmation_summary || "";
    html += `<details style="margin:16px 0 8px;">`;
    html += `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">`
      + `${r.case_id} — ${r.vuln_title}`
      + (fpReason ? ` <span style="color:#e74c3c;font-size:14px;">—— ${fpReason}</span>` : "")
      + `</summary>`;

    // 挖掘链
    html += _renderChain(mining, "挖掘", "#6c5ce7", catLabels, catColor);

    // 验证链
    html += _renderChain(verification, "验证", "#9b59b6", catLabels, catColor);

    html += `</details>`;
  }

  el.innerHTML = html;
};

// 渲染修复建议（fix_suggestion 可能是 dict、list[dict] 或 string）
// dict 字段: target（修复方）、location（位置）、action（修改）、expected_effect（预期效果）
function _renderFixSuggestion(fs) {
  if (!fs) return '<span style="color:#999">—</span>';
  // 字符串直接返回
  if (typeof fs === "string") {
    return `<div style="color:#555;font-size:14px;line-height:1.6;">${fs}</div>`;
  }
  // 单个 dict
  if (!Array.isArray(fs)) fs = [fs];
  if (!fs.length) return '<span style="color:#999">—</span>';
  let out = "";
  for (let i = 0; i < fs.length; i++) {
    const item = fs[i];
    if (typeof item === "string") {
      out += `<div style="color:#555;font-size:14px;line-height:1.6;margin-bottom:6px;">${item}</div>`;
      continue;
    }
    if (!item || typeof item !== "object") continue;
    const parts = [];
    if (item.target) parts.push(`<b>修复方:</b> ${item.target}`);
    if (item.location) parts.push(`<b>位置:</b> ${item.location}`);
    if (item.action) parts.push(`<b>修改:</b> ${item.action}`);
    if (item.expected_effect) parts.push(`<b>预期:</b> ${item.expected_effect}`);
    out += `<div style="color:#555;font-size:14px;line-height:1.6;margin-bottom:6px;padding:6px;background:#fff;border-radius:3px;">`
      + (parts.length ? parts.join(" · ") : JSON.stringify(item))
      + `</div>`;
  }
  return out || '<span style="color:#999">—</span>';
}

function _renderChain(chainData, label, color, catLabels, catColor) {
  let html = "";
  const chain = chainData.session_chain || [];
  const cat = chainData.root_cause?.category || "unknown";
  const cc = catColor[cat] || "#888";

  html += `<div style="margin:12px 0;padding:12px;background:#f8f8fa;border-radius:6px;border-left:3px solid ${color}">`;
  html += `<div style="color:${color};font-weight:600;font-size:15px;margin-bottom:8px;">`
    + `${label}链 (${chain.length} 会话) `
    + `<span class="badge" style="background:${cc};color:#fff">${catLabels[cat] || cat}</span>`
    + `</div>`;

  // session 链
  if (chain.length > 0) {
    html += `<div style="margin:4px 0;color:#888;font-size:13px;font-family:monospace;">`
      + chain.join(" → ")
      + `</div>`;
  }

  // 根因
  html += `<details style="margin:8px 0;padding:8px;background:#fff0f0;border-radius:4px;">`;
  html += `<summary style="color:#e74c3c;font-weight:600;font-size:14px;cursor:pointer;">根因</summary>`;
  html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;">${chainData.root_cause?.description || "—"}</div>`;
  html += `</details>`;

  // 修复建议
  if (chainData.fix_suggestion) {
    html += `<details style="margin:8px 0;padding:8px;background:#f0fff0;border-radius:4px;">`;
    html += `<summary style="color:#27ae60;font-weight:600;font-size:14px;cursor:pointer;">修复建议</summary>`;
    html += `<div style="margin-top:4px;">${_renderFixSuggestion(chainData.fix_suggestion)}</div>`;
    html += `</details>`;
  }

  // L0-L7 断点
  const bps = chainData.l0_l7_breakpoints || [];
  if (bps.length > 0) {
    html += `<details style="margin:8px 0;">`;
    html += `<summary style="color:#f39c12;font-weight:600;font-size:14px;cursor:pointer;">L0-L7 断点 (${bps.length})</summary>`;
    html += `<table style="margin-top:6px;"><thead><tr><th>会话</th><th>断点</th><th>成因</th><th>L1</th><th>L2</th><th>L3</th><th>L4</th><th>L5</th><th>L6</th><th>L7</th><th>查询内容</th><th>返回内容</th></tr></thead><tbody>`;
    for (const bp of bps) {
      const lvl = bp.breakpoint || "—";
      const code = bp.cause_code || "—";
      const bpColor = code !== "—" ? "#e74c3c" : "#888";
      html += `<tr>`;
      html += `<td style="font-family:monospace;font-size:12px">${bp.session_id || ""}</td>`;
      html += `<td style="color:${bpColor};font-weight:bold">${lvl}</td>`;
      html += `<td style="color:${bpColor};font-weight:bold">${code}</td>`;
      html += `<td>${bp.l1_need === true ? "✓" : bp.l1_need === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l2_initiated === true ? "✓" : bp.l2_initiated === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l3_accurate === true ? "✓" : bp.l3_accurate === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l4_exists === true ? "✓" : bp.l4_exists === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l5_retrieved === true ? "✓" : bp.l5_retrieved === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l6_used === true ? "✓" : bp.l6_used === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l7_influenced === "positive" ? "正向" : bp.l7_influenced === "negative" ? "负向" : "—"}</td>`;
      html += `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${bp.query_content || ""}">${bp.query_content || "—"}</td>`;
      html += `<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${bp.returned_content || ""}">${bp.returned_content || "—"}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  // L4 独立验证（知识库主动验证）
  const l4v = chainData.l4_independent_verification;
  if (l4v) {
    const l4Exists = l4v.l4_knowledge_exists;
    const l4Label = l4Exists === true ? "知识存在" :
                    l4Exists === false ? "知识不存在" : "无法判定";
    const l4Color = l4Exists === true ? "#27ae60" :
                    l4Exists === false ? "#e74c3c" : "#999";
    const kbSearched = l4v.kb_searched || {};
    const sources = [];
    if (kbSearched.athena_api) sources.push("知识库API");
    if (kbSearched.wiki_nfs) sources.push("记忆Wiki");

    html += `<details style="margin:8px 0;padding:8px;background:#f0f0ff;border-radius:4px;border-left:3px solid #4a90d9;">`;
    html += `<summary style="color:#4a90d9;font-weight:600;font-size:14px;cursor:pointer;">L4 独立验证 — 评测引擎主动搜索知识库</summary>`;
    html += `<div style="margin-top:6px;margin-bottom:6px;">`;
    html += `<span style="font-size:13px;color:#888;">验证结果：</span>`;
    html += `<span class="badge" style="background:${l4Color};color:#fff;">${l4Label}</span>`;
    html += `<span style="font-size:13px;color:#888;margin-left:12px;">搜索来源：${sources.join(" + ") || "—"}</span>`;
    html += `<span style="font-size:13px;color:#888;margin-left:12px;">候选文件：${l4v.candidate_files || 0}</span>`;
    html += `</div>`;
    if (l4v.summary) {
      html += `<div style="color:#555;font-size:13px;line-height:1.6;margin-bottom:6px;">${l4v.summary}</div>`;
    }
    const matched = l4v.matched_files || [];
    if (matched.length > 0) {
      html += `<table><thead><tr><th>文件路径</th><th>标题</th><th>相关度</th><th>原因</th></tr></thead><tbody>`;
      for (const mf of matched) {
        const rel = mf.relevance || "—";
        const relColor = rel === "high" ? "#27ae60" : rel === "medium" ? "#f39c12" : "#888";
        html += `<tr>`;
        html += `<td style="font-family:monospace;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${mf.path || ""}">${mf.path || ""}</td>`;
        html += `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${mf.title || ""}</td>`;
        html += `<td><span class="badge" style="background:${relColor};color:#fff;">${rel}</span></td>`;
        html += `<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${mf.reason || ""}">${mf.reason || "—"}</td>`;
        html += `</tr>`;
      }
      html += `</tbody></table>`;
    }
    if (l4v.error) {
      html += `<div style="color:#e74c3c;font-size:12px;margin-top:4px;">错误: ${l4v.error}</div>`;
    }
    html += `</details>`;
  }

  // 各 session 独立压缩结果
  const summaries = chainData.compressed_summaries || [];
  if (summaries.length > 0) {
    html += `<details style="margin:8px 0;">`;
    html += `<summary style="color:${color};font-weight:600;font-size:14px;cursor:pointer;">各 Session 独立压缩 (${summaries.length})</summary>`;
    for (const s of summaries) {
      html += `<div style="margin:6px 0;padding:8px;background:#f0f0f5;border-radius:4px;border-left:2px solid ${color}40;">`;
      html += `<div style="color:${color};font-size:13px;font-weight:600;margin-bottom:4px;font-family:monospace;">${s.session_id || ""}</div>`;
      html += `<pre style="font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#555;">${s.summary || ""}</pre>`;
      if (s.key_findings && s.key_findings.length > 0) {
        html += `<div style="color:#6c5ce7;font-size:12px;margin-top:4px;">关键发现: ${s.key_findings.join(" | ")}</div>`;
      }
      // session 级 L0-L7
      const l0l7 = s.l0_l7 || [];
      if (l0l7.length > 0) {
        html += `<div style="margin-top:4px;color:#888;font-size:12px;">`;
        for (const kp of l0l7) {
          const bp = kp.breakpoint || "—";
          const code = kp.cause_code || "—";
          const bpColor = code !== "—" ? "#e74c3c" : "#888";
          html += `<span style="margin-right:8px;color:${bpColor};">${bp}/${code}</span>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  // 合并压缩摘要
  if (chainData.merge_summary) {
    html += `<details style="margin:8px 0;padding:8px;background:#fff8e1;border-radius:4px;border-left:3px solid #f39c12;">`;
    html += `<summary style="color:#f39c12;font-weight:600;font-size:14px;cursor:pointer;">合并压缩摘要</summary>`;
    html += `<pre style="font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#555;margin-top:4px;">${chainData.merge_summary}</pre>`;
    html += `</details>`;
  }

  html += `</div>`;
  return html;
}

// ── resolving 渲染器（因果链 + 问题单）──
RENDERERS.resolving = function(el, data) {
  let html = "";

  const causalChain = data.causal_chain || {};
  const causeSummary = causalChain.cause_summary || {};
  const effectDist = causalChain.effect_label_distribution || {};
  const perCase = causalChain.per_case_breakpoints || [];

  // 统计
  const totalBp = perCase.reduce((s, c) => s + (c.breakpoints?.length || 0), 0);
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${perCase.length}</div><div class="label">FP case 数</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${totalBp}</div><div class="label">断点总数</div></div>`;
  html += `</div>`;

  // 成因分布
  const causeLabels = {"A":"A 该查没查","B":"B 查询太泛","C":"C 查了没得","D":"D 链路问题","E":"E 查到没用","F":"F 用了没推动","G":"G 导致误判"};
  if (Object.keys(causeSummary).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">成因分布：</div>`;
    html += `<div class="stats">`;
    for (const [code, cnt] of Object.entries(causeSummary).sort()) {
      html += `<div class="stat"><div class="num" style="color:#f39c12">${cnt}</div><div class="label">${causeLabels[code] || code}</div></div>`;
    }
    html += `</div>`;
  }

  // 效果标签分布
  if (Object.keys(effectDist).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">效果标签分布：</div>`;
    html += `<div class="stats">`;
    for (const [label, cnt] of Object.entries(effectDist)) {
      html += `<div class="stat"><div class="num">${cnt}</div><div class="label">${label}</div></div>`;
    }
    html += `</div>`;
  }

  // 逐 case 断点展示
  if (perCase.length === 0) {
    html += '<div class="empty">无因果链断点数据</div>';
    el.innerHTML = html;
    return;
  }

  for (const c of perCase) {
    const bps = c.breakpoints || [];
    const hasBp = bps.length > 0;
    const titleColor = hasBp ? "#e74c3c" : "#27ae60";
    html += `<details style="margin:16px 0 8px;">`;
    html += `<summary style="cursor:pointer;color:${titleColor};font-size:16px;font-weight:600;">`;
    html += `${c.case_id || ""} — ${c.vuln_title || ""} (${bps.length} 断点)`;
    html += `</summary>`;
    html += `<div style="margin-top:8px;">`;

    // 根因
    const rc = c.root_cause || {};
    if (Object.keys(rc).length > 0) {
      html += `<details style="margin:8px 0;padding:8px;background:#fff0f0;border-radius:4px;">`;
      html += `<summary style="color:#e74c3c;font-weight:600;font-size:14px;cursor:pointer;">根因</summary>`;
      for (const [cat, desc] of Object.entries(rc)) {
        html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;"><b>${cat}:</b> ${desc}</div>`;
      }
      html += `</details>`;
    }

    // 修复建议
    if (c.fix_suggestion) {
      html += `<details style="margin:8px 0;padding:8px;background:#f0fff0;border-radius:4px;">`;
      html += `<summary style="color:#27ae60;font-weight:600;font-size:14px;cursor:pointer;">修复建议</summary>`;
      html += `<div style="margin-top:4px;">${_renderFixSuggestion(c.fix_suggestion)}</div>`;
      html += `</details>`;
    }

    // 断点表
    if (bps.length > 0) {
      html += `<table><thead><tr>`;
      html += `<th>Agent</th><th>链类型</th><th>断点级别</th><th>成因</th><th>证据</th>`;
      html += `</tr></thead><tbody>`;
      for (const bp of bps) {
        const code = bp.cause_code || "—";
        const bpColor = code !== "—" ? "#e74c3c" : "#888";
        html += `<tr>`;
        html += `<td>${bp.agent_type || "—"}</td>`;
        html += `<td>${bp.chain_type || "—"}</td>`;
        html += `<td style="color:${bpColor};font-weight:bold;text-align:center">${bp.break_level || "—"}</td>`;
        html += `<td style="color:${bpColor};font-weight:bold;text-align:center">${code}</td>`;
        html += `<td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(bp.evidence||"").replace(/"/g,"&quot;")}">${bp.evidence || "—"}</td>`;
        html += `</tr>`;
      }
      html += `</tbody></table>`;
    }

    html += `</div>`;
    html += `</details>`;
  }

  el.innerHTML = html;
};

checkSteps();
</script>
