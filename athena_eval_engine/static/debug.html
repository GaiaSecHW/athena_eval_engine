<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>调试 — 评测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6fa; color: #333; padding: 20px; font-size: 15px; }
h1 { font-size: 20px; margin-bottom: 16px; color: #6c5ce7; word-break: break-all; }
.step-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.step-btn { padding: 6px 14px; border: 1px solid #ccc; background: #fff; color: #666;
  border-radius: 4px; cursor: pointer; font-size: 14px; }
.step-btn:hover { background: #ececff; color: #333; }
.step-btn.active { background: #6c5ce7; color: #fff; border-color: #6c5ce7; }
.content { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 16px;
  height: calc(100vh - 110px); overflow: auto; }
.content pre { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.empty { color: #999; padding: 40px; text-align: center; }
.stats { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.stat { background: #f0f0f5; padding: 8px 14px; border-radius: 4px; font-size: 14px; }
.stat .num { font-size: 22px; font-weight: bold; color: #6c5ce7; }
.stat .label { color: #888; font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 6px 8px; border-bottom: 2px solid #e0e0e0; color: #666; position: sticky; top: 0; background: #f8f8fa; }
td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
tr:hover { background: #f5f5ff; }
.badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 12px; }
.badge-vulnerable, .badge-VULNERABLE { background: #e74c3c; color: #fff; }
.badge-not_vulnerable, .badge-NON_VULNERABLE { background: #27ae60; color: #fff; }
.badge-pending { background: #f39c12; color: #fff; }
.badge-inconclusive { background: #95a5a6; color: #fff; }
</style>
</head>
<body>
<h1 id="title">调试</h1>
<div class="step-bar" id="stepBar"></div>
<div class="content" id="content"></div>
<script>
// 检测 /eval/ 前缀，构建静态资源基础路径
const _P = location.pathname;
const _INGRESS = (_P.indexOf('/eval/') === 0) ? '/eval' : '';
const _LIB_BASE = _INGRESS + '/static/lib/';

// 动态加载本地 JS/CSS（兼容 /eval/ 前缀）
(function loadLibs() {
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = _LIB_BASE + 'style.min.css';
  document.head.appendChild(css);

  const jq = document.createElement('script');
  jq.src = _LIB_BASE + 'jquery.min.js';
  jq.onload = function() {
    const js = document.createElement('script');
    js.src = _LIB_BASE + 'jstree.min.js';
    document.head.appendChild(js);
  };
  document.head.appendChild(jq);

  // fact 依赖图布局与渲染（dagre 分层 + d3 SVG）
  const dg = document.createElement('script');
  dg.src = _LIB_BASE + 'dagre.min.js';
  document.head.appendChild(dg);
  const d3s = document.createElement('script');
  d3s.src = _LIB_BASE + 'd3.min.js';
  document.head.appendChild(d3s);
})();

const STEPS = ["ingesting", "parsing", "case_matching", "root_cause", "reporting"];
const STEP_LABELS = {
  "ingesting": "数据采集",
  "parsing": "解析 Trace",
  "case_matching": "Case 匹配",
  "root_cause": "根因分析",
  "reporting": "生成报告",
};

function getEid() {
  const m = location.pathname.match(/\/evaluations\/([^/]+)\/debug/);
  return m ? m[1] : "";
}

// 用相对路径，兼容 /eval/ 前缀
function apiBase(step) {
  return `./debug/${step}`;
}

const eid = getEid();
document.getElementById("title").textContent = "调试 — " + eid;

let available = [];

async function checkSteps() {
  // 逐个检查哪些步骤有数据
  const results = await Promise.all(STEPS.map(async (step) => {
    try {
      const resp = await fetch(apiBase(step));
      return resp.ok ? step : null;
    } catch { return null; }
  }));
  available = results.filter(Boolean);
  renderStepBar();
  if (available.length) loadStep(available[0]);
  else document.getElementById("content").innerHTML = '<div class="empty">暂无调试数据。评测运行后此处显示各步骤中间数据。</div>';

}

function renderStepBar() {
  const bar = document.getElementById("stepBar");
  bar.innerHTML = available.map((step, i) =>
    `<button class="step-btn${i === 0 ? " active" : ""}" data-step="${step}">${STEP_LABELS[step] || step}</button>`
  ).join("");
  bar.querySelectorAll(".step-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      bar.querySelectorAll(".step-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      loadStep(btn.dataset.step);
    });
  });
}

async function loadStep(step) {
  const resp = await fetch(apiBase(step));
  if (!resp.ok) {
    document.getElementById("content").innerHTML = "<p>加载失败</p>";
    return;
  }
  const data = await resp.json();
  render(step, data);
}

function render(step, data) {
  const el = document.getElementById("content");
  const renderer = RENDERERS[step];
  if (renderer) renderer(el, data);
  else el.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
  // innerHTML 设置后初始化 jstree 容器
  flushJstreeInits();
}

// ── 步骤渲染器 ──
const RENDERERS = {};

// HTML 转义工具：所有插入 innerHTML 的外部字段必须经过 esc()。
// 不转义 < > & 会把字段当标签解析（如 summary 里的 <script> 会吞掉后续 DOM），
// 且存在 XSS 注入风险。
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

RENDERERS.ingesting = function(el, data) {
  let html = "";

  // 配置信息
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${data.benchmark_source || "-"}</div><div class="label">基线来源</div></div>`;
  html += `<div class="stat"><div class="num">${data.eval_mode || "-"}</div><div class="label">评测模式</div></div>`;
  html += `<div class="stat"><div class="num">${data.raw_data?.total ?? 0}</div><div class="label">原始数据</div></div>`;
  html += `<div class="stat"><div class="num">${data.baseline?.total ?? 0}</div><div class="label">基线数据</div></div>`;
  html += `</div>`;

  // 原始数据明细
  const raw = data.raw_data || {};
  html += `<details style="margin:16px 0 8px;">`
    + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">原始数据（告警中心） — ${raw.total ?? 0} 条</summary>`;
  if (raw.cases?.length) {
    html += `<table><thead><tr><th>告警中心编号</th><th>标题</th><th>摘要</th><th>验证结果</th><th>阶段</th><th>误报分组</th><th>人工确认原因</th><th>源文件</th><th>项目编号</th></tr></thead><tbody>`;
    for (const c of raw.cases) {
      const vr = c.validation_result || "pending";
      const summary = c.summary ?? "";
      const summaryShort = summary.length > 80 ? summary.substring(0, 80) + "..." : summary;
      const title = c.title ?? "";
      const titleShort = title.length > 60 ? title.substring(0, 60) + "..." : title;
      const sf = c.source_file ?? "";
      const sfShort = sf.length > 60 ? sf.substring(0, 60) + "..." : sf;
      const hc = c.human_confirmation_summary ?? "";
      const hcShort = hc.length > 60 ? hc.substring(0, 60) + "..." : hc;
      html += `<tr><td title="${esc(c.case_id ?? "")}">${esc(c.case_id ?? "")}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(title)}">${esc(titleShort)}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(summary)}">${esc(summaryShort)}</td>`
        + `<td><span class="badge badge-${vr}">${esc(vr)}</span></td>`
        + `<td>${esc(c.current_stage ?? "")}</td>`
        + `<td>${esc(c.false_positive_group ?? "")}</td>`
        + `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(hc)}">${esc(hcShort)}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(sf)}">${esc(sfShort)}</td>`
        + `<td>${esc(c.project_id ?? "")}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</details>`;

  // 基线数据明细
  const bl = data.baseline || {};
  html += `<details style="margin:16px 0 8px;">`
    + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">基线数据 — ${bl.total ?? 0} 条</summary>`;
  if (bl.cases?.length) {
    html += `<table><thead><tr><th>基线编号</th><th>漏洞标题</th><th>预期标签</th><th>源文件</th><th>误报分组</th><th>人工确认原因</th></tr></thead><tbody>`;
    for (const c of bl.cases) {
      const lbl = c.expected_label || "";
      const vt = c.vuln_title ?? "";
      const vtShort = vt.length > 60 ? vt.substring(0, 60) + "..." : vt;
      const sf = c.source_file ?? "";
      const sfShort = sf.length > 60 ? sf.substring(0, 60) + "..." : sf;
      const hc = c.human_confirmation_summary ?? "";
      const hcShort = hc.length > 60 ? hc.substring(0, 60) + "..." : hc;
      html += `<tr><td title="${esc(c.case_id ?? "")}">${esc(c.case_id ?? "")}</td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(vt)}">${esc(vtShort)}</td>`
        + `<td><span class="badge badge-${lbl}">${esc(lbl)}</span></td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(sf)}">${esc(sfShort)}</td>`
        + `<td>${esc(c.false_positive_group ?? "")}</td>`
        + `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(hc)}">${esc(hcShort)}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</details>`;

  // LLM 匹配结果（开发态：原始数据 ↔ 基线）
  const matches = data.case_matches;
  if (matches && matches.length) {
    const matched = matches.filter(m => m.matched_baseline_case_id).length;
    html += `<details style="margin:16px 0 8px;">`
      + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">LLM 匹配结果 — ${matched}/${matches.length} 条匹配成功</summary>`;
    html += `<table><thead><tr><th>告警中心编号</th><th>告警中心漏洞状态</th><th>告警中心标题</th><th>匹配基线编号</th><th>匹配基线漏洞状态</th><th>匹配基线标题</th><th>置信度</th><th>原因</th></tr></thead><tbody>`;
    for (const m of matches) {
      const conf = m.confidence ?? 0;
      const confColor = conf >= 0.7 ? "#27ae60" : conf >= 0.4 ? "#f39c12" : "#e74c3c";
      const matchedId = m.matched_baseline_case_id;
      const rt = m.raw_title ?? "";
      const rtShort = rt.length > 60 ? rt.substring(0, 60) + "..." : rt;
      const mbt = m.matched_baseline_title ?? "";
      const mbtShort = mbt.length > 60 ? mbt.substring(0, 60) + "..." : mbt;
      const reason = m.reason ?? "";
      const reasonShort = reason.length > 80 ? reason.substring(0, 80) + "..." : reason;

      // 告警中心漏洞状态（vulnerable/not_vulnerable）
      const rawVr = m.raw_validation_result ?? "";
      const rawVrLabel = rawVr === "vulnerable" ? "漏洞" :
                         rawVr === "not_vulnerable" ? "非漏洞" : rawVr || "—";
      const rawVrColor = rawVr === "vulnerable" ? "#e74c3c" :
                         rawVr === "not_vulnerable" ? "#27ae60" : "#999";
      // 基线漏洞状态（VULNERABLE/NON_VULNERABLE）
      const blLabel = m.baseline_expected_label ?? "";
      const blLabelShort = blLabel === "VULNERABLE" ? "漏洞" :
                           blLabel === "NON_VULNERABLE" ? "非漏洞" : blLabel || "—";
      const blColor = blLabel === "VULNERABLE" ? "#e74c3c" :
                      blLabel === "NON_VULNERABLE" ? "#27ae60" : "#999";

      html += `<tr>`
        + `<td title="${esc(m.raw_case_id ?? "")}">${esc(m.raw_case_id ?? "")}</td>`
        + `<td><span class="badge" style="background:${rawVrColor};color:#fff">${esc(rawVrLabel)}</span></td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(rt)}">${esc(rtShort)}</td>`
        + `<td title="${esc(matchedId ?? "")}">${matchedId ? esc(matchedId) : '<span style="color:#666">无匹配</span>'}</td>`
        + `<td><span class="badge" style="background:${blColor};color:#fff">${esc(blLabelShort)}</span></td>`
        + `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(mbt)}">${esc(mbtShort)}</td>`
        + `<td style="color:${confColor};font-weight:bold">${(conf * 100).toFixed(0)}%</td>`
        + `<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(reason)}">${esc(reasonShort)}</td>`
        + `</tr>`;
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  el.innerHTML = html;
};
// RENDERERS.parsing = function(el, data) { ... };
// RENDERERS.resolving = function(el, data) { ... };
// ...

RENDERERS.parsing = function(el, data) {
  let html = "";

  const packs = data.data_packs || [];
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${packs.length}</div><div class="label">数据包</div></div>`;
  let totalSessions = 0, totalEdges = 0, totalEvents = 0;
  for (const p of packs) {
    totalSessions += p.session_count || 0;
    totalEdges += p.edge_count || 0;
    totalEvents += p.event_count || 0;
  }
  html += `<div class="stat"><div class="num">${totalSessions}</div><div class="label">会话数</div></div>`;
  html += `<div class="stat"><div class="num">${totalEdges}</div><div class="label">边数</div></div>`;
  html += `<div class="stat"><div class="num">${totalEvents}</div><div class="label">事件数</div></div>`;
  html += `</div>`;

  for (const p of packs) {
    const agentLabel = p.agent_type || "";
    const condLabel = p.condition || "";
    const sc = p.session_count || 0;
    const ec = p.edge_count || 0;
    html += `<details style="margin:16px 0 8px;">`
      + `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">${esc(p.task_run_id)} — ${esc(agentLabel)} (${esc(condLabel)}) — ${sc} 会话, ${ec} 边</summary>`;

    const sessions = p.sessions || [];
    if (sessions.length > 0) {
      // fact 依赖图（节点=Fact，边=Intent，多跳网络）
      const factDeps = p.fact_deps || {};
      const hasFactGraph = factDeps.edges && factDeps.edges.length > 0;
      if (hasFactGraph) {
        html += renderFactDepsGraph(factDeps, sessions, p.task_run_id);
      }
      // session 调用树（文本缩进格式）
      html += renderSessionTree(sessions, factDeps);
    }
    html += `</details>`;
  }

  if (!packs.length) {
    html += '<div class="empty">无解析数据</div>';
  }
  el.innerHTML = html;
};

// ── Fact 依赖图（纯 SVG，零依赖）──
// 节点 = Fact（system_profile/module/fact/finding/verified_finding/report）
// 边   = Intent（bootstrap/module_expand/investigate/verify/synthesize）
// 边方向 = intent.from（消费的 facts）→ intent.outputs（产出的 facts）
// 多跳链：origin → system_profile → module → finding → verified_finding → report
// 按 BFS 跳数分层布局；点击节点高亮其上下游
function renderFactDepsGraph(factDeps, sessions, taskRunId) {
  const facts = factDeps.facts || {};
  const intents = factDeps.intents || [];
  const edges = factDeps.edges || [];
  if (!edges.length) return "";

  // 节点类型 -> 颜色
  const FACT_COLOR = {
    "system_profile": "#8e44ad",
    "module":         "#2980b9",
    "fact":           "#00a8ff",
    "finding":        "#e67e22",
    "verified_finding": "#27ae60",
    "report":         "#e74c3c",
  };
  const DEFAULT_COLOR = "#95a5a6";
  // 边类型 -> 颜色
  const EDGE_COLOR = {
    "bootstrap": "#8e44ad",
    "module_expand": "#2980b9",
    "investigate": "#00a8ff",
    "verify": "#27ae60",
    "synthesize": "#e74c3c",
  };
  const DEFAULT_EDGE = "#95a5a6";

  // 排除 report
  const nodeIds = new Set();
  for (const fid of Object.keys(facts)) {
    if ((facts[fid] || {}).type !== "report") nodeIds.add(fid);
  }
  for (const e of edges) {
    if (e.from !== e.to) {
      if ((facts[e.from] || {}).type !== "report") nodeIds.add(e.from);
      if ((facts[e.to] || {}).type !== "report") nodeIds.add(e.to);
    }
  }
  const allNodes = Array.from(nodeIds);

  // 邻接表
  const outAdj = {}, inAdj = {};
  for (const e of edges) {
    if (e.from !== e.to && nodeIds.has(e.from) && nodeIds.has(e.to)) {
      if (!outAdj[e.from]) outAdj[e.from] = [];
      if (!inAdj[e.to]) inAdj[e.to] = [];
      outAdj[e.from].push(e.to);
      inAdj[e.to].push(e.from);
    }
  }

  // fact_id -> 生产者 session_id
  const factSid = {};
  for (const it of intents) {
    if (!it.session_id) continue;
    for (const fid of (it.outputs || [])) {
      if (!factSid[fid]) factSid[fid] = it.session_id;
    }
  }

  // 节点标签
  const NODE_W = 260, NODE_H = 52;
  function nodeLabel(n) {
    const fd = facts[n] || {};
    const desc = fd.description || n;
    const sid = factSid[n] || "";
    const sidShort = sid.length > 30 ? sid.slice(0, 28) + "\u2026" : sid;
    const head = n + " [" + (fd.type || "?") + "]";
    return { id: n, type: fd.type || "?", desc: desc,
             head: head,
             short: desc.length > 26 ? desc.slice(0, 24) + "\u2026" : desc,
             sid: sidShort || "\u2014",
             full: head + " " + desc + (sid ? " | session: " + sid : "") };
  }
  const labels = {};
  for (const n of allNodes) labels[n] = nodeLabel(n);

  // 是否叶子节点（无出边子节点）
  function isLeaf(n) {
    return !outAdj[n] || outAdj[n].length === 0;
  }

  // 向上收集全部祖先（多跳传递闭包）
  function collectAncestors(id) {
    const set = new Set([id]);
    const queue = [id];
    while (queue.length) {
      const cur = queue.shift();
      for (const p of (inAdj[cur] || [])) {
        if (!set.has(p)) { set.add(p); queue.push(p); }
      }
    }
    return set;
  }

  // 向下取直接子节点（1 跳）
  function collectChildren(id) {
    return outAdj[id] || [];
  }

  // 默认视图：最新 2 层（verified_finding + finding 的直接上级）
  // verified_finding 是最右层（最新产出），finding 是它的直接上级
  function buildDefaultView() {
    const result = new Set();
    // 找 verified_finding 节点
    const vfNodes = allNodes.filter(n => labels[n].type === "verified_finding");
    for (const n of vfNodes.slice(0, 3)) {  // 取前 3 个 verified_finding
      result.add(n);
      // 直接上级 finding
      for (const p of (inAdj[n] || [])) {
        result.add(p);
      }
    }
    // 兜底：如果没找到 verified_finding，取 finding 前 3 个 + 上级
    if (result.size === 0) {
      const fNodes = allNodes.filter(n => labels[n].type === "finding");
      for (const n of fNodes.slice(0, 3)) {
        result.add(n);
        for (const p of (inAdj[n] || [])) result.add(p);
      }
    }
    return Array.from(result);
  }

  // 状态
  let visibleNodes = buildDefaultView();
  let focusHighlight = null;
  let selectedId = "";
  let zoomState = null;
  const containerId = "factGraph-" + taskRunId;
  const MAX_CHILDREN = 50;  // 向下1跳子节点上限

  // dagre 布局 + d3 渲染
  function renderD3() {
    const box = document.getElementById(containerId);
    if (!box) return;
    box.innerHTML = "";

    const vis = new Set(visibleNodes);
    // 边：两端都可见
    const visEdges = edges.filter(e => e.from !== e.to && vis.has(e.from) && vis.has(e.to));

    // dagre 布局
    const g = new dagre.graphlib.Graph();
    g.setGraph({ rankdir: "LR", nodesep: 24, ranksep: 80, edgesep: 20, marginx: 24, marginy: 24 });
    g.setDefaultEdgeLabel(function() { return {}; });
    for (const n of vis) g.setNode(n, { width: NODE_W, height: NODE_H });
    const seenE = new Set();
    for (const e of visEdges) {
      const key = e.from + "|" + e.to;
      if (seenE.has(key)) continue;
      seenE.add(key);
      g.setEdge(e.from, e.to, { taskType: e.task_type });
    }
    dagre.layout(g);
    const graph = g.graph();
    const pos = {};
    for (const n of vis) {
      const node = g.node(n);
      if (node) pos[n] = { x: node.x - NODE_W / 2, y: node.y - NODE_H / 2 };
    }
    const W = (graph.width || 800) + 40;
    const H = (graph.height || 600) + 40;

    // d3 SVG
    const svg = d3.select(box).append("svg")
      .attr("width", "100%").attr("height", "100%")
      .attr("style", "display:block;background:#fafafd;border:1px solid #eee;border-radius:6px");
    const gWrap = svg.append("g");
    const zoom = d3.zoom().scaleExtent([0.1, 6]).on("zoom", (ev) => {
      zoomState = ev.transform;
      gWrap.attr("transform", ev.transform);
    });
    svg.call(zoom);

    // fit 到容器
    const boxW = box.clientWidth || 800, boxH = box.clientHeight || 600;
    const scale = Math.min(boxW / W, boxH / H, 1) * 0.9;
    const initT = d3.zoomIdentity
      .translate((boxW - W * scale) / 2, (boxH - H * scale) / 2)
      .scale(scale);
    zoomState = initT;
    gWrap.attr("transform", initT);

    // 选中节点的关联边
    let relEdges = null;
    if (selectedId) {
      relEdges = new Set();
      for (const e of visEdges) {
        if (e.from === selectedId || e.to === selectedId) relEdges.add(e.from + "|" + e.to);
      }
    }

    // 边
    gWrap.append("g").selectAll("path")
      .data(visEdges)
      .enter().append("path")
      .attr("d", function(e) {
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b) return "";
        const ax = a.x + NODE_W, ay = a.y + NODE_H / 2;
        const bx = b.x, by = b.y + NODE_H / 2;
        const mx = (ax + bx) / 2;
        return "M" + ax + "," + ay + " C" + mx + "," + ay + " " + mx + "," + by + " " + bx + "," + by;
      })
      .attr("fill", "none")
      .attr("stroke", function(e) {
        const k = e.from + "|" + e.to;
        if (selectedId && relEdges && relEdges.has(k)) return "#f59e0b";
        return EDGE_COLOR[e.task_type] || DEFAULT_EDGE;
      })
      .attr("stroke-opacity", function(e) {
        if (!selectedId) return 0.5;
        const k = e.from + "|" + e.to;
        return relEdges.has(k) ? 0.9 : 0.15;
      })
      .attr("stroke-width", function(e) {
        if (!selectedId) return 1.2;
        const k = e.from + "|" + e.to;
        return relEdges.has(k) ? 2.5 : 0.8;
      });

    // 节点
    gWrap.append("g").selectAll("g.node")
      .data(Array.from(vis))
      .enter().append("g")
      .attr("class", "node")
      .attr("transform", function(n) { return "translate(" + pos[n].x + "," + pos[n].y + ")"; })
      .style("cursor", function(n) { return isLeaf(n) ? "default" : "pointer"; })
      .on("dblclick", function(ev, n) { onNodeDblClick(n); })
      .each(function(n) {
        const gEl = d3.select(this);
        const fd = labels[n];
        const st = FACT_COLOR[fd.type] || DEFAULT_COLOR;
        const leaf = isLeaf(n);
        const inFocus = focusHighlight && focusHighlight.has(n);
        const sel = selectedId === n;
        gEl.append("title").text(fd.full);
        gEl.append("rect")
          .attr("width", NODE_W).attr("height", NODE_H)
          .attr("rx", 6)
          .attr("fill", sel ? "#f59e0b" : (inFocus ? "#fcd34d" : st))
          .attr("fill-opacity", sel ? 0.55 : (inFocus ? 0.4 : 0.12))
          .attr("stroke", sel ? "#f59e0b" : st)
          .attr("stroke-width", sel ? 3 : 1)
          // 叶子节点虚线边框
          .attr("stroke-dasharray", leaf ? "5,3" : null);
        gEl.append("text")
          .attr("x", 6).attr("y", 12)
          .attr("font-size", 10).attr("fill", st)
          .attr("font-weight", "bold")
          .attr("style", "user-select:none")
          .text(fd.head);
        gEl.append("text")
          .attr("x", 6).attr("y", 27)
          .attr("font-size", 10).attr("fill", "#333")
          .attr("font-weight", sel ? "bold" : "normal")
          .attr("style", "user-select:none")
          .text(fd.short);
        gEl.append("text")
          .attr("x", 6).attr("y", 41)
          .attr("font-size", 9).attr("fill", "#888")
          .attr("style", "user-select:none")
          .text(fd.sid);
      });
  }

  // 双击节点
  function onNodeDblClick(id) {
    if (isLeaf(id)) {
      // 叶子节点：闪现提示
      const tip = document.createElement("div");
      tip.style.cssText = "color:#e74c3c;font-size:12px;margin-top:4px;";
      tip.textContent = "\u8be5\u8282\u70b9\u65e0\u4e0b\u6e38\u5b50\u8282\u70b9";
      const box = document.getElementById(containerId);
      if (box) { box.parentNode.insertBefore(tip, box.nextSibling); setTimeout(() => tip.remove(), 2000); }
      return;
    }
    // 非叶子节点：向上全部祖先 + 向下1跳子节点
    const ancestors = collectAncestors(id);
    const children = collectChildren(id);
    const result = new Set([...ancestors, ...children]);
    // 子节点过多截断
    if (children.length > MAX_CHILDREN) {
      const limited = new Set([...ancestors]);
      for (const c of children.slice(0, MAX_CHILDREN)) limited.add(c);
      const tip = document.createElement("div");
      tip.style.cssText = "color:#e74c3c;font-size:12px;margin-top:4px;";
      tip.textContent = "\u8be5\u8282\u70b9\u5b50\u8282\u70b9\u8fc7\u591a\uff08" + children.length + " \u4e2a\uff09\uff0c\u4ec5\u663e\u793a\u524d " + MAX_CHILDREN + " \u4e2a";
      const box = document.getElementById(containerId);
      if (box) { box.parentNode.insertBefore(tip, box.nextSibling); setTimeout(() => tip.remove(), 4000); }
      visibleNodes = Array.from(limited);
    } else {
      visibleNodes = Array.from(result);
    }
    selectedId = id;
    focusHighlight = null;
    renderD3();
  }

  // 搜索：session_id 或 fact_id
  function search(q) {
    const query = (q || "").trim();
    if (!query) return;
    // 先按 fact_id 匹配
    let target = null;
    if (allNodes.includes(query)) {
      target = query;
    } else {
      // 按 session_id 匹配（找到 intent 关联的 fact）
      let found = null;
      for (const it of intents) {
        if (it.session_id && it.session_id.includes(query)) {
          found = it;
          break;
        }
      }
      if (found) {
        // 取 intent 的 outputs 第一个 fact
        const fids = found.outputs || [];
        target = fids.length ? fids[0] : (found.from || [])[0];
      }
    }
    if (!target || !nodeIds.has(target)) {
      const tip = document.createElement("div");
      tip.style.cssText = "color:#e74c3c;font-size:12px;margin-top:4px;";
      tip.textContent = "\u672a\u627e\u5230\uff1a" + query;
      const box = document.getElementById(containerId);
      if (box) { box.parentNode.insertBefore(tip, box.nextSibling); setTimeout(() => tip.remove(), 4000); }
      return;
    }
    // 定位到目标节点：显示全部祖先 + 全部后代（传递闭包）
    const ancestors = collectAncestors(target);
    // 向下也取全部后代（搜索定位时显示完整相关子图）
    const descendants = new Set([target]);
    const queue = [target];
    while (queue.length) {
      const cur = queue.shift();
      for (const c of (outAdj[cur] || [])) {
        if (!descendants.has(c)) { descendants.add(c); queue.push(c); }
      }
    }
    const all = new Set([...ancestors, ...descendants]);
    if (all.size > 500) {
      // 过大：只显示祖先 + 直接子节点
      const limited = new Set([...ancestors, target]);
      for (const c of (outAdj[target] || []).slice(0, 30)) limited.add(c);
      const tip = document.createElement("div");
      tip.style.cssText = "color:#e74c3c;font-size:12px;margin-top:4px;";
      tip.textContent = "\u8be5\u8282\u70b9\u5173\u8054\u8282\u70b9\u8fc7\u591a\uff08" + all.size + " \u4e2a\uff09\uff0c\u4ec5\u663e\u793a\u7956\u5148 + \u76f4\u63a5\u5b50\u8282\u70b9";
      const box = document.getElementById(containerId);
      if (box) { box.parentNode.insertBefore(tip, box.nextSibling); setTimeout(() => tip.remove(), 4000); }
      visibleNodes = Array.from(limited);
    } else {
      visibleNodes = Array.from(all);
    }
    focusHighlight = new Set([target]);
    selectedId = target;
    renderD3();
  }

  // 类型统计
  const typeCount = {};
  for (const n of allNodes) {
    const t = (facts[n] || {}).type || "?";
    typeCount[t] = (typeCount[t] || 0) + 1;
  }
  const typeSummary = Object.entries(typeCount)
    .map(([t, c]) => t + ":" + c).join(", ");

  const html = '<details style="margin-bottom:12px" open>'
    + '<summary style="cursor:pointer;color:#00a8ff;font-size:14px;font-weight:600;">'
    + 'Fact \u4f9d\u8d56\u56fe\uff08' + allNodes.length + ' \u8282\u70b9 / ' + edges.length + ' \u8fb9 / ' + intents.length + ' intent\uff09'
    + ' \u2014 ' + esc(typeSummary) + '</summary>'
    + '<div style="margin:6px 0;">'
    + '<input type="text" id="factSearch-' + taskRunId + '" placeholder="\u641c\u7d22 session_id \u6216 fact_id" style="font-size:13px;padding:2px 6px;width:240px;margin-right:4px;" />'
    + '<button type="button" id="factSearchBtn-' + taskRunId + '" style="font-size:13px;padding:2px 8px;cursor:pointer;">\u5b9a\u4f4d</button>'
    + ' <span style="color:#888;font-size:12px;">\u9ed8\u8ba4\u663e\u793a\u6700\u65b02\u5c42\uff0c\u53cc\u51fb\u8282\u70b9\u5c55\u5f00\u7956\u5148+\u4e0b\u7ea7\uff0c\u53f6\u5b50\u8282\u70b9\u865a\u7ebf\u6846</span></div>'
    + '<div style="margin-top:8px;height:calc(100vh - 220px);overflow:hidden" id="' + containerId + '"></div>'
    + '</details>';

  _pendingSankeyClick.push(function() {
    const inp = document.getElementById("factSearch-" + taskRunId);
    const sbtn = document.getElementById("factSearchBtn-" + taskRunId);
    if (inp) inp.addEventListener("keydown", function(ev) { if (ev.key === "Enter") search(inp.value); });
    if (sbtn) sbtn.onclick = function() { if (inp) search(inp.value); };
    renderD3();
  });

  return html;
}

// ── session 调用树（jstree 渲染）──
let _jstreeSeq = 0;
const _pendingJstreeInits = [];
// fact 依赖图点击委托（渲染后统一绑定）
const _pendingSankeyClick = [];

function renderSessionTree(sessions, factDeps) {
  // 构建 sid -> session map 和 parent -> children map
  const smap = {};
  const childrenMap = {};
  for (const s of sessions) {
    smap[s.session_id] = s;
    const pid = s.parent_id || "";
    if (pid) {
      if (!childrenMap[pid]) childrenMap[pid] = [];
      childrenMap[pid].push(s);
    }
  }

  // 根节点：无 parent 的 session
  const roots = sessions.filter(s => !s.parent_id);
  const treeRoots = roots.filter(r => r.session_id in childrenMap);
  let isolated = roots.filter(r => !(r.session_id in childrenMap));

  // 剔除已在 fact 依赖图中的孤立节点——fact 图已表达它们的协作关系，
  // 只在孤立节点列表重复展示会造成信息冗余。fact 图中的 session =
  // intents[].session_id（intent 是 session 的执行载体）。
  if (factDeps && factDeps.intents && factDeps.intents.length) {
    const factSids = new Set();
    for (const it of factDeps.intents) {
      if (it.session_id) factSids.add(it.session_id);
    }
    isolated = isolated.filter(r => !factSids.has(r.session_id));
  }

  // 调用树只在有真实层级时显示：存在深度 ≥ 3 的树（根→子→孙）。
  // argo 等平级协作平台 parent_id 只是"根 session + 子 agent 文件"的
  // 扁平目录关系（全深度 2），不构成调用链，渲染调用树无信息量。
  let hasRealTree = false;
  if (treeRoots.length > 0) {
    for (const r of treeRoots) {
      let maxDepth = 1;
      const q = [r.session_id];
      const depthMap = { [r.session_id]: 1 };
      while (q.length) {
        const cur = q.shift();
        const dep = depthMap[cur] || 1;
        for (const kid of (childrenMap[cur] || [])) {
          depthMap[kid.session_id] = dep + 1;
          maxDepth = Math.max(maxDepth, dep + 1);
          q.push(kid.session_id);
        }
      }
      if (maxDepth >= 3) { hasRealTree = true; break; }
    }
  }

  let html = `<div style="margin-bottom:8px;color:#888;font-size:14px;">`
    + `孤立节点: ${isolated.length}`
    + (hasRealTree ? `, 调用树: ${treeRoots.length} 棵` : "")
    + `</div>`;

  // 用 jstree 渲染有真实层级（深度 ≥ 3）的树
  if (hasRealTree) {
    _jstreeSeq++;
    const containerId = `jstree-${_jstreeSeq}`;
    html += `<details style="margin-bottom:12px" open>`;
    html += `<summary style="cursor:pointer;color:#6c5ce7;font-size:14px;">调用树（${treeRoots.length} 棵）</summary>`;

    // 构建 jstree 节点数据（多棵树各自 parent: "#"）
    const treeNodes = [];

    // 遍历所有 session 构建 jstree 节点
    const visited = new Set();
    function buildNode(sid, parentId) {
      if (visited.has(sid)) return;
      visited.add(sid);
      const s = smap[sid];
      if (!s) return;

      const agent = esc(s.agent || s.session_type || "?");
      const phase = s.phase ? ` [${esc(s.phase)}]` : "";
      const status = s.status ? ` <span style="color:#aaa;font-size:12px">(${esc(s.status)})</span>` : "";
      const text = `<span style="color:#6c5ce7;font-weight:600">${agent}</span>`
        + `<span style="color:#6c5ce7">${phase}</span>`
        + `${status} `
        + `<span style="color:#999;font-size:12px">${esc(sid)}</span>`;

      const hasKids = (childrenMap[sid] || []).length > 0;
      treeNodes.push({
        id: sid,
        parent: parentId,
        text: text,
        state: { opened: true },
        icon: hasKids ? "jstree-folder" : "jstree-file",
      });

      const kids = childrenMap[sid] || [];
      for (const kid of kids) {
        buildNode(kid.session_id, sid);
      }
    }

    for (const root of treeRoots) {
      buildNode(root.session_id, "#");
    }

    html += `<div id="${containerId}" style="margin-top:8px;"></div>`;
    html += `</details>`;

    // 注册 jstree 初始化（在 innerHTML 设置后执行）
    _pendingJstreeInits.push(function() {
      const $c = $("#" + containerId);
      if ($c.length && typeof $.fn.jstree === "function") {
        $c.jstree({
          core: { data: treeNodes, themes: { name: "default", dots: true, icons: true } },
          plugins: ["themes"],
        });
      }
    });
  }

  // 孤立节点按 agent 分组（可收起）
  if (isolated.length > 0) {
    const byAgent = {};
    for (const s of isolated) {
      const a = s.agent || "(none)";
      if (!byAgent[a]) byAgent[a] = [];
      byAgent[a].push(s);
    }
    html += `<details style="margin-bottom:12px">`;
    html += `<summary style="cursor:pointer;color:#888;font-size:14px;">孤立节点（${isolated.length}）— 按 agent 分组</summary>`;
    for (const [agent, sess] of Object.entries(byAgent).sort((a,b) => b[1].length - a[1].length)) {
      html += `<div style="margin:8px 0 4px;color:#6c5ce7;font-size:14px;">${esc(agent)} (${sess.length})</div>`;
      html += `<div style="font-family:monospace;font-size:13px;line-height:1.6;color:#888;white-space:pre-wrap;">`;
      for (const s of sess) {
        const phase = s.phase ? ` <span style="color:#6c5ce7">[${esc(s.phase)}]</span>` : "";
        html += `${esc(s.session_id)}${phase}\n`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  return html;
}

// 在 innerHTML 设置后调用，初始化所有待渲染的 jstree 容器
function flushJstreeInits() {
  while (_pendingJstreeInits.length) {
    const fn = _pendingJstreeInits.shift();
    try { fn(); } catch(e) { console.error("jstree init error:", e); }
  }
  // fact 依赖图点击委托（重绘后容器重建，需在每次渲染后重新绑定）
  while (_pendingSankeyClick.length) {
    const fn = _pendingSankeyClick.shift();
    try { fn(); } catch(e) { console.error("sankey click init error:", e); }
  }
}

// ── case_matching 渲染器（仅误报 FP + 漏报 FN case）──
RENDERERS.case_matching = function(el, data) {
  let html = "";

  // 统计：FP（误报）+ FN（漏报）
  // TP（真阳性）和 TN（真阴性）不需要根因分析/问题单，不在 case_matching 中展示
  const total = data.total_cases || 0;
  const matched = data.matched || 0;
  const unmatched = data.unmatched || 0;
  const outcomes = data.outcomes || {};
  const fp = outcomes.FP || 0;
  const fn = outcomes.FN || 0;

  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${total}</div><div class="label">case 总数 (${data.eval_mode || ""})</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${matched}</div><div class="label">已匹配</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${unmatched}</div><div class="label">未匹配</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${fp}</div><div class="label">误报 (FP)</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e67e22">${fn}</div><div class="label">漏报 (FN)</div></div>`;
  html += `</div>`;

  const matches = data.matches || [];
  if (!matches.length) {
    html += '<div class="empty">无匹配数据</div>';
    el.innerHTML = html;
    return;
  }

  html += `<table><thead><tr>`;
  html += `<th>基线编号</th><th>告警中心编号</th><th>漏洞标题</th>`;
  html += `<th>判定</th><th>验证判定</th><th>匹配方式</th><th>挖掘 agent session</th><th>验证 agent session</th><th>匹配细节</th>`;
  html += `</tr></thead><tbody>`;

  for (const m of matches) {
    const outcome = m.outcome || "?";
    const outcomeColor = {
      "FP": "#e74c3c", "FN": "#e67e22",
    }[outcome] || "#888";
    const outcomeLabel = {
      "FP": "误报", "FN": "漏报",
    }[outcome] || outcome;

    const method = m.match_method || "unmatched";
    const methodColor = method === "unmatched" ? "#e74c3c" : "#27ae60";
    const methodLabel = {
      "matched": "已匹配",
      "unmatched": "未匹配",
    }[method] || method;

    const miningSids = (m.mining_sessions || []).join(", ");
    const verifySids = (m.verify_sessions || []).join(", ");
    const detail = m.match_detail || '';

    // 验证 agent 判定（挖掘 CONFIRMED + 验证否定 → FN，根因在验证链）
    const verifyVerdict = m.verify_verdict || "";
    const vvLabel = verifyVerdict === "CONFIRMED" ? "确认" :
                    verifyVerdict === "FALSE_POSITIVE" ? "否定" : verifyVerdict || "—";
    const vvColor = verifyVerdict === "CONFIRMED" ? "#27ae60" :
                    verifyVerdict === "FALSE_POSITIVE" ? "#e74c3c" : "#999";

    html += `<tr>`;
    html += `<td style="font-family:monospace;font-size:12px">${esc(m.case_id || "")}</td>`;
    html += `<td style="font-family:monospace;font-size:12px">${m.ac_case_id ? esc(m.ac_case_id) : '<span style="color:#999">—</span>'}</td>`;
    html += `<td>${esc(m.vuln_title || "")}</td>`;
    html += `<td><span class="badge" style="background:${outcomeColor};color:#fff">${esc(outcomeLabel)}</span></td>`;
    html += `<td><span class="badge" style="background:${vvColor};color:#fff">${esc(vvLabel)}</span></td>`;
    html += `<td><span class="badge" style="background:${methodColor};color:#fff">${esc(methodLabel)}</span></td>`;
    html += `<td style="font-family:monospace;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(miningSids)}">${miningSids ? esc(miningSids) : '<span style="color:#999">—</span>'}</td>`;
    html += `<td style="font-family:monospace;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(verifySids)}">${verifySids ? esc(verifySids) : '<span style="color:#999">—</span>'}</td>`;
    html += `<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(detail)}">${detail ? esc(detail) : '<span style="color:#999">—</span>'}</td>`;
    html += `</tr>`;
  }
  html += `</tbody></table>`;

  el.innerHTML = html;
};

// ── root_cause 渲染器 ──
RENDERERS.root_cause = function(el, data) {
  let html = "";

  const total = data.total_fp || 0;
  const analyzed = data.analyzed || 0;
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${total}</div><div class="label">误报 case 数</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#27ae60">${analyzed}</div><div class="label">已分析</div></div>`;
  html += `</div>`;

  // FN 漏报原因分析数据已拆分到下面的问题单分析（results）里——
  // 每个漏报 case 是 results 中的一个条目（fn_miss 字段含漏报原因），
  // 不再独立成子段，与误报风险风格统一。

  const results = data.results || [];
  if (!results.length) {
    html += '<div class="empty">无根因分析数据</div>';
    el.innerHTML = html;
    return;
  }

  // L0-L7 断点统计
  const bpCounts = {};
  const causeCounts = {};
  for (const r of results) {
    for (const chainType of ["mining", "verification"]) {
      const bps = (r[chainType] || {}).l0_l7_breakpoints || [];
      for (const bp of bps) {
        const lvl = bp.breakpoint || "null";
        const code = bp.cause_code || "null";
        if (lvl !== "null") bpCounts[lvl] = (bpCounts[lvl] || 0) + 1;
        if (code !== "null") causeCounts[code] = (causeCounts[code] || 0) + 1;
      }
    }
  }
  if (Object.keys(bpCounts).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">L0-L7 断点分布：</div>`;
    html += `<div class="stats">`;
    const bpLabels = {
      "L2": "L2 发起访问", "L3": "L3 查询准确", "L4": "L4 知识存在",
      "L5": "L5 成功取回", "L6": "L6 被使用", "L7": "L7 影响结论",
    };
    for (const [lvl, cnt] of Object.entries(bpCounts).sort()) {
      html += `<div class="stat"><div class="num" style="color:#e74c3c">${cnt}</div><div class="label">${bpLabels[lvl] || lvl}</div></div>`;
    }
    html += `</div>`;
  }
  if (Object.keys(causeCounts).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">成因分布：</div>`;
    html += `<div class="stats">`;
    const causeLabels = {
      "A": "A 该查没查", "B": "B 查询太泛", "C": "C 查了没得",
      "D": "D 链路问题", "E": "E 查到没用", "F": "F 用了没推动", "G": "G 导致误判",
    };
    for (const [code, cnt] of Object.entries(causeCounts).sort()) {
      html += `<div class="stat"><div class="num" style="color:#f39c12">${cnt}</div><div class="label">${causeLabels[code] || code}</div></div>`;
    }
    html += `</div>`;
  }

  const catLabels = {
    "knowledge_gap": "该查没查",
    "query_inaccurate": "查询不准",
    "knowledge_error": "知识错误",
    "reasoning_flaw": "推理缺陷",
    "verification_dimension_missing": "验证维度遗漏",
    "verification_insufficient": "验证不足",
    "no_session": "无 session",
    "llm_error": "LLM 错误",
    "unknown": "未知",
  };
  const catColor = {
    "knowledge_gap": "#f39c12",
    "query_inaccurate": "#f39c12",
    "knowledge_error": "#e74c3c",
    "reasoning_flaw": "#e74c3c",
    "verification_dimension_missing": "#e67e22",
    "verification_insufficient": "#9b59b6",
    "no_session": "#999",
    "llm_error": "#999",
    "unknown": "#999",
  };

  // 逐 case 展示
  for (const r of results) {
    const mining = r.mining || {};
    const verification = r.verification || {};
    const outcome = r.outcome || "";

    const fpReason = r.human_confirmation_summary || "";
    // 漏报 case：summary 加漏报类型 badge + 漏报原因短标记（与误报原因同位置）
    const fnMissData = r.fn_miss || {};
    const fnCat = fnMissData.miss_category || "";
    const fnCatLabel = {
      "sink_not_found": "挖掘方向问题",
      "sink_found_no_report": "识别能力问题",
    }[fnCat] || "";
    const fnCatColor = fnCat === "sink_not_found" ? "#e74c3c" : "#f39c12";
    const fnMissReason = fnMissData.miss_reason || "";
    const fnMissReasonShort = fnMissReason.length > 50 ? fnMissReason.substring(0, 50) + "..." : fnMissReason;

    html += `<details style="margin:16px 0 8px;">`;
    html += `<summary style="cursor:pointer;color:#6c5ce7;font-size:16px;font-weight:600;">`
      + `${esc(r.case_id)} — ${esc(r.vuln_title)}`
      + (outcome === "FN" ? ` <span class="badge" style="background:#e67e22;color:#fff">漏报</span>` : "")
      + (fnCatLabel ? ` <span class="badge" style="background:${fnCatColor};color:#fff">${esc(fnCatLabel)}</span>` : "")
      + (fpReason ? ` <span style="color:#e74c3c;font-size:14px;">—— ${esc(fpReason)}</span>` : "")
      + (fnMissReasonShort && outcome === "FN" ? ` <span style="color:#e67e22;font-size:14px;">—— ${esc(fnMissReasonShort)}</span>` : "")
      + `</summary>`;

    // 挖掘链
    html += _renderChain(mining, "挖掘", "#6c5ce7", catLabels, catColor);

    // 验证链
    html += _renderChain(verification, "验证", "#9b59b6", catLabels, catColor);

    // ── FN 漏报原因分析（拆分到问题单分析里）──
    // 漏报 case 的 fn_miss 字段含漏报原因（sink 精确命中分析 + 细分漏报成因）
    if (fnCatLabel) {
      const md = fnMissData.miss_detail || {};
      const subLabel = md.miss_sub_category_label || "";
      const subColor = {
        "chain_break": "#6c5ce7",
        "knowledge_mislead": "#e74c3c",
        "hallucination": "#e74c3c",
      }[md.miss_sub_category] || "#f39c12";

      // LLM 提取的 sink 信息摘要
      const si = fnMissData.sink_info || {};
      const sinkFiles = (si.sink_files || []).filter(Boolean);
      const sinkFuncs = (si.sink_functions || []).filter(Boolean);
      const sinkLines = (si.sink_lines || []).filter(Boolean);
      const sinkConf = (si.confidence ?? 0) * 100;
      let sinkSummary = "";
      if (sinkFiles.length || sinkFuncs.length || sinkLines.length) {
        const parts = [];
        if (sinkFiles.length) parts.push(`文件: ${sinkFiles.map(f => f.length > 40 ? f.substring(f.lastIndexOf('/')+1) : f).join(", ")}`);
        if (sinkFuncs.length) parts.push(`函数: ${sinkFuncs.join(", ")}`);
        if (sinkLines.length) parts.push(`行号: ${sinkLines.join(", ")}`);
        sinkSummary = parts.join(" | ") + ` (${sinkConf.toFixed(0)}%)`;
      }

      html += `<div style="margin:12px 0;padding:12px;background:#f8f8fa;border-radius:6px;border-left:3px solid #e67e22">`;
      html += `<div style="color:#e67e22;font-weight:600;font-size:15px;margin-bottom:8px;">`
        + `漏报原因分析 <span class="badge" style="background:${fnCatColor};color:#fff">${esc(fnCatLabel)}</span>`
        + (subLabel ? ` <span class="badge" style="background:${subColor};color:#fff">${esc(subLabel)}</span>` : "")
        + `</div>`;

      // 漏报原因（红色块，对齐根因风格）
      html += `<details style="margin:8px 0;padding:8px;background:#fff0f0;border-radius:4px;">`;
      html += `<summary style="color:#e74c3c;font-weight:600;font-size:14px;cursor:pointer;">漏报原因</summary>`;
      html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;">${esc(fnMissData.miss_reason || "—")}</div>`;
      html += `</details>`;

      // 细分漏报成因
      if (subLabel) {
        html += `<details style="margin:8px 0;padding:8px;background:#f0f0ff;border-radius:4px;">`;
        html += `<summary style="color:#6c5ce7;font-weight:600;font-size:14px;cursor:pointer;">细分成因 — ${esc(subLabel)}</summary>`;
        html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;">${esc(md.reason || "—")}</div>`;
        if (md.evidence) {
          html += `<div style="color:#888;font-size:13px;line-height:1.6;margin-top:4px;"><b>证据:</b> ${esc(md.evidence)}</div>`;
        }
        if (md.confidence) {
          html += `<div style="color:#888;font-size:13px;margin-top:4px;"><b>置信度:</b> ${(md.confidence * 100).toFixed(0)}%</div>`;
        }
        html += `</details>`;
      }

      // LLM 提取的 sink 信息
      if (sinkSummary) {
        html += `<details style="margin:8px 0;padding:8px;background:#f0fff0;border-radius:4px;">`;
        html += `<summary style="color:#27ae60;font-weight:600;font-size:14px;cursor:pointer;">LLM 提取 sink 点</summary>`;
        html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;">${esc(sinkSummary)}</div>`;
        if (si.sink_description) {
          html += `<div style="color:#888;font-size:13px;line-height:1.6;margin-top:4px;">${esc(si.sink_description)}</div>`;
        }
        html += `</details>`;
      }

      // 命中 event 上下文
      const hitEvents = fnMissData.hit_events || [];
      if (hitEvents.length > 0) {
        html += `<details style="margin:8px 0;">`;
        html += `<summary style="color:#f39c12;font-weight:600;font-size:14px;cursor:pointer;">命中 event 上下文 (${hitEvents.length})</summary>`;
        html += `<table style="margin-top:6px;"><thead><tr><th>agent</th><th>session</th><th>event_type</th><th>tool</th><th>命中字段</th><th>匹配精度</th><th>命中函数</th><th>命中行号</th><th>input 预览</th><th>output 预览</th></tr></thead><tbody>`;
        for (const ev of hitEvents) {
          const inputPreview = esc(ev.input_preview || "").substring(0, 100);
          const outputPreview = esc(ev.output_preview || "").substring(0, 100);
          const precision = ev.match_precision || "";
          const precisionColor = precision === "precise" ? "#27ae60" : "#f39c12";
          const matchedFuncs = (ev.matched_functions || []).join(", ");
          const matchedLines = (ev.matched_lines || []).join(", ");
          html += `<tr>`;
          html += `<td style="font-family:monospace;font-size:12px">${esc(ev.agent_type || "")}</td>`;
          html += `<td style="font-family:monospace;font-size:12px">${esc(ev.session_id || "")}</td>`;
          html += `<td style="font-size:12px">${esc(ev.event_type || "")}</td>`;
          html += `<td style="font-family:monospace;font-size:12px">${esc(ev.tool_name || "")}</td>`;
          html += `<td style="font-size:12px">${esc(ev.matched_field || "")}</td>`;
          html += `<td><span class="badge" style="background:${precisionColor};color:#fff">${precision === "precise" ? "精确" : "文件级"}</span></td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(matchedFuncs)}">${esc(matchedFuncs) || '—'}</td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(matchedLines)}">${esc(matchedLines) || '—'}</td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(ev.input_preview || '')}">${inputPreview}</td>`;
          html += `<td style="font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(ev.output_preview || '')}">${outputPreview}</td>`;
          html += `</tr>`;
        }
        html += `</tbody></table>`;
        html += `</details>`;
      }

      html += `</div>`;
    }

    html += `</details>`;
  }

  el.innerHTML = html;
};

// 渲染修复建议（fix_suggestion 可能是 dict、list[dict] 或 string）
// dict 字段: target（修复方）、location（位置）、action（修改）、expected_effect（预期效果）
function _renderFixSuggestion(fs) {
  if (!fs) return '<span style="color:#999">—</span>';
  // 字符串直接返回
  if (typeof fs === "string") {
    return `<div style="color:#555;font-size:14px;line-height:1.6;">${esc(fs)}</div>`;
  }
  // 单个 dict
  if (!Array.isArray(fs)) fs = [fs];
  if (!fs.length) return '<span style="color:#999">—</span>';
  let out = "";
  for (let i = 0; i < fs.length; i++) {
    const item = fs[i];
    if (typeof item === "string") {
      out += `<div style="color:#555;font-size:14px;line-height:1.6;margin-bottom:6px;">${esc(item)}</div>`;
      continue;
    }
    if (!item || typeof item !== "object") continue;
    const parts = [];
    if (item.target) parts.push(`<b>修复方:</b> ${esc(item.target)}`);
    if (item.location) parts.push(`<b>位置:</b> ${esc(item.location)}`);
    if (item.action) parts.push(`<b>修改:</b> ${esc(item.action)}`);
    if (item.expected_effect) parts.push(`<b>预期:</b> ${esc(item.expected_effect)}`);
    out += `<div style="color:#555;font-size:14px;line-height:1.6;margin-bottom:6px;padding:6px;background:#fff;border-radius:3px;">`
      + (parts.length ? parts.join(" · ") : JSON.stringify(item))
      + `</div>`;
  }
  return out || '<span style="color:#999">—</span>';
}

function _renderChain(chainData, label, color, catLabels, catColor) {
  let html = "";
  const chain = chainData.session_chain || [];
  const cat = chainData.root_cause?.category || "unknown";
  const cc = catColor[cat] || "#888";

  html += `<div style="margin:12px 0;padding:12px;background:#f8f8fa;border-radius:6px;border-left:3px solid ${color}">`;
  html += `<div style="color:${color};font-weight:600;font-size:15px;margin-bottom:8px;">`
    + `${label}链 (${chain.length} 会话) `
    + `<span class="badge" style="background:${cc};color:#fff">${esc(catLabels[cat] || cat)}</span>`
    + `</div>`;

  // session 链
  if (chain.length > 0) {
    html += `<div style="margin:4px 0;color:#888;font-size:13px;font-family:monospace;">`
      + chain.join(" → ")
      + `</div>`;
  }

  // 根因
  html += `<details style="margin:8px 0;padding:8px;background:#fff0f0;border-radius:4px;">`;
  html += `<summary style="color:#e74c3c;font-weight:600;font-size:14px;cursor:pointer;">根因</summary>`;
  html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;">${esc(chainData.root_cause?.description || "—")}</div>`;
  html += `</details>`;

  // 修复建议
  if (chainData.fix_suggestion) {
    html += `<details style="margin:8px 0;padding:8px;background:#f0fff0;border-radius:4px;">`;
    html += `<summary style="color:#27ae60;font-weight:600;font-size:14px;cursor:pointer;">修复建议</summary>`;
    html += `<div style="margin-top:4px;">${_renderFixSuggestion(chainData.fix_suggestion)}</div>`;
    html += `</details>`;
  }

  // L0-L7 断点
  const bps = chainData.l0_l7_breakpoints || [];
  if (bps.length > 0) {
    html += `<details style="margin:8px 0;">`;
    html += `<summary style="color:#f39c12;font-weight:600;font-size:14px;cursor:pointer;">L0-L7 断点 (${bps.length})</summary>`;
    html += `<table style="margin-top:6px;"><thead><tr><th>会话</th><th>断点</th><th>成因</th><th>L1</th><th>L2</th><th>L3</th><th>L4</th><th>L5</th><th>L6</th><th>L7</th><th>查询内容</th><th>返回内容</th></tr></thead><tbody>`;
    for (const bp of bps) {
      const lvl = bp.breakpoint || "—";
      const code = bp.cause_code || "—";
      const bpColor = code !== "—" ? "#e74c3c" : "#888";
      html += `<tr>`;
      html += `<td style="font-family:monospace;font-size:12px">${esc(bp.session_id || "")}</td>`;
      html += `<td style="color:${bpColor};font-weight:bold">${esc(lvl)}</td>`;
      html += `<td style="color:${bpColor};font-weight:bold">${esc(code)}</td>`;
      html += `<td>${bp.l1_need === true ? "✓" : bp.l1_need === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l2_initiated === true ? "✓" : bp.l2_initiated === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l3_accurate === true ? "✓" : bp.l3_accurate === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l4_exists === true ? "✓" : bp.l4_exists === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l5_retrieved === true ? "✓" : bp.l5_retrieved === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l6_used === true ? "✓" : bp.l6_used === false ? "✗" : "—"}</td>`;
      html += `<td>${bp.l7_influenced === "positive" ? "正向" : bp.l7_influenced === "negative" ? "负向" : "—"}</td>`;
      html += `<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(bp.query_content || "")}">${esc(bp.query_content || "—")}</td>`;
      html += `<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(bp.returned_content || "")}">${esc(bp.returned_content || "—")}</td>`;
      html += `</tr>`;
    }
    html += `</tbody></table>`;
    html += `</details>`;
  }

  // L4 独立验证（知识库主动验证）
  const l4v = chainData.l4_independent_verification;
  if (l4v) {
    const l4Exists = l4v.l4_knowledge_exists;
    const l4Label = l4Exists === true ? "知识存在" :
                    l4Exists === false ? "知识不存在" : "无法判定";
    const l4Color = l4Exists === true ? "#27ae60" :
                    l4Exists === false ? "#e74c3c" : "#999";
    const kbSearched = l4v.kb_searched || {};
    const sources = [];
    if (kbSearched.athena_api) sources.push("知识库API");
    if (kbSearched.wiki_nfs) sources.push("记忆Wiki");

    html += `<details style="margin:8px 0;padding:8px;background:#f0f0ff;border-radius:4px;border-left:3px solid #4a90d9;">`;
    html += `<summary style="color:#4a90d9;font-weight:600;font-size:14px;cursor:pointer;">L4 独立验证 — 评测引擎主动搜索知识库</summary>`;
    html += `<div style="margin-top:6px;margin-bottom:6px;">`;
    html += `<span style="font-size:13px;color:#888;">验证结果：</span>`;
    html += `<span class="badge" style="background:${l4Color};color:#fff;">${l4Label}</span>`;
    html += `<span style="font-size:13px;color:#888;margin-left:12px;">搜索来源：${sources.join(" + ") || "—"}</span>`;
    html += `<span style="font-size:13px;color:#888;margin-left:12px;">候选文件：${l4v.candidate_files || 0}</span>`;
    html += `</div>`;
    if (l4v.summary) {
      html += `<div style="color:#555;font-size:13px;line-height:1.6;margin-bottom:6px;">${esc(l4v.summary)}</div>`;
    }
    const matched = l4v.matched_files || [];
    if (matched.length > 0) {
      html += `<table><thead><tr><th>文件路径</th><th>标题</th><th>相关度</th><th>原因</th></tr></thead><tbody>`;
      for (const mf of matched) {
        const rel = mf.relevance || "—";
        const relColor = rel === "high" ? "#27ae60" : rel === "medium" ? "#f39c12" : "#888";
        html += `<tr>`;
        html += `<td style="font-family:monospace;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(mf.path || "")}">${esc(mf.path || "")}</td>`;
        html += `<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(mf.title || "")}</td>`;
        html += `<td><span class="badge" style="background:${relColor};color:#fff;">${esc(rel)}</span></td>`;
        html += `<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(mf.reason || "")}">${esc(mf.reason || "—")}</td>`;
        html += `</tr>`;
      }
      html += `</tbody></table>`;
    }
    // 查询过程透明化——展示评测引擎去知识库问了什么
    const queryLog = l4v.query_log || [];
    if (queryLog.length > 0) {
      html += `<details style="margin:8px 0;">`;
      html += `<summary style="color:#888;font-weight:600;font-size:13px;cursor:pointer;">查询过程 (${queryLog.length} 步)</summary>`;
      html += `<table style="margin-top:6px;"><thead><tr><th>步骤</th><th>动作</th><th>详情</th><th>结果</th><th>命中数</th></tr></thead><tbody>`;
      for (const q of queryLog) {
        const stepColor = q.count > 0 ? "#27ae60" : "#888";
        html += `<tr>`;
        html += `<td style="font-size:12px;font-weight:600;color:#4a90d9;">${esc(q.step || "")}</td>`;
        html += `<td style="font-size:12px;max-width:250px;word-break:break-all;">${esc(q.action || "")}</td>`;
        html += `<td style="font-size:11px;max-width:300px;word-break:break-all;color:#888;">${esc(q.detail || "")}</td>`;
        html += `<td style="font-size:12px;max-width:250px;word-break:break-all;">${esc(q.result || "")}</td>`;
        html += `<td style="font-size:13px;font-weight:bold;color:${stepColor};">${q.count || 0}</td>`;
        html += `</tr>`;
      }
      html += `</tbody></table>`;
      html += `</details>`;
    }
    if (l4v.error) {
      html += `<div style="color:#e74c3c;font-size:12px;margin-top:4px;">错误: ${esc(l4v.error)}</div>`;
    }
    html += `</details>`;
  }

  // 各 session 独立压缩结果
  const summaries = chainData.compressed_summaries || [];
  if (summaries.length > 0) {
    html += `<details style="margin:8px 0;">`;
    html += `<summary style="color:${color};font-weight:600;font-size:14px;cursor:pointer;">各 Session 独立压缩 (${summaries.length})</summary>`;
    for (const s of summaries) {
      html += `<div style="margin:6px 0;padding:8px;background:#f0f0f5;border-radius:4px;border-left:2px solid ${color}40;">`;
      html += `<div style="color:${color};font-size:13px;font-weight:600;margin-bottom:4px;font-family:monospace;">${esc(s.session_id || "")}</div>`;
      html += `<pre style="font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#555;">${esc(s.summary || "")}</pre>`;
      if (s.key_findings && s.key_findings.length > 0) {
        html += `<div style="color:#6c5ce7;font-size:12px;margin-top:4px;">关键发现: ${esc(s.key_findings.join(" | "))}</div>`;
      }
      // session 级 L0-L7
      const l0l7 = s.l0_l7 || [];
      if (l0l7.length > 0) {
        html += `<div style="margin-top:4px;color:#888;font-size:12px;">`;
        for (const kp of l0l7) {
          const bp = kp.breakpoint || "—";
          const code = kp.cause_code || "—";
          const bpColor = code !== "—" ? "#e74c3c" : "#888";
          html += `<span style="margin-right:8px;color:${bpColor};">${esc(bp)}/${esc(code)}</span>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</details>`;
  }

  // 合并压缩摘要
  if (chainData.merge_summary) {
    html += `<details style="margin:8px 0;padding:8px;background:#fff8e1;border-radius:4px;border-left:3px solid #f39c12;">`;
    html += `<summary style="color:#f39c12;font-weight:600;font-size:14px;cursor:pointer;">合并压缩摘要</summary>`;
    html += `<pre style="font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#555;margin-top:4px;">${esc(chainData.merge_summary)}</pre>`;
    html += `</details>`;
  }

  html += `</div>`;
  return html;
}

// ── resolving 渲染器（因果链 + 问题单）──
RENDERERS.resolving = function(el, data) {
  let html = "";

  const causalChain = data.causal_chain || {};
  const causeSummary = causalChain.cause_summary || {};
  const effectDist = causalChain.effect_label_distribution || {};
  const perCase = causalChain.per_case_breakpoints || [];

  // 统计
  const totalBp = perCase.reduce((s, c) => s + (c.breakpoints?.length || 0), 0);
  html += `<div class="stats">`;
  html += `<div class="stat"><div class="num">${perCase.length}</div><div class="label">FP case 数</div></div>`;
  html += `<div class="stat"><div class="num" style="color:#e74c3c">${totalBp}</div><div class="label">断点总数</div></div>`;
  html += `</div>`;

  // 成因分布
  const causeLabels = {"A":"A 该查没查","B":"B 查询太泛","C":"C 查了没得","D":"D 链路问题","E":"E 查到没用","F":"F 用了没推动","G":"G 导致误判"};
  if (Object.keys(causeSummary).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">成因分布：</div>`;
    html += `<div class="stats">`;
    for (const [code, cnt] of Object.entries(causeSummary).sort()) {
      html += `<div class="stat"><div class="num" style="color:#f39c12">${cnt}</div><div class="label">${causeLabels[code] || code}</div></div>`;
    }
    html += `</div>`;
  }

  // 效果标签分布
  if (Object.keys(effectDist).length > 0) {
    html += `<div style="margin:8px 0;color:#888;font-size:14px;">效果标签分布：</div>`;
    html += `<div class="stats">`;
    for (const [label, cnt] of Object.entries(effectDist)) {
      html += `<div class="stat"><div class="num">${cnt}</div><div class="label">${label}</div></div>`;
    }
    html += `</div>`;
  }

  // 逐 case 断点展示
  if (perCase.length === 0) {
    html += '<div class="empty">无因果链断点数据</div>';
    el.innerHTML = html;
    return;
  }

  for (const c of perCase) {
    const bps = c.breakpoints || [];
    const hasBp = bps.length > 0;
    const titleColor = hasBp ? "#e74c3c" : "#27ae60";
    html += `<details style="margin:16px 0 8px;">`;
    html += `<summary style="cursor:pointer;color:${titleColor};font-size:16px;font-weight:600;">`;
    html += `${esc(c.case_id || "")} — ${esc(c.vuln_title || "")} (${bps.length} 断点)`;
    html += `</summary>`;
    html += `<div style="margin-top:8px;">`;

    // 根因
    const rc = c.root_cause || {};
    if (Object.keys(rc).length > 0) {
      html += `<details style="margin:8px 0;padding:8px;background:#fff0f0;border-radius:4px;">`;
      html += `<summary style="color:#e74c3c;font-weight:600;font-size:14px;cursor:pointer;">根因</summary>`;
      for (const [cat, desc] of Object.entries(rc)) {
        html += `<div style="color:#555;font-size:14px;line-height:1.6;margin-top:4px;"><b>${esc(cat)}:</b> ${esc(desc)}</div>`;
      }
      html += `</details>`;
    }

    // 修复建议
    if (c.fix_suggestion) {
      html += `<details style="margin:8px 0;padding:8px;background:#f0fff0;border-radius:4px;">`;
      html += `<summary style="color:#27ae60;font-weight:600;font-size:14px;cursor:pointer;">修复建议</summary>`;
      html += `<div style="margin-top:4px;">${_renderFixSuggestion(c.fix_suggestion)}</div>`;
      html += `</details>`;
    }

    // 断点表
    if (bps.length > 0) {
      html += `<table><thead><tr>`;
      html += `<th>Agent</th><th>链类型</th><th>断点级别</th><th>成因</th><th>证据</th>`;
      html += `</tr></thead><tbody>`;
      for (const bp of bps) {
        const code = bp.cause_code || "—";
        const bpColor = code !== "—" ? "#e74c3c" : "#888";
        html += `<tr>`;
        html += `<td>${esc(bp.agent_type || "—")}</td>`;
        html += `<td>${esc(bp.chain_type || "—")}</td>`;
        html += `<td style="color:${bpColor};font-weight:bold;text-align:center">${esc(bp.break_level || "—")}</td>`;
        html += `<td style="color:${bpColor};font-weight:bold;text-align:center">${esc(code)}</td>`;
        html += `<td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(bp.evidence || "")}">${esc(bp.evidence || "—")}</td>`;
        html += `</tr>`;
      }
      html += `</tbody></table>`;
    }

    html += `</div>`;
    html += `</details>`;
  }

  el.innerHTML = html;
};

checkSteps();
</script>
