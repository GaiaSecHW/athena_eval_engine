<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新建评测</title>
<script>
(function(){
  var _p=location.pathname;
  var _ing=(_p==='/eval'||_p.indexOf('/eval/')===0)?'/eval':'';
  var _lib=_ing+'/static/lib/';
  document.write('<link rel="stylesheet" href="'+_lib+'app.css">');
  document.write('<script src="'+_lib+'config.js"><\/script>');
  document.write('<script src="'+_lib+'app.js"><\/script>');
})();
</script>
<style>
.ci{color:var(--sub);font-size:14px;font-family:"SF Mono",Consolas,monospace}
.sel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;max-height:300px;overflow-y:auto}
.st{font-size:16px;color:var(--amber);margin:10px 0;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title" onclick="go('/')">知识效果评测平台</div>
    <nav>
      <button class="ghost nav-item" data-route="home" onclick="go('/')">首页</button>
      <button class="ghost nav-item" data-route="evals" onclick="go('/evals')">评测</button>
      <button class="ghost nav-item" data-route="dts" onclick="go('/dts')">问题单</button>
      <button class="ghost nav-item" data-route="report" onclick="go('/report')">平台任务详情</button>
    </nav>
    <div class="sp"></div>
    <button class="ghost" onclick="go('/create')">+ 新建评测</button>
    <button class="ghost nav-item" id="sys-btn" onclick="go('/system')" style="display:none">系统</button>
    <button class="ghost" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </header>
  <main><div id="view"></div></main>
</div>
<script>
renderNav('/create');

let sel={proj:"",projName:"",task:"",taskName:"",traceReady:false,traceKind:"",traceInfo:"",vbProj:"",vbProjName:"",vbCase:"",vbCaseDesc:"",biid:"",tfid:"",eid:"",bsrc:"vuln_center",vcProj:"",vcProjName:"",vcTask:"",vcTaskName:"",evalMode:"dev"};
let _allVbProjs=[];let _vbCases=null;let _vcCases=null;let _vcKey="";let _vcTasks=null;
let _allProjs=[];let _sideData={tasks:null};

async function renderCreate(){
  sel={proj:"",projName:"",task:"",taskName:"",traceReady:false,traceKind:"",traceInfo:"",vbProj:"",vbProjName:"",vbCase:"",vbCaseDesc:"",biid:"",tfid:"",eid:"",bsrc:"vuln_center",vcProj:"",vcProjName:"",vcTask:"",vcTaskName:"",evalMode:"dev"};
  _sideData={tasks:null};
  _vbCases=null;_vcCases=null;_vcTasks=null;_vcKey="";
  $("view").innerHTML=`<div class="page-body">
    <div class="card" style="margin-bottom:16px">
      <label>评测名称 <span style="color:var(--red)">*</span></label>
      <input id="eval-name" placeholder="输入评测名称" oninput="updateRunBtn()">
      <div style="margin-top:14px">
        <label style="font-weight:600;font-size:14px">评测模式</label>
        <div style="font-size:12px;color:var(--sub);margin:4px 0">开发态=Agent 发布新版本时触发，基线来自预置基线集；运行态=项目测试完成时触发，基线=自身项目任务的人工确认漏洞</div>
        <div style="display:inline-flex;gap:4px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:4px">
          <button id="mode-dev-btn" onclick="switchEvalMode('dev')" style="border:none;cursor:pointer;padding:8px 18px;border-radius:9px;font-size:15px;font-weight:500;font-family:inherit;transition:.15s;background:var(--acc);color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.3)">🔧 开发态</button>
          <button id="mode-runtime-btn" onclick="switchEvalMode('runtime')" style="border:none;cursor:pointer;padding:8px 18px;border-radius:9px;font-size:15px;font-weight:500;font-family:inherit;transition:.15s;background:transparent;color:var(--sub)">🚀 运行态</button>
        </div>
      </div>
    </div>
    <div class="card" id="main-col" style="margin-bottom:16px"></div>
    <div class="card" id="run-conf"></div></div>`;
  if(!_allProjs.length) _allProjs=(await jget("/api/v1/platform/projects")).projects||[];
  renderMainSide();renderRunConf();
}
function switchEvalMode(m){
  sel.evalMode=m;
  var d=$("mode-dev-btn"),r=$("mode-runtime-btn");
  if(m==='dev'){d.style.background='var(--acc)';d.style.color='#fff';d.style.boxShadow='0 1px 3px rgba(37,99,235,.3)';r.style.background='transparent';r.style.color='var(--sub)';r.style.boxShadow='none';}
  else{r.style.background='var(--acc)';r.style.color='#fff';r.style.boxShadow='0 1px 3px rgba(37,99,235,.3)';d.style.background='transparent';d.style.color='var(--sub)';d.style.boxShadow='none';}
  if(m==='runtime'){sel.bsrc='vuln_center';sel.vcProj='';sel.vcProjName='';sel.vcTask='';sel.vcTaskName='';_vcCases=null;_vcTasks=null;}
  renderRunConf();
}
function renderMainSide(){
  const s=sel;
  const p1=s.proj?"var(--acc)":"var(--p2)";const p2=s.task?"var(--acc)":"var(--p2)";
  const steps=`<div style="display:flex;gap:6px;font-size:14px;margin-bottom:12px">
    <span style="padding:2px 8px;border-radius:8px;background:${p1};color:#fff">${s.proj?"✓ ":""}1 项目</span>
    <span style="padding:2px 8px;border-radius:8px;background:${p2};color:#fff">${s.task?"✓ ":""}2 任务</span></div>`;
  let body="";
  if(!s.proj){
    body=`<input id="main-search" placeholder="搜索项目名…" oninput="filterMainList()" style="margin-bottom:10px"><div class="sel" style="max-height:300px" id="main-list"></div>`;
  }else if(!s.task){
    body=`<div style="margin-bottom:8px;font-size:14px">项目：<b>${s.projName}</b> <span class="ci">(${s.proj})</span> <button class="btn g" style="font-size:12px;padding:3px 8px" onclick="sel.proj='';sel.projName='';sel.task='';sel.taskName='';sel.traceReady=false;sel.traceKind='';sel.traceInfo='';_sideData.tasks=null;renderMainSide();renderRunConf()">重选</button></div><input id="main-search" placeholder="搜索任务名…" oninput="filterMainList()" style="margin-bottom:10px"><div class="sel" style="max-height:300px" id="main-list"></div>`;
  }else{
    body=`<div style="margin-bottom:8px;font-size:14px">项目：<b>${s.projName}</b> <span class="ci">(${s.proj})</span> · 任务：<b>${s.taskName}</b> <span class="ci">(${s.task})</span> <button class="btn g" style="font-size:12px;padding:3px 8px" onclick="sel.task='';sel.taskName='';sel.traceReady=false;sel.traceKind='';sel.traceInfo='';renderMainSide();renderRunConf()">重选</button></div><div id="main-trace-info" style="padding:8px 12px;border-radius:8px;background:var(--p2);font-size:13px">${s.traceReady?`<span style="color:var(--green)">✓ ${s.traceInfo}</span>`:`<span style="color:var(--sub)">⏳ 检查 trace…</span>`}</div>`;
  }
  $("main-col").innerHTML=`<h3>选择项目与任务</h3>${steps}${body}`;
  if(!s.proj){filterMainList();}
  else if(!s.task){jget(`/api/v1/platform/tasks?project_id=${s.proj}`).then(d=>{_sideData.tasks=d.tasks||[];filterMainList();});}
  else if(!s.traceReady&&s.traceKind===""){_checkTraceMain();}
}
function filterMainList(){
  const q=$("main-search")?($("main-search").value||"").toLowerCase():"";const s=sel;
  if(!s.proj){
    if(!_allProjs)return;
    const f=_allProjs.filter(p=>(p.name+" "+p.id+" "+(p.department_name||"")+" "+(p.product_path||"")).toLowerCase().includes(q));
    $("main-list").innerHTML=f.map(p=>`<div class="opt" onclick="pickMain('proj','${p.id}','${p.name.replace(/'/g,"")}')"><span class="l" title="${p.name}">${p.name}</span><span class="opt-mid" style="color:var(--sub)" title="${p.department_name||""}">${p.department_name||""}</span><span class="opt-right" style="color:var(--acc)" title="${p.product_path||""}">${p.product_path||""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }else if(!s.task){
    if(!_sideData.tasks)return;
    const f=_sideData.tasks.filter(t=>((t.name||"")+" "+t.id+" "+(t.task_type||"")+" "+(t.test_target||"")+" "+(t.status||"")).toLowerCase().includes(q));
    $("main-list").innerHTML=f.map(t=>{
      var st=t.status||'-';
      var stColor=st==='success'?'var(--green)':(st==='failed'?'var(--red)':(st==='running'?'var(--acc)':'var(--gray)'));
      var stText=st==='success'?'✓ 已完成':st==='failed'?'✗ 失败':st==='running'?'⏳ 运行中':st==='paused'?'⏸ 已暂停':st==='queued'?'排队中':st;
      return `<div class="opt" onclick="pickMain('task','${t.id}','${(t.name||"").replace(/'/g,"")}')"><span class="l" title="${t.name||t.id}">${t.name||t.id}</span>${t.task_type?`<span style="font-size:12px;color:var(--acc)">${t.task_type}</span>`:""}<span style="font-size:12px;color:${stColor};font-weight:600">${stText}</span>${t.test_target?`<span style="font-size:12px;color:var(--sub);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.test_target}">${t.test_target}</span>`:""}</div>`;
    }).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }
}
function pickMain(field,id,name){
  if(field==="proj"){sel.proj=id;sel.projName=name;sel.task="";sel.taskName="";sel.traceReady=false;sel.traceKind="";sel.traceInfo="";_sideData.tasks=null;}
  else if(field==="task"){sel.task=id;sel.taskName=name;sel.traceReady=false;sel.traceKind="";sel.traceInfo="";}
  renderMainSide();renderRunConf();
}
function _checkTraceMain(){
  jget(`/api/v1/platform/tasks/${sel.proj}/${sel.task}/trace-check`).then(d=>{
    if(d.ready){
      const m=d.mining||{};const v=d.verify||[];
      let info=`挖掘工具: <b>${_toolLabel(m.trace_kind)}</b>`;
      if(v.length)info+=` · 验证工具: <b>${v.map(x=>_toolLabel(x.trace_kind)).join('、')}</b>`;
      sel.traceReady=true;sel.traceKind=m.trace_kind;sel.traceInfo=info;
    }else{
      sel.traceReady=false;sel.traceKind="";sel.traceInfo="未发现 trace";
    }
    renderMainSide();renderRunConf();
  }).catch(e=>{
    sel.traceReady=false;sel.traceKind="";sel.traceInfo="检查失败: "+String(e).slice(0,80);
    renderMainSide();renderRunConf();
  });
}

async function renderRunConf(){
  const kgReady=sel.traceReady;
  const ready=kgReady;
  const modeLabel=sel.evalMode==='dev'?'开发态':'运行态';
  let bodyHtml="";let bound=false;
  if(sel.evalMode==='runtime'){
    bound=!!sel.proj&&!!sel.task;
    if(sel.proj&&sel.task){
      bodyHtml=`<div style="padding:12px 14px;border-radius:10px;background:rgba(91,156,246,.08);border:1px solid var(--acc);font-size:14px;line-height:1.7">
        <span style="color:var(--acc);font-weight:600">🔍 运行态基线</span><br>
        <span style="color:var(--sub)">基线来源：漏洞中心（与被评测项目任务相同）</span><br>
        <span style="color:var(--sub)">项目：</span><b>${sel.projName}</b> <span class="ci">(${sel.proj})</span><br>
        <span style="color:var(--sub)">任务：</span><b>${sel.taskName}</b> <span class="ci">(${sel.task})</span>
      </div>`;
    }else{
      bodyHtml=`<div style="padding:12px 14px;border-radius:10px;background:var(--p2);font-size:14px;color:var(--sub)">请先选择项目与任务，基线将自动绑定到该任务的人工确认漏洞</div>`;
    }
    $("run-conf").innerHTML=`<h3>基线数据源</h3>
    <div style="display:none"><input id="eid" value="${genId()}"></div>
    ${bodyHtml}
    <div style="margin-top:12px;font-size:14px;color:var(--sub);line-height:1.7">${ready?'<span style="color:var(--green)">✓ Trace 已就绪</span><br>':(sel.task&&!kgReady?'<span style="color:var(--amber)">⏳ 正在检查 trace…</span><br>':'请选完项目和任务<br>')}${bound?'<span style="color:var(--green)">✓ 基线已绑定（自身项目任务）</span><br>':'<span style="color:var(--amber)">未绑定基线</span><br>'}<span style="color:var(--sub)">评测模式：<b style="color:var(--acc)">${modeLabel}</b></span></div>
    <div class="st" id="run-st"></div>
    <button class="btn" id="run-btn" ${ready&&bound&&$("eval-name")&&$("eval-name").value.trim()?"":"disabled"} onclick="runEval()">${ready&&bound?"开始评测":"请先选完项目和任务"}</button>`;
  }else{
    const isVb=sel.bsrc!=='vuln_center';
    const srcToggle=`<div style="display:inline-flex;gap:4px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px">
      <button onclick="switchBsrc('vbench_zip')" style="border:none;cursor:pointer;padding:9px 20px;border-radius:9px;font-size:15px;font-weight:500;font-family:inherit;transition:.15s;${isVb?'background:var(--acc);color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.3)':'background:transparent;color:var(--sub)'}">📦 测评数据集基线</button>
      <button onclick="switchBsrc('vuln_center')" style="border:none;cursor:pointer;padding:9px 20px;border-radius:9px;font-size:15px;font-weight:500;font-family:inherit;transition:.15s;${!isVb?'background:var(--acc);color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.3)':'background:transparent;color:var(--sub)'}">🔍 漏洞中心数据</button>
    </div>`;
    if(sel.bsrc==='vuln_center'){
      if(!sel.vcProj){
        if(!_allProjs.length)try{_allProjs=(await jget("/api/v1/platform/projects")).projects||[];}catch(e){}
        bodyHtml=`<div style="margin-bottom:8px;font-size:13px;color:var(--sub)">从漏洞中心取基线：先选项目，再选任务，自动拉取该任务的人工确认漏洞</div><input id="vc-search" placeholder="搜索项目名…" oninput="filterVcList()" style="margin-bottom:8px"><div class="sel" id="vc-list" style="max-height:200px"></div>`;
      }else if(!sel.vcTask){
        if(!_vcTasks)try{_vcTasks=(await jget(`/api/v1/platform/tasks?project_id=${sel.vcProj}`)).tasks||[];}catch(e){_vcTasks=[];}
        bodyHtml=`<div style="margin-bottom:8px;font-size:14px">项目：<b>${sel.vcProjName}</b> <span class="ci">(${sel.vcProj})</span> <button class="btn g" style="font-size:12px;padding:3px 8px" onclick="sel.vcProj='';sel.vcProjName='';_vcTasks=null;renderRunConf()">重选</button></div><input id="vc-search" placeholder="搜索任务名…" oninput="filterVcList()" style="margin-bottom:8px"><div class="sel" id="vc-list" style="max-height:200px"></div>`;
      }else{
        const vcKey=sel.vcProj+"|"+sel.vcTask;
        if(_vcCases===null||_vcKey!==vcKey){_vcKey=vcKey;_vcCases=null;try{_vcCases=(await jget(`/api/v1/vbench/vuln-center/${sel.vcProj}/${sel.vcTask}`)).cases||[];}catch(e){_vcCases=[];}}
        const nVuln=_vcCases.length;
        bound=_vcCases.length>0;
        bodyHtml=`<div style="margin-bottom:8px;font-size:14px">项目：<b>${sel.vcProjName}</b> <span class="ci">(${sel.vcProj})</span> · 任务：<b>${sel.vcTaskName}</b> <span class="ci">(${sel.vcTask})</span> <button class="btn g" style="font-size:12px;padding:3px 8px" onclick="sel.vcTask='';sel.vcTaskName='';_vcCases=null;renderRunConf()">重选任务</button></div><div style="font-size:14px">漏洞中心基线 · 确认漏洞 <b style="color:var(--green)">${nVuln}</b> 条 <button class="btn g" style="font-size:12px;padding:3px 8px" onclick="_vcCases=null;renderRunConf()">刷新</button></div>`;
      }
    }else{
      if(!_allVbProjs.length){try{_allVbProjs=(await jget("/api/v1/vbench/projects")).projects||[];}catch(e){}}
      if(!sel.vbProj){
        bodyHtml=`<div style="margin-bottom:10px"><label>V-Bench 基线项目</label><input id="vb-search" placeholder="搜索项目名…" oninput="filterVbList()" style="margin-bottom:8px"><div class="sel" id="vb-list" style="max-height:200px"></div></div>`;
      }else{
        if(!_vbCases){_vbCases=(await jget(`/api/v1/vbench/projects/${sel.vbProj}/benchmark`)).cases||[];}
        const casesHtml=_vbCases.map(c=>{const nfind=c.findings?c.findings.length:0;return `<div style="padding:6px 0;border-bottom:1px solid var(--bd)"><span style="font-weight:600;font-size:13px">${c.vuln_title||c.case_id.slice(0,8)}</span> ${nfind?`<span class="bdg b-COMPLETED" style="font-size:11px">${nfind} finding</span>`:""} <span style="font-size:12px;color:var(--sub)">${c.case_id.slice(0,8)}</span></div>`}).join("");
        bodyHtml=`<div style="margin-bottom:8px;font-size:14px">V-Bench 项目：<b>${sel.vbProjName}</b> · 基线漏洞 <b>${_vbCases.length}</b> 条 <button class="btn g" style="font-size:12px;padding:3px 8px" onclick="sel.vbProj='';sel.vbProjName='';_vbCases=null;renderRunConf()">重选</button></div><div class="sel" style="max-height:150px;margin-bottom:10px">${casesHtml||'<div style="padding:16px;color:var(--sub)">无 case</div>'}</div>`;
      }
      bound=!!sel.vbProj;
    }
    $("run-conf").innerHTML=`<h3>基线数据源</h3>
    <div style="display:none"><input id="eid" value="${genId()}"></div>
    ${srcToggle}
    ${bodyHtml}
    <div style="margin-top:12px;font-size:14px;color:var(--sub);line-height:1.7">${ready?'<span style="color:var(--green)">✓ Trace 已就绪</span><br>':(sel.task&&!kgReady?'<span style="color:var(--amber)">⏳ 正在检查 trace…</span><br>':'请选完项目和任务<br>')}${bound?'<span style="color:var(--green)">✓ 基线已绑定</span><br>':'<span style="color:var(--amber)">未绑定基线 → 无 GT 模式</span><br>'}<span style="color:var(--sub)">评测模式：<b style="color:var(--acc)">${modeLabel}</b></span></div>
    <div class="st" id="run-st"></div>
    <button class="btn" id="run-btn" ${ready&&bound&&$("eval-name")&&$("eval-name").value.trim()?"":"disabled"} onclick="runEval()">${ready&&bound?"开始评测":"请先选完项目和任务"}</button>`;
    if(sel.bsrc==='vuln_center'&&!sel.vcTask){filterVcList();}
    else if(sel.bsrc!=='vuln_center'&&!sel.vbProj){renderVbList();}
  }
}
function switchBsrc(s){sel.bsrc=s;renderRunConf();}
function filterVcList(){
  const list=$("vc-list");if(!list)return;const q=($("vc-search")?($("vc-search").value||"").toLowerCase():"");
  if(!sel.vcProj){
    if(!_allProjs)return;
    const f=_allProjs.filter(p=>(p.name+" "+p.id+" "+(p.department_name||"")+" "+(p.product_path||"")).toLowerCase().includes(q));
    list.innerHTML=f.slice(0,50).map(p=>`<div class="opt" onclick="pickVc('proj','${p.id}','${p.name.replace(/'/g,"")}')"><span class="l" title="${p.name}">${p.name}</span><span class="opt-mid" style="color:var(--sub)" title="${p.department_name||""}">${p.department_name||""}</span><span class="opt-right" style="color:var(--acc)" title="${p.product_path||""}">${p.product_path||""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }else if(!sel.vcTask){
    if(!_vcTasks)return;
    const f=_vcTasks.filter(t=>((t.name||"")+" "+t.id+" "+(t.task_type||"")+" "+(t.test_target||"")).toLowerCase().includes(q));
    list.innerHTML=f.map(t=>`<div class="opt" onclick="pickVc('task','${t.id}','${(t.name||"").replace(/'/g,"")}')"><span class="l" title="${t.name||t.id}">${t.name||t.id}</span><span class="opt-mid" style="color:var(--acc)">${t.task_type||""}</span><span class="opt-right" style="color:var(--sub)" title="${t.test_target||""}">${t.test_target||""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }
}
function pickVc(field,id,name){
  if(field==="proj"){sel.vcProj=id;sel.vcProjName=name;sel.vcTask="";sel.vcTaskName="";_vcTasks=null;_vcCases=null;}
  else if(field==="task"){sel.vcTask=id;sel.vcTaskName=name;_vcCases=null;}
  renderRunConf();
}
function renderVbList(){filterVbList();}
function updateRunBtn(){const btn=$("run-btn");if(!btn)return;const name=$("eval-name")?$("eval-name").value.trim():"";const ready=sel.traceReady;btn.disabled=!(ready&&name);}
function filterVbList(){
  if(!_allVbProjs)return;
  const list=$("vb-list");if(!list)return;
  const q=($("vb-search")?($("vb-search").value||"").toLowerCase():"");
  const f=_allVbProjs.filter(p=>(p.name+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q));
  list.innerHTML=f.slice(0,30).map(p=>`<div class="opt" onclick="pickVbProj('${p.id}','${p.name.replace(/'/g,"")}')"><span class="l" title="${p.name}">${p.name}</span><span class="opt-mid"><span class="bdg b-${p.status==='EXPORTED'?'COMPLETED':'RUNNING'}">${p.status}</span></span><span class="opt-right" style="color:var(--sub)">${p.tags&&p.tags.length?p.tags.join(" · "):""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
}
function pickVbProj(id,name){
  if(sel.vbProj) return;
  sel.vbProj=id;sel.vbProjName=name;_vbCases=null;
  var rc=$("run-conf");
  if(rc) rc.innerHTML='<h3>测评数据集基线</h3><div style="padding:16px;color:var(--sub)">⏳ 加载基线数据…</div>';
  renderRunConf();
}
async function runEval(){
  let eid=$("eid").value.trim()||genId();
  $("eid").value=eid;sel.eid=eid;$("run-st").textContent="⏳ 提交中…";$("run-btn").disabled=true;
  const evalName=$("eval-name")?$("eval-name").value.trim():"";
  var bSetId,vcTaskId,bsrc;
  if(sel.evalMode==='runtime'){
    bsrc='vuln_center';bSetId=sel.proj;vcTaskId=sel.task;
  }else{
    bsrc=sel.bsrc;bSetId=bsrc==='vuln_center'?(sel.vcProj||undefined):(sel.vbProj||undefined);vcTaskId=bsrc==='vuln_center'?(sel.vcTask||undefined):undefined;
  }
  try{const r=await jpost("/api/v1/evaluations",{evaluation_id:eid,evaluation_name:evalName||undefined,kg_project_id:sel.proj,kg_task_id:sel.task,benchmark_source:bsrc,benchmark_set_id:bSetId,vc_source_task_id:vcTaskId,eval_mode:sel.evalMode});
    $("run-st").textContent="✅ 评测已创建，排队中…";
    go('/evals/'+encodeURIComponent(r.evaluation_id));
  }
  catch(e){const msg=String(e);if(msg.includes("1062")||msg.includes("Duplicate")){$("run-st").textContent="⚠ ID 重复，换新 ID 重试…";$("eid").value=genId();$("run-btn").disabled=false;return;}$("run-st").innerHTML='⚠ 失败：'+msg;$("run-btn").disabled=false;}
}

renderCreate();
</script>
</body>
</html>
