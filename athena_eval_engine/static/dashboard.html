<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识测评</title>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--p2:#f0f2f5;--bd:#e1e4e8;--txt:#1a1d23;--sub:#6b7280;--acc:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--gray:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:18px;line-height:1.6;display:flex;height:100vh;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
header{height:64px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0;background:var(--header-bg)}
header .title{font-size:18px;font-weight:600}
header .sub{color:var(--sub);font-size:15px}
header .sp{flex:1}
header button{background:var(--acc);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:500;transition:.15s}
header button:hover{filter:brightness(1.1)}
header button.ghost{background:var(--p2);border:1px solid var(--bd);color:var(--txt)}
main{flex:1;overflow:hidden;padding:28px}
#view{height:100%;display:flex;flex-direction:column}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--sub);text-align:center;gap:16px}
.empty .ic{width:72px;height:72px;border-radius:18px;background:var(--p2);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:32px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty h3{color:var(--txt);font-size:19px}
.empty p{max-width:440px;font-size:16px}
.cols{display:flex;gap:20px;height:100%}
.lst{width:360px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.lst .h{padding:16px 18px;border-bottom:1px solid var(--bd);font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.lst .b{flex:1;overflow-y:auto;padding:8px}
.it{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:background .15s}
.it:hover{background:var(--p2)}
.it.act{background:rgba(91,156,246,.12)}
.it .n{font-size:17px;font-weight:500;margin-bottom:4px}
.it .m{font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center}
.ev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ev-card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.ev-card:hover{border-color:var(--acc);box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-1px)}
.ev-card .ev-name{font-size:16px;font-weight:600;line-height:1.4;word-break:break-all}
.ev-card .ev-meta{font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-card .ev-actions{display:flex;gap:4px;margin-left:auto}
.back-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-shrink:0}
.back-bar .back-btn{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:15px;color:var(--txt);display:flex;align-items:center;gap:6px;transition:.15s}
.back-bar .back-btn:hover{background:var(--bd)}
.bdg{font-size:14px;padding:2px 8px;border-radius:12px;font-weight:600}
.b-COMPLETED{background:rgba(74,222,128,.18);color:var(--green)}
.b-COMPLETEDWITHWARNINGS,.b-COMPLETED_WITH_WARNINGS{background:rgba(251,191,36,.18);color:var(--amber)}
.b-FAILED,.b-CANCEL,.b-CANCELLED,.b-CANCELLING{background:rgba(248,113,113,.18);color:var(--red)}
.b-CREATED{background:rgba(107,114,128,.18);color:var(--gray)}
.b-QUEUED{background:rgba(251,191,36,.18);color:var(--amber)}
.b-RUNNING,.b-VALIDATING,.b-INGESTING,.b-PARSING,.b-AI_MATCHING,.b-RESOLVING,.b-CALCULATING{background:rgba(96,165,250,.18);color:var(--acc)}
.rep{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:22px}
.card.f{grid-column:1/-1}
.card h3{font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.tier{font-size:14px;padding:3px 8px;border-radius:12px;font-weight:600}
.t-p0{background:rgba(91,156,246,.18);color:var(--acc)}
.t-p1{background:rgba(251,191,36,.18);color:var(--amber)}
.t-p2{background:rgba(107,114,128,.18);color:var(--gray)}
table{width:100%;border-collapse:collapse;font-size:17px}
th{color:var(--sub);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px;text-transform:uppercase;letter-spacing:.4px}
td{padding:12px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
td.num{font-family:"SF Mono",Consolas,monospace;color:var(--acc)}
.ci{color:var(--sub);font-size:14px;font-family:"SF Mono",Consolas,monospace}
.na{color:var(--red);font-style:italic;font-size:16px}
.dp{color:var(--green)}.dn{color:var(--red)}
.diag{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:10px;padding:12px 14px;margin:8px 0}
.diag .rid{color:var(--amber);font-weight:600;font-size:14px;font-family:monospace}
.diag .ob{font-weight:500;font-size:17px}.diag .ip{color:var(--sub);font-size:15px;margin-top:4px}
.narr{font-size:17px;line-height:1.8}.narr b{color:var(--sub);font-weight:500}
.note{font-size:14px;color:var(--sub);margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
svg{display:block;margin:0 auto;max-width:100%}
.lg{display:flex;gap:18px;justify-content:center;margin-top:10px}.lg span{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;max-height:300px;overflow-y:auto}
.opt{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;display:grid;grid-template-columns:minmax(0,.85fr) 96px minmax(0,1.15fr);align-items:center;column-gap:12px;font-size:17px}
.opt:hover{background:var(--p2)}
/* 自定义弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:440px;width:90%;overflow:hidden;animation:pop .15s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal .modal-head{padding:20px 24px 12px;display:flex;align-items:center;gap:12px}
.modal .modal-head .modal-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.modal .modal-head h3{font-size:18px;font-weight:600}
.modal .modal-body{padding:4px 24px 16px;font-size:15px;color:var(--sub);line-height:1.7}
.modal .modal-body ul{list-style:none;padding:0;margin:8px 0}
.modal .modal-body li{padding:3px 0;padding-left:18px;position:relative}
.modal .modal-body li:before{content:"•";position:absolute;left:0;color:var(--amber)}
.modal .modal-foot{padding:14px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--bd)}
.opt.sel{background:rgba(91,156,246,.12);border-left:3px solid var(--acc)}
.opt .l{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.opt .r{font-size:14px;color:var(--sub)}
.opt .opt-main{display:flex;align-items:center;gap:8px;min-width:0}.opt .opt-mid,.opt .opt-right{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.opt .opt-right{text-align:right}
.btn{background:var(--acc);color:#fff;border:none;padding:11px 20px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:var(--p2);border:1px solid var(--bd);color:var(--txt)}
label{display:block;font-size:15px;color:var(--sub);margin:12px 0 5px}
input,select{width:100%;background:var(--p2);border:1px solid var(--bd);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:17px;font-family:inherit}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st{font-size:16px;color:var(--amber);margin:10px 0;min-height:18px}
.knd{font-size:14px;padding:2px 7px;border-radius:8px;background:var(--p2);color:var(--sub)}
.knd.k-opencode{background:rgba(74,222,128,.18);color:var(--green)}
.knd.k-argo{background:rgba(96,165,250,.18);color:var(--acc)}
.knd.k-turing{background:rgba(217,119,6,.18);color:var(--amber)}.mcard{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px 16px;text-align:center;transition:transform .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.mc-icon{font-size:24px;margin-bottom:6px}
.mc-label{font-size:14px;color:var(--sub);margin-bottom:6px}
.mc-val{font-size:24px;font-weight:700;font-family:"SF Mono",Consolas,monospace}
.mc-ci{font-size:14px;color:var(--sub);margin-top:6px;font-family:"SF Mono",Consolas,monospace}
.mc-n{font-size:14px;color:var(--gray)}
.barr{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-l{font-size:16px;width:140px;flex-shrink:0}
.bar-track{flex:1;height:28px;background:var(--p2);border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.bar-fill{height:100%;border-radius:14px;transition:width .5s}
.bar-v{font-size:18px;font-weight:600;width:60px;text-align:right;font-family:"SF Mono",Consolas,monospace}
.ps{display:flex;gap:14px;padding:0 0 0 0;position:relative}
.ps:not(:last-child)::after{content:"";position:absolute;left:15px;top:36px;bottom:0;width:2px;background:var(--bd)}
.ps-n{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;z-index:1}
.ps-body{flex:1;padding-bottom:20px;font-size:16px;line-height:1.8}
.ps-det{font-size:14px;color:var(--sub);font-family:"SF Mono",Consolas,monospace}
.ps-body b{font-size:17px}
.ef-btn{background:var(--p2);border:1px solid var(--bd);color:var(--sub);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:14px;flex:1}
.ef-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ef-btn:hover{border-color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="title" id="h-title">知识测评</div><div class="sub" id="h-sub"></div><div class="sp"></div>
    <button class="ghost" data-route="create" onclick="Router.navigate('/create')">+ 新建评测</button>
    <button class="ghost" data-route="system" id="sys-btn" onclick="Router.navigate('/system')" style="display:none">系统</button>
    <button class="ghost" id="theme-btn" onclick="toggleTheme()" style="font-size:18px;padding:8px 12px">🌙</button>
  </header>
  <main><div id="view"></div></main>
</div>
<script>
const DEBUG=new URLSearchParams(location.search).get("debug")==="true";
if(DEBUG){var _sb=document.getElementById("sys-btn");if(_sb)_sb.style.display="";}
const _P=location.pathname;const _INGRESS=(_P==='/eval'||_P.indexOf('/eval/')===0)?'/eval':'';
const U=(u)=>_INGRESS&&(u.indexOf("/api/")===0||u.indexOf("/reports/")===0||u.indexOf("/reports")===0||u==="/health")?_INGRESS+u:u;const F=(u,...a)=>fetch(U(u),...a);let activeId=null;
const THEMES={
  light:{"--bg":"#f5f6f8","--panel":"#ffffff","--p2":"#f0f2f5","--bd":"#e1e4e8","--txt":"#1a1d23","--sub":"#6b7280","--acc":"#2563eb","--green":"#16a34a","--red":"#dc2626","--amber":"#d97706","--gray":"#9ca3af","--nav-bg":"#1a1d23","--td-bd":"var(--bd)","--card-bg":"linear-gradient(145deg,#ffffff,#f8f9fa)","--mc-glow":"0 2px 16px rgba(22,163,74,.08)","--mc-neg-glow":"0 2px 16px rgba(220,38,38,.08)","--header-bg":"#ffffff","--bar-bg":"#e5e7eb","--hover-shadow":"0 8px 24px rgba(0,0,0,.1)"},
  dark:{"--bg":"#0b0e14","--panel":"#141821","--p2":"#1c212c","--bd":"#2a3140","--txt":"#e8eaed","--sub":"#a8b2c0","--acc":"#5b9cf6","--green":"#4ade80","--red":"#f87171","--amber":"#fbbf24","--gray":"#8b95a5","--nav-bg":"#080b10","--td-bd":"rgba(255,255,255,.04)","--card-bg":"linear-gradient(145deg,var(--panel),var(--p2))","--mc-glow":"0 0 24px rgba(74,222,128,.08)","--mc-neg-glow":"0 0 24px rgba(248,113,113,.08)","--header-bg":"rgba(20,24,33,.6)","--bar-bg":"var(--p2)","--hover-shadow":"0 8px 32px rgba(0,0,0,.3)"}
};
function applyTheme(t){
  const v=THEMES[t];const r=document.documentElement;
  for(const[k,val]of Object.entries(v))r.style.setProperty(k,val);
  const btn=$("theme-btn");if(btn)btn.textContent=t==="dark"?"☀️":"🌙";
  localStorage.setItem("eval-theme",t);
}
function toggleTheme(){const cur=localStorage.getItem("eval-theme")||"light";applyTheme(cur==="light"?"dark":"light");}
applyTheme(localStorage.getItem("eval-theme")||"light");

let w={proj:"",task:"",kg:"",nogk:"",biid:"BI-T001",tfid:"F-T001",eid:""};

function $(i){return document.getElementById(i);}
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstChild;}
function fmtMtime(mt){if(!mt)return'-';const d=new Date(mt*1000+8*3600000);const p=n=>String(n).padStart(2,'0');return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
function fmtDate(s){if(!s)return'-';const d=new Date(s+'Z');if(isNaN(d))return s;const b=new Date(d.getTime()+8*3600000);const p=n=>String(n).padStart(2,'0');return b.getUTCFullYear()+'-'+p(b.getUTCMonth()+1)+'-'+p(b.getUTCDate())+' '+p(b.getUTCHours())+':'+p(b.getUTCMinutes());}
function fmtTs(ts){if(!ts)return'';const d=new Date(ts+8*3600000);const p=n=>String(n).padStart(2,'0');return p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
async function jget(u){const r=await F(u);if(!r.ok)throw new Error(r.status);return r.json();}
async function jpost(u,b){const r=await F(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d;}
async function jput(u,b){const r=await F(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d;}

// 返回列表的全局函数（避免 onclick 内单引号转义问题）
function goBack(){Router.navigate('/');}

// ===== 页面路由器（整页跳转，一个功能一个 URL） =====
const Router={
  base:'',
  init(){
    this.base=_INGRESS;
    this.handle();
  },
  navigate(path){
    window.location.href=this.base+path;
  },
  handle(){
    var path=location.pathname.substring(this.base.length)||'/';
    updateNavActive(path);
    if(path==='/'||path===''){renderEvals();}
    else if(path.indexOf('/evaluations/')===0){
      var id=path.split('/')[2];
      if(id)selEv(id);else renderEvals();
    }
    else if(path==='/create'){renderCreate();}
    else if(path==='/system'){renderSystem();}
    else{renderEvals();}
  }
};
function updateNavActive(path){
  document.querySelectorAll('header button.ghost').forEach(function(b){
    b.classList.remove('nav-active');
    var r=b.getAttribute('data-route');
    if(r){
      if((r==='create'&&path==='/create')||(r==='system'&&path==='/system')){b.classList.add('nav-active');}
    }
  });
}

async function render(){
  const v=$("view");v.innerHTML='<div class="empty"><div class="ic">⏳</div><h3>加载中…</h3></div>';
  try{await renderEvals();}
  catch(e){v.innerHTML='<div class="empty"><div class="ic">⚠️</div><h3>错误</h3><p>'+e+'</p></div>';}
}

// ===== 评测列表 =====
async function renderEvals(){
  const d=await jget("/api/v1/evaluations?page_size=9999");const evs=d.evaluations||[];
  window._evData=evs;window._evPage=1;
  var _f=window._evFilter||"all";var _q=window._evQ||"";
  $("view").innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0">
    <input id="ev-search" placeholder="搜索 ID / 名称…" oninput="filterEvals()" style="max-width:300px" value="${_q}">
    <div style="display:flex;gap:6px">
      <button class="ef-btn${_f==='all'?' active':''}" onclick="setEvFilter('all',this)">全部</button>
      <button class="ef-btn${_f==='COMPLETED'?' active':''}" onclick="setEvFilter('COMPLETED',this)">完成</button>
      <button class="ef-btn${_f==='COMPLETED_WITH_WARNINGS'?' active':''}" onclick="setEvFilter('COMPLETED_WITH_WARNINGS',this)">警告</button>
      <button class="ef-btn${_f==='FAILED'?' active':''}" onclick="setEvFilter('FAILED',this)">失败</button>
    </div>
    <span style="margin-left:auto;font-size:14px;color:var(--sub)">共 ${evs.length} 条</span>
    <button class="ghost" style="font-size:14px;padding:6px 12px" onclick="renderEvals()">🔄 刷新</button>
  </div>
  <div style="flex:1;overflow-y:auto"><div class="ev-grid" id="ev-list-body"></div></div>`;
  renderEvList();
}
function setEvFilter(f,btn){window._evFilter=f;window._evPage=1;document.querySelectorAll(".ef-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderEvList();}
function filterEvals(){window._evQ=$("ev-search").value.toLowerCase();window._evPage=1;renderEvList();}
function evPage(p){window._evPage=p;renderEvList();}
const EV_PAGE_SIZE=12;
function renderEvList(){
  const evs=window._evData||[];const f=window._evFilter||"all";const q=window._evQ||"";
  let filtered=evs;
  if(f!=="all")filtered=filtered.filter(e=>(e.status||"").startsWith(f));
  if(q)filtered=filtered.filter(e=>(e.evaluation_id+e.name).toLowerCase().includes(q));
  const total=filtered.length;
  const pages=Math.ceil(total/EV_PAGE_SIZE)||1;
  const page=Math.min(window._evPage||1,pages);
  const start=(page-1)*EV_PAGE_SIZE;
  const pageItems=filtered.slice(start,start+EV_PAGE_SIZE);
  const el=$("ev-list-body");
  if(!el)return;
  let html=pageItems.length?pageItems.map(function(e){
    var _phaseLabels={"CREATED":"创建中","QUEUED":"已暂停","RUNNING":"启动中","VALIDATING":"验证中","INGESTING":"获取基线","PARSING":"解析 Trace","AI_MATCHING":"漏洞匹配","RESOLVING":"提取 Fact","PAIRING":"任务配对","CALCULATING":"计算指标","STATISTICAL_ANALYSIS":"统计分析","DIAGNOSING":"诊断中","REPORTING":"生成报告","FINALIZING":"收尾中","COMPLETED":"完成","COMPLETED_WITH_WARNINGS":"完成有告警","FAILED":"失败","CANCEL_REQUESTED":"取消中","CANCELLING":"取消中","CANCELLED":"已取消"};
    var badge=(e.status||'').replace('_WITH_WARNINGS','').replace('CANCEL_REQUESTED','FAILED').replace('CANCELLING','FAILED').replace('CANCELLED','FAILED');
    var isTerminal=e.status==='COMPLETED'||e.status==='COMPLETED_WITH_WARNINGS'||e.status==='FAILED'||e.status==='CANCELLED';
    // REPORTING 时通过 progress 文本区分"知识与记忆介入分析"和"生成报告"
    var phaseLabel=_phaseLabels[e.status]||e.status||'-';
    if(e.status==='REPORTING'&&e.progress&&e.progress.indexOf('生成报告')<0){phaseLabel='知识与记忆分析';}
    var safeName=(e.name||e.evaluation_id).replace(/'/g,'');
    var btns=DEBUG?'<span class="ev-actions" onclick="event.stopPropagation()">'+
      '<button class="btn g" style="font-size:12px;padding:2px 8px" onclick="retryEval(\''+e.evaluation_id+'\')">重跑</button>'+
      (!isTerminal?'<button class="btn" style="font-size:12px;padding:2px 8px;background:var(--amber)" onclick="cancelEval(\''+e.evaluation_id+'\')">取消</button>':'')+
      (isTerminal?'<button class="btn" style="font-size:12px;padding:2px 8px;background:var(--red)" onclick="deleteEval(\''+e.evaluation_id+'\',\''+safeName+'\')">删除</button>':'')+

  // 分页控件
  if(pages>1){

async function selEv(id){
  activeId=id;
  try{const s=await jget(`/api/v1/evaluations/${id}`);
    // FAILED: 直接显示错误 + 重试
    if(s.status==="FAILED"){
      var errMsg=s.error_message||"无详细错误信息";
      $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic">⚠️</div><h3>评测失败</h3><p style="font-size:14px;color:var(--red);max-width:500px;text-align:left;word-break:break-all">'+errMsg+'</p>'+(DEBUG?'<button class="btn" style="margin-top:16px" id="retry-btn">重试</button>':'')+'</div>';
      var rb=$("retry-btn");if(rb)rb.onclick=function(){retryEval(id);};
      return;
    }
    // 运行中: 显示进度（非终态即运行中）
    if(s.status!=="COMPLETED"&&s.status!=="COMPLETED_WITH_WARNINGS"&&s.status!=="FAILED"&&s.status!=="CANCELLED"&&s.status!=="CANCEL"){
      var phases=[{key:"INGESTING",label:"获取基线"},{key:"PARSING",label:"解析 Trace"},{key:"AI_MATCHING",label:"漏洞匹配"},{key:"RESOLVING",label:"提取 Fact"},{key:"PAIRING",label:"任务配对"},{key:"CALCULATING",label:"计算指标"},{key:"KNOWLEDGE_ANALYSIS",label:"知识与记忆介入分析"},{key:"REPORTING",label:"生成报告"}];
      var phaseMap={"CREATED":0,"QUEUED":0,"RUNNING":0,"VALIDATING":0,"INGESTING":1,"PARSING":2,"AI_MATCHING":3,"RESOLVING":4,"PAIRING":5,"CALCULATING":6,"STATISTICAL_ANALYSIS":6,"DIAGNOSING":7,"REPORTING":8,"FINALIZING":9};
      var curStep=phaseMap[s.status]||0;
      // 知识与记忆介入分析是 REPORTING 的子阶段，通过 progress 文本区分
      if(s.status==="REPORTING"){
        if(s.progress&&s.progress.indexOf("生成报告")>=0){curStep=8;}
        else{curStep=7;}
      }
      var totalSteps=phases.length;
      var progressPct=Math.round((curStep/(totalSteps+1))*100);
      var stepsHtml='<div style="margin:12px 0">';
      stepsHtml+='<div style="height:4px;background:var(--p2);border-radius:5px;margin-bottom:12px;overflow:hidden"><div style="height:100%;width:'+progressPct+'%;background:linear-gradient(90deg,var(--acc),#7c3aed);transition:width .5s;border-radius:5px"></div></div>';
      phases.forEach(function(p,i){
        var done=curStep>i+1;var active=curStep===i+1;var stepNum=i+1;
        var bg=done?"rgba(74,222,128,.12)":active?"rgba(124,58,237,.12)":"var(--p2)";
        var borderC=done?"rgba(74,222,128,.4)":active?"rgba(124,58,237,.4)":"transparent";
        var color=done?"var(--green)":active?"var(--acc)":"var(--gray)";
        var icon=done?"✅":(active?"⏳":"⏸");
        stepsHtml+='<div style="display:flex;align-items:center;gap:12px;padding:7px 10px;margin-bottom:5px;background:'+bg+';border:1px solid '+borderC+';border-radius:8px;transition:all .3s">';
        stepsHtml+='<span style="width:30px;height:30px;border-radius:50%;background:'+(done?"rgba(74,222,128,.2)":active?"rgba(124,58,237,.2)":"rgba(107,114,128,.1)")+';display:flex;align-items:center;justify-content:center;color:'+color+';font-size:14px;flex-shrink:0">'+icon+'</span>';
        stepsHtml+='<div><div style="font-size:14px;color:'+color+';font-weight:'+(active?'700':'400')+'">'+stepNum+'. '+p.label+(active?'…':'')+'</div>';
        if(done){stepsHtml+='<div style="font-size:11px;color:var(--sub)">已完成</div>';}
        else if(active){stepsHtml+='<div style="font-size:11px;color:var(--acc)">进行中</div>';}
        else{stepsHtml+='<div style="font-size:11px;color:var(--gray)">等待中</div>';}
        stepsHtml+='</div></div>';
      });
      stepsHtml+='</div>';
      // 运行中也可强制重跑（卡住时用户可手动重启），仅 debug 模式显示
      if(DEBUG) stepsHtml+='<div style="text-align:center;margin-top:16px"><button class="btn g" id="force-retry-btn" style="font-size:14px;padding:8px 20px">强制重跑</button> <button class="btn" id="cancel-btn" style="font-size:14px;padding:8px 20px;background:var(--amber)">取消任务</button></div>';
      var progressHtml='<div id="eval-progress" style="text-align:center;font-size:14px;color:var(--acc);margin-top:10px;font-weight:600'+(s.progress?'':';display:none')+'">'+(s.progress||'')+'</div>';
      $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div style="padding:20px 20px;flex:1;overflow-y:auto"><div style="text-align:center;margin-bottom:8px"><span style="font-size:22px">⚙️</span> <span style="font-size:17px;font-weight:700;color:var(--txt)">评测运行中</span><div style="font-size:13px;color:var(--sub);margin-top:2px">'+(s.name||'')+'</div><div style="font-size:11px;color:var(--gray)">'+id+'</div></div>'+stepsHtml+progressHtml+'<div style="text-align:center;font-size:12px;color:var(--sub);margin-top:6px">'+s.status+' · '+progressPct+'%</div></div>';
      var frb=$("force-retry-btn");if(frb)frb.onclick=function(){retryEval(id);};
      var cb=$("cancel-btn");if(cb)cb.onclick=function(){cancelEval(id);};
      let cnt=0;let _partialLoaded=false;let _lastRsKey="";const poll=async()=>{cnt++;if(cnt>14400)return;
        if(activeId!==id)return;  // 用户已切走，停止旧评测轮询
        try{const st=await jget(`/api/v1/evaluations/${id}`);
          if(st.status==="COMPLETED"||st.status==="COMPLETED_WITH_WARNINGS"){
            // 优先固化 HTML（HEAD 探测）
            try{
              const probe=await F(`/reports/${id}.html`,{method:'HEAD'});
              if(probe.ok){
                loadIframeReport(id);
                return;
              }
            }catch(e){}
            const r=await jget(`/api/v1/evaluations/${id}/report`);renderReport(r);
          }
          else if(st.status==="FAILED"){selEv(id);}
          else{
            // 运行中：检查是否有段文件已就绪
            try{
              const rs=await jget(`/api/v1/evaluations/${id}/report/status`);
              if(rs.base){  // 基础报告就绪才切换到部分报告视图（FPR/KG 段需要合并到基础报告）
                var _rsKey=rs.base+'|'+rs.fpr+'|'+rs.kg;
                if(!_partialLoaded||_rsKey!==_lastRsKey){
                  _partialLoaded=true;
                  _lastRsKey=_rsKey;
                  loadPartialReport(id,st);
                }
              }
            }catch(e){}
            // 更新进度文本
            var pe=$("eval-progress");
            if(pe){if(st.progress){pe.textContent=st.progress;pe.style.display='block';}else{pe.style.display='none';}}
            if(st.status!==s.status){
              if(window._evData){var ev=window._evData.find(e=>e.evaluation_id===id);if(ev){ev.status=st.status;ev.progress=st.progress;}}
              if(!_partialLoaded){selEv(id);return;}  // 状态变更时刷新步骤图标（无段文件时）
              // 部分报告已加载：更新横幅进度文本
              var _bn=$("partial-banner-status");
              if(_bn){_bn.textContent=st.progress||st.status||'';}
              s.status=st.status;
            }
            setTimeout(poll,20000);
          }
        }catch(e){}};
      setTimeout(poll,20000);return;
    }
  }catch(e){}
  // COMPLETED: 加载报告（优先固化 HTML iframe，回退动态接口）
  $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic">⏳</div><h3>加载报告…</h3></div>';
  try{
    // 先探测固化 HTML 是否存在（HEAD 请求不下载 body）
    const probe=await F(`/reports/${id}.html`,{method:'HEAD'});
    if(probe.ok){
      loadIframeReport(id);
      return;
    }
  }catch(e){}
  try{const r=await jget(`/api/v1/evaluations/${id}/report`);renderReport(r);}
  catch(e){$("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic">⚠️</div><h3>报告未就绪</h3><p>'+e+'</p></div>';}
}

function retryEval(eid){
  showConfirm({icon:'⚠️',iconBg:'rgba(251,191,36,.15)',iconColor:'var(--amber)',title:'重跑评测',
    desc:'重跑将清除该评测的全部数据，重新解析 trace 并调用 LLM。',
    risks:['耗时可能较长（10-30 分钟）','如果 LLM 不可用会降级为规则生成','旧报告会被覆盖'],
    confirmText:'重跑',confirmColor:'var(--acc)',
    onConfirm:function(){
      activeId=eid;
      var rep=$("view");if(rep)rep.innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic" style="animation:spin 1s linear infinite">⏳</div><h3>正在重新启动评测…</h3><p style="font-size:14px;color:var(--sub)">清理旧数据并重新解析中</p></div>';
      F('/api/v1/evaluations/'+eid+'/retry?force=true',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
        if(d.status==='QUEUED'||d.status==='RUNNING'){
          var pollCnt=0;
          var retryPoll=function(){
            pollCnt++;if(pollCnt>30)return;
            if(activeId!==eid)return;  // 用户已切走，停止重跑轮询
            jget('/api/v1/evaluations/'+eid).then(function(s){
              if(s.status==='FAILED'){setTimeout(retryPoll,1000);}
              else{selEv(eid);}
            }).catch(function(){setTimeout(retryPoll,1000);});
          };
          setTimeout(retryPoll,500);
        }else{
          alert('重试失败: '+JSON.stringify(d));
        }
      }).catch(function(e){alert('重试失败: '+e);});
    }
  });
}
function rerunSection(eid,section){
  var title=section==='fpr'?'重跑误报率分析':'重跑知识图谱与记忆分析';
  var desc=section==='fpr'?'重新运行基线 vs 告警中心/漏洞中心 LLM 匹配 + M13 指标计算。':'重新解析 trace + 重新运行逐漏洞 KG 归因分析。前置：FPR 段必须存在。';
  var risks=section==='fpr'?['LLM 调用可能较慢','旧 FPR 报告会被覆盖']:['需要重新解析 trace','LLM 调用可能较慢','旧 KG 报告会被覆盖'];
  showConfirm({icon:'🔄',iconBg:'rgba(37,99,235,.15)',iconColor:'var(--acc)',title:title,
    desc:desc,risks:risks,confirmText:'重跑',confirmColor:'var(--acc)',
    onConfirm:function(){
      F('/api/v1/evaluations/'+eid+'/rerun-'+section+'?force=true',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
        if(d.status==='submitted'){
          // 轮询进度
          var cnt=0;
          var poll=function(){
            cnt++;if(cnt>3600)return;
            if(activeId!==eid)return;
            jget('/api/v1/evaluations/'+eid).then(function(s){
              var prog=(s.progress||'');
              var isRunning=prog.indexOf(section==='fpr'?'重跑误报率':'重跑知识与记忆')>=0;
              if(isRunning){
                // 更新进度提示
                var el=$('section-loading-'+section);
                if(el){el.textContent=prog;el.style.display='block';}
                setTimeout(poll,5000);
              }else{
                // 完成，重新加载报告
                selEv(eid);
              }
            }).catch(function(){setTimeout(poll,5000);});
          };
          setTimeout(poll,1000);
        }else{
          alert('重跑失败: '+JSON.stringify(d));
        }
      }).catch(function(e){alert('重跑失败: '+e);});
    }
  });
}

function fmtDur(ms){
  if(ms===null||ms===undefined||isNaN(ms))return'<span class="na">NA</span>';
  var abs=Math.abs(ms);var sign=ms<0?'-':'';
  if(abs>=3600000){var h=Math.floor(abs/3600000);var m=Math.floor((abs%3600000)/60000);return sign+h+'<span class="ci">时</span> '+m+'<span class="ci">分</span>';}
  if(abs>=60000){var m2=Math.floor(abs/60000);var s=Math.floor((abs%60000)/1000);return sign+m2+'<span class="ci">分</span> '+s+'<span class="ci">秒</span>';}
  if(abs>=1000){return sign+(abs/1000).toFixed(1)+'<span class="ci">秒</span>';}
  return sign+Math.round(abs)+'<span class="ci">ms</span>';
}
function fmt(v,u){
  if(v===null||v===undefined||isNaN(v))return'<span class="na">NA</span>';
  if(u==="ratio")return (v*100).toFixed(2)+'<span class="ci">%</span>';
  if(u==="ms")return fmtDur(v);
  if(u==="steps"||u==="tokens"){const a=Math.abs(v);let s;
    if(a>=1e9)s=(v/1e9).toFixed(2)+'B';else if(a>=1e6)s=(v/1e6).toFixed(2)+'M';else if(a>=1e3)s=(v/1e3).toFixed(1)+'K';else s=Math.round(v).toString();
    return s+'<span class="ci">'+(u==="tokens"?" tok":" steps")+'</span>';}
  return Number(v).toFixed(3);
}
function fmtNum(v){if(v==null||isNaN(v))return'<span class="na">NA</span>';const a=Math.abs(v);
  if(a>=1e9)return(v/1e9).toFixed(2)+'B';
  if(a>=1e6)return(v/1e6).toFixed(2)+'M';
  if(a>=1e3)return(v/1e3).toFixed(1)+'K';
  return Math.round(v).toString();}
const MI={
  M13:{n:"误报率",short:"误报率",d:"Agent 上报漏洞中误报的比例。KG 和 No-KG 各自独立对比基线计算。",u:"ratio",
     range:[{v:0,t:"无误报",c:"green"},{v:0.3,t:"中等",c:"amber"},{v:1,t:"全误报",c:"red"}],
     interp:(v)=>v==null?"无数据":`误报率 ${(v*100).toFixed(2)}%`,
     formula:"误报率 = 误报数 / (误报数 + 真正数)"},
  M5:{n:"知识访问率",short:"知识访问",d:"Agent 工具调用中知识查询所占比例（交互级）。衡量 Agent 对知识的依赖程度。",u:"ratio",
     range:[{v:0,t:"无访问",c:"red"},{v:0.05,t:"少量",c:"amber"},{v:0.15,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到知识访问":v>=0.15?`知识访问率 ${(v*100).toFixed(2)}%, 充分`:v>=0.05?`知识访问率 ${(v*100).toFixed(2)}%, 少量`:`知识访问率 ${(v*100).toFixed(2)}%, 占比低`,
     formula:"kg_count / total_tool_calls (知识查询次数 / 总工具调用次数)"},
  M6:{n:"知识交付率",short:"知识交付",d:"知识查询中平台有效回复的比例（交互级）。衡量知识质量。",u:"ratio",
     range:[{v:0,t:"无交付",c:"red"},{v:0.5,t:"部分",c:"amber"},{v:0.8,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到知识交付":v>=0.8?`知识交付率 ${v*100}%, 充分`:v>=0.5?`知识交付率 ${v*100}%, 部分`:`知识交付率 ${v*100}%, 不足`,
     formula:"successful_read_count / access_event_count (有效回复次数 / 总查询次数)"},
  M11:{n:"记忆访问率",short:"记忆访问",d:"Agent 工具调用中记忆读取/检索所占比例。与知识访问率同算法。",u:"ratio",
     range:[{v:0,t:"无访问",c:"red"},{v:0.05,t:"少量",c:"amber"},{v:0.15,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到记忆访问":v>=0.15?`记忆访问率 ${(v*100).toFixed(2)}%, 充分`:v>=0.05?`记忆访问率 ${(v*100).toFixed(2)}%, 少量`:`记忆访问率 ${(v*100).toFixed(2)}%, 占比低`,
     formula:"memory_access_event_count / total_tool_calls (记忆读取次数 / 总工具调用次数)"},
  M12:{n:"记忆交付率",short:"记忆交付",d:"记忆读取中成功返回的比例。与知识交付率同算法。",u:"ratio",
     range:[{v:0,t:"无交付",c:"red"},{v:0.5,t:"部分",c:"amber"},{v:0.8,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到记忆交付":v>=0.8?`记忆交付率 ${v*100}%, 充分`:v>=0.5?`记忆交付率 ${v*100}%, 部分`:`记忆交付率 ${v*100}%, 不足`,
     formula:"memory_successful_read_count / memory_access_event_count (成功读取次数 / 记忆读取次数)"},
  M7:{n:"行为偏移",short:"行为偏移",d:"KG vs No-KG 工具使用分布差异。0=完全相同，1=完全不同。",u:"ratio",
     range:[{v:0,t:"无差异",c:"green"},{v:0.1,t:"轻微",c:"amber"},{v:0.3,t:"显著",c:"red"}],
     interp:(v)=>v==null?"无法计算":v<0.1?`行为偏移 ${v*100}%, 轻微`:v<0.3?`行为偏移 ${v*100}%, 明显`:`行为偏移 ${v*100}%, 显著`,
     formula:"median(JSD_i), JSD_i=(0.5*KL(P||M)+0.5*KL(Q||M))/ln2, M=(P+Q)/2, P/Q=工具使用概率分布"},
  M8:{n:"Token变化",short:"Token",d:"KG - No-KG 有效 token 消耗。负值=KG 更省。",u:"tokens",
     range:[{v:-1,t:"KG 更省",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 更耗",c:"red"}],
     interp:(v)=>v==null?"无法计算":v<0?`KG 少用 ${fmtNum(Math.abs(v))} token`:v>0?`KG 多用 ${fmtNum(v)} token`:"token 消耗无差异",
     formula:"median(KG_tokens - NoKG_tokens)"},
  M9:{n:"步数变化",short:"步数",d:"KG - No-KG 推理步数。负值=KG 更少步。",u:"steps",
     range:[{v:-1,t:"KG 更少",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 更多",c:"red"}],
     interp:(v)=>v==null?"无法计算":v<0?`KG 少 ${fmtNum(Math.abs(v))} 步`:v>0?`KG 多 ${fmtNum(v)} 步`:"步数无差异",
     formula:"median(KG_steps - NoKG_steps)"},
  M10:{n:"时长变化",short:"时长",d:"KG - No-KG 运行时长(ms)。负值=KG 更快。",u:"ms",
     range:[{v:-1,t:"KG 更快",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 更慢",c:"red"}],
     interp:(v)=>v==null?"无法计算":v<0?`KG 快 ${fmtDur(-v)}`:v>0?`KG 慢 ${fmtDur(v)}`:"时长无差异",
     formula:"median(KG_duration_ms - NoKG_duration_ms)"}
};
function mInfo(id){const m=MI[id];return m?`<div style="font-size:15px;color:var(--sub);margin-top:4px;line-height:1.5">${m.d}<br><span style="color:var(--gray);font-size:14px">单位：${m.u}</span></div>`:"";}
function dc(v,u){if(v===null||v===undefined||isNaN(v))return"";if(u==="ratio")return v>0?"dp":"dn";return v<0?"dp":"dn";}
function ci(m){if(!m||m.ci_lower==null||m.ci_upper==null||isNaN(m.ci_lower)||isNaN(m.ci_upper))return"";const u=m.unit==="ratio"?"pp":(m.unit==="ms"?"s":(m.unit||""));const lo=m.unit==="ratio"?(m.ci_lower*100).toFixed(2):(m.unit==="ms"?(m.ci_lower/1000).toFixed(1):Number(m.ci_lower).toFixed(2));const hi=m.unit==="ratio"?(m.ci_upper*100).toFixed(2):(m.unit==="ms"?(m.ci_upper/1000).toFixed(1):Number(m.ci_upper).toFixed(2));return`<div class="ci">95% CI [${lo}, ${hi}] ${u}</div>`;}
function row(m,l){const mid=l.split(" ")[0];const mi=MI[mid]||{n:l,u:""};const RC={"NO_STRATUM":"基线全部为漏洞型，无对照样本","NO_VALID_DENOMINATOR":"No-KG 全部成功，无改善空间","NO_POSITIVE_GT":"无漏洞型基线","BOOTSTRAP_UNSTABLE":"样本量不足"};if(!m)return`<tr><td><b>${mi.n||l}</b><div style="font-size:14px;color:var(--sub)">${mi.d||""}</div></td><td class="na">未计算</td><td>-</td><td></td><td></td></tr>`;const c=m.calculation_status!=="CALCULATED"?`<span class="na">${m.calculation_status}<br><span style="font-size:14px">${RC[m.reason_code]||m.reason_code||""}</span></span>`:`<span class="${dc(m.estimate,m.unit)}">${fmt(m.estimate,m.unit)}</span>`;const n=m.n!=null?`<span class="ci">N=${m.n}</span>${m.median!=null?'<br><span class="ci">med '+fmt(m.median,m.unit)+'</span>':''}`:"-";const p=m.p_value!=null&&!isNaN(m.p_value)?`<span class="ci">p=${m.p_value<0.001?'<0.001':m.p_value.toFixed(3)}</span>`:(m.median!=null?'<span class="ci">Wilcoxon</span>':"");return`<tr><td><b>${mi.n||l}</b><div style="font-size:15px;color:var(--sub);line-height:1.5">${mi.d||""}<br><span style="color:var(--gray);font-size:14px">单位：${mi.u}</span></div></td><td class="num">${c}</td><td>${n}</td><td>${ci(m)}</td><td>${p}</td></tr>`;}

function selectReportTab(button,paneId){
  document.querySelectorAll('[data-report-tab]').forEach(el=>{el.style.display=el.id===paneId?'block':'none';});
  document.querySelectorAll('[data-report-tab-btn]').forEach(el=>{el.style.background='var(--panel)';el.style.color='var(--sub)';el.style.borderColor='var(--bd)';el.style.boxShadow='none';el.style.transform='none';el.setAttribute('aria-selected','false');});

function filterKgCases(btn,filter){
  var container=btn.closest('details')||btn.closest('.card')||btn.parentElement;
  if(!container)return;
  var btns=container.querySelectorAll('.kg-filter-btn');
  btns.forEach(function(b){b.style.opacity=b===btn?'1':'0.5';b.style.fontWeight=b===btn?'700':'400';});
  var cards=container.querySelectorAll('.kg-case-card');
  cards.forEach(function(card){
    var impact=card.getAttribute('data-impact');
    card.style.display=(filter==='ALL'||impact===filter)?'':'none';
  });
  var headers=container.querySelectorAll('.kg-group-header');
  headers.forEach(function(header){
    var next=header.nextElementSibling;
    var hasVisible=false;
    while(next&&!next.classList.contains('kg-group-header')){
      if(next.classList.contains('kg-case-card')&&next.style.display!=='none'){hasVisible=true;break;}
      next=next.nextElementSibling;
    }
    header.style.display=hasVisible?'':'none';
  });
}

// 分阶段加载报告：运行中时加载已就绪的段，未就绪段显示占位
async function loadPartialReport(id,st){
  try{
    const rs=await jget(`/api/v1/evaluations/${id}/report/status`);
    let report={evaluation_id:id,status:st.status,evaluation_name:st.evaluation_name||""};
    let r={};
    // 加载基础报告（指标版或完整版）
    if(rs.base){
      try{
        const base=await jget(`/api/v1/evaluations/${id}/report`);
        r=base.report||base;
        report.evaluation_name=report.evaluation_name||base.evaluation_name||"";
      }catch(e){}
    }
    // 合并 FPR 段
    if(rs.fpr){
      try{
        const fpr=await jget(`/api/v1/evaluations/${id}/report/fpr`);
        if(fpr){
          if(fpr.e2e_fpr_kg||fpr.e2e_fpr_nogk){
            (r.metric_groups||[]).forEach(function(g){
              if(g.category==='verify'||g.category==='verification'){
                if(fpr.e2e_fpr_kg)g.e2e_fpr_kg=fpr.e2e_fpr_kg;
                if(fpr.e2e_fpr_nogk)g.e2e_fpr_nogk=fpr.e2e_fpr_nogk;
              }
            });
          }
          if(fpr.mining_fpr_group&&!(r.metric_groups||[]).some(function(g){return g.category==='mining_fpr';})){
            (r.metric_groups=r.metric_groups||[]).push(fpr.mining_fpr_group);
          }
          if(fpr.m13_top){(r.p0=r.p0||{}).M13=fpr.m13_top;}
          if(fpr.group_m13){
            (r.metric_groups||[]).forEach(function(g){
              if(fpr.group_m13[g.task_id]){(g.p0=g.p0||{}).M13=fpr.group_m13[g.task_id];}
            });
          }
        }
      }catch(e){}
    }
    // 合并 KG 段
    if(rs.kg){
      try{
        const kg=await jget(`/api/v1/evaluations/${id}/report/kg`);
        if(kg&&kg.groups){
          const kgMap={};
          kg.groups.forEach(function(g){kgMap[g.task_id]=g;});
          (r.metric_groups||[]).forEach(function(g){
            if(kgMap[g.task_id]){
              if(kgMap[g.task_id].per_case_kg_analysis)g.per_case_kg_analysis=kgMap[g.task_id].per_case_kg_analysis;
              if(kgMap[g.task_id].case_results)g.case_results=kgMap[g.task_id].case_results;
            }
          });
        }
      }catch(e){}
    }
    report.report=r;
    report._partial={base:rs.base,fpr:rs.fpr,kg:rs.kg,html:rs.html,running:true,status:st.status,progress:st.progress};
    renderReport(report);
  }catch(e){}
}

function renderReport(d){
  var _evalId=d.evaluation_id||activeId||'';
  $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button>'+(DEBUG?'<div style="margin-left:auto;display:flex;gap:8px"><button class="btn" style="font-size:12px;padding:4px 10px" onclick="rerunSection(\''+_evalId+'\',\'fpr\')">重跑误报率</button><button class="btn" style="font-size:12px;padding:4px 10px" onclick="rerunSection(\''+_evalId+'\',\'kg\')">重跑知识分析</button></div>':'')+'</div><div id="rep-content" style="flex:1;overflow-y:auto"></div>';
  var rep=$("rep-content");
  if(!rep)return;
  rep.style.overflowY='auto';
  const r=d.report||{},p0=r.p0||{},p1=r.p1||{},p2=r.p2||{},h=r.diagnostic_hits||[],nt=r.notes||[],rw=r.raw_stats||{};
  var _partial=d._partial||null;

  // 指标卡片：名称 + 值 + 解读 + 参考范围条
  function mCard(mid,m){
    const mi=MI[mid]||{n:mid,short:mid,d:"",u:"",range:[],interp:()=>""};
    const RC={"NO_STRATUM":"基线全部为漏洞型，无对照样本","NO_VALID_DENOMINATOR":mid==="M3"?"No-KG 全部失败，无回归可能":"No-KG 全部成功，无改善空间","NO_POSITIVE_GT":"无漏洞型基线","BOOTSTRAP_UNSTABLE":"样本量不足，bootstrap 不稳定","NO_VALID":"数据不足","INSUFFICIENT_DATA":"样本量不足","NO_DISCORDANT_PAIRS":"KG 与 No-KG 结果一致，无差异对","INSUFFICIENT_PAIRS":"配对数不足","ALL_ZERO_DIFFERENCES":"所有配对差异为零","TOOL_EVENT_MISSING":"工具事件缺失","TOKEN_INVALID":"Token 数据无效","STEP_INVALID":"步数数据无效","TIME_INVALID":"时长数据无效","FPR_ANALYSIS_FAILED":"误报率分析失败（基线与告警中心/漏洞中心数据匹配失败）","PENDING_FPR_ANALYSIS":"等待误报率分析","NO_DATA":"无数据","NO_CONFUSION_LABELS":"无混淆矩阵标签"};
    if(!m||m.calculation_status!=="CALCULATED"){
      const rc=m?m.reason_code||m.calculation_status:"无数据";
      const reason=RC[rc]||rc||"无数据";
      const nNote=m&&m.n!=null?` (N=${m.n})`:"";
      return `<div class="mcard na"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">${mid}</span> ${mi.short||""}</div><div class="mc-val na">N/A</div><div style="font-size:13px;color:var(--sub);margin-top:4px">${reason}${nNote}</div></div>`;
    }
    const v=m.estimate;
    if(v==null||isNaN(v))return `<div class="mcard na"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">${mid}</span> ${mi.short||""}</div><div class="mc-val na">N/A</div><div style="font-size:13px;color:var(--sub);margin-top:4px">estimate 缺失</div></div>`;
    const interp=mi.interp?mi.interp(v):"";
    let col="var(--gray)";
    if(mi.range){
      for(let i=mi.range.length-1;i>=0;i--){if(v>=mi.range[i].v){col=mi.range[i].c==="green"?"var(--green)":mi.range[i].c==="red"?"var(--red)":"var(--amber)";break;}}
    }
    const valStr=fmt(v,m.unit);
    let rangeBar="";
    if(mi.range&&mi.range.length>=2){
      const min=mi.range[0].v,max=mi.range[mi.range.length-1].v;
      const pct=Math.min(100,Math.max(0,((v-min)/(max-min))*100));
      rangeBar=`<div class="bar-track" style="margin-top:6px;height:4px"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>`;
    }
    var formulaHtml=mi.formula?"<details style='margin-top:4px'><summary style='cursor:pointer;font-size:12px;color:var(--gray)'>计算公式</summary><div style='font-size:12px;color:var(--sub);font-family:monospace;background:var(--p2);padding:4px 6px;border-radius:4px;margin-top:4px'>"+mi.formula+"</div></details>":"";
    // 混淆矩阵值：显示计算过程
    if(m.cm){
      var cmParts=[];
      if(mid==="M13"){
        cmParts.push("误报="+m.cm.fp,"真正="+m.cm.tp);
        cmParts.push("→ "+m.cm.fp+"/("+m.cm.fp+"+"+m.cm.tp+")");
      }
      if(cmParts.length){
        formulaHtml+="<div style='font-size:12px;color:var(--sub);margin-top:4px'>"+cmParts.join("，")+"</div>";
      }
    }
    // M13 额外展示中文公式与具体数值
    if(mid==="M13"&&m.formulaDetail){
      formulaHtml+="<div style='font-size:12px;color:var(--sub);margin-top:4px;font-family:monospace'>"+m.formulaDetail+"</div>";
    }
    return '<div class="mcard" style="border-color:'+col+'33"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">'+mid+'</span> '+(mi.short||"")+'</div><div class="mc-val" style="color:'+col+'">'+valStr+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4">'+(m.d||mi.d||"")+'</div>'+rangeBar+formulaHtml+'</div>';
  }

  // 知识图谱与记忆介入情况：两种方案分别统计
  function buildKnowledgeHtml(group){
  const groupP1=group?(group.p1||{}):p1;
  const kar=groupP1.M5,kdr=groupP1.M6;
  const mar=groupP1.M11,mdr=groupP1.M12;
  const kgAccess=kar&&kar.calculation_status==="CALCULATED"?kar.estimate:null;
  const kgDelivery=kdr&&kdr.calculation_status==="CALCULATED"?kdr.estimate:null;
  const memAccess=mar&&mar.calculation_status==="CALCULATED"?mar.estimate:null;
  const memDelivery=mdr&&mdr.calculation_status==="CALCULATED"?mdr.estimate:null;
  const taskId=group&&group.task_id;
  const kgData=taskId?(d.knowledge_interactions||[]).filter(k=>k.task_run_id.includes("-"+taskId+"-KG")):(d.knowledge_interactions||[]);

  // 分别提取知识图谱交互和记忆交互
  const kgAll=[],memAll=[];
  kgData.forEach(k=>{
    (k.interactions||[]).forEach(i=>kgAll.push(i));
    const mem=k.memory||{};
    (mem.interactions||[]).forEach(i=>memAll.push(i));
  });

  // 统计辅助函数：计算主动查询、返回结果、有效返回、返回失败、知识盲区
  function _stats(arr){
    const callCount=arr.filter(function(iv){return iv.type==="CALL";}).length;
    const resultCount=arr.filter(function(iv){return iv.type==="RESULT";}).length;
    const noResponse=Math.max(0,callCount-resultCount);
    var fail=0,blind=0,success=0;
    arr.forEach(function(iv){
      if(iv.type!=="RESULT"||!iv.output)return;
      var out=(iv.output||"").toLowerCase();
      if(out.indexOf("terminated")>=0||out.indexOf("timeout")>=0||out.indexOf("error")>=0||out.indexOf("404")>=0||out.indexOf("failed")>=0||out.indexOf("exception")>=0||out.indexOf("unreachable")>=0||out.indexOf("connection refused")>=0){
        fail++;
      }else if(out.indexOf("知识库暂无此类知识")>=0||out.indexOf("no memory")>=0||out.indexOf("not found")>=0||out.indexOf("empty")>=0){
        blind++;
      }else{
        success++;
      }
    });
    fail+=noResponse;
    return {callCount:callCount,resultCount:resultCount,noResponse:noResponse,fail:fail,blind:blind,success:success};
  }

  // 单个方案统计区块
  function _sectionHtml(title,icon,stats,accessRate,deliveryRate){
    const active=(accessRate!==null&&accessRate>0)||stats.callCount>0;
    var html="<div style='display:flex;gap:12px;align-items:center;margin-bottom:8px'>";
    html+=active?"<span style='font-size:24px'>"+icon+"</span>":"<span style='font-size:24px'>❌</span>";
    html+="<div><span style='font-weight:600;font-size:15px'>"+title+(active?"已介入":"未介入")+"</span>";
    html+="<div style='font-size:13px;color:var(--sub)'>主动查询：<b style='color:var(--txt)'>"+stats.callCount+"</b> 次 · 返回结果：<b style='color:var(--txt)'>"+stats.resultCount+"</b> 次</div></div></div>";
    if(stats.callCount>0){
      html+="<div style='display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-left:36px'>";
      html+="<span class='bdg b-COMPLETED' style='font-size:13px'>有效返回 "+stats.success+"</span>";
      html+="<span class='bdg b-FAILED' style='font-size:13px'>返回失败 "+stats.fail+"</span>";
      html+="<span class='bdg b-CREATED' style='font-size:13px'>知识盲区 "+stats.blind+"</span>";
      if(accessRate!=null&&!isNaN(accessRate))html+="<span class='bdg' style='font-size:13px;background:var(--p3);color:var(--sub)'>访问率 "+(accessRate*100).toFixed(2)+"%</span>";
      if(deliveryRate!=null&&!isNaN(deliveryRate))html+="<span class='bdg' style='font-size:13px;background:var(--p3);color:var(--sub)'>交付率 "+(deliveryRate*100).toFixed(2)+"%</span>";
      html+="</div>";
    }
    return html;
  }

  const kgStats=_stats(kgAll);
  const memStats=_stats(memAll);
  const kgActive=(kgAccess!==null&&kgAccess>0)||kgStats.callCount>0;
  let kgHtml="";
  kgHtml+=_sectionHtml("知识图谱","🔍",kgStats,kgAccess,kgDelivery);
  kgHtml+=_sectionHtml("记忆","🧠",memStats,memAccess,memDelivery);

  // 知识对漏洞判定的影响（正向/负向/中性），来源 per_case_kg_analysis.impact
  var pcAnalysis=group?(group.per_case_kg_analysis||[]):(r.per_case_kg_analysis||[]);
  if(pcAnalysis.length){
    var posCount=pcAnalysis.filter(p=>p.impact==="POSITIVE").length;
    var negCount=pcAnalysis.filter(p=>p.impact==="NEGATIVE").length;
    var neuCount=pcAnalysis.filter(p=>p.impact==="NEUTRAL").length;
    kgHtml+="<div style='display:flex;gap:8px;margin-bottom:12px'>";
    kgHtml+="<button class='bdg b-COMPLETED kg-filter-btn' style='font-size:14px;cursor:pointer;border:none;opacity:0.5' onclick='filterKgCases(this,\"POSITIVE\")'>正向 "+posCount+"</button>";
    kgHtml+="<button class='bdg b-FAILED kg-filter-btn' style='font-size:14px;cursor:pointer;border:none;opacity:0.5' onclick='filterKgCases(this,\"NEGATIVE\")'>负向 "+negCount+"</button>";
    kgHtml+="<button class='bdg b-CREATED kg-filter-btn' style='font-size:14px;cursor:pointer;border:none;opacity:0.5' onclick='filterKgCases(this,\"NEUTRAL\")'>中性 "+neuCount+"</button>";
    kgHtml+="<button class='bdg kg-filter-btn' style='font-size:14px;cursor:pointer;border:none;background:var(--p2);color:var(--sub);opacity:1;font-weight:700' onclick='filterKgCases(this,\"ALL\")'>全部 "+pcAnalysis.length+"</button>";
    kgHtml+="</div>";
  }

  // 基线漏洞 per-case 分析

      }).join('');
      return `${isAc?'':`<div class="card" style="margin-bottom:16px"><h3>${srcIcon} 误报率（基线 vs ${srcLabel}数据）</h3>${stats}</div>`}

  // 异步加载 FPR 段和 KG 段（三段拆分后主报告不含这些大字段）

  if(_evalId&&!_partial){

    var _hasInlineKg=_mg.some(function(g){return g.per_case_kg_analysis&&g.per_case_kg_analysis.length>0;});

          if(_ac_kg)_mining.e2e_fpr_kg=Object.assign({},_ac_kg,{vc_ids:fpr.vc_ids_kg||[]});
          if(_ac_nogk)_mining.e2e_fpr_nogk=Object.assign({},_ac_nogk,{vc_ids:fpr.vc_ids_nogk||[]});

async function saveSystemConfig(){
  var body={};
  var v;
  var fields=["llm_conc:llm_max_concurrency","max_evals:max_concurrent_evals","eval_pool_max:eval_pool_max",
    "parse_workers:parse_workers","source_fill_workers:source_fill_workers","ac_fetch_workers:ac_fetch_workers",
    "resolver_workers:resolver_workers","ai_match_workers:ai_match_workers","ac_llm_workers:ac_llm_workers",
    "fpr_cond_workers:fpr_cond_workers","fpr_baseline_workers:fpr_baseline_workers",
    "fpr_baseline_batch:fpr_baseline_batch","kg_analysis_workers:kg_analysis_workers","bootstrap_workers:bootstrap_workers"];
  for(var i=0;i<fields.length;i++){
    var parts=fields[i].split(":");
    var elId="cfg_"+parts[0],key=parts[1];
    var el=$(elId);
    if(el){v=parseInt(el.value);if(!isNaN(v))body[key]=v;}
  }
  $("cfg_msg").innerHTML="<span style='color:var(--sub)'>保存中...</span>";
  try{
    var r=await jput("/api/v1/system/config",body);
    $("cfg_msg").innerHTML="<span style='color:var(--green)'>已保存："+r.updated.join("， ")+"</span>";
  }catch(e){
    $("cfg_msg").innerHTML="<span style='color:var(--red)'>保存失败："+e+"</span>";
  }
}

// iframe 固化报告的重跑/删除按钮通过 postMessage 回传到 dashboard（仅 debug 模式）
if(DEBUG) window.addEventListener("message",function(ev){
  var d=ev.data||{};
  if(d.action==="retry"&&d.evaluation_id){retryEval(d.evaluation_id);}
  else if(d.action==="delete"&&d.evaluation_id){deleteEval(d.evaluation_id,d.evaluation_id);}
});
