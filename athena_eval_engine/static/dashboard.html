<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识测评</title>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--p2:#f0f2f5;--bd:#e1e4e8;--txt:#1a1d23;--sub:#6b7280;--acc:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--gray:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:18px;line-height:1.6;display:flex;height:100vh;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
header{height:64px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0;background:var(--header-bg)}
header .title{font-size:18px;font-weight:600}
header .sub{color:var(--sub);font-size:15px}
header .sp{flex:1}
header button{background:var(--acc);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:500;transition:.15s}
header button:hover{filter:brightness(1.1)}
header button.ghost{background:var(--p2);border:1px solid var(--bd);color:var(--txt)}
main{flex:1;overflow:hidden;padding:28px}
#view{height:100%;display:flex;flex-direction:column}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--sub);text-align:center;gap:16px}
.empty .ic{width:72px;height:72px;border-radius:18px;background:var(--p2);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:32px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty h3{color:var(--txt);font-size:19px}
.empty p{max-width:440px;font-size:16px}
.cols{display:flex;gap:20px;height:100%}
.lst{width:360px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.lst .h{padding:16px 18px;border-bottom:1px solid var(--bd);font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.lst .b{flex:1;overflow-y:auto;padding:8px}
.it{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:background .15s}
.it:hover{background:var(--p2)}
.it.act{background:rgba(91,156,246,.12)}
.it .n{font-size:17px;font-weight:500;margin-bottom:4px}
.it .m{font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center}
.ev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ev-card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.ev-card:hover{border-color:var(--acc);box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-1px)}
.ev-card .ev-name{font-size:16px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-card .ev-meta{font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-card .ev-actions{display:flex;gap:4px;margin-left:auto}
.back-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-bar .back-btn{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:15px;color:var(--txt);display:flex;align-items:center;gap:6px;transition:.15s}
.back-bar .back-btn:hover{background:var(--bd)}
.bdg{font-size:14px;padding:2px 8px;border-radius:12px;font-weight:600}
.b-COMPLETED{background:rgba(74,222,128,.18);color:var(--green)}
.b-COMPLETEDWITHWARNINGS,.b-COMPLETED_WITH_WARNINGS{background:rgba(251,191,36,.18);color:var(--amber)}
.b-FAILED,.b-CANCEL,.b-CANCELLED,.b-CANCELLING{background:rgba(248,113,113,.18);color:var(--red)}
.b-CREATED,.b-QUEUED{background:rgba(107,114,128,.18);color:var(--gray)}
.b-RUNNING,.b-VALIDATING,.b-PARSING,.b-AI_MATCHING,.b-RESOLVING,.b-CALCULATING{background:rgba(96,165,250,.18);color:var(--acc)}
.rep{flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:22px}
.card.f{grid-column:1/-1}
.card h3{font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.tier{font-size:14px;padding:3px 8px;border-radius:12px;font-weight:600}
.t-p0{background:rgba(91,156,246,.18);color:var(--acc)}
.t-p1{background:rgba(251,191,36,.18);color:var(--amber)}
.t-p2{background:rgba(107,114,128,.18);color:var(--gray)}
table{width:100%;border-collapse:collapse;font-size:17px}
th{color:var(--sub);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px;text-transform:uppercase;letter-spacing:.4px}
td{padding:12px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
td.num{font-family:"SF Mono",Consolas,monospace;color:var(--acc)}
.ci{color:var(--sub);font-size:14px;font-family:"SF Mono",Consolas,monospace}
.na{color:var(--red);font-style:italic;font-size:16px}
.dp{color:var(--green)}.dn{color:var(--red)}
.diag{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:10px;padding:12px 14px;margin:8px 0}
.diag .rid{color:var(--amber);font-weight:600;font-size:14px;font-family:monospace}
.diag .ob{font-weight:500;font-size:17px}.diag .ip{color:var(--sub);font-size:15px;margin-top:4px}
.narr{font-size:17px;line-height:1.8}.narr b{color:var(--sub);font-weight:500}
.note{font-size:14px;color:var(--sub);margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
svg{display:block;margin:0 auto;max-width:100%}
.lg{display:flex;gap:18px;justify-content:center;margin-top:10px}.lg span{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:6px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.sel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;max-height:300px;overflow-y:auto}
.opt{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;display:grid;grid-template-columns:minmax(0,.85fr) 96px minmax(0,1.15fr);align-items:center;column-gap:12px;font-size:17px}
.opt:hover{background:var(--p2)}
/* 自定义弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:440px;width:90%;overflow:hidden;animation:pop .15s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal .modal-head{padding:20px 24px 12px;display:flex;align-items:center;gap:12px}
.modal .modal-head .modal-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.modal .modal-head h3{font-size:18px;font-weight:600}
.modal .modal-body{padding:4px 24px 16px;font-size:15px;color:var(--sub);line-height:1.7}
.modal .modal-body ul{list-style:none;padding:0;margin:8px 0}
.modal .modal-body li{padding:3px 0;padding-left:18px;position:relative}
.modal .modal-body li:before{content:"•";position:absolute;left:0;color:var(--amber)}
.modal .modal-foot{padding:14px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--bd)}
.opt.sel{background:rgba(91,156,246,.12);border-left:3px solid var(--acc)}
.opt .l{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.opt .r{font-size:14px;color:var(--sub)}
.opt .opt-main{display:flex;align-items:center;gap:8px;min-width:0}.opt .opt-mid,.opt .opt-right{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.opt .opt-right{text-align:right}
.btn{background:var(--acc);color:#fff;border:none;padding:11px 20px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:var(--p2);border:1px solid var(--bd);color:var(--txt)}
label{display:block;font-size:15px;color:var(--sub);margin:12px 0 5px}
input,select{width:100%;background:var(--p2);border:1px solid var(--bd);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:17px;font-family:inherit}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st{font-size:16px;color:var(--amber);margin:10px 0;min-height:18px}
.knd{font-size:14px;padding:2px 7px;border-radius:8px;background:var(--p2);color:var(--sub)}
.knd.k-opencode{background:rgba(74,222,128,.18);color:var(--green)}
.knd.k-argo{background:rgba(96,165,250,.18);color:var(--acc)}
.knd.k-turing{background:rgba(217,119,6,.18);color:var(--amber)}.mcard{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px 16px;text-align:center;transition:transform .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.mc-icon{font-size:24px;margin-bottom:6px}
.mc-label{font-size:14px;color:var(--sub);margin-bottom:6px}
.mc-val{font-size:24px;font-weight:700;font-family:"SF Mono",Consolas,monospace}
.mc-ci{font-size:14px;color:var(--sub);margin-top:6px;font-family:"SF Mono",Consolas,monospace}
.mc-n{font-size:14px;color:var(--gray)}
.barr{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-l{font-size:16px;width:140px;flex-shrink:0}
.bar-track{flex:1;height:28px;background:var(--p2);border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.bar-fill{height:100%;border-radius:14px;transition:width .5s}
.bar-v{font-size:18px;font-weight:600;width:60px;text-align:right;font-family:"SF Mono",Consolas,monospace}
.ps{display:flex;gap:14px;padding:0 0 0 0;position:relative}
.ps:not(:last-child)::after{content:"";position:absolute;left:15px;top:36px;bottom:0;width:2px;background:var(--bd)}
.ps-n{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;z-index:1}
.ps-body{flex:1;padding-bottom:20px;font-size:16px;line-height:1.8}
.ps-det{font-size:14px;color:var(--sub);font-family:"SF Mono",Consolas,monospace}
.ps-body b{font-size:17px}
.ef-btn{background:var(--p2);border:1px solid var(--bd);color:var(--sub);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:14px;flex:1}
.ef-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ef-btn:hover{border-color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="title" id="h-title">知识测评</div><div class="sub" id="h-sub"></div><div class="sp"></div>
    <button class="ghost" onclick="renderCreate()">+ 新建评测</button>
    <button class="ghost" onclick="render()">刷新</button>
    <button class="ghost" id="theme-btn" onclick="toggleTheme()" style="font-size:18px;padding:8px 12px">🌙</button>
  </header>
  <main><div id="view"></div></main>
</div>
<script>
const DEBUG=new URLSearchParams(location.search).get("debug")==="true";
const U=(u)=>location.pathname.indexOf("/eval")===0&&(u.indexOf("/api/")===0||u.indexOf("/reports/")===0)?"/eval"+u:u;const F=(u,...a)=>fetch(U(u),...a);let activeId=null;
const THEMES={
  light:{"--bg":"#f5f6f8","--panel":"#ffffff","--p2":"#f0f2f5","--bd":"#e1e4e8","--txt":"#1a1d23","--sub":"#6b7280","--acc":"#2563eb","--green":"#16a34a","--red":"#dc2626","--amber":"#d97706","--gray":"#9ca3af","--nav-bg":"#1a1d23","--td-bd":"var(--bd)","--card-bg":"linear-gradient(145deg,#ffffff,#f8f9fa)","--mc-glow":"0 2px 16px rgba(22,163,74,.08)","--mc-neg-glow":"0 2px 16px rgba(220,38,38,.08)","--header-bg":"#ffffff","--bar-bg":"#e5e7eb","--hover-shadow":"0 8px 24px rgba(0,0,0,.1)"},
  dark:{"--bg":"#0b0e14","--panel":"#141821","--p2":"#1c212c","--bd":"#2a3140","--txt":"#e8eaed","--sub":"#a8b2c0","--acc":"#5b9cf6","--green":"#4ade80","--red":"#f87171","--amber":"#fbbf24","--gray":"#8b95a5","--nav-bg":"#080b10","--td-bd":"rgba(255,255,255,.04)","--card-bg":"linear-gradient(145deg,var(--panel),var(--p2))","--mc-glow":"0 0 24px rgba(74,222,128,.08)","--mc-neg-glow":"0 0 24px rgba(248,113,113,.08)","--header-bg":"rgba(20,24,33,.6)","--bar-bg":"var(--p2)","--hover-shadow":"0 8px 32px rgba(0,0,0,.3)"}
};
function applyTheme(t){
  const v=THEMES[t];const r=document.documentElement;
  for(const[k,val]of Object.entries(v))r.style.setProperty(k,val);
  const btn=$("theme-btn");if(btn)btn.textContent=t==="dark"?"☀️":"🌙";
  localStorage.setItem("eval-theme",t);
}
function toggleTheme(){const cur=localStorage.getItem("eval-theme")||"light";applyTheme(cur==="light"?"dark":"light");}
applyTheme(localStorage.getItem("eval-theme")||"light");

let w={proj:"",task:"",kg:"",nogk:"",biid:"BI-T001",tfid:"F-T001",eid:""};

function $(i){return document.getElementById(i);}
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstChild;}
function fmtMtime(mt){if(!mt)return'-';const d=new Date(mt*1000+8*3600000);const p=n=>String(n).padStart(2,'0');return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());}
function fmtDate(s){if(!s)return'-';const d=new Date(s+'Z');if(isNaN(d))return s;const b=new Date(d.getTime()+8*3600000);const p=n=>String(n).padStart(2,'0');return b.getUTCFullYear()+'-'+p(b.getUTCMonth()+1)+'-'+p(b.getUTCDate())+' '+p(b.getUTCHours())+':'+p(b.getUTCMinutes());}
async function jget(u){const r=await F(u);if(!r.ok)throw new Error(r.status);return r.json();}
async function jpost(u,b){const r=await F(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d;}

async function render(){
  const v=$("view");v.innerHTML='<div class="empty"><div class="ic">⏳</div><h3>加载中…</h3></div>';
  try{await renderEvals();}
  catch(e){v.innerHTML='<div class="empty"><div class="ic">⚠️</div><h3>错误</h3><p>'+e+'</p></div>';}
}

// ===== 评测列表 =====
async function renderEvals(){
  const d=await jget("/api/v1/evaluations?page_size=9999");const evs=d.evaluations||[];
  window._evData=evs;window._evPage=1;
  $("view").innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0">
    <input id="ev-search" placeholder="搜索 ID / 名称…" oninput="filterEvals()" style="max-width:300px">
    <div style="display:flex;gap:6px">
      <button class="ef-btn active" onclick="setEvFilter('all',this)">全部</button>
      <button class="ef-btn" onclick="setEvFilter('COMPLETED',this)">完成</button>
      <button class="ef-btn" onclick="setEvFilter('COMPLETED_WITH_WARNINGS',this)">警告</button>
      <button class="ef-btn" onclick="setEvFilter('FAILED',this)">失败</button>
    </div>
    <span style="margin-left:auto;font-size:14px;color:var(--sub)">共 ${evs.length} 条</span>
  </div>
  <div style="flex:1;overflow-y:auto"><div class="ev-grid" id="ev-list-body"></div></div>`;
  renderEvList();
}
function setEvFilter(f,btn){window._evFilter=f;window._evPage=1;document.querySelectorAll(".ef-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderEvList();}
function filterEvals(){window._evQ=$("ev-search").value.toLowerCase();window._evPage=1;renderEvList();}
function evPage(p){window._evPage=p;renderEvList();}
const EV_PAGE_SIZE=12;
function renderEvList(){
  const evs=window._evData||[];const f=window._evFilter||"all";const q=window._evQ||"";
  let filtered=evs;
  if(f!=="all")filtered=filtered.filter(e=>(e.status||"").startsWith(f));
  if(q)filtered=filtered.filter(e=>(e.evaluation_id+e.name).toLowerCase().includes(q));
  const total=filtered.length;
  const pages=Math.ceil(total/EV_PAGE_SIZE)||1;
  const page=Math.min(window._evPage||1,pages);
  const start=(page-1)*EV_PAGE_SIZE;
  const pageItems=filtered.slice(start,start+EV_PAGE_SIZE);
  const el=$("ev-list-body");
  if(!el)return;
  let html=pageItems.length?pageItems.map(function(e){
    var badge=(e.status||'').replace('_WITH_WARNINGS','').replace('CANCEL','FAILED');
    var isTerminal=e.status==='COMPLETED'||e.status==='COMPLETED_WITH_WARNINGS'||e.status==='FAILED';
    var safeName=(e.name||e.evaluation_id).replace(/'/g,'');
    var btns=DEBUG?'<span class="ev-actions" onclick="event.stopPropagation()">'+
      '<button class="btn g" style="font-size:12px;padding:2px 8px" onclick="retryEval(\''+e.evaluation_id+'\')">重跑</button>'+
      (isTerminal?'<button class="btn" style="font-size:12px;padding:2px 8px;background:var(--red)" onclick="deleteEval(\''+e.evaluation_id+'\',\''+safeName+'\')">删除</button>':'')+
      '</span>':'';
    return '<div class="ev-card '+(e.evaluation_id===activeId?'act':'')+'" onclick="selEv(\''+e.evaluation_id+'\')">'+
      '<div class="ev-name" title="'+(e.name||e.evaluation_id).replace(/"/g,'&quot;')+'">'+(e.name||e.evaluation_id)+'</div>'+
      '<div class="ev-meta"><span class="bdg b-'+badge+'">'+(e.status||'-')+'</span><span>'+fmtDate(e.created_at)+'</span>'+btns+'</div>'+
      '<div style="font-size:12px;color:var(--gray);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e.evaluation_id+'</div>'+
      '<div style="font-size:13px;line-height:1.5;margin-top:4px">'+
        '<div><span style="color:var(--gray)">KG：</span><b>'+(e.kg_project||'-')+'</b> / '+(e.kg_task||'-')+'</div>'+
        (e.nogk_project?'<div><span style="color:var(--gray)">No-KG：</span><b>'+(e.nogk_project||'-')+'</b> / '+(e.nogk_task||'-')+'</div>':'')+
        '<div><span style="color:var(--gray)">基线：</span><b>'+(e.benchmark_source==='vuln_center'?('漏洞中心 · '+(e.vc_project_name||'-')+' / '+(e.vc_task_name||'-')):(e.vbench_project_name||'无 GT'))+'</b></div>'+
      '</div>'+
      '</div>';
  }).join(""):'<div style="padding:48px;text-align:center;color:var(--sub);font-size:16px;grid-column:1/-1">无匹配评测</div>';
  // 分页控件
  if(pages>1){
    let pgHtml='<div style="display:flex;justify-content:center;align-items:center;gap:6px;padding:16px 0 0;grid-column:1/-1">';
    pgHtml+=`<button class="ef-btn" ${page<=1?'disabled':''} onclick="evPage(${page-1})" style="padding:6px 12px;font-size:14px">‹ 上一页</button>`;
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||(i>=page-1&&i<=page+1)){
        pgHtml+=`<button class="ef-btn ${i===page?'active':''}" onclick="evPage(${i})" style="padding:6px 10px;font-size:14px;min-width:32px">${i}</button>`;
      }else if(i===page-2||i===page+2){
        pgHtml+='<span style="color:var(--sub);font-size:14px">…</span>';
      }
    }
    pgHtml+=`<button class="ef-btn" ${page>=pages?'disabled':''} onclick="evPage(${page+1})" style="padding:6px 12px;font-size:14px">下一页 ›</button>`;
    pgHtml+=`<span style="font-size:13px;color:var(--sub);margin-left:8px">${start+1}-${Math.min(start+EV_PAGE_SIZE,total)}/${total}</span>`;
    pgHtml+='</div>';
    html+=pgHtml;
  }
  el.innerHTML=html;
}

async function selEv(id){
  activeId=id;
  try{const s=await jget(`/api/v1/evaluations/${id}`);
    // FAILED: 直接显示错误 + 重试
    if(s.status==="FAILED"){
      var name=s.name||"";
      var m1=name.match(/FAILED at (\w+):/)||[];
      var phase=m1[1]||"";
      var phaseLabel={"PARSING":"解析 Trace","AI_MATCHING":"漏洞匹配","RESOLVING":"提取 Fact","CALCULATING":"计算指标","REPORTING":"生成报告","RUNNING":"准备阶段","UNKNOWN":"未知阶段"}[phase]||phase||"";
      if(phase==="REPORTING"&&!(s.progress&&s.progress.indexOf("生成报告")>=0)){phaseLabel="知识与记忆介入分析";}
      var errMsg=s.error_message||"无详细错误信息";
      $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div class="empty"><div class="ic">⚠️</div><h3>评测失败</h3><p style="font-size:15px;color:var(--amber);margin-bottom:8px">失败步骤：'+phaseLabel+'</p><p style="font-size:14px;color:var(--red);max-width:500px;text-align:left;word-break:break-all">'+errMsg+'</p>'+(DEBUG?'<button class="btn" style="margin-top:16px" id="retry-btn">重试</button>':'')+'</div>';
      var rb=$("retry-btn");if(rb)rb.onclick=function(){retryEval(id);};
      return;
    }
    // 运行中: 显示进度
    if(s.status==="RUNNING"||s.status==="CREATED"||s.status==="QUEUED"||s.status==="PARSING"||s.status==="AI_MATCHING"||s.status==="RESOLVING"||s.status==="PAIRING"||s.status==="CALCULATING"||s.status==="REPORTING"||s.status==="FINALIZING"){
      var phases=[{key:"PARSING",label:"解析 Trace"},{key:"AI_MATCHING",label:"漏洞匹配"},{key:"RESOLVING",label:"提取 Fact"},{key:"PAIRING",label:"任务配对"},{key:"CALCULATING",label:"计算指标"},{key:"KNOWLEDGE_ANALYSIS",label:"知识与记忆介入分析"},{key:"REPORTING",label:"生成报告"}];
      var phaseMap={"CREATED":0,"QUEUED":0,"RUNNING":0,"PARSING":1,"AI_MATCHING":2,"RESOLVING":3,"PAIRING":4,"CALCULATING":5,"REPORTING":7,"FINALIZING":8};
      var curStep=phaseMap[s.status]||0;
      // 知识与记忆介入分析是 REPORTING 的子阶段，通过 progress 文本区分
      if(s.status==="REPORTING"){
        if(s.progress&&s.progress.indexOf("生成报告")>=0){curStep=7;}
        else{curStep=6;}
      }
      var totalSteps=phases.length;
      var progressPct=Math.round((curStep/(totalSteps+1))*100);
      var stepsHtml='<div style="margin:24px 0">';
      stepsHtml+='<div style="height:5px;background:var(--p2);border-radius:5px;margin-bottom:20px;overflow:hidden"><div style="height:100%;width:'+progressPct+'%;background:linear-gradient(90deg,var(--acc),#7c3aed);transition:width .5s;border-radius:5px"></div></div>';
      phases.forEach(function(p,i){
        var done=curStep>i+1;var active=curStep===i+1;var stepNum=i+1;
        var bg=done?"rgba(74,222,128,.12)":active?"rgba(124,58,237,.12)":"var(--p2)";
        var borderC=done?"rgba(74,222,128,.4)":active?"rgba(124,58,237,.4)":"transparent";
        var color=done?"var(--green)":active?"var(--acc)":"var(--gray)";
        var icon=done?"✅":(active?"⏳":"⏸");
        stepsHtml+='<div style="display:flex;align-items:center;gap:14px;padding:10px;margin-bottom:8px;background:'+bg+';border:1px solid '+borderC+';border-radius:10px;transition:all .3s">';
        stepsHtml+='<span style="font-size:18px;width:38px;height:38px;border-radius:50%;background:'+(done?"rgba(74,222,128,.2)":active?"rgba(124,58,237,.2)":"rgba(107,114,128,.1)")+';display:flex;align-items:center;justify-content:center;color:'+color+';font-size:16px">'+icon+'</span>';
        stepsHtml+='<div><div style="font-size:16px;color:'+color+';font-weight:'+(active?'700':'400')+'">'+stepNum+'. '+p.label+(active?'…':'')+'</div>';
        if(done){stepsHtml+='<div style="font-size:12px;color:var(--sub)">已完成</div>';}
        else if(active){stepsHtml+='<div style="font-size:12px;color:var(--acc)">进行中</div>';}
        else{stepsHtml+='<div style="font-size:12px;color:var(--gray)">等待中</div>';}
        stepsHtml+='</div></div>';
      });
      stepsHtml+='</div>';
      // 运行中也可强制重跑（卡住时用户可手动重启），仅 debug 模式显示
      if(DEBUG) stepsHtml+='<div style="text-align:center;margin-top:16px"><button class="btn g" id="force-retry-btn" style="font-size:14px;padding:8px 20px">强制重跑</button></div>';
      var progressHtml='<div id="eval-progress" style="text-align:center;font-size:14px;color:var(--acc);margin-top:10px;font-weight:600'+(s.progress?'':';display:none')+'">'+(s.progress||'')+'</div>';
      $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div style="padding:30px 20px"><div style="text-align:center;margin-bottom:10px"><span style="font-size:28px">⚙️</span> <span style="font-size:20px;font-weight:700;color:var(--txt)">评测运行中</span><div style="font-size:14px;color:var(--sub);margin-top:4px">'+(s.name||'')+'</div><div style="font-size:12px;color:var(--gray)">'+id+'</div></div>'+stepsHtml+progressHtml+'<div style="text-align:center;font-size:13px;color:var(--sub);margin-top:8px">'+s.status+' · '+progressPct+'%</div></div>';
      var frb=$("force-retry-btn");if(frb)frb.onclick=function(){retryEval(id);};
      let cnt=0;const poll=async()=>{cnt++;if(cnt>14400)return;
        if(activeId!==id)return;  // 用户已切走，停止旧评测轮询
        try{const st=await jget(`/api/v1/evaluations/${id}`);
          if(st.status==="COMPLETED"||st.status==="COMPLETED_WITH_WARNINGS"){
            // 优先固化 HTML（HEAD 探测）
            try{
              const probe=await F(`/reports/${id}.html`,{method:'HEAD'});
              if(probe.ok){
                loadIframeReport(id);
                return;
              }
            }catch(e){}
            const r=await jget(`/api/v1/evaluations/${id}/report`);renderReport(r);
          }
          else if(st.status==="FAILED"){selEv(id);}
          else if(st.status!==s.status){
            // 更新缓存中的状态
            if(window._evData){var ev=window._evData.find(e=>e.evaluation_id===id);if(ev){ev.status=st.status;}}
            selEv(id);
          }
          else{
            var pe=$("eval-progress");
            if(pe){if(st.progress){pe.textContent=st.progress;pe.style.display='block';}else{pe.style.display='none';}}
            setTimeout(poll,20000);
          }
        }catch(e){}};
      setTimeout(poll,20000);return;
    }
  }catch(e){}
  // COMPLETED: 加载报告（优先固化 HTML iframe，回退动态接口）
  $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div class="empty"><div class="ic">⏳</div><h3>加载报告…</h3></div>';
  try{
    // 先探测固化 HTML 是否存在（HEAD 请求不下载 body）
    const probe=await F(`/reports/${id}.html`,{method:'HEAD'});
    if(probe.ok){
      loadIframeReport(id);
      return;
    }
  }catch(e){}
  try{const r=await jget(`/api/v1/evaluations/${id}/report`);renderReport(r);}
  catch(e){$("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div class="empty"><div class="ic">⚠️</div><h3>报告未就绪</h3><p>'+e+'</p></div>';}
}
function loadIframeReport(id){
  var rep=$("view");

  rep.innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div style="width:100%;flex:1;overflow:hidden"><iframe src="'+U('/reports/'+id+'.html')+'" style="width:100%;height:100%;border:none;background:#fff;display:block"></iframe></div>';
}
function retryEval(eid){
  showConfirm({icon:'⚠️',iconBg:'rgba(251,191,36,.15)',iconColor:'var(--amber)',title:'重跑评测',
    desc:'重跑将清除该评测的全部数据，重新解析 trace 并调用 LLM。',
    risks:['耗时可能较长（10-30 分钟）','如果 LLM 不可用会降级为规则生成','旧报告会被覆盖'],
    confirmText:'重跑',confirmColor:'var(--acc)',
    onConfirm:function(){
      var rep=$("view");if(rep)rep.innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div class="empty"><div class="ic" style="animation:spin 1s linear infinite">⏳</div><h3>正在重新启动评测…</h3><p style="font-size:14px;color:var(--sub)">清理旧数据并重新解析中</p></div>';
      jget('/api/v1/evaluations/'+eid+'/report').then(function(){}).catch(function(){});
      F('/api/v1/evaluations/'+eid+'/retry?force=true',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
        if(d.status==='QUEUED'||d.status==='RUNNING'){
          var pollCnt=0;
          var retryPoll=function(){
            pollCnt++;if(pollCnt>30)return;
            if(activeId!==eid)return;  // 用户已切走，停止重跑轮询
            jget('/api/v1/evaluations/'+eid).then(function(s){
              if(s.status==='FAILED'){setTimeout(retryPoll,1000);}
              else{selEv(eid);}
            }).catch(function(){setTimeout(retryPoll,1000);});
          };
          setTimeout(retryPoll,500);
        }else{
          alert('重试失败: '+JSON.stringify(d));
        }
      }).catch(function(e){alert('重试失败: '+e);});
    }
  });
}
function deleteEval(eid,name){
  showConfirm({icon:'🗑️',iconBg:'rgba(248,113,113,.15)',iconColor:'var(--red)',title:'删除评测',
    desc:'删除将永久清除该评测的全部数据，不可恢复。',
    risks:['trace 解析结果（facts、events）','指标计算结果（M1-M10、统计检验）','AI 分析报告（叙述、漏洞对比）','基线匹配数据'],
    confirmText:'永久删除',confirmColor:'var(--red)',
    onConfirm:function(){
  F('/api/v1/evaluations/'+eid,{method:'DELETE'}).then(r=>r.json()).then(d=>{
    if(d.status==='ok'){
      renderEvals();
      $("view").innerHTML='<div class="empty"><div class="ic">🗑️</div><h3>评测已删除</h3><p>'+eid+'</p><button class="btn" style="margin-top:16px" onclick="renderEvals()">返回列表</button></div>';
    }else{
      alert('删除失败: '+JSON.stringify(d));
    }
  }).catch(e=>alert('删除失败: '+e));
    }
  });
}
function showConfirm(opts){
  var ov=document.createElement('div');ov.className='modal-overlay';
  var risksHtml=(opts.risks||[]).map(function(r){return '<li>'+r+'</li>'}).join('');
  ov.innerHTML='<div class="modal">'+
    '<div class="modal-head"><div class="modal-icon" style="background:'+opts.iconBg+';color:'+opts.iconColor+'">'+opts.icon+'</div><h3>'+opts.title+'</h3></div>'+
    '<div class="modal-body"><p>'+opts.desc+'</p>'+(risksHtml?'<ul>'+risksHtml+'</ul>':'')+'</div>'+
    '<div class="modal-foot"><button class="btn g" style="font-size:15px;padding:8px 20px" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>'+
    '<button class="btn" style="font-size:15px;padding:8px 20px;background:'+opts.confirmColor+'" id="modal-confirm">'+opts.confirmText+'</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});
  document.getElementById('modal-confirm').onclick=function(){ov.remove();if(opts.onConfirm)opts.onConfirm()};
}

function fmtDur(ms){
  if(ms===null||ms===undefined)return'<span class="na">NA</span>';
  var abs=Math.abs(ms);var sign=ms<0?'-':'';
  if(abs>=3600000){var h=Math.floor(abs/3600000);var m=Math.floor((abs%3600000)/60000);return sign+h+'<span class="ci">时</span> '+m+'<span class="ci">分</span>';}
  if(abs>=60000){var m2=Math.floor(abs/60000);var s=Math.floor((abs%60000)/1000);return sign+m2+'<span class="ci">分</span> '+s+'<span class="ci">秒</span>';}
  if(abs>=1000){return sign+(abs/1000).toFixed(1)+'<span class="ci">秒</span>';}
  return sign+Math.round(abs)+'<span class="ci">ms</span>';
}
function fmt(v,u){
  if(v===null||v===undefined)return'<span class="na">NA</span>';
  if(u==="ratio")return (v*100).toFixed(1)+'<span class="ci">%</span>';
  if(u==="ms")return fmtDur(v);
  if(u==="steps"||u==="tokens"){const a=Math.abs(v);let s;
    if(a>=1e9)s=(v/1e9).toFixed(2)+'B';else if(a>=1e6)s=(v/1e6).toFixed(2)+'M';else if(a>=1e3)s=(v/1e3).toFixed(1)+'K';else s=Math.round(v).toString();
    return s+'<span class="ci">'+(u==="tokens"?" tok":" steps")+'</span>';}
  return Number(v).toFixed(3);
}
function fmtNum(v){const a=Math.abs(v);
  if(a>=1e9)return(v/1e9).toFixed(2)+'B';
  if(a>=1e6)return(v/1e6).toFixed(2)+'M';
  if(a>=1e3)return(v/1e3).toFixed(1)+'K';
  return Math.round(v).toString();}
const MI={
  M1:{n:"准确率变化(ΔBA)",short:"Δ准确率",d:"KG vs No-KG 的平衡准确率差值。正值=KG 更准，负值=更差。",u:"ratio",
     range:[{v:-1,t:"KG 更差",c:"red"},{v:0,t:"无差异",c:"amber"},{v:1,t:"KG 更准",c:"green"}],
     interp:(v)=>v==null?"无基准，无法计算":v>0.05?`KG 准确率高出 ${(v*100).toFixed(1)}pp`:v<-0.05?`KG 准确率低 ${(-v*100).toFixed(1)}pp`:"准确率无明显差异",
     formula:"BA_KG - BA_NoKG, BA=(TPR+TNR)/2, TPR=TP/(TP+FN), TNR=TN/(TN+FP)"},
  M4:{n:"漏报率变化(ΔFNR)",short:"Δ漏报率",d:"KG vs No-KG 漏报率差值。负值=KG 漏报更少(好)，正值=更多。",u:"ratio",
     range:[{v:-1,t:"KG 漏报少",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 漏报多",c:"red"}],

     formula:"FNR_KG - FNR_NoKG, FNR=FN/(FN+TP)"},
  M13:{n:"误报率变化(ΔFPR)",short:"Δ误报率",d:"KG vs No-KG 误报率差值。负值=KG 误报更少(好)，正值=更多。",u:"ratio",
     range:[{v:-1,t:"KG 误报少",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 误报多",c:"red"}],

     formula:"FPR_KG - FPR_NoKG, FPR=FP/(FP+TN)"},
  M14:{n:"精确率变化(ΔPrecision)",short:"Δ精确率",d:"KG vs No-KG 精确率差值。正值=KG 报出的漏洞更准，负值=更差。",u:"ratio",
     range:[{v:-1,t:"KG 更差",c:"red"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 更准",c:"green"}],
     interp:(v)=>v==null?"无基准":v>0?`KG 精确率高出 ${(v*100).toFixed(1)}pp`:v<0?`KG 精确率低 ${(-v*100).toFixed(1)}pp`:"精确率无明显差异",
     formula:"Precision_KG - Precision_NoKG, Precision=TP/(TP+FP)"},
  M5:{n:"知识访问率(KAR)",short:"知识访问",d:"Agent 工具调用中知识查询所占比例（交互级）。衡量 Agent 对知识的依赖程度。",u:"ratio",
     range:[{v:0,t:"无访问",c:"red"},{v:0.05,t:"少量",c:"amber"},{v:0.15,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到知识访问":v>=0.15?`知识访问率 ${(v*100).toFixed(1)}%, 充分`:v>=0.05?`知识访问率 ${(v*100).toFixed(1)}%, 少量`:`知识访问率 ${(v*100).toFixed(1)}%, 占比低`,
     formula:"kg_count / total_tool_calls (知识查询次数 / 总工具调用次数)"},
  M6:{n:"知识交付率(KDR)",short:"知识交付",d:"知识查询中平台有效回复的比例（交互级）。衡量知识质量。",u:"ratio",
     range:[{v:0,t:"无交付",c:"red"},{v:0.5,t:"部分",c:"amber"},{v:0.8,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到知识交付":v>=0.8?`知识交付率 ${v*100}%, 充分`:v>=0.5?`知识交付率 ${v*100}%, 部分`:`知识交付率 ${v*100}%, 不足`,
     formula:"successful_read_count / access_event_count (有效回复次数 / 总查询次数)"},
  M11:{n:"记忆访问率(MAR)",short:"记忆访问",d:"Agent 工具调用中记忆读取/检索所占比例。与知识访问率同算法。",u:"ratio",
     range:[{v:0,t:"无访问",c:"red"},{v:0.05,t:"少量",c:"amber"},{v:0.15,t:"充分",c:"green"}],
     interp:(v)=>v==null?"未观测到记忆访问":v>=0.15?`记忆访问率 ${(v*100).toFixed(1)}%, 充分`:v>=0.05?`记忆访问率 ${(v*100).toFixed(1)}%, 少量`:`记忆访问率 ${(v*100).toFixed(1)}%, 占比低`,
     formula:"memory_access_event_count / total_tool_calls (记忆读取次数 / 总工具调用次数)"},
  M12:{n:"记忆交付率(MDR)",short:"记忆交付",d:"记忆读取中成功返回的比例。与知识交付率同算法。",u:"ratio",
     range:[{v:0,t:"无交付",c:"red"},{v:0.5,t:"部分",c:"amber"},{v:0.8,t:"充分",c:"green"}],

     formula:"memory_successful_read_count / memory_access_event_count (成功读取次数 / 记忆读取次数)"},
  M7:{n:"行为偏移(JSD)",short:"行为偏移",d:"KG vs No-KG 工具使用分布差异。0=完全相同，1=完全不同。",u:"ratio",
     range:[{v:0,t:"无差异",c:"green"},{v:0.1,t:"轻微",c:"amber"},{v:0.3,t:"显著",c:"red"}],

     formula:"median(JSD_i), JSD_i=(0.5*KL(P||M)+0.5*KL(Q||M))/ln2, M=(P+Q)/2, P/Q=工具使用概率分布"},
  M8:{n:"Token变化(ΔToken)",short:"Token",d:"KG - No-KG 有效 token 消耗。负值=KG 更省。",u:"tokens",
     range:[{v:-1,t:"KG 更省",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 更耗",c:"red"}],
     interp:(v)=>v==null?"无法计算":v<0?`KG 少用 ${fmtNum(Math.abs(v))} token`:v>0?`KG 多用 ${fmtNum(v)} token`:"token 消耗无差异",
     formula:"median(KG_tokens - NoKG_tokens)"},
  M9:{n:"步数变化(ΔSteps)",short:"步数",d:"KG - No-KG 推理步数。负值=KG 更少步。",u:"steps",
     range:[{v:-1,t:"KG 更少",c:"green"},{v:0,t:"无变化",c:"amber"},{v:1,t:"KG 更多",c:"red"}],
     interp:(v)=>v==null?"无法计算":v<0?`KG 少 ${fmtNum(Math.abs(v))} 步`:v>0?`KG 多 ${fmtNum(v)} 步`:"步数无差异",

  M10:{n:"时长变化(ΔTime)",short:"时长",d:"KG - No-KG 运行时长(ms)。负值=KG 更快。",u:"ms",

     interp:(v)=>v==null?"无法计算":v<0?`KG 快 ${fmtDur(-v)}`:v>0?`KG 慢 ${fmtDur(v)}`:"时长无差异",

};
function mInfo(id){const m=MI[id];return m?`<div style="font-size:15px;color:var(--sub);margin-top:4px;line-height:1.5">${m.d}<br><span style="color:var(--gray);font-size:14px">单位：${m.u}</span></div>`:"";}
function dc(v,u){if(v===null||v===undefined)return"";if(u==="ratio")return v>0?"dp":"dn";return v<0?"dp":"dn";}
function ci(m){if(!m||m.ci_lower===null||m.ci_lower===undefined)return"";const u=m.unit==="ratio"?"pp":(m.unit==="ms"?"s":(m.unit||""));const lo=m.unit==="ratio"?(m.ci_lower*100).toFixed(1):(m.unit==="ms"?(m.ci_lower/1000).toFixed(1):Number(m.ci_lower).toFixed(2));const hi=m.unit==="ratio"?(m.ci_upper*100).toFixed(1):(m.unit==="ms"?(m.ci_upper/1000).toFixed(1):Number(m.ci_upper).toFixed(2));return`<div class="ci">95% CI [${lo}, ${hi}] ${u}</div>`;}
function row(m,l){const mid=l.split(" ")[0];const mi=MI[mid]||{n:l,u:""};const RC={"NO_STRATUM":"基线全部为漏洞型，无对照样本","NO_VALID_DENOMINATOR":"No-KG 全部成功，无改善空间","NO_POSITIVE_GT":"无漏洞型基线","BOOTSTRAP_UNSTABLE":"样本量不足"};if(!m)return`<tr><td><b>${mi.n||l}</b><div style="font-size:14px;color:var(--sub)">${mi.d||""}</div></td><td class="na">未计算</td><td>-</td><td></td><td></td></tr>`;const c=m.calculation_status!=="CALCULATED"?`<span class="na">${m.calculation_status}<br><span style="font-size:14px">${RC[m.reason_code]||m.reason_code||""}</span></span>`:`<span class="${dc(m.estimate,m.unit)}">${fmt(m.estimate,m.unit)}</span>`;const n=m.n!=null?`<span class="ci">N=${m.n}</span>${m.median!=null?'<br><span class="ci">med '+fmt(m.median,m.unit)+'</span>':''}`:"-";const p=m.p_value!=null?`<span class="ci">p=${m.p_value<0.001?'<0.001':m.p_value.toFixed(3)}</span>`:(m.median!=null?'<span class="ci">Wilcoxon</span>':"");return`<tr><td><b>${mi.n||l}</b><div style="font-size:15px;color:var(--sub);line-height:1.5">${mi.d||""}<br><span style="color:var(--gray);font-size:14px">单位：${mi.u}</span></div></td><td class="num">${c}</td><td>${n}</td><td>${ci(m)}</td><td>${p}</td></tr>`;}

function selectReportTab(button,paneId){
  document.querySelectorAll('[data-report-tab]').forEach(el=>{el.style.display=el.id===paneId?'block':'none';});
  document.querySelectorAll('[data-report-tab-btn]').forEach(el=>{el.style.background='var(--panel)';el.style.color='var(--sub)';el.style.borderColor='var(--bd)';el.style.boxShadow='none';el.style.transform='none';el.setAttribute('aria-selected','false');});
  button.style.background='var(--acc)';button.style.color='#fff';button.style.borderColor='var(--acc)';button.style.boxShadow='0 8px 20px rgba(124,58,237,.28)';button.style.transform='translateY(-2px)';button.setAttribute('aria-selected','true');
}

function renderReport(d){
  $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="renderEvals()">← 返回列表</button></div><div id="rep-content" style="flex:1;overflow-y:auto"></div>';
  var rep=$("rep-content");
  rep.style.overflowY='auto';
  const r=d.report||{},p0=r.p0||{},p1=r.p1||{},p2=r.p2||{},h=r.diagnostic_hits||[],nt=r.notes||[],rw=r.raw_stats||{};

  // 指标卡片：名称 + 值 + 解读 + 参考范围条
  function mCard(mid,m){
    const mi=MI[mid]||{n:mid,short:mid,d:"",u:"",range:[],interp:()=>""};
    const RC={"NO_STRATUM":"基线全部为漏洞型，无对照样本","NO_VALID_DENOMINATOR":"No-KG 全部成功，无改善空间","NO_POSITIVE_GT":"无漏洞型基线","BOOTSTRAP_UNSTABLE":"样本量不足，bootstrap 不稳定","NO_VALID":"数据不足","INSUFFICIENT_DATA":"样本量不足","NO_DISCORDANT_PAIRS":"KG 与 No-KG 结果一致，无差异对","INSUFFICIENT_PAIRS":"配对数不足","ALL_ZERO_DIFFERENCES":"所有配对差异为零"};
    if(!m||m.calculation_status!=="CALCULATED"){
      const rc=m?m.reason_code||m.calculation_status:"无数据";
      const reason=RC[rc]||rc||"无数据";
      const nNote=m&&m.n!=null?` (N=${m.n})`:"";
      return `<div class="mcard na"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">${mid}</span> ${mi.short||""}</div><div class="mc-val na">N/A</div><div style="font-size:13px;color:var(--sub);margin-top:4px">${reason}${nNote}</div></div>`;
    }
    const v=m.estimate;
    const interp=mi.interp?mi.interp(v):"";
    let col="var(--gray)";
    if(mi.range){
      for(let i=mi.range.length-1;i>=0;i--){if(v>=mi.range[i].v){col=mi.range[i].c==="green"?"var(--green)":mi.range[i].c==="red"?"var(--red)":"var(--amber)";break;}}
    }
    const valStr=fmt(v,m.unit);
    // KG/No-KG 绝对值拆分显示（M1/M4/M13 差值类指标）
    const KG_FIELDS={"M1":{kg:"ba_kg",nogk:"ba_nogk"},"M4":{kg:"fnr_kg",nogk:"fnr_nogk"},"M13":{kg:"fpr_kg",nogk:"fpr_nogk"},"M14":{kg:"precision_kg",nogk:"precision_nogk"}};
    let kgBreakdown="";
    if(KG_FIELDS[mid]&&m.method){
      const kf=KG_FIELDS[mid];
      const kgV=m.method[kf.kg],nogkV=m.method[kf.nogk];
      if(kgV!=null&&nogkV!=null&&(r.has_nogk!==false)){
        kgBreakdown=`<div style="display:flex;gap:12px;margin-top:4px;font-size:13px"><span>KG <b style="color:var(--acc)">${(kgV*100).toFixed(1)}%</b></span><span>No-KG <b>${(nogkV*100).toFixed(1)}%</b></span></div>`;
      }
    }
    let rangeBar="";
    if(mi.range&&mi.range.length>=2){
      const min=mi.range[0].v,max=mi.range[mi.range.length-1].v;
      const pct=Math.min(100,Math.max(0,((v-min)/(max-min))*100));
      rangeBar=`<div class="bar-track" style="margin-top:6px;height:4px"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>`;
    }
    var formulaHtml=mi.formula?"<details style='margin-top:4px'><summary style='cursor:pointer;font-size:12px;color:var(--gray)'>计算公式</summary><div style='font-size:12px;color:var(--sub);font-family:monospace;background:var(--p2);padding:4px 6px;border-radius:4px;margin-top:4px'>"+mi.formula+"</div></details>":"";
    return '<div class="mcard" style="border-color:'+col+'33"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">'+mid+'</span> '+(mi.short||"")+'</div><div class="mc-val" style="color:'+col+'">'+valStr+'</div>'+kgBreakdown+'<div style="font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4">'+(mi.d||"")+'</div>'+rangeBar+formulaHtml+'</div>';
  }

  // 知识图谱与记忆介入情况：两种方案分别统计
  function buildKnowledgeHtml(group){
  const groupP1=group?(group.p1||{}):p1;
  const kar=groupP1.M5,kdr=groupP1.M6;
  const mar=groupP1.M11,mdr=groupP1.M12;
  const kgAccess=kar&&kar.calculation_status==="CALCULATED"?kar.estimate:null;
  const kgDelivery=kdr&&kdr.calculation_status==="CALCULATED"?kdr.estimate:null;
  const memAccess=mar&&mar.calculation_status==="CALCULATED"?mar.estimate:null;
  const memDelivery=mdr&&mdr.calculation_status==="CALCULATED"?mdr.estimate:null;
  const taskId=group&&group.task_id;
  const kgData=taskId?(d.knowledge_interactions||[]).filter(k=>k.task_run_id.includes("-"+taskId+"-KG")):(d.knowledge_interactions||[]);

  // 分别提取知识图谱交互和记忆交互
  const kgAll=[],memAll=[];
  kgData.forEach(k=>{
    (k.interactions||[]).forEach(i=>kgAll.push(i));
    const mem=k.memory||{};
    (mem.interactions||[]).forEach(i=>memAll.push(i));
  });

  // 统计辅助函数：计算主动查询、返回结果、有效返回、返回失败、知识盲区
  function _stats(arr){
    const callCount=arr.filter(function(iv){return iv.type==="CALL";}).length;
    const resultCount=arr.filter(function(iv){return iv.type==="RESULT";}).length;
    const noResponse=Math.max(0,callCount-resultCount);
    var fail=0,blind=0,success=0;
    arr.forEach(function(iv){
      if(iv.type!=="RESULT"||!iv.output)return;
      var out=(iv.output||"").toLowerCase();
      if(out.indexOf("terminated")>=0||out.indexOf("timeout")>=0||out.indexOf("error")>=0||out.indexOf("404")>=0||out.indexOf("failed")>=0||out.indexOf("exception")>=0||out.indexOf("unreachable")>=0||out.indexOf("connection refused")>=0){
        fail++;
      }else if(out.indexOf("知识库暂无此类知识")>=0||out.indexOf("no memory")>=0||out.indexOf("not found")>=0||out.indexOf("empty")>=0){
        blind++;
      }else{
        success++;
      }
    });
    fail+=noResponse;
    return {callCount:callCount,resultCount:resultCount,noResponse:noResponse,fail:fail,blind:blind,success:success};
  }

  // 单个方案统计区块
  function _sectionHtml(title,icon,stats,accessRate,deliveryRate){
    const active=(accessRate!==null&&accessRate>0)||stats.callCount>0;
    var html="<div style='display:flex;gap:12px;align-items:center;margin-bottom:8px'>";
    html+=active?"<span style='font-size:24px'>"+icon+"</span>":"<span style='font-size:24px'>❌</span>";
    html+="<div><span style='font-weight:600;font-size:15px'>"+title+(active?"已介入":"未介入")+"</span>";
    html+="<div style='font-size:13px;color:var(--sub)'>主动查询：<b style='color:var(--txt)'>"+stats.callCount+"</b> 次 · 返回结果：<b style='color:var(--txt)'>"+stats.resultCount+"</b> 次</div></div></div>";
    if(stats.callCount>0){
      html+="<div style='display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-left:36px'>";
      html+="<span class='bdg b-COMPLETED' style='font-size:13px'>有效返回 "+stats.success+"</span>";
      html+="<span class='bdg b-FAILED' style='font-size:13px'>返回失败 "+stats.fail+"</span>";
      html+="<span class='bdg b-CREATED' style='font-size:13px'>知识盲区 "+stats.blind+"</span>";
      if(accessRate!==null)html+="<span class='bdg' style='font-size:13px;background:var(--p3);color:var(--sub)'>访问率 "+(accessRate*100).toFixed(1)+"%</span>";
      if(deliveryRate!==null)html+="<span class='bdg' style='font-size:13px;background:var(--p3);color:var(--sub)'>交付率 "+(deliveryRate*100).toFixed(1)+"%</span>";
      html+="</div>";
    }
    return html;
  }

  const kgStats=_stats(kgAll);
  const memStats=_stats(memAll);
  const kgActive=(kgAccess!==null&&kgAccess>0)||kgStats.callCount>0;
  let kgHtml="";
  kgHtml+=_sectionHtml("知识图谱","🔍",kgStats,kgAccess,kgDelivery);
  kgHtml+=_sectionHtml("记忆","🧠",memStats,memAccess,memDelivery);

  // 知识对漏洞判定的影响（正向/负向/中性），来源 per_case_kg_analysis.impact
  var pcAnalysis=group?(group.per_case_kg_analysis||[]):(r.per_case_kg_analysis||[]);
  if(pcAnalysis.length){
    var posCount=pcAnalysis.filter(p=>p.impact==="POSITIVE").length;
    var negCount=pcAnalysis.filter(p=>p.impact==="NEGATIVE").length;
    var neuCount=pcAnalysis.filter(p=>p.impact==="NEUTRAL").length;
    kgHtml+="<div style='display:flex;gap:12px;margin-bottom:12px'>";
    kgHtml+="<span class='bdg b-COMPLETED' style='font-size:14px'>正向 "+posCount+"</span>";
    kgHtml+="<span class='bdg b-FAILED' style='font-size:14px'>负向 "+negCount+"</span>";
    kgHtml+="<span class='bdg b-CREATED' style='font-size:14px'>中性 "+neuCount+"</span>";
    kgHtml+="</div>";
  }

  // 基线漏洞 per-case 分析
  var caseResults=group?(group.case_results||[]):(d.case_results||[]);
  if(caseResults.length){
    kgHtml+="<div style='font-size:15px;margin-bottom:8px'>基线漏洞逐个对比：<b>"+caseResults.length+"</b> 个</div>";
    caseResults.forEach(function(c,idx){
      var conf=c.confusion||"NA";
      var nogkConf=c.nogk_confusion||"NA";
      function confBadge(label,conf){
        var isCorrect=conf==="TP"||conf==="TN";
        var isFound=conf==="TP"||conf==="FP";
        var icon=isCorrect?'✅':'❌';
        var color=isCorrect?"var(--green)":"var(--red)";
        var judgment=isFound?"漏洞":"未发现";
        var correctness=isCorrect?"正确":"错误";
        return "<span style='font-weight:600;font-size:13px;color:"+color+"'>"+icon+" "+label+": "+judgment+" ("+correctness+")</span>";
      }
      kgHtml+="<div style='background:var(--p2);border-radius:10px;padding:12px;margin-bottom:10px'>";
      kgHtml+="<div style='display:flex;gap:8px;align-items:center;margin-bottom:6px'>";
      kgHtml+="<span class='bdg b-COMPLETED' style='font-size:11px'>问题"+(idx+1)+"</span>";
      var _exp=c.expected_label||"";
      var _expBadge=_exp==="VULNERABLE"?"<span class='bdg b-FAILED' style='font-size:11px'>基线: 漏洞</span>":_exp==="NON_VULNERABLE"?"<span class='bdg b-CREATED' style='font-size:11px'>基线: 非漏洞</span>":"";
      kgHtml+=_expBadge;
      kgHtml+="<span style='font-weight:600;font-size:14px'>"+(c.vulnerability_type||c.source_function||c.source_file||"漏洞")+"</span>";
      kgHtml+="<span style='font-size:12px;color:var(--gray);font-family:monospace'>"+(c.case_id||"").slice(0,8)+"</span>";
      kgHtml+="</div>";
      // per-case 知识介入分析（仅在知识图谱已介入时显示，否则与上方"未介入"矛盾）
      var pcKa=pcAnalysis.find(function(p){return p.case_id===c.case_id;});
      // AI 分析结论放最前面
      if(pcKa&&kgActive&&(pcKa.reason||pcKa.query_summary)){
        var impColor=pcKa.impact==="POSITIVE"?"var(--green)":pcKa.impact==="NEGATIVE"?"var(--red)":"var(--amber)";
        var impText=pcKa.impact==="POSITIVE"?"正向 ✅":pcKa.impact==="NEGATIVE"?"负向 ❌":"中性 ⏳";
        var jText=pcKa.kg_judgment==="VULNERABILITY"?"漏洞(TP)":pcKa.kg_judgment==="NON_VULNERABILITY"?"非漏洞(FP)":"未找到(FN)";
        kgHtml+="<div style='background:var(--p3);border-radius:8px;padding:10px;margin-bottom:8px'>";
        kgHtml+="<div style='font-weight:600;font-size:13px;margin-bottom:4px'>📝 AI 分析结论</div>";
        kgHtml+="<div style='display:flex;gap:16px;margin-bottom:4px'><span style='font-size:13px'>判定: <b>"+jText+"</b></span><span style='font-size:13px;color:"+impColor+"'>影响: "+impText+"</span></div>";
        if(pcKa.reason)kgHtml+="<div style='font-size:12px;color:var(--txt);margin-top:4px;line-height:1.5'>"+pcKa.reason+"</div>";
        kgHtml+="</div>";
      }
      var _hasNogk=r.has_nogk!==false;
      kgHtml+="<div style='display:flex;gap:16px;margin-bottom:6px'>"+confBadge("KG",conf)+(_hasNogk?confBadge("No-KG",nogkConf):"")+"</div>";
      // JSONL trace 文件名（KG/NO-KG 各自匹配到的 session 所在文件）
      function jsonlName(uri,sid){
        if(!uri)return '';
        var base=uri.split('/').pop();
        // 目录 → session_id.jsonl；单文件 → 文件名
        if(base&&(base.endsWith('.jsonl')||base.endsWith('.db')))return base;
        if(sid)return sid+'.jsonl';
        return base||'';
      }
      var kgJsonl=jsonlName(c.kg_source_uri,c.session_id);
      var nogkJsonl=_hasNogk?jsonlName(c.nogk_source_uri,c.nogk_session_id):"";
      if(kgJsonl||nogkJsonl){
        kgHtml+="<div style='font-size:11px;color:var(--gray);margin-top:2px;font-family:monospace'>";
        if(kgJsonl)kgHtml+="KG trace: "+kgJsonl;
        if(kgJsonl&&nogkJsonl)kgHtml+=" · ";
        if(nogkJsonl)kgHtml+="NO-KG trace: "+nogkJsonl;
        kgHtml+="</div>";
      }
      if(c.description){
        var desc=String(c.description).replace(/</g,"&lt;");
        var firstSec=desc.indexOf("## ",3); if(firstSec>0)desc=desc.slice(0,firstSec);
        kgHtml+="<div style='font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5'>"+desc.slice(0,300)+"</div>";
      }
      // 知识与记忆交互明细
      if(pcKa&&kgActive){
        // 知识图谱交互
        var ivs=pcKa.interactions||[];
        if(ivs.length){
          kgHtml+="<details style='margin-top:6px;border-top:1px solid var(--border);padding-top:6px'>";
          kgHtml+="<summary style='font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px;cursor:pointer'>🔍 知识交互（"+ivs.length+" 条）</summary>";
          ivs.forEach(function(iv,i){
            kgHtml+="<div style='margin-bottom:6px;padding:6px;background:var(--p2);border-radius:6px'>";
            var src=iv.session_id?("session: "+String(iv.session_id).slice(0,16)+"…"):"";
            if(iv.timestamp){var ts=new Date(iv.timestamp);src+=" · "+ts.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});}
            kgHtml+="<div style='font-size:11px;color:var(--gray);margin-bottom:2px'>知识"+(i+1)+"："+(iv.tool||"")+(src?" <span style='color:var(--gray);font-size:10px'>["+src+"]</span>":"")+"</div>";
            var qp=iv.command_parsed||iv.question||"";
            var op=iv.output_parsed||iv.answer||"";
            var rawQ=iv.command||iv.question||"";
            var rawA=iv.answer||"";
            if(qp){
              kgHtml+="<div style='font-size:12px;color:var(--txt);line-height:1.4'><b>查询:</b> "+qp.replace(/</g,"&lt;")+"</div>";
            }
            if(op){
              kgHtml+="<div style='font-size:12px;color:var(--sub);line-height:1.4;margin-top:2px'><b>回答:</b> "+op.replace(/</g,"&lt;")+"</div>";
            }
            if(rawQ||rawA){
              kgHtml+="<details style='margin-top:2px'><summary style='font-size:11px;color:var(--gray);cursor:pointer'>原始数据</summary>";
              if(rawQ)kgHtml+="<div style='font-size:11px;color:var(--gray);word-break:break-all'><code>"+String(rawQ).replace(/</g,"&lt;").slice(0,400)+"</code></div>";
              if(rawA)kgHtml+="<div style='font-size:11px;color:var(--gray);word-break:break-all'><code>"+String(rawA).replace(/</g,"&lt;").slice(0,600)+"</code></div>";
              kgHtml+="</details>";
            }
            kgHtml+="</div>";
          });
          kgHtml+="</details>";
        }
        // 记忆交互
        var memIvs=pcKa.memory_interactions||[];
        if(memIvs.length){
          kgHtml+="<details style='margin-top:6px;border-top:1px solid var(--border);padding-top:6px'>";
          kgHtml+="<summary style='font-size:12px;font-weight:600;color:var(--sub);margin-bottom:4px;cursor:pointer'>🧠 记忆交互（"+memIvs.length+" 条）</summary>";
          memIvs.forEach(function(iv,i){
            kgHtml+="<div style='margin-bottom:6px;padding:6px;background:var(--p2);border-radius:6px'>";
            var src=iv.session_id?("session: "+String(iv.session_id).slice(0,16)+"…"):"";
            if(iv.timestamp){var ts=new Date(iv.timestamp);src+=" · "+ts.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});}
            kgHtml+="<div style='font-size:11px;color:var(--gray);margin-bottom:2px'>记忆"+(i+1)+"："+(iv.tool||"")+(src?" <span style='color:var(--gray);font-size:10px'>["+src+"]</span>":"")+"</div>";
            var qp=iv.command_parsed||iv.question||"";
            var op=iv.output_parsed||iv.answer||"";
            var rawQ=iv.command||iv.question||"";
            var rawA=iv.answer||"";
            if(qp){
              kgHtml+="<div style='font-size:12px;color:var(--txt);line-height:1.4'><b>查询:</b> "+qp.replace(/</g,"&lt;")+"</div>";
            }
            if(op){
              kgHtml+="<div style='font-size:12px;color:var(--sub);line-height:1.4;margin-top:2px'><b>回答:</b> "+op.replace(/</g,"&lt;")+"</div>";
            }
            if(rawQ||rawA){
              kgHtml+="<details style='margin-top:2px'><summary style='font-size:11px;color:var(--gray);cursor:pointer'>原始数据</summary>";
              if(rawQ)kgHtml+="<div style='font-size:11px;color:var(--gray);word-break:break-all'><code>"+String(rawQ).replace(/</g,"&lt;").slice(0,400)+"</code></div>";
              if(rawA)kgHtml+="<div style='font-size:11px;color:var(--gray);word-break:break-all'><code>"+String(rawA).replace(/</g,"&lt;").slice(0,600)+"</code></div>";
              kgHtml+="</details>";
            }
            kgHtml+="</div>";
          });
          kgHtml+="</details>";
        }
      }
      kgHtml+="</div>";
    });
  }
  return kgHtml;
  }

  // 自动生成通俗摘要
  let summaryParts=[];
  const m7v=p1.M7&&p1.M7.calculation_status==="CALCULATED"?p1.M7.estimate:null;

  if(sel.kg.verifyTrace){entries.push({task_id:"T"+String(tid).padStart(3,"0"),condition:"KG",source_uri:sel.kg.verifyTrace,trace_kind:sel.kg.verifyTraceKind||undefined,trace_case_ids:_selectedTraceCaseIds("kg",sel.kg.verifyTrace,sel.kg.verifyTraceKind),benchmark_item_ids:caseIds.length?caseIds:undefined,expected_label:"VULNERABLE",category:"verify",project_name:sel.kg.projName,project_id:sel.kg.proj,task_name:sel.kg.taskName,task_id_actual:sel.kg.task});tid++;}
  let tid2=1;
  if(sel.nogk.miningTrace){entries.push({task_id:"T"+String(tid2).padStart(3,"0"),condition:"NOGK",source_uri:sel.nogk.miningTrace,trace_kind:sel.nogk.miningTraceKind||undefined,trace_case_ids:_selectedTraceCaseIds("nogk",sel.nogk.miningTrace,sel.nogk.miningTraceKind),benchmark_item_ids:caseIds.length?caseIds:undefined,expected_label:"VULNERABLE",category:"mining",project_name:sel.nogk.projName,project_id:sel.nogk.proj,task_name:sel.nogk.taskName,task_id_actual:sel.nogk.task});tid2++;}
  if(sel.nogk.verifyTrace){entries.push({task_id:"T"+String(tid2).padStart(3,"0"),condition:"NOGK",source_uri:sel.nogk.verifyTrace,trace_kind:sel.nogk.verifyTraceKind||undefined,trace_case_ids:_selectedTraceCaseIds("nogk",sel.nogk.verifyTrace,sel.nogk.verifyTraceKind),benchmark_item_ids:caseIds.length?caseIds:undefined,expected_label:"VULNERABLE",category:"verify",project_name:sel.nogk.projName,project_id:sel.nogk.proj,task_name:sel.nogk.taskName,task_id_actual:sel.nogk.task});tid2++;}
  try{const r=await jpost("/api/v1/evaluations",{evaluation_id:eid,evaluation_name:evalName||undefined,benchmark_set_id:bSetId,vbench_project_name:sel.vbProjName||undefined,benchmark_source:sel.bsrc,vc_source_task_id:sel.bsrc==='vuln_center'?(sel.vcTask||undefined):undefined,vc_source_project_name:sel.bsrc==='vuln_center'?(sel.vcProjName||undefined):undefined,vc_source_task_name:sel.bsrc==='vuln_center'?(sel.vcTaskName||undefined):undefined,entries:entries});
    $("run-st").textContent="✅ 评测已创建，排队中…";
    activeId=r.evaluation_id;renderEvals();setTimeout(selEv,500,r.evaluation_id);
    // selEv 内部已启动轮询，不再重复轮询
  }
  catch(e){const msg=String(e);if(msg.includes("1062")||msg.includes("Duplicate")){$("run-st").textContent="⚠ ID 重复，换新 ID 重试…";$("eid").value=genId();$("run-btn").disabled=false;return;}$("run-st").innerHTML='⚠ 失败：'+msg;$("run-btn").disabled=false;}}

// ===== ④ 系统 =====
async function renderSystem(){let h=await jget("/api/v1/system/health");let s=await jget("/api/v1/system/schema");
  $("view").innerHTML=`<div style="max-width:700px"><div class="card"><h3>数据库</h3><div style="font-size:15px;line-height:2">状态：<span class="bdg ${h.db==='ok'?'b-COMPLETED':'b-FAILED'}">${h.db}</span><br>数据库：${h.database}<br>表数：${h.tables}<br>外键数：${h.fks}</span></div></div>
  <div class="card" style="margin-top:16px"><h3>表清单（${s.tables.length}）</h3><table><tr><th>表</th><th>行数</th></tr>${s.tables.map(t=>`<tr><td class="num">${t.table}</td><td>${t.rows}</td></tr>`).join("")}</table></div></div>`;}

// iframe 固化报告的重跑/删除按钮通过 postMessage 回传到 dashboard（仅 debug 模式）
if(DEBUG) window.addEventListener("message",function(ev){
  var d=ev.data||{};
  if(d.action==="retry"&&d.evaluation_id){retryEval(d.evaluation_id);}
  else if(d.action==="delete"&&d.evaluation_id){deleteEval(d.evaluation_id,d.evaluation_id);}
});

render();
</script>
