<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识效果评测</title>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--p2:#f0f2f5;--bd:#e1e4e8;--txt:#1a1d23;--sub:#6b7280;--acc:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706;--gray:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:18px;line-height:1.6;display:flex;height:100vh;overflow:hidden}
.wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
header{height:64px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0;background:var(--header-bg)}
header .title{font-size:18px;font-weight:600}
header .sub{color:var(--sub);font-size:15px}
header .sp{flex:1}
header button{background:var(--acc);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:500;transition:.15s}
header button:hover{filter:brightness(1.1)}
header button.ghost{background:var(--p2);border:1px solid var(--bd);color:var(--txt)}
main{flex:1;overflow:hidden;padding:28px}
#view{height:100%;display:flex;flex-direction:column}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--sub);text-align:center;gap:16px}
.empty .ic{width:72px;height:72px;border-radius:18px;background:var(--p2);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:32px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.empty h3{color:var(--txt);font-size:19px}
.empty p{max-width:440px;font-size:16px}
.ev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ev-card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.ev-card:hover{border-color:var(--acc);box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-1px)}
.ev-card .ev-name{font-size:16px;font-weight:600;line-height:1.4;word-break:break-all}
.ev-card .ev-meta{font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.back-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-shrink:0}
.back-bar .back-btn{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:15px;color:var(--txt);display:flex;align-items:center;gap:6px;transition:.15s}
.back-bar .back-btn:hover{background:var(--bd)}
.bdg{font-size:14px;padding:2px 8px;border-radius:12px;font-weight:600}
.b-COMPLETED{background:rgba(74,222,128,.18);color:var(--green)}
.b-COMPLETEDWITHWARNINGS,.b-COMPLETED_WITH_WARNINGS{background:rgba(251,191,36,.18);color:var(--amber)}
.b-FAILED,.b-CANCEL,.b-CANCELLED,.b-CANCELLING{background:rgba(248,113,113,.18);color:var(--red)}
.b-CREATED{background:rgba(107,114,128,.18);color:var(--gray)}
.b-QUEUED{background:rgba(251,191,36,.18);color:var(--amber)}
.b-RUNNING,.b-VALIDATING,.b-INGESTING,.b-PARSING,.b-CASE_MATCHING,.b-ROOT_CAUSE_ANALYSIS,.b-RESOLVING,.b-REPORTING,.b-FINALIZING{background:rgba(96,165,250,.18);color:var(--acc)}
.rep{flex:1;overflow-y:auto}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:22px}
.card.f{grid-column:1/-1}
.card h3{font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:17px}
th{color:var(--sub);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px;text-transform:uppercase;letter-spacing:.4px}
td{padding:12px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
td.num{font-family:"SF Mono",Consolas,monospace;color:var(--acc)}
.ci{color:var(--sub);font-size:14px;font-family:"SF Mono",Consolas,monospace}
.na{color:var(--red);font-style:italic;font-size:16px}
.dp{color:var(--green)}.dn{color:var(--red)}
.mcard{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:18px 16px;text-align:center;transition:transform .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.mc-icon{font-size:24px;margin-bottom:6px}
.mc-label{font-size:14px;color:var(--sub);margin-bottom:6px}
.mc-val{font-size:24px;font-weight:700;font-family:"SF Mono",Consolas,monospace}
.mc-ci{font-size:14px;color:var(--sub);margin-top:6px;font-family:"SF Mono",Consolas,monospace}
.mc-n{font-size:14px;color:var(--gray)}
.barr{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-l{font-size:16px;width:140px;flex-shrink:0}
.bar-track{flex:1;height:28px;background:var(--p2);border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.bar-fill{height:100%;border-radius:14px;transition:width .5s}
.bar-v{font-size:18px;font-weight:600;width:60px;text-align:right;font-family:"SF Mono",Consolas,monospace}
.ps{display:flex;gap:14px;padding:0 0 0 0;position:relative}
.ps:not(:last-child)::after{content:"";position:absolute;left:15px;top:36px;bottom:0;width:2px;background:var(--bd)}
.ps-n{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;z-index:1}
.ps-body{flex:1;padding-bottom:20px;font-size:16px;line-height:1.8}
.ps-det{font-size:14px;color:var(--sub);font-family:"SF Mono",Consolas,monospace}
.ps-body b{font-size:17px}
.ef-btn{background:var(--p2);border:1px solid var(--bd);color:var(--sub);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:14px;flex:1}
.ef-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.ef-btn:hover{border-color:var(--acc)}
.knd{font-size:14px;padding:2px 7px;border-radius:8px;background:var(--p2);color:var(--sub)}
.sel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;max-height:300px;overflow-y:auto}
.opt{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;display:grid;grid-template-columns:minmax(0,.85fr) 96px minmax(0,1.15fr);align-items:center;column-gap:12px;font-size:17px}
.opt:hover{background:var(--p2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:440px;width:90%;overflow:hidden;animation:pop .15s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal .modal-head{padding:20px 24px 12px;display:flex;align-items:center;gap:12px}
.modal .modal-head .modal-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.modal .modal-head h3{font-size:18px;font-weight:600}
.modal .modal-body{padding:4px 24px 16px;font-size:15px;color:var(--sub);line-height:1.7}
.modal .modal-body ul{list-style:none;padding:0;margin:8px 0}
.modal .modal-body li{padding:3px 0;padding-left:18px;position:relative}
.modal .modal-body li:before{content:"•";position:absolute;left:0;color:var(--amber)}
.modal .modal-foot{padding:14px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--bd)}
.opt.sel{background:rgba(91,156,246,.12);border-left:3px solid var(--acc)}
.opt .l{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.opt .r{font-size:14px;color:var(--sub)}
.opt .opt-main{display:flex;align-items:center;gap:8px;min-width:0}.opt .opt-mid,.opt .opt-right{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.opt .opt-right{text-align:right}
.btn{background:var(--acc);color:#fff;border:none;padding:11px 20px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:var(--p2);border:1px solid var(--bd);color:var(--txt)}
.nav-item{font-size:15px;padding:8px 14px;border-radius:8px;font-weight:500}
.nav-item.nav-active{background:var(--acc);color:#fff}
label{display:block;font-size:15px;color:var(--sub);margin:12px 0 5px}
input,select{width:100%;background:var(--p2);border:1px solid var(--bd);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:17px;font-family:inherit}
.st{font-size:16px;color:var(--amber);margin:10px 0;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title" id="h-title" onclick="Router.navigate('/')" style="cursor:pointer">知识效果评测平台</div>
    <nav style="display:flex;gap:2px;margin-left:20px">
      <button class="ghost nav-item" data-route="home" onclick="Router.navigate('/')">首页</button>
      <button class="ghost nav-item" data-route="evals" onclick="Router.navigate('/evaluations')">评测</button>
      <button class="ghost nav-item" data-route="dts" onclick="Router.navigate('/dts')">问题单</button>
    </nav>
    <div class="sp"></div>
    <button class="ghost" data-route="create" onclick="Router.navigate('/create')">+ 新建评测</button>
    <button class="ghost" data-route="system" id="sys-btn" onclick="Router.navigate('/system')" style="display:none">系统</button>
    <button class="ghost" id="theme-btn" onclick="toggleTheme()" style="font-size:18px;padding:8px 12px">🌙</button>
  </header>
  <main><div id="view"></div></main>
</div>
<script>
const DEBUG=new URLSearchParams(location.search).get("debug")==="true";
if(DEBUG){var _sb=document.getElementById("sys-btn");if(_sb)_sb.style.display="";}
const _P=location.pathname;const _INGRESS=(_P==='/eval'||_P.indexOf('/eval/')===0)?'/eval':'';
const U=(u)=>_INGRESS&&(u.indexOf("/api/")===0||u.indexOf("/reports/")===0||u==="/health")?_INGRESS+u:u;const F=(u,...a)=>fetch(U(u),...a);let activeId=null;
const THEMES={
  light:{"--bg":"#f5f6f8","--panel":"#ffffff","--p2":"#f0f2f5","--bd":"#e1e4e8","--txt":"#1a1d23","--sub":"#6b7280","--acc":"#2563eb","--green":"#16a34a","--red":"#dc2626","--amber":"#d97706","--gray":"#9ca3af","--header-bg":"#ffffff","--bar-bg":"#e5e7eb","--hover-shadow":"0 8px 24px rgba(0,0,0,.1)"},
  dark:{"--bg":"#0b0e14","--panel":"#141821","--p2":"#1c212c","--bd":"#2a3140","--txt":"#e8eaed","--sub":"#a8b2c0","--acc":"#5b9cf6","--green":"#4ade80","--red":"#f87171","--amber":"#fbbf24","--gray":"#8b95a5","--header-bg":"rgba(20,24,33,.6)","--bar-bg":"var(--p2)","--hover-shadow":"0 8px 32px rgba(0,0,0,.3)"}
};
function applyTheme(t){
  const v=THEMES[t];const r=document.documentElement;
  for(const[k,val]of Object.entries(v))r.style.setProperty(k,val);
  const btn=$("theme-btn");if(btn)btn.textContent=t==="dark"?"☀️":"🌙";
  localStorage.setItem("eval-theme",t);
}
function toggleTheme(){const cur=localStorage.getItem("eval-theme")||"light";applyTheme(cur==="light"?"dark":"light");}
applyTheme(localStorage.getItem("eval-theme")||"light");

let w={proj:"",task:"",kg:"",biid:"BI-T001",tfid:"F-T001",eid:""};

function $(i){return document.getElementById(i);}
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstChild;}
function fmtDate(s){if(!s)return'-';const d=new Date(s+'Z');if(isNaN(d))return s;const b=new Date(d.getTime()+8*3600000);const p=n=>String(n).padStart(2,'0');return b.getUTCFullYear()+'-'+p(b.getUTCMonth()+1)+'-'+p(b.getUTCDate())+' '+p(b.getUTCHours())+':'+p(b.getUTCMinutes());}
function fmtTs(ts){if(!ts)return'';const d=new Date(ts+8*3600000);const p=n=>String(n).padStart(2,'0');return p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
async function jget(u){const r=await F(u);if(!r.ok)throw new Error(r.status);return r.json();}
async function jpost(u,b){const r=await F(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d;}
async function jput(u,b){const r=await F(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d;}

function goBack(){
  var path=location.pathname.substring(Router.base.length)||'/';
  if(path.indexOf('/dts')===0){Router.navigate('/dts');}
  else if(path.indexOf('/evaluations/')===0){Router.navigate('/evaluations');}
  else{Router.navigate('/');}
}

// ===== 路由器 =====
const Router={
  base:'',
  init(){this.base=_INGRESS;this.handle();},
  navigate(path){window.location.href=this.base+path;},
  handle(){
    var path=location.pathname.substring(this.base.length)||'/';
    updateNavActive(path);
    if(path==='/'||path===''){renderHome();}
    else if(path==='/evaluations'||path.indexOf('/evaluations/')===0){
      var id=path.split('/')[2];
      if(id)selEv(id);else renderEvals();
    }
    else if(path==='/dts'){renderDtsList();}
    else if(path==='/create'){renderCreate();}
    else if(path==='/system'){renderSystem();}
    else{renderHome();}
  }
};
function updateNavActive(path){
  document.querySelectorAll('header .nav-item').forEach(function(b){
    b.classList.remove('nav-active');
    var r=b.getAttribute('data-route');
    if(!r)return;
    if(r==='home'&&(path==='/'||path==='')){b.classList.add('nav-active');}
    else if(r==='evals'&&(path==='/evaluations'||path.indexOf('/evaluations/')===0)){b.classList.add('nav-active');}
    else if(r==='dts'&&path==='/dts'){b.classList.add('nav-active');}
  });
}

// ===== ① 首页看板 =====
async function renderHome(){
  $("view").innerHTML='<div style="flex:1;overflow-y:auto;padding:28px"><div class="empty"><div class="ic" style="animation:spin 1s linear infinite">⏳</div><h3>加载看板…</h3></div></div>';
  var evals=[],dtsStats={};
  try{evals=(await jget("/api/v1/evaluations?page_size=9999")).evaluations||[];}catch(e){}
  try{dtsStats=await jget("/api/v2/dts/stats");}catch(e){}

  var total=evals.length;
  var completed=evals.filter(function(e){return e.status==='COMPLETED'||e.status==='COMPLETED_WITH_WARNINGS';}).length;
  var running=evals.filter(function(e){return ['RUNNING','VALIDATING','INGESTING','PARSING','CASE_MATCHING','ROOT_CAUSE_ANALYSIS','RESOLVING','REPORTING','FINALIZING'].indexOf(e.status)>=0;}).length;
  var failed=evals.filter(function(e){return e.status==='FAILED';}).length;

  var dtsTotal=dtsStats.total||0;
  var dtsByStatus=dtsStats.by_status||{};
  var dtsUnlocated=dtsByStatus.unlocated||0;
  var dtsImproving=dtsByStatus.improving||0;
  var dtsPassed=dtsByStatus.passed||0;
  var dtsFailed=dtsByStatus.failed||0;

  // 最近评测
  var recentEvals=evals.slice(0,6);
  var recentHtml=recentEvals.length?recentEvals.map(function(e){
    var badge=(e.status||'').replace('_WITH_WARNINGS','').replace('CANCEL_REQUESTED','FAILED').replace('CANCELLING','FAILED').replace('CANCELLED','FAILED');
    var phaseLabel=_phaseLabelsHome[e.status]||e.status||'-';
    return '<div class="ev-card" onclick="Router.navigate(\'/evaluations/'+e.evaluation_id+'\')">'+
      '<div class="ev-name" style="font-size:15px" title="'+(e.name||e.evaluation_id).replace(/"/g,'&quot;')+'">'+(e.name||e.evaluation_id)+'</div>'+
      '<div class="ev-meta"><span class="bdg b-'+badge+'">'+phaseLabel+'</span><span>'+fmtDate(e.created_at)+'</span></div>'+
      '<div style="font-size:12px;color:var(--gray);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e.evaluation_id+'</div>'+
      '</div>';
  }).join(''):'<div style="padding:24px;text-align:center;color:var(--sub)">暂无评测</div>';

  var html='<div style="flex:1;overflow-y:auto;padding:28px">'
    // 指标卡片
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px">'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">评测总数</div><div class="mc-val" style="color:var(--acc)">'+total+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">已完成</div><div class="mc-val" style="color:var(--green)">'+completed+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">运行中</div><div class="mc-val" style="color:var(--amber)">'+running+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">失败</div><div class="mc-val" style="color:var(--red)">'+failed+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">问题单</div><div class="mc-val" style="color:var(--acc)">'+dtsTotal+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">已通过</div><div class="mc-val" style="color:var(--green)">'+dtsPassed+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">未定位</div><div class="mc-val" style="color:var(--gray)">'+dtsUnlocated+'</div></div>'
    +'<div class="mcard" style="text-align:left;padding:20px"><div class="mc-label">未通过</div><div class="mc-val" style="color:var(--red)">'+dtsFailed+'</div></div>'
    +'</div>'

    // 问题单状态流水线
    +(dtsTotal>0?'<div class="card" style="margin-bottom:24px"><h3>问题单状态</h3>'
      +'<div style="display:flex;gap:12px;flex-wrap:wrap">'
      +Object.keys(DTS_STATUS_LABELS).map(function(s){
        var v=dtsByStatus[s]||0;
        var pct=dtsTotal>0?(v/dtsTotal*100).toFixed(0):'0';
        return '<div style="text-align:center;min-width:90px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--panel)">'
          +'<div style="font-size:20px;font-weight:700;color:'+(DTS_STATUS_COLORS[s]||'var(--gray)')+'">'+v+'</div>'
          +'<div style="font-size:13px;color:var(--sub);margin-top:2px">'+DTS_STATUS_LABELS[s]+'</div>'
          +'<div style="font-size:11px;color:var(--gray);margin-top:2px">'+pct+'%</div>'
          +'</div>';
      }).join('')
      +'</div></div>':'')

    // 最近评测
    +'<div class="card" style="margin-bottom:24px"><h3>最近评测</h3><div class="ev-grid">'+recentHtml+'</div></div>'

    +'</div>';

  $("view").innerHTML=html;
}
var _phaseLabelsHome={"CREATED":"创建中","QUEUED":"已暂停","RUNNING":"启动中","VALIDATING":"验证中","INGESTING":"数据采集","PARSING":"解析 Trace","CASE_MATCHING":"Case 匹配","ROOT_CAUSE_ANALYSIS":"根因分析","RESOLVING":"事实写入","REPORTING":"生成报告","FINALIZING":"收尾中","COMPLETED":"完成","COMPLETED_WITH_WARNINGS":"完成有告警","FAILED":"失败","CANCEL_REQUESTED":"取消中","CANCELLING":"取消中","CANCELLED":"已取消"};

// ===== ② 评测列表 =====
async function renderEvals(){
  const d=await jget("/api/v1/evaluations?page_size=9999");const evs=d.evaluations||[];
  window._evData=evs;window._evPage=1;
  var _f=window._evFilter||"all";var _q=window._evQ||"";
  $("view").innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-shrink:0">
    <input id="ev-search" placeholder="搜索 ID / 名称…" oninput="filterEvals()" style="max-width:300px" value="${_q}">
    <div style="display:flex;gap:6px">
      <button class="ef-btn${_f==='all'?' active':''}" onclick="setEvFilter('all',this)">全部</button>
      <button class="ef-btn${_f==='dev'?' active':''}" onclick="setEvFilter('dev',this)">开发态</button>
      <button class="ef-btn${_f==='runtime'?' active':''}" onclick="setEvFilter('runtime',this)">运行态</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="ef-btn${_f==='COMPLETED'?' active':''}" onclick="setEvFilter('COMPLETED',this)">完成</button>
      <button class="ef-btn${_f==='COMPLETED_WITH_WARNINGS'?' active':''}" onclick="setEvFilter('COMPLETED_WITH_WARNINGS',this)">警告</button>
      <button class="ef-btn${_f==='FAILED'?' active':''}" onclick="setEvFilter('FAILED',this)">失败</button>
    </div>

function evPage(p){window._evPage=p;renderEvList();}
const EV_PAGE_SIZE=12;

    var isTerminal=e.status==='COMPLETED'||e.status==='COMPLETED_WITH_WARNINGS'||e.status==='FAILED'||e.status==='CANCELLED';
    var phaseLabel=_phaseLabels[e.status]||e.status||'-';
    if(e.status==='REPORTING'&&e.progress&&e.progress.indexOf('生成报告')<0){phaseLabel='知识与记忆分析';}
    var safeName=(e.name||e.evaluation_id).replace(/'/g,'');

      '</span>':'';
    return '<div class="ev-card '+(e.evaluation_id===activeId?'act':'')+'" onclick="Router.navigate(\'/evaluations/'+e.evaluation_id+'\')">'+
      '<div class="ev-name" title="'+(e.name||e.evaluation_id).replace(/"/g,'&quot;')+'">'+(e.name||e.evaluation_id)+'</div>'+
      '<div class="ev-meta"><span class="bdg b-'+badge+'">'+phaseLabel+'</span><span style="font-size:11px;padding:1px 6px;border-radius:4px;background:'+(e.eval_mode==='runtime'?'rgba(245,158,11,.15)':'rgba(91,156,246,.15)')+';color:'+(e.eval_mode==='runtime'?'var(--amber)':'var(--acc)')+'">'+(e.eval_mode==='runtime'?'运行态':'开发态')+'</span><span>'+fmtDate(e.created_at)+'</span>'+btns+'</div>'+

  }).join(""):'<div style="padding:48px;text-align:center;color:var(--sub);font-size:16px;grid-column:1/-1">无匹配评测</div>';
  if(pages>1){

    pgHtml+=`<button class="ef-btn" ${page<=1?'disabled':''} onclick="evPage(${page-1})" style="padding:6px 12px;font-size:14px">‹ 上一页</button>`;

// ===== ② 评测详情 + 报告 =====
async function selEv(id){
  activeId=id;
  try{const s=await jget(`/api/v2/evaluations/${id}`);
    // FAILED: 显示错误 + 重试
    if(s.status==="FAILED"){
      var errMsg=s.error_message||"无详细错误信息";
      $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic">⚠️</div><h3>评测失败</h3><p style="font-size:14px;color:var(--red);max-width:500px;text-align:left;word-break:break-all">'+errMsg+'</p>'+(DEBUG?'<button class="btn" style="margin-top:16px" id="retry-btn">重试</button>':'')+'</div>';
      var rb=$("retry-btn");if(rb)rb.onclick=function(){retryEval(id);};
      return;
    }
    // 运行中：显示进度
    if(s.status!=="COMPLETED"&&s.status!=="COMPLETED_WITH_WARNINGS"&&s.status!=="FAILED"&&s.status!=="CANCELLED"&&s.status!=="CANCEL"){
      var phases=[{key:"INGESTING",label:"数据采集"},{key:"PARSING",label:"解析 Trace"},{key:"CASE_MATCHING",label:"Case 匹配"},{key:"ROOT_CAUSE_ANALYSIS",label:"根因分析"},{key:"RESOLVING",label:"事实写入"},{key:"REPORTING",label:"生成报告"},{key:"FINALIZING",label:"完成"}];
      var phaseMap={"CREATED":0,"QUEUED":0,"RUNNING":0,"VALIDATING":0,"INGESTING":1,"PARSING":2,"CASE_MATCHING":3,"ROOT_CAUSE_ANALYSIS":4,"RESOLVING":5,"REPORTING":6,"FINALIZING":7};
      var curStep=phaseMap[s.status]||0;
      var totalSteps=phases.length;
      var progressPct=Math.round((curStep/(totalSteps+1))*100);
      var stepsHtml='<div style="margin:12px 0">';
      stepsHtml+='<div style="height:4px;background:var(--p2);border-radius:5px;margin-bottom:12px;overflow:hidden"><div style="height:100%;width:'+progressPct+'%;background:linear-gradient(90deg,var(--acc),#7c3aed);transition:width .5s;border-radius:5px"></div></div>';
      phases.forEach(function(p,i){
        var done=curStep>i+1;var active=curStep===i+1;var stepNum=i+1;
        var bg=done?"rgba(74,222,128,.12)":active?"rgba(124,58,237,.12)":"var(--p2)";
        var borderC=done?"rgba(74,222,128,.4)":active?"rgba(124,58,237,.4)":"transparent";
        var color=done?"var(--green)":active?"var(--acc)":"var(--gray)";
        var icon=done?"✅":(active?"⏳":"⏸");
        stepsHtml+='<div style="display:flex;align-items:center;gap:12px;padding:7px 10px;margin-bottom:5px;background:'+bg+';border:1px solid '+borderC+';border-radius:8px;transition:all .3s">';
        stepsHtml+='<span style="width:30px;height:30px;border-radius:50%;background:'+(done?"rgba(74,222,128,.2)":active?"rgba(124,58,237,.2)":"rgba(107,114,128,.1)")+';display:flex;align-items:center;justify-content:center;color:'+color+';font-size:14px;flex-shrink:0">'+icon+'</span>';
        stepsHtml+='<div><div style="font-size:14px;color:'+color+';font-weight:'+(active?'700':'400')+'">'+stepNum+'. '+p.label+(active?'…':'')+'</div>';
        if(done){stepsHtml+='<div style="font-size:11px;color:var(--sub)">已完成</div>';}
        else if(active){stepsHtml+='<div style="font-size:11px;color:var(--acc)">进行中</div>';}
        else{stepsHtml+='<div style="font-size:11px;color:var(--gray)">等待中</div>';}
        stepsHtml+='</div></div>';
      });
      stepsHtml+='</div>';
      if(DEBUG) stepsHtml+='<div style="text-align:center;margin-top:16px"><button class="btn g" id="force-retry-btn" style="font-size:14px;padding:8px 20px">强制重跑</button> <button class="btn" id="cancel-btn" style="font-size:14px;padding:8px 20px;background:var(--amber)">取消任务</button></div>';
      var progressHtml='<div id="eval-progress" style="text-align:center;font-size:14px;color:var(--acc);margin-top:10px;font-weight:600'+(s.progress?'':';display:none')+'">'+(s.progress||'')+'</div>';
      $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div style="padding:20px 20px;flex:1;overflow-y:auto"><div style="text-align:center;margin-bottom:8px"><span style="font-size:22px">⚙️</span> <span style="font-size:17px;font-weight:700;color:var(--txt)">评测运行中</span><div style="font-size:13px;color:var(--sub);margin-top:2px">'+(s.name||'')+'</div><div style="font-size:11px;color:var(--gray)">'+id+'</div></div>'+stepsHtml+progressHtml+'<div style="text-align:center;font-size:12px;color:var(--sub);margin-top:6px">'+s.status+' · '+progressPct+'%</div></div>';
      var frb=$("force-retry-btn");if(frb)frb.onclick=function(){retryEval(id);};
      var cb=$("cancel-btn");if(cb)cb.onclick=function(){cancelEval(id);};
      // 轮询
      let cnt=0;let _partialLoaded=false;const poll=async()=>{cnt++;if(cnt>14400)return;
        if(activeId!==id)return;
        try{const st=await jget(`/api/v2/evaluations/${id}`);
          if(st.status==="COMPLETED"||st.status==="COMPLETED_WITH_WARNINGS"){
            selEv(id);return;
          }
          else if(st.status==="FAILED"){selEv(id);return;}
          else{
            // 检查段文件就绪
            try{
              const rs=await jget(`/api/v2/evaluations/${id}/report/status`);
              if(rs.base&&!_partialLoaded){
                _partialLoaded=true;
                loadV2Report(id,st,rs);
                return;
              }
            }catch(e){}
            var pe=$("eval-progress");
            if(pe){if(st.progress){pe.textContent=st.progress;pe.style.display='block';}else{pe.style.display='none';}}
            if(st.status!==s.status){
              if(window._evData){var ev=window._evData.find(e=>e.evaluation_id===id);if(ev){ev.status=st.status;ev.progress=st.progress;}}
              if(!_partialLoaded){selEv(id);return;}
            }
            setTimeout(poll,20000);
          }
        }catch(e){}};
      setTimeout(poll,20000);return;
    }
  }catch(e){}
  // COMPLETED: 加载报告
  $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic">⏳</div><h3>加载报告…</h3></div>';
  try{
    const rs=await jget(`/api/v2/evaluations/${id}/report/status`);
    const st=await jget(`/api/v2/evaluations/${id}`);
    loadV2Report(id,st,rs);
  }catch(e){
    $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic">⚠️</div><h3>报告未就绪</h3><p>'+e+'</p></div>';
  }
}

// ===== v2 报告加载 + 渲染 =====
async function loadV2Report(id,st,rs){
  var d={evaluation_id:id,status:st.status,evaluation_name:st.name||st.evaluation_id,_rs:rs,_partial:{running:st.status!=="COMPLETED"&&st.status!=="COMPLETED_WITH_WARNINGS"&&st.status!=="FAILED",status:st.status,progress:st.progress},eval_mode:st.eval_mode,benchmark_source:st.benchmark_source,vc_source_project_name:st.vc_source_project_name,vc_source_task_name:st.vc_source_task_name,entries_info:st.entries_info};
  // 加载基础报告
  if(rs.base){
    try{d.base=await jget(`/api/v2/evaluations/${id}/report`);}catch(e){d.base={};}
  }
  // 加载生命周期段
  if(rs.lifecycle){
    try{d.lifecycle=await jget(`/api/v2/evaluations/${id}/report/lifecycle`);}catch(e){}
  }
  renderV2Report(d);
  // 异步补加载未就绪段
  if(!d.lifecycle){
    jget(`/api/v2/evaluations/${id}/report/lifecycle`).then(lc=>{if(lc&&!lc.error){d.lifecycle=lc;renderV2Report(d);}}).catch(()=>{});
  }
}

function fmtNum(v){if(v==null||isNaN(v))return'<span class="na">NA</span>';const a=Math.abs(v);
  if(a>=1e9)return(v/1e9).toFixed(2)+'B';
  if(a>=1e6)return(v/1e6).toFixed(2)+'M';
  if(a>=1e3)return(v/1e3).toFixed(1)+'K';
  return Math.round(v).toString();}
function fmt(v,u){
  if(v===null||v===undefined||isNaN(v))return'<span class="na">NA</span>';
  if(u==="ratio")return (v*100).toFixed(2)+'<span class="ci">%</span>';
  return Number(v).toFixed(3);}

function mCard(mid,m){
  const mi=MI[mid]||{n:mid,short:mid,d:"",u:"",range:[],interp:()=>""};
  const RC={"NO_DATA":"无数据","NO_TOOL_CALLS":"无工具调用","NO_ACCESS_EVENT":"无知识访问事件","NO_VALID":"数据不足","PENDING_FPR_ANALYSIS":"等待误报率分析","NO_NEED_KNOWLEDGE":"无知识需求","NO_INITIATED_ACCESS":"未发起访问","NO_QUERY_ACCURATE_ACCESS":"无准确查询","NO_EXISTS_ACCESS":"无知识存在","NO_RETRIEVED_ACCESS":"未召回","NO_USED_ACCESS":"未使用","NO_FP_CASE":"无误报case"};
  if(!m||m.calculation_status!=="CALCULATED"){
    const rc=m?m.reason_code||m.calculation_status:"无数据";
    const reason=RC[rc]||rc||"无数据";
    return `<div class="mcard na"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">${mid}</span> ${mi.short||""}</div><div class="mc-val na">N/A</div><div style="font-size:13px;color:var(--sub);margin-top:4px">${reason}</div></div>`;
  }
  const v=m.estimate;
  if(v==null||isNaN(v))return `<div class="mcard na"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">${mid}</span> ${mi.short||""}</div><div class="mc-val na">N/A</div><div style="font-size:13px;color:var(--sub);margin-top:4px">estimate 缺失</div></div>`;
  const interp=mi.interp?mi.interp(v):"";
  let col="var(--gray)";
  if(mi.range){
    for(let i=mi.range.length-1;i>=0;i--){if(v>=mi.range[i].v){col=mi.range[i].c==="green"?"var(--green)":mi.range[i].c==="red"?"var(--red)":"var(--amber)";break;}}
  }
  const valStr=fmt(v,mi.u);
  let rangeBar="";
  if(mi.range&&mi.range.length>=2){
    const min=mi.range[0].v,max=mi.range[mi.range.length-1].v;
    const pct=Math.min(100,Math.max(0,((v-min)/(max-min))*100));
    rangeBar=`<div class="bar-track" style="margin-top:6px;height:4px"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>`;
  }
  var formulaHtml=mi.d?"<div style='font-size:12px;color:var(--sub);margin-top:4px'>"+mi.d+"</div>":"";
  var nHtml=m.n!=null?'<div class="mc-n">N='+m.n+'</div>':'';
  return '<div class="mcard" style="border-color:'+col+'33"><div class="mc-label"><span style="font-family:monospace;font-size:12px;color:var(--gray)">'+mid+'</span> '+(mi.short||"")+'</div><div class="mc-val" style="color:'+col+'">'+valStr+'</div>'+rangeBar+formulaHtml+nHtml+'</div>';
}

// 生命周期报告段渲染
function renderLifecycle(lc){
  if(!lc)return'';
  const bp=lc.breakpoint_distribution||{};
  const cs=lc.cause_summary||{};
  const el=lc.effect_label_distribution||{};
  const pc=lc.per_case_details||[];
  const l0=lc.l0_origin_distribution||{};
  const rp=lc.recall_precision||{};

  const agents=['turing','argo','secmate','dataflow','cvuln_verify','webvuln_verify'];
  const agentLabels={'turing':'Turing','argo':'Argo','secmate':'SecMate','dataflow':'Dataflow','cvuln_verify':'CVulnVerify','webvuln_verify':'WebVulnVerify'};
  const levels=['L2','L3','L4','L5','L6','L7'];
  const causeLabels={'A':'L2断(该查没查)','B':'L3断(查询太泛)','C':'L4断(查了没得)','D':'L5断(链路问题)','E':'L6断(查到没用)','F':'L7断(用了没推动)','G':'L7负向(导致误判)'};

  let matrixRows=agents.map(function(a){
    var row=bp[a]||{};
    var cells=levels.map(function(l){
      var v=row[l]||0;
      return '<td class="num">'+(v>0?'<b style="color:var(--red)">'+v+'</b>':'<span style="color:var(--gray)">0</span>')+'</td>';
    }).join('');
    return '<tr><td style="font-size:14px">'+(agentLabels[a]||a)+'</td>'+cells+'</tr>';
  }).join('');

  var causeTotal=Object.values(cs).reduce(function(a,b){return a+(b||0);},0);
  var causeBars=Object.keys(causeLabels).map(function(c){
    var v=cs[c]||0;var pct=causeTotal>0?(v/causeTotal*100).toFixed(1):'0.0';
    return '<div class="barr"><span class="bar-l" style="font-size:13px">'+causeLabels[c]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(v>0?'var(--red)':'var(--p2)')+'"></div></div><span class="bar-v">'+v+'</span></div>';
  }).join('');

  var elTotal=(el.POSITIVE||0)+(el.NEGATIVE||0)+(el.NEUTRAL||0)+(el.NULL||0);
  var elBars=[['POSITIVE','正向(推动判定)','var(--green)'],['NEGATIVE','负向(导致误判)','var(--red)'],['NEUTRAL','中性(未推动)','var(--amber)'],['NULL','证据不足','var(--gray)']].map(function(e){
    var v=el[e[0]]||0;var pct=elTotal>0?(v/elTotal*100).toFixed(1):'0.0';
    return '<div class="barr"><span class="bar-l" style="font-size:13px">'+e[1]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+e[2]+'"></div></div><span class="bar-v">'+v+'</span></div>';
  }).join('');

  var l0Total=Object.values(l0).reduce(function(a,b){return a+(b||0);},0);
  var l0Bars=Object.keys(l0).map(function(k){
    var v=l0[k]||0;var pct=l0Total>0?(v/l0Total*100).toFixed(1):'0.0';
    return '<div class="barr"><span class="bar-l" style="font-size:13px">'+k+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--acc)"></div></div><span class="bar-v">'+v+'</span></div>';
  }).join('');

  // 召回率/准确率
  var rpHtml='';
  if(rp.recall_rate!=null||rp.precision_rate!=null){
    var tp=rp.tp||0,fn=rp.fn||0,fp=rp.fp||0,tn=rp.tn||0;
    rpHtml='<div class="card" style="margin-bottom:16px"><h3>召回率与准确率</h3>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">'
      +'<div class="mcard" style="border-color:var(--green)33"><div class="mc-label">召回率 (Recall)</div><div class="mc-val" style="color:var(--green)">'+(rp.recall_rate!=null?(rp.recall_rate*100).toFixed(1)+'%':'N/A')+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px">TP/(TP+FN)</div></div>'
      +'<div class="mcard" style="border-color:var(--acc)33"><div class="mc-label">准确率 (Precision)</div><div class="mc-val" style="color:var(--acc)">'+(rp.precision_rate!=null?(rp.precision_rate*100).toFixed(1)+'%':'N/A')+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px">TP/(TP+FP)</div></div>'
      +'<div class="mcard"><div class="mc-label">TP</div><div class="mc-val" style="color:var(--green)">'+tp+'</div></div>'
      +'<div class="mcard"><div class="mc-label">FN</div><div class="mc-val" style="color:var(--red)">'+fn+'</div></div>'
      +'<div class="mcard"><div class="mc-label">FP</div><div class="mc-val" style="color:var(--red)">'+fp+'</div></div>'
      +'<div class="mcard"><div class="mc-label">TN</div><div class="mc-val">'+tn+'</div></div>'
      +'</div></div>';
  }

  // Per-case 断点详情
  var pcHtml='';
  if(pc.length){
    pcHtml='<details class="card" style="margin-bottom:16px"><summary style="font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px">逐 Case 断点详情 <span style="font-size:12px;color:var(--gray)">（'+pc.length+' 个 case，点击展开）</span></summary><div style="margin-top:16px">';
    pc.forEach(function(c){
      var bps=c.breakpoints||[];
      if(!bps.length)return;
      pcHtml+='<div style="margin-bottom:12px;padding:12px;border:1px solid var(--bd);border-radius:10px"><b style="font-family:monospace">'+c.case_id+'</b><table style="margin-top:8px"><thead><tr><th>Agent</th><th>断点级别</th><th>成因</th><th>证据</th></tr></thead><tbody>';
      bps.forEach(function(b){
        pcHtml+='<tr><td style="font-size:14px">'+(agentLabels[b.agent_type]||b.agent_type||'-')+'</td><td>'+(b.break_level||'-')+'</td><td>'+(causeLabels[b.cause_code]||b.cause_code||'-')+'</td><td style="font-size:12px;color:var(--sub);max-width:400px;overflow:hidden;text-overflow:ellipsis">'+String(b.evidence||'').replace(/</g,'&lt;')+'</td></tr>';
      });
      pcHtml+='</tbody></table></div>';
    });
    pcHtml+='</div></details>';
  }

  return rpHtml
    +'<div class="card" style="margin-bottom:16px"><h3>L0-L7 生命周期分析</h3>'
    +(l0Total>0?'<div style="margin-bottom:16px"><h4 style="font-size:16px;margin-bottom:8px">L0 知识原始来源分布</h4>'+l0Bars+'</div>':'')
    +'<h4 style="font-size:16px;margin-bottom:8px">断点交叉归因矩阵（Agent × 级别）</h4>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Agent</th>'+levels.map(function(l){return'<th>'+l+'</th>';}).join('')+'</tr></thead><tbody>'
    +matrixRows+'</tbody></table></div></div>'
    +'<div class="card" style="margin-bottom:16px"><h4 style="font-size:16px;margin-bottom:8px">成因汇总</h4>'+causeBars+'<div style="font-size:14px;color:var(--sub);margin-top:8px">总断点数：'+causeTotal+'</div></div>'
    +'<div class="card" style="margin-bottom:16px"><h4 style="font-size:16px;margin-bottom:8px">效果标签分布</h4>'+elBars+'<div style="font-size:14px;color:var(--sub);margin-top:8px">总记录数：'+elTotal+'</div></div>'
    +pcHtml;
}

// v2 报告主渲染
function renderV2Report(d){
  var _evalId=d.evaluation_id||activeId||'';
  var _partial=d._partial||null;
  var base=d.base||{};
  var metrics=base.metrics||{};
  var metricResults=metrics.metric_results||[];
  var statResults=metrics.statistical_results||[];
  var ccSum=base.causal_chain_summary||{};

  // 指标分组
  var mById={};
  metricResults.forEach(function(m){mById[m.metric_id]=m;});
  // M5/M6/M11/M12/M13 基础指标
  var baseMetrics=['M5','M6','M11','M12','M13'].map(function(mid){return mCard(mid,mById[mid]);}).join('');

  // 因果链汇总
  var causeSum=ccSum.cause_summary||{};
  var effectSum=ccSum.effect_label_distribution||{};
  var causeTotal=Object.values(causeSum).reduce(function(a,b){return a+(b||0);},0);
  var causeLabels={'A':'L2断(该查没查)','B':'L3断(查询太泛)','C':'L4断(查了没得)','D':'L5断(链路问题)','E':'L6断(查到没用)','F':'L7断(用了没推动)','G':'L7负向(导致误判)'};
  var causeBars=Object.keys(causeLabels).map(function(c){
    var v=causeSum[c]||0;var pct=causeTotal>0?(v/causeTotal*100).toFixed(1):'0.0';
    return '<div class="barr"><span class="bar-l" style="font-size:13px">'+causeLabels[c]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(v>0?'var(--red)':'var(--p2)')+'"></div></div><span class="bar-v">'+v+'</span></div>';
  }).join('');
  var effectTotal=(effectSum.POSITIVE||0)+(effectSum.NEGATIVE||0)+(effectSum.NEUTRAL||0)+(effectSum.NULL||0);
  var effectBars=[['POSITIVE','正向(推动判定)','var(--green)'],['NEGATIVE','负向(导致误判)','var(--red)'],['NEUTRAL','中性(未推动)','var(--amber)'],['NULL','证据不足','var(--gray)']].map(function(e){
    var v=effectSum[e[0]]||0;var pct=effectTotal>0?(v/effectTotal*100).toFixed(1):'0.0';
    return '<div class="barr"><span class="bar-l" style="font-size:13px">'+e[1]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+e[2]+'"></div></div><span class="bar-v">'+v+'</span></div>';
  }).join('');

  // 评测元信息
  var entriesInfo=d.entries_info||(base.entries_info||[]);
  var kgInfo=entriesInfo.find(function(e){return e.condition==="KG";})||{};
  var bsrc=d.benchmark_source||(base.benchmark_source||'vuln_center');
  var vcProj=d.vc_source_project_name||(base.vc_source_project_name||'');
  var vcTask=d.vc_source_task_name||(base.vc_source_task_name||'');
  var evalMode=d.eval_mode||(base.eval_mode||'dev');

  var html=`
  ${_partial&&_partial.running?`<div style="background:rgba(91,156,246,.12);border:1px solid var(--acc);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
    <div style="width:20px;height:20px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0"></div>
    <div><b style="color:var(--acc)">评测运行中</b> · <span id="partial-banner-status">${_partial.progress||_partial.status||''}</span><div style="font-size:13px;color:var(--sub);margin-top:2px">以下为已就绪内容${d.lifecycle?'':' · 生命周期分析计算中'}</div></div>
  </div>`:""}
  <div style="margin-bottom:22px">
    <h2 style="font-size:22px;margin-bottom:6px">${d.evaluation_name||d.evaluation_id}</h2>
    <div style="color:var(--sub);font-size:16px;margin-bottom:8px"><span class="bdg b-${d.status||""}">${d.status||"-"}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:14px;color:var(--sub);background:var(--p2);border-radius:10px;padding:12px 16px">
      <div><span style="color:var(--gray)">项目：</span><b>${kgInfo.project_name||"-"}</b> · <span style="color:var(--gray)">任务：</span><b>${kgInfo.task_name||"-"}</b></div>
      ${evalMode==='runtime'?'':'<div><span style="color:var(--gray)">基线来源：</span><b>'+(bsrc==='vuln_center'?('漏洞中心 · '+vcProj+' / '+vcTask):'测评数据集')+'</b></div>'}
      <div><span style="color:var(--gray)">评测模式：</span><b style="color:var(--acc)">${evalMode==='dev'?'开发态':'运行态'}</b></div>
      <div><span style="color:var(--gray)">评测 ID：</span><b style="font-family:monospace">${d.evaluation_id}</b></div>
    </div>
  </div>

  <!-- 基础指标 -->
  <div class="card" style="margin-bottom:16px">
    <h3>基础效果指标</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
      ${baseMetrics}
    </div>
  </div>

  <!-- 因果链汇总 -->
  ${(causeTotal>0||effectTotal>0)?`<div class="card" style="margin-bottom:16px"><h3>因果链汇总</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div><h4 style="font-size:16px;margin-bottom:8px">成因汇总</h4>${causeBars}<div style="font-size:14px;color:var(--sub);margin-top:8px">总断点数：${causeTotal}</div></div>
      <div><h4 style="font-size:16px;margin-bottom:8px">效果标签分布</h4>${effectBars}<div style="font-size:14px;color:var(--sub);margin-top:8px">总记录数：${effectTotal}</div></div>
    </div></div>`:''}

  <!-- 生命周期分析段 -->
  ${d.lifecycle?renderLifecycle(d.lifecycle):(_partial&&_partial.running?'<div class="card" style="margin-bottom:16px"><h3>L0-L7 生命周期分析</h3><div style="color:var(--sub);padding:20px;text-align:center">计算中…</div></div>':'')}

  <!-- 问题单 -->
  <div id="dts-section"></div>

  `;

  $("view").innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div id="rep-content" style="flex:1;overflow-y:auto">'+html+'</div>';
  // 异步加载问题单
  loadDtsSection(d.evaluation_id||activeId||'');
}

  });
  html+='</div>';

function renderDtsTable(){
  if(!_dtsData){return;}
  var f=_dtsFilter;
  var filtered=_dtsData.filter(function(i){
    if(f.status&&i.status!==f.status)return false;
    if(f.agent_type&&i.agent_type!==f.agent_type)return false;
    if(f.case_type&&i.case_type!==f.case_type)return false;
    if(f.responsibility&&dtsResponsibility(i.cause_code)!==f.responsibility)return false;
    if(f.q){var s=((i.dts_id||'')+' '+(i.task_id||'')+' '+(i.evaluation_id||'')).toLowerCase();if(s.indexOf(f.q)<0)return false;}
    return true;
  });
  if(!filtered.length){
    $("dts-table").innerHTML='<div style="color:var(--sub);padding:20px;text-align:center">无匹配问题单</div>';
    return;
  }
  var html='<table><thead><tr><th>问题单 ID</th><th>评测 ID</th><th>类型</th><th>Agent</th><th>责任方</th><th>成因</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  filtered.forEach(function(i){
    html+='<tr>'
      +'<td style="font-size:12px;font-family:monospace;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+(i.dts_id||'')+'</td>'
      +'<td style="font-size:12px;font-family:monospace;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+(i.evaluation_id||'')+'</td>'
      +'<td><span class="bdg" style="background:rgba('+(i.case_type==='FP'?'248,113,113':'251,191,36')+',.18);color:'+(i.case_type==='FP'?'var(--red)':'var(--amber)')+'">'+DTS_CASE_TYPE_LABELS[i.case_type]+'</span></td>'
      +'<td style="font-size:14px">'+(i.agent_type||'-')+'</td>'
      +'<td style="font-size:14px">'+(DTS_RESP_LABELS[dtsResponsibility(i.cause_code)]||'-')+'</td>'
      +'<td style="font-size:14px">'+(DTS_CAUSE_LABELS[i.cause_code]||i.cause_code||'-')+'</td>'
      +'<td><span class="bdg" style="background:rgba(107,114,128,.15);color:'+(DTS_STATUS_COLORS[i.status]||'var(--gray)')+'">'+DTS_STATUS_LABELS[i.status]+'</span></td>'
      +'<td><button class="btn g" style="font-size:12px;padding:3px 10px" onclick="showDtsDetail(\''+i.dts_id+'\')">详情</button></td>'
      +'</tr>';
  });
  html+='</tbody></table>';
  $("dts-table").innerHTML=html;
}

// ===== 问题单（报告内嵌段）=====
const DTS_STATUS_LABELS={'unlocated':'未定位','improving':'改进中','confirmed':'已确认','closing':'关闭中','passed':'已通过','failed':'未通过','not_issue':'非问题'};
const DTS_STATUS_COLORS={'unlocated':'var(--gray)','improving':'var(--acc)','confirmed':'var(--amber)','closing':'var(--amber)','passed':'var(--green)','failed':'var(--red)','not_issue':'var(--gray)'};
const DTS_RESP_LABELS={'agent':'Agent','knowledge_base':'知识库'};
const DTS_CASE_TYPE_LABELS={'FP':'误报','FN':'漏报'};
const DTS_CAUSE_LABELS={'A':'L2断(该查没查)','B':'L3断(查询太泛)','C':'L4断(查了没得)','D':'L5断(链路问题)','E':'L6断(查到没用)','F':'L7断(用了没推动)','G':'L7负向(导致误判)'};
const DTS_CAUSE_TO_RESP={'A':'agent','B':'agent','C':'knowledge_base','D':'knowledge_base','E':'agent','F':'agent','G':'knowledge_base'};
function dtsResponsibility(causeCode){return DTS_CAUSE_TO_RESP[causeCode]||'';}

async function loadDtsSection(evalId){
  var container=$("dts-section");if(!container)return;
  if(!evalId){container.innerHTML='';return;}
  container.innerHTML='<div class="card" style="margin-bottom:16px"><h3>问题单</h3><div style="color:var(--sub);padding:12px">加载中…</div></div>';
  try{
    var dts=await jget(`/api/v2/dts?evaluation_id=${evalId}&limit=9999`);
    var issues=dts.issues||[];
    var stats=dts.stats||{};
    renderDtsSection(evalId,issues,stats);
  }catch(e){
    container.innerHTML='<div class="card" style="margin-bottom:16px"><h3>问题单</h3><div style="color:var(--sub);padding:12px">暂无问题单</div></div>';
  }
}

function renderDtsSection(evalId,issues,stats){
  var container=$("dts-section");if(!container)return;
  var total=issues.length;
  var byStatus={};
  issues.forEach(function(i){byStatus[i.status]=(byStatus[i.status]||0)+1;});
  var byResp={agent:0,knowledge_base:0};
  issues.forEach(function(i){var r=dtsResponsibility(i.cause_code);if(byResp.hasOwnProperty(r))byResp[r]++;});
  var byCaseType={FP:0,FN:0};
  issues.forEach(function(i){var t=i.case_type||'';if(byCaseType.hasOwnProperty(t))byCaseType[t]++;});

  var statusBars=Object.keys(DTS_STATUS_LABELS).map(function(s){
    var v=byStatus[s]||0;var pct=total>0?(v/total*100).toFixed(1):'0.0';
    return '<div class="barr"><span class="bar-l" style="font-size:13px">'+DTS_STATUS_LABELS[s]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(v>0?DTS_STATUS_COLORS[s]:'var(--p2)')+'"></div></div><span class="bar-v">'+v+'</span></div>';
  }).join('');

  var summaryHtml='<div class="card" style="margin-bottom:16px"><h3>问题单</h3>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px">'
    +'<div class="mcard"><div class="mc-label">总问题单</div><div class="mc-val">'+total+'</div></div>'
    +'<div class="mcard"><div class="mc-label">误报(FP)</div><div class="mc-val" style="color:var(--red)">'+byCaseType.FP+'</div></div>'
    +'<div class="mcard"><div class="mc-label">漏报(FN)</div><div class="mc-val" style="color:var(--amber)">'+byCaseType.FN+'</div></div>'
    +'<div class="mcard"><div class="mc-label">Agent 责任</div><div class="mc-val" style="color:var(--acc)">'+byResp.agent+'</div></div>'
    +'<div class="mcard"><div class="mc-label">知识库责任</div><div class="mc-val" style="color:var(--amber)">'+byResp.knowledge_base+'</div></div>'
    +'</div>'

    }

async function saveDtsIssue(dtsId){
  var rootCause=$("dts_root_cause")?$("dts_root_cause").value.trim():"";
  var solution=$("dts_solution")?$("dts_solution").value.trim():"";
  try{
    await jput(`/api/v2/dts/${dtsId}`,{root_cause:rootCause,solution:solution});
    showDtsDetail(dtsId);
  }catch(e){alert("保存失败: "+e);}
}

async function closeDtsIssue(dtsId){
  try{
    await jpost(`/api/v2/dts/${dtsId}/close`,{});
    showDtsDetail(dtsId);
    loadDtsSection(activeId||'');
  }catch(e){alert("关闭失败: "+e);}
}

async function rejectDtsIssue(dtsId){
  try{
    await jpost(`/api/v2/dts/${dtsId}/reject`,{});
    showDtsDetail(dtsId);
    loadDtsSection(activeId||'');
  }catch(e){alert("拒绝失败: "+e);}
}

function filterMainList(){
  const q=$("main-search")?($("main-search").value||"").toLowerCase():"";const s=sel;

    $("main-list").innerHTML=f.map(p=>`<div class="opt" onclick="pickMain('proj','${p.id}','${p.name.replace(/'/g,"")}')"><span class="l" title="${p.name}">${p.name}</span><span class="opt-mid" style="color:var(--sub)" title="${p.department_name||""}">${p.department_name||""}</span><span class="opt-right" style="color:var(--acc)" title="${p.product_path||""}">${p.product_path||""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }else if(!s.task){
    if(!_sideData.tasks)return;
    const f=_sideData.tasks.filter(t=>((t.name||"")+" "+t.id+" "+(t.task_type||"")+" "+(t.test_target||"")+" "+(t.status||"")).toLowerCase().includes(q));

function _checkTraceMain(){
  jget(`/api/v1/platform/tasks/${sel.proj}/${sel.task}/trace-check`).then(d=>{
    if(d.ready){
      const m=d.mining||{};const v=d.verify||[];
      let info=`挖掘工具: <b>${_toolLabel(m.trace_kind)}</b>`;

      sel.traceReady=true;sel.traceKind=m.trace_kind;sel.traceInfo=info;

let _dsData=null;
async function loadDatasources(){
  try{const d=await jget("/api/v2/datasources");_dsData=d.datasources||d||[];renderDsContainer();}
  catch(e){$("ds-container").innerHTML='<div style="color:var(--red)">加载失败: '+e+'</div>';}
}
function renderDsContainer(){
  if(!_dsData||!_dsData.length){$("ds-container").innerHTML='<div style="color:var(--sub)">无配置</div>';return;}
  $("ds-container").innerHTML=_dsData.map(function(ds,i){
    var dbType=ds.db_type||'none';
    var typeBadge=dbType==='mysql'?'<span class="bdg b-COMPLETED">MySQL</span>':dbType==='postgresql'?'<span class="bdg b-RUNNING">PostgreSQL</span>':'<span class="bdg b-CREATED">无独立DB</span>';
    var statusBadge=ds.last_error?'<span class="bdg b-FAILED">连接异常</span>':ds.last_connected_at?'<span class="bdg b-COMPLETED">已连接</span>':'<span class="bdg b-CREATED">未测试</span>';
    var enabledBadge=ds.enabled?'<span class="bdg b-COMPLETED">启用</span>':'<span class="bdg b-CREATED">禁用</span>';
    var connInfo=ds.host?(ds.host+':'+(ds.port||'')):'-';
    var dbName=ds.database_name||'-';
    var pidInput=(ds.database_name||'').indexOf('{project_id}')>=0?'<div style="margin-top:10px"><label style="font-size:12px;color:var(--sub);margin:0">测试用 Project ID（数据库名含 {project_id} 占位符）</label><input id="ds_'+i+'_pid" placeholder="如 1ebaa4b2dc204454" style="width:100%;padding:6px 10px;font-size:14px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>':'';
    return '<div style="border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:16px">'+ds.display_name+'</b>'+typeBadge+enabledBadge+statusBadge+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;color:var(--sub);margin-bottom:10px">'+
      '<div>主机: <span style="font-family:monospace;color:var(--txt)">'+connInfo+'</span></div>'+
      '<div>数据库: <span style="font-family:monospace;color:var(--txt)">'+dbName+'</span></div>'+
      '<div>用户: <span style="font-family:monospace;color:var(--txt)">'+(ds.username||'-')+'</span></div>'+
      '<div>版本: <span style="font-family:monospace;color:var(--txt)">v'+(ds._version||1)+'</span></div>'+
      '</div>'+
      (ds.last_error?'<div style="font-size:13px;color:var(--red);margin-bottom:8px;padding:6px 10px;background:rgba(248,113,113,.08);border-radius:6px">'+ds.last_error+'</div>':'')+
      pidInput+
      '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn g" style="font-size:13px;padding:6px 14px" onclick="testDatasource('+i+')">测试连接</button>'+
      '<button class="btn g" style="font-size:13px;padding:6px 14px" onclick="toggleDsEnabled('+i+')">'+(ds.enabled?'禁用':'启用')+'</button>'+
      '</div><div id="ds_'+i+'_msg" style="margin-top:8px;font-size:13px"></div></div>';
  }).join('');
}
async function testDatasource(i){
  var ds=_dsData[i];if(!ds)return;
  var msg=$("ds_"+i+"_msg");if(msg)msg.innerHTML='<span style="color:var(--sub)">测试中...</span>';
  var pidEl=$("ds_"+i+"_pid");
  var pid=pidEl?pidEl.value.trim():'';
  var url="/api/v2/datasources/"+ds.agent_type+"/test";
  if(pid)url+="?project_id="+encodeURIComponent(pid);
  try{
    var r=await jpost(url,{});
    if(msg)msg.innerHTML=r.success?'<span style="color:var(--green)">✓ '+r.error+'</span>':'<span style="color:var(--red)">✗ '+r.error+'</span>';
    loadDatasources();
  }catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+e+'</span>';}
}
async function toggleDsEnabled(i){
  var ds=_dsData[i];if(!ds)return;
  try{await jput("/api/v2/datasources/"+ds.agent_type,{enabled:!ds.enabled});loadDatasources();}
  catch(e){alert("切换失败: "+e);}
}

// ===== 通用操作 =====
function retryEval(eid){
  showConfirm({icon:'⚠️',iconBg:'rgba(251,191,36,.15)',iconColor:'var(--amber)',title:'重跑评测',
    desc:'重跑将清除该评测的全部数据，重新解析 trace 并调用 LLM。',
    risks:['耗时可能较长（10-30 分钟）','如果 LLM 不可用会降级为规则生成','旧报告会被覆盖'],
    confirmText:'重跑',confirmColor:'var(--acc)',
    onConfirm:function(){
      activeId=eid;
      var rep=$("view");if(rep)rep.innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic" style="animation:spin 1s linear infinite">⏳</div><h3>正在重新启动评测…</h3><p style="font-size:14px;color:var(--sub)">清理旧数据并重新解析中</p></div>';
      F('/api/v1/evaluations/'+eid+'/retry?force=true',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
        if(d.status==='QUEUED'||d.status==='RUNNING'){
          var pollCnt=0;var retryPoll=function(){pollCnt++;if(pollCnt>30)return;if(activeId!==eid)return;
            jget('/api/v1/evaluations/'+eid).then(function(s){if(s.status==='FAILED'){setTimeout(retryPoll,1000);}else{selEv(eid);}}).catch(function(){setTimeout(retryPoll,1000);});};
          setTimeout(retryPoll,500);
        }else{alert('重试失败: '+JSON.stringify(d));}
      }).catch(function(e){alert('重试失败: '+e);});
    }
  });
}
function deleteEval(eid,name){
  showConfirm({icon:'🗑️',iconBg:'rgba(248,113,113,.15)',iconColor:'var(--red)',title:'删除评测',
    desc:'删除将永久清除该评测的全部数据，不可恢复。',
    risks:['trace 解析结果','指标计算结果','分析报告','基线匹配数据'],
    confirmText:'永久删除',confirmColor:'var(--red)',
    onConfirm:function(){
  F('/api/v1/evaluations/'+eid,{method:'DELETE'}).then(r=>r.json()).then(d=>{
    if(d.status==='ok'){Router.navigate('/');$("view").innerHTML='<div class="empty"><div class="ic">🗑️</div><h3>评测已删除</h3><p>'+eid+'</p><button class="btn" style="margin-top:16px" onclick="goBack()">返回列表</button></div>';}else{alert('删除失败: '+JSON.stringify(d));}
  }).catch(e=>alert('删除失败: '+e));
    }
  });
}
function cancelEval(eid){
  showConfirm({icon:'⚠️',iconBg:'rgba(245,158,11,.15)',iconColor:'var(--amber)',title:'取消评测',
    desc:'取消后评测将停止运行，状态设为已取消。此操作不可撤销。',
    confirmText:'确认取消',confirmColor:'var(--amber)',
    onConfirm:function(){
      F('/api/v1/evaluations/'+eid+'/cancel',{method:'POST'}).then(function(r){return r.json()}).then(function(d){if(d.status==='CANCELLED'){renderEvals();}else{alert('取消失败: '+JSON.stringify(d));}}).catch(function(e){alert('取消失败: '+e);});
    }
  });
}
function showConfirm(opts){
  var ov=document.createElement("div");ov.className="modal-overlay";
  var risksHtml=(opts.risks||[]).map(function(r){return "<li>"+r+"</li>"}).join("");
  ov.innerHTML='<div class="modal">'+
    '<div class="modal-head"><div class="modal-icon" style="background:'+opts.iconBg+';color:'+opts.iconColor+'">'+opts.icon+'</div><h3>'+opts.title+'</h3></div>'+
    '<div class="modal-body"><p>'+opts.desc+'</p>'+(risksHtml?'<ul>'+risksHtml+'</ul>':'')+'</div>'+
    '<div class="modal-foot"><button class="btn g" style="font-size:15px;padding:8px 20px" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>'+
    '<button class="btn" style="font-size:15px;padding:8px 20px;background:'+opts.confirmColor+'" id="modal-confirm">'+opts.confirmText+'</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener("click",function(e){if(e.target===ov)ov.remove()});
  document.getElementById("modal-confirm").onclick=function(){ov.remove();if(opts.onConfirm)opts.onConfirm();};
}

// ===== 启动 =====
Router.init();
</script>
