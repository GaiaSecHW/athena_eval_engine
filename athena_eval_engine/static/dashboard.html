      +'<h3>基本信息</h3>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:14px;margin-bottom:12px">'
      +'<div><span style="color:var(--gray)">问题单 ID：</span><b style="font-family:monospace;font-size:13px">'+d.dts_id+'</b></div>'
      +'<div><span style="color:var(--gray)">状态：</span><span class="bdg" style="background:rgba(107,114,128,.15);color:'+statusColor+'">'+statusLabel+'</span></div>'
      +'<div><span style="color:var(--gray)">任务 ID：</span><b style="font-family:monospace;font-size:12px">'+(d.task_id||'-')+'</b></div>'
      +'<div><span style="color:var(--gray)">类型：</span><b>'+caseTypeLabel+'</b></div>'
      +'<div><span style="color:var(--gray)">Agent：</span><b>'+agentLabel+'</b></div>'
      +'<div><span style="color:var(--gray)">责任方：</span><b>'+respLabel+'</b></div>'
      +'<div><span style="color:var(--gray)">成因：</span><b>'+causeLabel+'</b></div>'
      +'<div><span style="color:var(--gray)">断点级别：</span><b>'+(d.breakpoint_level||'-')+'</b></div>'
      +'<div><span style="color:var(--gray)">Case ID：</span><b style="font-family:monospace;font-size:12px">'+(d.case_id||'-')+'</b></div>'
      +'<div><span style="color:var(--gray)">评测 ID：</span><b style="font-family:monospace;font-size:12px">'+(d.evaluation_id||'-')+'</b></div>'
      +'</div>';
    if(caseData){
      html+='<div style="margin-top:8px;padding:8px 0;border-top:1px solid var(--bd)">'
        +'<div style="font-size:14px;color:var(--sub);margin-bottom:4px">漏洞标题</div>'
        +'<div style="font-size:15px;font-weight:600">'+(caseData.vuln_title||'-')+'</div>';
      // 漏洞摘要紧跟漏洞标题
      if(caseData.summary){
        html+='<div style="margin-top:8px;font-size:14px;color:var(--sub);margin-bottom:4px">漏洞摘要</div>'
          +'<div style="font-size:14px;padding:10px 12px;background:var(--p2);border-radius:8px;white-space:pre-wrap">'+String(caseData.summary).replace(/</g,'&lt;')+'</div>';
      }
      if(caseData.human_confirmation_summary){
        html+='<div style="margin-top:8px;font-size:14px;color:var(--sub);margin-bottom:4px">人工确认信息</div>'
          +'<div style="font-size:14px;padding:8px 10px;background:rgba(220,38,38,.08);border-radius:6px;white-space:pre-wrap">'+String(caseData.human_confirmation_summary).replace(/</g,'&lt;')+'</div>';
      }
      html+='</div>';
    }
    html+='</div>';

    // ── 2. 多假设根因分析 + 修复建议 ──
    if(caseData){
      var chainsForRC=[
        {label:'挖掘',data:caseData.mining||{}},
        {label:'验证',data:caseData.verification||{}}
      ];
      var TARGET_LABELS={agent_prompt:'Agent提示词',agent_code:'Agent代码',knowledge:'知识/记忆',knowledge_base:'知识库',memory:'记忆模块',external_data_source:'外部数据源',eval_process:'评测流程'};
      var allHypotheses=[];
      var allLabelQuality=[];
      var legacyRootCauses=[];
      var legacyFixSuggestions=[];
      var projectId=(d.project_id||d.task_id||'').split(':')[0];
      var projectName=d.evaluation_name||'';
      chainsForRC.forEach(function(ch){
        var hypList=ch.data.hypotheses||[];
        if(Array.isArray(hypList)&&hypList.length){
          hypList.forEach(function(h){
            if(h&&typeof h==='object'){
              allHypotheses.push({
                label:ch.label,
                chainType:ch.label,
                agentType:ch.data.agent_type||'',
                data:h,
              });
            }
          });
        }else{
          // 兼容旧格式：从 root_cause + fix_suggestion 构建
          var rc=ch.data.root_cause||{};
          if(rc&&Object.keys(rc).length){
            legacyRootCauses.push({label:ch.label,category:rc.category||'',description:rc.description||''});
          }
          var fsList=ch.data.fix_suggestion||[];
          if(typeof fsList==='string'){fsList=[{action:fsList}];}
          if(Array.isArray(fsList)){
            fsList.forEach(function(fs){
              if(fs&&typeof fs==='object'){legacyFixSuggestions.push({label:ch.label,items:fs});}
            });
          }
        }
        var lq=ch.data.label_quality||{};
        if(lq&&Object.keys(lq).length){allLabelQuality.push({label:ch.label,data:lq});}
      });

      // 2a. 人工标注质量评估（如 imprecise 显示追问）
      var impreciseItems=allLabelQuality.filter(function(lq){return lq.data.precision==='imprecise';});
      if(impreciseItems.length){
        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--amber)">'
          +'<h3>人工标注质量评估</h3>';
        impreciseItems.forEach(function(lq){
          var d=lq.data||{};
          html+='<div style="margin-bottom:12px;padding:10px 12px;background:rgba(251,191,36,.08);border-radius:8px">'
            +'<div style="font-size:14px;color:var(--sub);margin-bottom:4px">标注不精确';
          if(lq.label){html+=' <span class="knd">'+lq.label+'</span>';}
          html+='</div>';
          if(d.reason){html+='<div style="font-size:14px;margin-bottom:6px"><b style="color:var(--sub)">理由：</b>'+String(d.reason).replace(/</g,'&lt;')+'</div>';}
          if(d.follow_up_questions&&d.follow_up_questions.length){
            html+='<div style="font-size:14px"><b style="color:var(--sub)">需追问：</b><ul style="margin:4px 0 0 18px">';
            d.follow_up_questions.forEach(function(q){html+='<li>'+String(q).replace(/</g,'&lt;')+'</li>';});
            html+='</ul></div>';
          }
          html+='</div>';
        });
        html+='</div>';
      }

      if(allHypotheses.length){
        // 2b. 多假设根因卡片
        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--red)">'
          +'<h3>多假设根因分析（'+allHypotheses.length+' 个假设）</h3>';
        // 按概率降序
        allHypotheses.sort(function(a,b){return (b.data.probability||0)-(a.data.probability||0);});
        allHypotheses.forEach(function(h,idx){
          var hdata=h.data||{};
          var prob=hdata.probability||0;
          var resp=hdata.responsibility||'';
          var causeCode=hdata.cause_code||'';
          var chainType=h.chainType||h.label||'chain';
          var agentType=h.agentType||'';
          var hypDesc=hdata.hypothesis||'';
          var evidence=hdata.evidence||'';
          var canResolve=hdata.agent_can_resolve;
          var blockedBy=hdata.blocked_by||'';
          var neededData=hdata.needed_external_data||[];
          var fs=hdata.fix_suggestion||{};
          var target=TARGET_LABELS[fs.target]||fs.target||'';
          var location=fs.location||'';
          var action=fs.action||'';
          var expected=fs.expected_effect||'';
          var causeLabel=DTS_CAUSE_LABELS[causeCode]||causeCode||'-';
          var respLabel=DTS_RESP_LABELS[resp]||resp||'-';
          var probColor=prob>=0.6?'var(--red)':prob>=0.3?'var(--amber)':'var(--gray)';
          var hypSid=hdata.session_id||'';
          html+='<div style="margin-bottom:14px;border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
            +'<div style="padding:10px 12px;background:var(--p2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
            +'<span style="font-weight:600;font-size:14px">假设 '+(idx+1)+'</span>';
          if(h.label){html+=' <span class="knd">'+h.label+'</span>';}
          html+=' <span class="knd" style="background:rgba(220,38,38,.12);color:'+probColor+'">P='+prob+'</span>'
            +' <span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+respLabel+'</span>'
            +' <span class="knd">'+causeLabel+'</span>';
          if(hypSid){
            html+=' <span class="knd" style="background:rgba(16,185,129,.12);color:var(--green);font-family:monospace;font-size:12px">基于 '+String(hypSid).replace(/</g,'&lt;')+'</span>';
          }
          if(canResolve===false){
            html+=' <span class="knd" style="background:rgba(251,191,36,.18);color:var(--amber)">Agent无法自行解决</span>';
          }else if(canResolve===true){
            html+=' <span class="knd" style="background:rgba(34,197,94,.15);color:var(--green)">Agent可解决</span>';
          }
          html+='</div>';
          if(hypDesc){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">假设：</b>'+String(hypDesc).replace(/</g,'&lt;')+'</div>';
          }
          if(evidence){
            html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">证据：</b>'+String(evidence).replace(/</g,'&lt;')+'</div>';
          }
          if(canResolve===false){
            if(blockedBy){html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">阻塞：</b>'+String(blockedBy).replace(/</g,'&lt;')+'</div>';}
            if(neededData&&neededData.length){
              html+='<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">需外部数据：</b>'+neededData.map(function(x){return String(x).replace(/</g,'&lt;');}).join('、')+'</div>';
            }
          }
          // 修复建议（嵌入假设卡片内）
          if(target||location||action||expected){
            html+='<div style="padding:10px 12px;background:rgba(37,99,235,.04);border-top:1px solid var(--bd)"><div style="font-size:14px;color:var(--sub);margin-bottom:6px">修复建议';
            if(target){html+=' <span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+target+'</span>';}
            html+='</div>';
            if(location){html+='<div style="font-size:14px;margin-bottom:4px"><b style="color:var(--sub)">修改位置：</b>'+String(location).replace(/</g,'&lt;')+'</div>';}
            if(action){html+='<div style="font-size:14px;margin-bottom:4px"><b style="color:var(--sub)">修改内容：</b>'+String(action).replace(/</g,'&lt;')+'</div>';}
            if(expected){html+='<div style="font-size:14px"><b style="color:var(--sub)">预期效果：</b>'+String(expected).replace(/</g,'&lt;')+'</div>';}
            // 根因确认按钮
            var hk=(chainType||'chain')+':hyp'+(idx+1);
            var hcInfo=(d.hypothesis_confirmations||{})[hk]||{};
            html+='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
            html+='<span style="font-size:13px;color:var(--sub);font-weight:500">根因确认：</span>';
            if(hcInfo.is_root===true){
              html+='<span class="knd" style="background:rgba(34,197,94,.15);color:var(--green);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(34,197,94,.2)">✓ 确认为根因</span>';
            }else if(hcInfo.is_root===false){
              html+='<span class="knd" style="background:rgba(220,38,38,.12);color:var(--red);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(220,38,38,.2)">✗ 确认为非根因</span>';
            }else{
              html+='<button class="confirm-btn confirm-btn-yes" onclick="confirmHypothesis(\''+d.dts_id+'\',\''+hk+'\',true,\''+(causeCode||'')+'\',\''+(agentType||'')+'\',\''+(projectId||'')+'\',\''+(projectName||'')+'\',this)">✓ 是此根因</button>'
                +'<button class="confirm-btn confirm-btn-no" onclick="confirmHypothesis(\''+d.dts_id+'\',\''+hk+'\',false,\''+(causeCode||'')+'\',\''+(agentType||'')+'\',\''+(projectId||'')+'\',\''+(projectName||'')+'\',this)">✗ 非此根因</button>';
            }
            html+='</div>';
            html+='</div>';
          }else{
            // 无建议时也给确认按钮
            var hk2=(chainType||'chain')+':hyp'+(idx+1);
            var hcInfo2=(d.hypothesis_confirmations||{})[hk2]||{};
            html+='<div style="padding:10px 12px;border-top:1px solid var(--bd)"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
            html+='<span style="font-size:13px;color:var(--sub);font-weight:500">根因确认：</span>';
            if(hcInfo2.is_root===true){
              html+='<span class="knd" style="background:rgba(34,197,94,.15);color:var(--green);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(34,197,94,.2)">✓ 确认为根因</span>';
            }else if(hcInfo2.is_root===false){
              html+='<span class="knd" style="background:rgba(220,38,38,.12);color:var(--red);font-size:13px;padding:6px 14px;border-radius:8px;box-shadow:0 2px 8px rgba(220,38,38,.2)">✗ 确认为非根因</span>';
            }else{
              html+='<button class="confirm-btn confirm-btn-yes" onclick="confirmHypothesis(\''+d.dts_id+'\',\''+hk2+'\',true,\''+(causeCode||'')+'\',\''+(agentType||'')+'\',\''+(projectId||'')+'\',\''+(projectName||'')+'\',this)">✓ 是此根因</button>'
                +'<button class="confirm-btn confirm-btn-no" onclick="confirmHypothesis(\''+d.dts_id+'\',\''+hk2+'\',false,\''+(causeCode||'')+'\',\''+(agentType||'')+'\',\''+(projectId||'')+'\',\''+(projectName||'')+'\',this)">✗ 非此根因</button>';
            }
            html+='</div></div>';
          }
          html+='</div>';
        });
        html+='</div>';
      }else if(legacyRootCauses.length||legacyFixSuggestions.length){
        // 兼容旧格式
        html+='<div class="card" style="margin-bottom:16px;border-left:3px solid var(--red)">'
          +'<h3>根因分析与修复建议</h3>';
        legacyRootCauses.forEach(function(rc){
          html+='<div style="margin-bottom:12px"><div style="font-size:14px;color:var(--sub);margin-bottom:4px">根因';
          if(rc.label){html+=' <span class="knd">'+rc.label+'</span>';}
          if(rc.category){html+=' <span class="knd">'+rc.category+'</span>';}
          html+='</div><div style="font-size:14px;padding:10px 12px;background:var(--p2);border-radius:8px;white-space:pre-wrap">'+String(rc.description||'(无)').replace(/</g,'&lt;')+'</div></div>';
        });
        legacyFixSuggestions.forEach(function(fs){
          var fi=fs.items||{};
          var target=TARGET_LABELS[fi.target]||fi.target||'';
          var location=fi.location||'';
          var action=fi.action||'';
          var expected=fi.expected_effect||'';
          html+='<div style="margin-bottom:12px;border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
            +'<div style="font-size:14px;color:var(--sub);padding:8px 12px;background:var(--p2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
            +'修复建议';
          if(fs.label){html+=' <span class="knd">'+fs.label+'</span>';}
          if(target){html+=' <span class="knd" style="background:rgba(37,99,235,.12);color:var(--acc)">'+target+'</span>';}
          html+='</div>';
          if(location){html+='<div style="padding:8px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">修改位置：</b>'+String(location).replace(/</g,'&lt;')+'</div>';}
          if(action){html+='<div style="padding:8px 12px;font-size:14px;border-bottom:1px solid var(--bd)"><b style="color:var(--sub)">修改内容：</b>'+String(action).replace(/</g,'&lt;')+'</div>';}
          if(expected){html+='<div style="padding:8px 12px;font-size:14px"><b style="color:var(--sub)">预期效果：</b>'+String(expected).replace(/</g,'&lt;')+'</div>';}
          html+='</div>';
        });
        html+='</div>';
      }
    }

    // ── 3. 误报原因分析（断点列表，可折叠）──
    // 多假设根因分析已包含 cause_code + evidence + 修复建议，此处仅在无多假设时显示
    var _hasHypotheses=typeof allHypotheses!=='undefined'&&allHypotheses&&allHypotheses.length>0;
    if(d.breakpoint_desc&&!_hasHypotheses){
      var bpTitle=d.case_type==='FN'?'漏报原因分析':'误报原因分析';
      html+='<div class="card" style="margin-bottom:16px">'
        +'<details><summary style="font-size:15px;color:var(--sub);cursor:pointer;font-weight:600">'+bpTitle+'</summary>'
        +'<div style="margin-top:8px;font-size:14px;padding:10px 12px;background:var(--p2);border-radius:8px;white-space:pre-wrap">'+String(d.breakpoint_desc).replace(/</g,'&lt;')+'</div>'
        +'</details>';
      if(d.evidence_uri){
        html+='<div style="margin-top:12px"><div style="font-size:14px;color:var(--sub);margin-bottom:4px">证据</div><div style="font-size:13px;font-family:monospace;padding:10px 12px;background:var(--p2);border-radius:8px;word-break:break-all">'+String(d.evidence_uri).replace(/</g,'&lt;')+'</div></div>';
      }
      html+='</div>';
    }

    // ── 5. Session 调用链 + 压缩摘要（挖掘 + 验证各自独立）──
    var sessionChains=d.session_chains||{mining:[],verification:[],parent_map:{}};
    if(caseData){
      var chains=[
        {type:'mining',label:'挖掘链',data:caseData.mining||{},sessions:sessionChains.mining||[]},
        {type:'verification',label:'验证链',data:caseData.verification||{},sessions:sessionChains.verification||[]}
      ];
      chains.forEach(function(ch){
        if(!ch.data||!Object.keys(ch.data).length){return;}
        var sessionChain=ch.data.session_chain||[];
        var agentType=ch.data.agent_type||'';
        var agentLbl=DTS_AGENT_LABELS[agentType]||agentType||'-';
        var summaries=ch.data.compressed_summaries||[];
        var chainSessions=ch.sessions||[];
        var parentMap=sessionChains.parent_map||{};

        html+='<div class="card" style="margin-bottom:16px">'
          +'<h3>'+ch.label+' ('+agentLbl+')</h3>';

        // Session 调用链树（用 parent_map 构建树）
        if(chainSessions.length){
          html+='<div style="margin-bottom:12px"><div style="font-size:14px;color:var(--sub);margin-bottom:6px">Session 调用链 ('+chainSessions.length+' 个)</div>';
          html+='<div style="font-family:monospace;font-size:13px;line-height:1.8;white-space:pre-wrap;padding:10px 12px;background:var(--p2);border-radius:8px">';
          var smap={};
          chainSessions.forEach(function(s){smap[s.session_id]=s;});
          var chainSet={};
          chainSessions.forEach(function(s){chainSet[s.session_id]=true;});
          var roots=chainSessions.filter(function(s){
            var pid=s.parent_id||'';
            return !pid||!chainSet[pid];
          });
          var visited={};
          function renderNode(sid,depth){
            if(visited[sid]){return'';}
            visited[sid]=true;
            var s=smap[sid]||{};
            var agent=s.agent||s.session_type||'?';
            var taskType=s.task_type?' ['+s.task_type+']':'';
            var status=s.status?' ('+s.status+')':'';
            var indent='  '.repeat(depth);
            var arrow=depth>0?'└─ ':'';
            var line=indent+arrow+'<span style="color:var(--acc)">'+agent+'</span>'+taskType+status+' <span style="color:var(--gray);font-size:11px">'+sid+'</span>\n';
            var kids=chainSessions.filter(function(cs){return cs.parent_id===sid;});
            kids.forEach(function(kid){line+=renderNode(kid.session_id,depth+1);});
            return line;
          }
          if(roots.length){
            roots.forEach(function(s){
              html+=renderNode(s.session_id,0);
            });
          }else{
            chainSessions.forEach(function(s,idx){
              var agent=s.agent||s.session_type||'?';
              html+=(idx>0?'→ ':'')+agent+' <span style="color:var(--gray);font-size:11px">'+s.session_id+'</span>\n';
            });
          }
          html+='</div></div>';
        }

        // 压缩摘要
        if(summaries.length){
          html+='<details style="margin-bottom:12px"><summary style="font-size:14px;color:var(--sub);cursor:pointer">压缩摘要 ('+summaries.length+' 个)</summary>';
          summaries.forEach(function(s,idx){
            var sumText=s.summary||s.compressed_summary||'';
            if(sumText){
              html+='<div style="margin-top:8px;padding:10px 12px;background:var(--p2);border-radius:8px;font-size:13px;white-space:pre-wrap">'+String(sumText).replace(/</g,'&lt;')+'</div>';
            }
            // 单 session 的知识/记忆使用情况已移至合并层统一生成，单 session 压缩不再产出此字段
          });
          html+='</details>';
        }

        // 合并后的知识/记忆使用总结
        var mergeKM=ch.data.knowledge_memory_summary;
        if(mergeKM&&(mergeKM.access_count>0||mergeKM.overall_effect||mergeKM.impact_on_conclusion)){
          html+=renderKMSummary(mergeKM,ch.label+' 综合');
        }

        html+='</div>';
      });
    }

    // ── 6. 回归验证 ──
    if(d.replay_result){
      var replayColor=d.replay_result==='false_positive_resolved'?'var(--green)':d.replay_result==='still_vulnerable'?'var(--red)':'var(--gray)';
      var replayLabel=d.replay_result==='false_positive_resolved'?'误报已消除':d.replay_result==='still_vulnerable'?'漏洞仍存在':'-';
      html+='<div class="card" style="margin-bottom:16px"><h3>回归验证</h3>'
        +'<div style="font-size:14px"><span style="color:var(--gray)">回归结果：</span><span class="bdg" style="background:rgba(107,114,128,.15);color:'+replayColor+'">'+replayLabel+'</span></div>';
      if(d.replay_eval_id){
        html+='<div style="margin-top:8px;font-size:14px"><span style="color:var(--gray)">回归任务 ID：</span><b style="font-family:monospace;font-size:12px">'+d.replay_eval_id+'</b></div>';
      }
      // 回归提交的完整数据
      if(d.replay_data){
        try{
          var rd=JSON.parse(d.replay_data);
          html+='<div style="margin-top:12px;font-size:14px">';
          if(rd.vuln_title){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">回归漏洞标题：</span>'+String(rd.vuln_title).replace(/</g,'&lt;')+'</div>';}
          if(rd.vuln_description){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">回归漏洞描述：</span><div style="margin-top:4px;padding:8px 10px;background:var(--p2);border-radius:6px;font-size:13px;white-space:pre-wrap">'+String(rd.vuln_description).replace(/</g,'&lt;')+'</div></div>';}
          if(rd.is_vulnerable!==undefined){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">是否仍有漏洞：</span><b>'+(rd.is_vulnerable?'是':'否')+'</b></div>';}
          if(rd.message){html+='<div style="margin-bottom:6px"><span style="color:var(--gray)">结论：</span>'+String(rd.message).replace(/</g,'&lt;')+'</div>';}
          html+='</div>';
        }catch(e){/* replay_data 解析失败 */}
      }
      html+='</div>';
    }

    $("dts-detail-body").innerHTML=html;
  }catch(e){
    $("dts-detail-body").innerHTML='<div style="color:var(--red)">加载失败: '+e+'</div>';
  }
}

          <button id="mode-runtime-btn" onclick="switchEvalMode('runtime')" style="border:none;cursor:pointer;padding:8px 18px;border-radius:9px;font-size:15px;font-weight:500;font-family:inherit;transition:.15s;background:transparent;color:var(--sub)">🚀 运行态</button>

function renderMainSide(){
  const s=sel;
  const p1=s.proj?"var(--acc)":"var(--p2)";const p2=s.task?"var(--acc)":"var(--p2)";
  const steps=`<div style="display:flex;gap:6px;font-size:14px;margin-bottom:12px">

function filterMainList(){
  const q=$("main-search")?($("main-search").value||"").toLowerCase():"";const s=sel;
  if(!s.proj){
    if(!_allProjs)return;
    const f=_allProjs.filter(p=>(p.name+" "+p.id+" "+(p.department_name||"")+" "+(p.product_path||"")).toLowerCase().includes(q));

  }else if(!s.task){

      return `<div class="opt" onclick="pickMain('task','${t.id}','${(t.name||"").replace(/'/g,"")}')"><span class="l" title="${t.name||t.id}">${t.name||t.id}</span>${t.task_type?`<span style="font-size:12px;color:var(--acc)">${t.task_type}</span>`:""}<span style="font-size:12px;color:${stColor};font-weight:600">${stText}</span>${t.test_target?`<span style="font-size:12px;color:var(--sub);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${t.test_target}">${t.test_target}</span>`:""}</div>`;
    }).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }

function pickMain(field,id,name){
  if(field==="proj"){sel.proj=id;sel.projName=name;sel.task="";sel.taskName="";sel.traceReady=false;sel.traceKind="";sel.traceInfo="";_sideData.tasks=null;}

function _checkTraceMain(){
  jget(`/api/v1/platform/tasks/${sel.proj}/${sel.task}/trace-check`).then(d=>{

      sel.traceReady=false;sel.traceKind="";sel.traceInfo="未发现 trace";

  }).catch(e=>{
    sel.traceReady=false;sel.traceKind="";sel.traceInfo="检查失败: "+String(e).slice(0,80);

}

function switchBsrc(s){sel.bsrc=s;renderRunConf();}
function filterVcList(){
  const list=$("vc-list");if(!list)return;const q=($("vc-search")?($("vc-search").value||"").toLowerCase():"");
  if(!sel.vcProj){
    if(!_allProjs)return;
    const f=_allProjs.filter(p=>(p.name+" "+p.id+" "+(p.department_name||"")+" "+(p.product_path||"")).toLowerCase().includes(q));
    list.innerHTML=f.slice(0,50).map(p=>`<div class="opt" onclick="pickVc('proj','${p.id}','${p.name.replace(/'/g,"")}')"><span class="l" title="${p.name}">${p.name}</span><span class="opt-mid" style="color:var(--sub)" title="${p.department_name||""}">${p.department_name||""}</span><span class="opt-right" style="color:var(--acc)" title="${p.product_path||""}">${p.product_path||""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }else if(!sel.vcTask){
    if(!_vcTasks)return;
    const f=_vcTasks.filter(t=>((t.name||"")+" "+t.id+" "+(t.task_type||"")+" "+(t.test_target||"")).toLowerCase().includes(q));
    list.innerHTML=f.map(t=>`<div class="opt" onclick="pickVc('task','${t.id}','${(t.name||"").replace(/'/g,"")}')"><span class="l" title="${t.name||t.id}">${t.name||t.id}</span><span class="opt-mid" style="color:var(--acc)">${t.task_type||""}</span><span class="opt-right" style="color:var(--sub)" title="${t.test_target||""}">${t.test_target||""}</span></div>`).join("")||'<div style="padding:16px;color:var(--sub)">无匹配</div>';
  }
}
function pickVc(field,id,name){
  if(field==="proj"){sel.vcProj=id;sel.vcProjName=name;sel.vcTask="";sel.vcTaskName="";_vcTasks=null;_vcCases=null;}
  else if(field==="task"){sel.vcTask=id;sel.vcTaskName=name;_vcCases=null;}
  renderRunConf();
}
function renderVbList(){filterVbList();}
function updateRunBtn(){const btn=$("run-btn");if(!btn)return;const name=$("eval-name")?$("eval-name").value.trim():"";const ready=sel.traceReady;btn.disabled=!(ready&&name);}
function filterVbList(){
  if(!_allVbProjs)return;
  const list=$("vb-list");if(!list)return;
  const q=($("vb-search")?($("vb-search").value||"").toLowerCase():"");
  const f=_allVbProjs.filter(p=>(p.name+" "+(p.tags||[]).join(" ")).toLowerCase().includes(q));

}
function pickVbProj(id,name){

function genId(){const d=new Date(Date.now()+8*3600000);const p=n=>String(n).padStart(2,"0");return `EV-${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}${p(d.getUTCHours())}${p(d.getUTCMinutes())}${p(d.getUTCSeconds())}-${Math.floor(Math.random()*9000+1000)}`;}
async function runEval(){
  let eid=$("eid").value.trim()||genId();
  $("eid").value=eid;sel.eid=eid;$("run-st").textContent="⏳ 提交中…";$("run-btn").disabled=true;
  const evalName=$("eval-name")?$("eval-name").value.trim():"";
  var bSetId,vcTaskId,bsrc;
  if(sel.evalMode==='runtime'){
    // 运行态：基线=自身项目任务的漏洞中心数据
    bsrc='vuln_center';bSetId=sel.proj;vcTaskId=sel.task;
  }else{
    // 开发态：用户选择的基线来源
    bsrc=sel.bsrc;bSetId=bsrc==='vuln_center'?(sel.vcProj||undefined):(sel.vbProj||undefined);vcTaskId=bsrc==='vuln_center'?(sel.vcTask||undefined):undefined;
  }
  try{const r=await jpost("/api/v1/evaluations",{evaluation_id:eid,evaluation_name:evalName||undefined,kg_project_id:sel.proj,kg_task_id:sel.task,benchmark_source:bsrc,benchmark_set_id:bSetId,vc_source_task_id:vcTaskId,eval_mode:sel.evalMode});
    $("run-st").textContent="✅ 评测已创建，排队中…";
    activeId=r.evaluation_id;Router.navigate('/evaluations/'+r.evaluation_id);
  }
  catch(e){const msg=String(e);if(msg.includes("1062")||msg.includes("Duplicate")){$("run-st").textContent="⚠ ID 重复，换新 ID 重试…";$("eid").value=genId();$("run-btn").disabled=false;return;}$("run-st").innerHTML='⚠ 失败：'+msg;$("run-btn").disabled=false;}

      <div><label style="font-weight:600;font-size:14px">LLM 思考模式</label><div style="font-size:12px;color:var(--sub);margin:4px 0">控制 LLM 推理深度。关闭=不思考，开启后可选 low/high/max</div><div style="display:flex;align-items:center;gap:12px"><label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);margin:0;cursor:pointer"><input id="cfg_reasoning_enabled" type="checkbox" ${c.reasoning_effort&&c.reasoning_effort!=='none'?'checked':''} onchange="toggleReasoning(this)" style="width:auto"> 是否开启思考</label><select id="cfg_reasoning_effort" style="width:100px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt);${c.reasoning_effort&&c.reasoning_effort!=='none'?'':'display:none'}"><option value="low" ${c.reasoning_effort==='low'?'selected':''}>low</option><option value="high" ${c.reasoning_effort==='high'?'selected':''}>high</option><option value="max" ${c.reasoning_effort==='max'?'selected':''}>max</option></select></div></div>
    </div>
    <div style="margin-top:20px;display:flex;gap:12px"><button id="cfg_save_btn" onclick="saveSystemConfig()" style="padding:8px 24px;border:none;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;font-size:14px">保存</button><button onclick="renderSystem()" style="padding:8px 24px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt);cursor:pointer;font-size:14px">刷新</button></div>
    <div id="cfg_msg" style="margin-top:12px;font-size:13px"></div>
    </div>
    <div class="card" style="margin-top:20px"><h3>LLM 网关配置</h3><div style="font-size:13px;color:var(--sub);margin-bottom:16px">LLM 网关地址、模型配置与连通性测试。模型修改后立即生效，Pod 重启后保留。</div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div><label style="font-weight:600;font-size:14px">网关地址</label><div style="font-size:12px;color:var(--sub);margin:4px 0">LLM 网关 Base URL（只读，通过环境变量 EVAL_LLM_BASE_URL 配置）</div><input id="cfg_llm_base_url" value="加载中..." readonly style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--sub);font-family:monospace;font-size:13px"></div>
      <div><label style="font-weight:600;font-size:14px">API Key</label><div style="font-size:12px;color:var(--sub);margin:4px 0">LLM 网关 API Key（只读，通过环境变量 EVAL_LLM_API_KEY 配置）</div><input id="cfg_llm_api_key" value="加载中..." readonly style="width:100%;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--sub);font-family:monospace;font-size:13px"></div>
      <div><label style="font-weight:600;font-size:14px">模型</label><div style="font-size:12px;color:var(--sub);margin:4px 0">LLM 模型名（如 pro、glm-5.2 等，修改后立即生效）</div><div style="display:flex;gap:8px;align-items:center"><input id="cfg_llm_model" value="${c.llm_model||''}" placeholder="如 pro" style="flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"><button class="btn" style="font-size:13px;padding:6px 16px;white-space:nowrap" onclick="saveLlmModel()">切换模型</button></div></div>
      <div style="border-top:1px solid var(--bd);padding-top:16px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button class="btn g" style="font-size:13px;padding:8px 20px" onclick="testLlmConnection()">测试连通性</button><span id="llm_test_status" style="font-size:13px;color:var(--sub)"></span></div><div id="llm_test_result" style="font-size:13px"></div></div>
    </div>
    </div>
    <div class="card" style="margin-top:20px"><h3>Agent 数据源配置</h3><div style="font-size:13px;color:var(--sub);margin-bottom:16px">各 Agent 的数据库连接配置。密码脱敏显示，修改时留空或 *** 表示不更新。</div><div id="ds-container"><div style="color:var(--sub)">加载中...</div></div></div></div>`;
  $("view").innerHTML=h;
  loadDatasources();
  loadLlmStatus();
}
function toggleReasoning(cb){var sel=$("cfg_reasoning_effort");if(sel){sel.style.display=cb.checked?'':'none';}}
async function saveSystemConfig(){
  var body={llm_max_concurrency:parseInt($("cfg_llm_conc").value)||50,max_concurrent_evals:parseInt($("cfg_max_evals").value)||3,eval_pool_max:parseInt($("cfg_eval_pool_max").value)||5,parse_workers:parseInt($("cfg_parse_workers").value)||4,source_fill_workers:parseInt($("cfg_source_fill_workers").value)||10,ac_fetch_workers:parseInt($("cfg_ac_fetch_workers").value)||10,resolver_workers:parseInt($("cfg_resolver_workers").value)||4,ai_match_workers:parseInt($("cfg_ai_match_workers").value)||10,ac_llm_workers:parseInt($("cfg_ac_llm_workers").value)||10,fpr_cond_workers:parseInt($("cfg_fpr_cond_workers").value)||2,fpr_baseline_workers:parseInt($("cfg_fpr_baseline_workers").value)||10,fpr_baseline_batch:parseInt($("cfg_fpr_baseline_batch").value)||5,kg_analysis_workers:parseInt($("cfg_kg_analysis_workers").value)||10,bootstrap_workers:parseInt($("cfg_bootstrap_workers").value)||4};
  var rcb=$("cfg_reasoning_enabled");
  if(rcb){body.reasoning_effort=rcb.checked?($("cfg_reasoning_effort").value||'low'):'none';}
  $("cfg_msg").innerHTML='⏳ 保存中…';
  try{await jput("/api/v1/system/config",body);$("cfg_msg").innerHTML='<span style="color:var(--green)">✓ 已保存并生效</span>';}
  catch(e){$("cfg_msg").innerHTML='<span style="color:var(--red)">✗ '+e+'</span>';}
}
// ===== LLM 网关配置 =====
async function loadLlmStatus(){
  try{
    var s=await jget("/api/v1/system/llm/status");
    if($("cfg_llm_base_url"))$("cfg_llm_base_url").value=s.base_url||'-';
    if($("cfg_llm_api_key"))$("cfg_llm_api_key").value=s.api_key_masked||'-';
    if($("cfg_llm_model"))$("cfg_llm_model").value=s.model||'';
  }catch(e){}
}
async function testLlmConnection(){
  var st=$("llm_test_status"),rs=$("llm_test_result");
  if(st)st.innerHTML='⏳ 测试中…';
  if(rs)rs.innerHTML='';
  var model='';
  var mEl=$("cfg_llm_model");
  if(mEl)model=mEl.value.trim();
  try{
    var body={};
    if(model)body.model=model;
    var r=await jpost("/api/v1/system/llm/test",body);
    if(st)st.innerHTML='';
    if(r.success){
      if(rs)rs.innerHTML='<div style="padding:10px 14px;border-radius:6px;background:rgba(22,163,74,.1);color:var(--green)">✓ 连通正常 — 模型: '+r.model+'，延迟: '+r.latency_ms+'ms，响应: '+(r.response||'').substring(0,50)+'</div>';
    }else{
      if(rs)rs.innerHTML='<div style="padding:10px 14px;border-radius:6px;background:rgba(220,38,38,.1);color:var(--red)">✗ 连接失败 — '+r.error+'</div>';
    }
  }catch(e){
    if(st)st.innerHTML='';
    if(rs)rs.innerHTML='<div style="color:var(--red)">✗ '+e+'</div>';
  }
}
async function saveLlmModel(){
  var mEl=$("cfg_llm_model");
  if(!mEl)return;
  var model=mEl.value.trim();
  if(!model){alert('请输入模型名');return;}
  try{
    await jput("/api/v1/system/llm/model",{model:model});
    if($("llm_test_result"))$("llm_test_result").innerHTML='<div style="padding:8px 14px;border-radius:6px;background:rgba(22,163,74,.1);color:var(--green);font-size:13px">✓ 模型已切换为 '+model+'</div>';
  }catch(e){
    if($("llm_test_result"))$("llm_test_result").innerHTML='<div style="color:var(--red)">✗ '+e+'</div>';
  }
}

// ===== Agent 数据源配置 =====
let _dsData=null;
async function loadDatasources(){
  try{const d=await jget("/api/v2/datasources");_dsData=d.datasources||d||[];renderDsContainer();}
  catch(e){$("ds-container").innerHTML='<div style="color:var(--red)">加载失败: '+e+'</div>';}
}
function renderDsContainer(){
  if(!_dsData||!_dsData.length){$("ds-container").innerHTML='<div style="color:var(--sub)">无配置</div>';return;}
  $("ds-container").innerHTML=_dsData.map(function(ds,i){
    var dbType=ds.db_type||'none';
    var typeBadge=dbType==='mysql'?'<span class="bdg b-COMPLETED">MySQL</span>':dbType==='postgresql'?'<span class="bdg b-RUNNING">PostgreSQL</span>':'<span class="bdg b-CREATED">无独立DB</span>';
    var statusBadge=ds.last_error?'<span class="bdg b-FAILED">连接异常</span>':ds.last_connected_at?'<span class="bdg b-COMPLETED">已连接</span>':'<span class="bdg b-CREATED">未测试</span>';
    var enabledBadge=ds.enabled?'<span class="bdg b-COMPLETED">启用</span>':'<span class="bdg b-CREATED">禁用</span>';
    var connInfo=ds.host?(ds.host+':'+(ds.port||'')):'-';
    var dbName=ds.database_name||'-';
    var pidInput=(ds.database_name||'').indexOf('{project_id}')>=0?'<div style="margin-top:10px"><label style="font-size:12px;color:var(--sub);margin:0">测试用 Project ID（数据库名含 {project_id} 占位符）</label><input id="ds_'+i+'_pid" placeholder="如 1ebaa4b2dc204454" style="width:100%;padding:6px 10px;font-size:14px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--txt)"></div>':'';
    return '<div style="border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:16px">'+ds.display_name+'</b>'+typeBadge+enabledBadge+statusBadge+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;color:var(--sub);margin-bottom:10px">'+
      '<div>主机: <span style="font-family:monospace;color:var(--txt)">'+connInfo+'</span></div>'+
      '<div>数据库: <span style="font-family:monospace;color:var(--txt)">'+dbName+'</span></div>'+
      '<div>用户: <span style="font-family:monospace;color:var(--txt)">'+(ds.username||'-')+'</span></div>'+
      '<div>版本: <span style="font-family:monospace;color:var(--txt)">v'+(ds._version||1)+'</span></div>'+
      '</div>'+
      (ds.last_error?'<div style="font-size:13px;color:var(--red);margin-bottom:8px;padding:6px 10px;background:rgba(248,113,113,.08);border-radius:6px">'+ds.last_error+'</div>':'')+
      pidInput+
      '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn g" style="font-size:13px;padding:6px 14px" onclick="testDatasource('+i+')">测试连接</button>'+
      '<button class="btn g" style="font-size:13px;padding:6px 14px" onclick="toggleDsEnabled('+i+')">'+(ds.enabled?'禁用':'启用')+'</button>'+
      '</div><div id="ds_'+i+'_msg" style="margin-top:8px;font-size:13px"></div></div>';
  }).join('');
}
async function testDatasource(i){
  var ds=_dsData[i];if(!ds)return;
  var msg=$("ds_"+i+"_msg");if(msg)msg.innerHTML='<span style="color:var(--sub)">测试中...</span>';
  var pidEl=$("ds_"+i+"_pid");
  var pid=pidEl?pidEl.value.trim():'';
  var url="/api/v2/datasources/"+ds.agent_type+"/test";
  if(pid)url+="?project_id="+encodeURIComponent(pid);
  try{
    var r=await jpost(url,{});
    if(msg)msg.innerHTML=r.success?'<span style="color:var(--green)">✓ '+r.error+'</span>':'<span style="color:var(--red)">✗ '+r.error+'</span>';
    loadDatasources();
  }catch(e){if(msg)msg.innerHTML='<span style="color:var(--red)">✗ '+e+'</span>';}
}
async function toggleDsEnabled(i){
  var ds=_dsData[i];if(!ds)return;
  try{await jput("/api/v2/datasources/"+ds.agent_type,{enabled:!ds.enabled});loadDatasources();}
  catch(e){alert("切换失败: "+e);}
}

// ===== 通用操作 =====
function retryEval(eid){
  showConfirm({icon:'⚠️',iconBg:'rgba(251,191,36,.15)',iconColor:'var(--amber)',title:'重跑评测',
    desc:'重跑将清除该评测的全部数据，重新解析 trace 并调用 LLM。',
    risks:['耗时可能较长（10-30 分钟）','如果 LLM 不可用会降级为规则生成','旧报告会被覆盖'],
    confirmText:'重跑',confirmColor:'var(--acc)',
    onConfirm:function(){
      activeId=eid;
      var rep=$("view");if(rep)rep.innerHTML='<div class="back-bar"><button class="back-btn" onclick="goBack()">← 返回列表</button></div><div class="empty"><div class="ic" style="animation:spin 1s linear infinite">⏳</div><h3>正在重新启动评测…</h3><p style="font-size:14px;color:var(--sub)">清理旧数据并重新解析中</p></div>';
      F('/api/v1/evaluations/'+eid+'/retry?force=true',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
        if(d.status==='QUEUED'||d.status==='RUNNING'){
          var pollCnt=0;var retryPoll=function(){pollCnt++;if(pollCnt>30)return;if(activeId!==eid)return;
            jget('/api/v1/evaluations/'+eid).then(function(s){if(s.status==='FAILED'){setTimeout(retryPoll,1000);}else{selEv(eid);}}).catch(function(){setTimeout(retryPoll,1000);});};
          setTimeout(retryPoll,500);
        }else{alert('重试失败: '+JSON.stringify(d));}
      }).catch(function(e){alert('重试失败: '+e);});
    }
  });
}
function deleteEval(eid,name){
  showConfirm({icon:'🗑️',iconBg:'rgba(248,113,113,.15)',iconColor:'var(--red)',title:'删除评测',
    desc:'删除将永久清除该评测的全部数据，不可恢复。',
    risks:['trace 解析结果','指标计算结果','分析报告','基线匹配数据'],
    confirmText:'永久删除',confirmColor:'var(--red)',
    onConfirm:function(){
  F('/api/v1/evaluations/'+eid,{method:'DELETE'}).then(r=>r.json()).then(d=>{
    if(d.status==='ok'){Router.navigate('/');$("view").innerHTML='<div class="empty"><div class="ic">🗑️</div><h3>评测已删除</h3><p>'+eid+'</p><button class="btn" style="margin-top:16px" onclick="goBack()">返回列表</button></div>';}else{alert('删除失败: '+JSON.stringify(d));}
  }).catch(e=>alert('删除失败: '+e));
    }
  });
}
function cancelEval(eid){
  showConfirm({icon:'⚠️',iconBg:'rgba(245,158,11,.15)',iconColor:'var(--amber)',title:'取消评测',
    desc:'取消后评测将停止运行，状态设为已取消。此操作不可撤销。',
    confirmText:'确认取消',confirmColor:'var(--amber)',
    onConfirm:function(){
      F('/api/v1/evaluations/'+eid+'/cancel',{method:'POST'}).then(function(r){return r.json()}).then(function(d){if(d.status==='CANCELLED'){renderEvals();}else{alert('取消失败: '+JSON.stringify(d));}}).catch(function(e){alert('取消失败: '+e);});
    }
  });
}
function showConfirm(opts){
  var ov=document.createElement("div");ov.className="modal-overlay";
  var risksHtml=(opts.risks||[]).map(function(r){return "<li>"+r+"</li>"}).join("");
  ov.innerHTML='<div class="modal">'+
    '<div class="modal-head"><div class="modal-icon" style="background:'+opts.iconBg+';color:'+opts.iconColor+'">'+opts.icon+'</div><h3>'+opts.title+'</h3></div>'+
    '<div class="modal-body"><p>'+opts.desc+'</p>'+(risksHtml?'<ul>'+risksHtml+'</ul>':'')+'</div>'+
    '<div class="modal-foot"><button class="btn g" style="font-size:15px;padding:8px 20px" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>'+
    '<button class="btn" style="font-size:15px;padding:8px 20px;background:'+opts.confirmColor+'" id="modal-confirm">'+opts.confirmText+'</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener("click",function(e){if(e.target===ov)ov.remove()});
  document.getElementById("modal-confirm").onclick=function(){ov.remove();if(opts.onConfirm)opts.onConfirm();};
}

// ===== 启动 =====
Router.init();
</script>
</body>
</html>
